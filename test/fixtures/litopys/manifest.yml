    url: http://litopys.org.ua/ipatlet/ipat01.htm
    whole: false
    trim: columns 3–18 cut (source lines 219–1109; 95,013 → 25,295 bytes) — keeps cols 1–2 + 19–21
  - path: ipatlet/ipat05.htm
    url: http://litopys.org.ua/ipatlet/ipat05.htm
    whole: false
    trim: columns 95–112 cut (source lines 422–1372; 103,751 → 33,761 bytes) — keeps cols 89–94
  - path: ipatlet/ipat36.htm
    url: http://litopys.org.ua/ipatlet/ipat36.htm
    whole: false
    trim: columns 813–840 cut (source lines 310–1898; 136,641 → 22,293 bytes) — keeps cols 810–812
  - path: ipatlet/ipat40.htm
    url: http://litopys.org.ua/ipatlet/ipat40.htm
    whole: true
    trim: none
  - path: zyzlex/zyz100.htm
    url: http://litopys.org.ua/zyzlex/zyz100.htm
