# Nabu fixture manifest (P5-4 "fixture sentinel"). Schema documented in
# test/fixtures/perseus/manifest.yml. Built from this directory's README.md.
#
# Real windows-1251 pages of the Izbornyk site (plain http — the https
# certificate is broken upstream). The chronicle pages ipat01/05/36 and the
# glossary zyz100 are line-boundary trims (whole column blocks cut at the
# apparatus-div boundaries, the page frame kept); ipat40, zyz101 and zyz102
# are whole. adapter_test is null (trimmed files would false-fail counts).
source: litopys
adapter_test:
retrieved: 2026-10-11
files:
