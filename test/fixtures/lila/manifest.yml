# resolver test asserts slice-level records, which the untrimmed upstream file
# would false-fail. Re-trim per the README recipe (prefix header + the eight
# named subject blocks, byte-verbatim) after any refresh.
source: lila
adapter_test:
retrieved: 2026-07-24
files:
  - path: rdf/lemmaBank.ttl
    url: https://raw.githubusercontent.com/CIRCSE/LiLa_Lemma-Bank/HEAD/rdf/lemmaBank.ttl
    whole: false
    trim: prefix header + 8 real subject blocks, byte-verbatim (84 MB -> ~2 KB)
