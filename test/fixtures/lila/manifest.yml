# Nabu fixture manifest (P5-4). Schema documented in
# test/fixtures/perseus/manifest.yml. Built from this directory's README.md.
#
# The dump is a documented TRIM of the full upstream 84 MB rdf/lemmaBank.ttl
# (whole: false — a fresh GET returns the full file and is fetched for
