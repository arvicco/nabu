    url: https://archive.org/download/tibetanenglishdi00jsuoft/tibetanenglishdi00jsuoft.pdf
    refetchable: true
    whole: false
    trim: >-
      leaves 27-28 (print pages 1-2) of the real PDF via mutool merge —
      the page images the converter's headword pairs were read from
  - path: tibetanenglishdi00jsuoft/tibetanenglishdi00jsuoft_page_numbers.json
    url: https://archive.org/download/tibetanenglishdi00jsuoft/tibetanenglishdi00jsuoft_page_numbers.json
    refetchable: true
    whole: false
    trim: >-
      the real page map's header verbatim with eight of its 702 leaf
      entries kept (leaves 1, 3, 27, 28, 637, 695, 698, 702 — one specimen
      per grain), re-serialized with upstream's 4-space indent
