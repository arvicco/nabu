# API-ENVELOPE PROVENANCE (the lexlep precedent). Retrieved 2026-08-18
# from zh/vi.wikisource.org api.php in the fetcher's own batch shape
# (action=query&prop=revisions&rvprop=content|ids|timestamp&rvslots=main);
# each page file is the adapter's per-page envelope with the API's
# wikitext byte-verbatim inside, filed by CURATED id (the PAGES table is
# the naming authority). A raw re-GET returns upstream's CURRENT revid —
# living wikis — so every entry is refetchable: false; drift is caught by
# the revid-pinned fetch at any real re-sync.
