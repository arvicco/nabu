# Nabu fixture manifest (P5-4 "fixture sentinel"). Schema documented in
# test/fixtures/perseus/manifest.yml. Built from this directory's README.md.
#
# BFM2022 serves each text at a sha1-ADDRESSED NAKALA url, so whole-file
# fixtures are refetchable byte-for-byte at their recorded address (a
# changed upstream file would change its address — drift shows as a dead
# URL, not silent bytes). AlexisRaM.xml is a documented TRIM of a 971 KB
# upstream file, so adapter_test stays null (the perseus precedent: a
# count-based test re-run against the untrimmed upstream would false-fail).
