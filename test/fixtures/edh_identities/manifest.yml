# Nabu fixture manifest (P5-4). Schema documented in
# test/fixtures/perseus/manifest.yml. One whole EDH record copied
# byte-identical from the box's canonical tree (a zip extraction — no raw
# per-file URL) plus documented CSV trims; every entry is refetchable: false.
source: edh_identities
adapter_test:
files:
