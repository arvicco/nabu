    refetchable: false
    provenance: local-trim
    reason: extracted byte-identical from edhEpidocDump_HD070001-HD080000.zip; re-acquiring = zip download + unzip, not a raw GET
    canonical: canonical/edh/epidoc/HD070001-HD080000/HD072020.xml
    upstream: https://edh.ub.uni-heidelberg.de/data/download/edhEpidocDump_HD070001-HD080000.zip
    copied: 2026-10-22
    whole: true
    trim: none
  - path: edh/text/edh_data_text.csv
    refetchable: false
    provenance: local-trim
    reason: trimmed from the 57 MB corpus-wide download; a fresh GET returns the full file, not this trim
    canonical: canonical/edh/text/edh_data_text.csv
    upstream: https://edh.ub.uni-heidelberg.de/data/download/edh_data_text.csv
    copied: 2026-10-22
    whole: false
    trim: header + the HD072020 row (whole physical line, byte-identical)
  - path: edh/pers/edh_data_pers.csv
    refetchable: false
    provenance: local-trim
    reason: trimmed from the 8.9 MB corpus-wide download; a fresh GET returns the full file, not this trim
    canonical: canonical/edh/pers/edh_data_pers.csv
    upstream: https://edh.ub.uni-heidelberg.de/data/download/edh_data_pers.csv
    copied: 2026-10-22
    whole: false
    trim: header + the three HD072020 person rows (whole physical lines, byte-identical)
