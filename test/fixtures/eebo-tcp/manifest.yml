  - path: fetch/eebo_phase1_IDs_and_dates.txt
    url: https://app.box.com/index.php?rm=box_v2_download_shared_file&shared_name=jjzmnrx98dkvanipopz3nxkvymnjccht&file_id=f_841168371445
