    trim: first 6 rows + the two Phase-1 fixture rows (id TAB year)
  - path: fetch/IDnos_in_phase2.txt
    url: https://app.box.com/index.php?rm=box_v2_download_shared_file&shared_name=jjzmnrx98dkvanipopz3nxkvymnjccht&file_id=f_841168065045
    whole: false
    trim: first 6 rows + the two Phase-2 fixture ids (A20018, A29180)
