# PDF — a fresh fetch returns the full 300+-page file, so the URL is
# checked for liveness only. adapter_test null: count assertions would
# false-fail against the untrimmed PDF.
source: altaica-shm
adapter_test:
retrieved: "2026-09-28"
files:
  - path: SH-24UP.pdf
    url: http://altaica.ru/SECRET/SH-24UP.pdf
    refetchable: true
    whole: false
    trim: >-
      pages 1+3+4 of the real PDF via mutool merge (the front matter
      with Street's substitution table + 60 numbered text lines)
  - path: SH-24UP.textlayer.txt
    refetchable: false
    provenance: local-trim
    reason: recorded mutool extraction of the fixture PDF, not an upstream artifact — re-cut via `mutool draw -F txt -o - SH-24UP.pdf`
    copied: "2026-09-28"
    whole: false
    trim: the mutool 1.26 text layer of the 3-page fixture trim, verbatim
