# Nabu fixture manifest (P5-4). Schema documented in
# test/fixtures/perseus/manifest.yml. Built from this directory's README.md.
#
# ALL entries are non-refetchable in the byte-identical sense: the site is
# a live Classic ASP application (per-session ASP cookie, live-rendered
# pages) and — the key quirk — serves WINDOWS-1252 bytes with no charset
# header; fixtures preserve those raw bytes (0x92/0x93/0x94/0x96) as the
# encoding regression corpus and must never be transcoded. Re-acquiring
# means a fresh GET of the recorded URL (content expected identical).
source: cantigas
adapter_test: test/adapters/cantigas_test.rb
retrieved: 2026-07-31
files:
  - path: cantiga-1.html
    url: https://cantigas.fcsh.unl.pt/cantiga.asp?cdcant=1&semanotacoes=true
    refetchable: false
    whole: true
    trim: none (Anónimo Lai, rubric + 43 lines / 11 stanzas; the semanotacoes variant the crawl lands — the primary parse fixture; P55-1)
    reason: raw Windows-1252 bytes preserved as the encoding regression corpus — a transcoding re-fetch pipeline would silently launder the 0x93/0x94 quirk bytes
  - path: cantiga-600.html
    url: https://cantigas.fcsh.unl.pt/cantiga.asp?cdcant=600&pv=sim
    refetchable: false
    whole: true
    trim: none (D. Dinis Amigo, 24 lines / 4 stanzas; fetched WITHOUT semanotacoes — the with-notes variant the parser must tolerate; P55-1)
    reason: raw Windows-1252 bytes preserved; the with-notes probe shape is documented as-is in README.md
  - path: cantiga-1400.html
    url: https://cantigas.fcsh.unl.pt/cantiga.asp?cdcant=1400&pv=sim
    refetchable: false
    whole: true
