# Nabu fixture manifest (P5-4 "fixture sentinel"). Schema documented in
# test/fixtures/perseus/manifest.yml. Built from this directory's README.md.
# adapter_test is null: the three book files are documented trims, so a
# fresh-copy re-run would false-fail the count assertions.
source: vedaweb
adapter_test:
retrieved: 2026-10-21
files:
