# Nabu fixture manifest (P5-4). Schema documented in
# test/fixtures/perseus/manifest.yml. Built from this directory's README.md.
#
# manifest.json is byte-verbatim WHOLE (license drift there is real
# drift). The .jsonl.gz files carry byte-verbatim JSON lines of the dump
# files, trimmed by book and RE-GZIPPED (whole: false — the gzip bytes
# differ from upstream's even where every line is kept, as in
# bible-editions). adapter_test is null: the adapter test asserts
# slice-level counts. Dump version pinned: 2026-09-21 (retrieved 2026-11-02).
source: typikon-bible
adapter_test:
retrieved: 2026-11-02
files:
