# Nabu fixture manifest (P5-4 "fixture sentinel"). Schema documented in
# test/fixtures/perseus/manifest.yml. Built from this directory's README.md.
#
# Every file has its own stable raw URL on the immutable Zenodo record —
# whole files byte-compare on check; the two trims are fetched for
# URL-liveness only (a trim can never byte-match its source). adapter_test
# is null: the trims are documented heads, so a fresh-copy re-run would
# false-fail the count assertions.
source: dacon
adapter_test:
retrieved: 2026-08-29
