  # ── Bare anchors forced by the script axis (P61) ─────────────────────────
  #
  # Each is a held language in the first consuming collection whose
  # BCP-47-style script-suffixed codes earn universal codemap rows
  # (san-Latn-shaped surface facts) -- a ~script codemap target needs its
  # anchor defined. Bare ISO facts only: no stages, no mode judgments;
  # parent edges only where textbook-settled and the family node exists
  # (the Aramaic-fan discipline for everything else).

  xtg:
    name: Transalpine Gaulish
    parent: cel
    note: "the RIIG corpus language; Greek- and Latin-script inscriptions"

  xcg:
    name: Cisalpine Gaulish
    parent: cel

  osc:
    name: Oscan
    parent: itc
    note: "Osco-Umbrian; held in Latin-script transliteration of Old Italic
           originals (the consumer's artifact field carries Ital)"

  xum:
    name: Umbrian
    parent: itc
    note: "Osco-Umbrian; the Iguvine Tables are the corpus. Held in
           Latin-script transliteration of Old Italic / Latin-alphabet
           originals (the consumer's per-passage annotation names the
           original alphabet). Deliberately coarse at the consuming
           edition's own lane split: minor Sabellic dialects (Paelignian,
           Marsian, ...) ride the nearest lane unminted until a consumer
           distinguishes them"

  sbv:
    name: Sabine
    parent: itc
    note: "Osco-Umbrian (Sabellic), osc/xum's minor sibling — the
           consumer that distinguishes it arrived (a curated
           Sabine→Latin loan shelf, 26 entries, censused 2026-09-27),
           closing xum's ride-the-nearest-lane note for this one
           dialect. Attested almost entirely through Latin authors'
           glosses (Varro, Festus), not a running-text corpus"

  ett:
    name: Etruscan
    glottocode: etru1241
    band: [-700, 50]
    band_note: "conventional epigraphic span, approximate — the earliest
                inscriptions to the language's extinction under Latin"
    note: "Tyrsenian (with Raetic and Lemnian), pre-Indo-European; the
           family carries no ISO 639-5 or Wiktionary code, so ett rides
           as a bare anchor (the xhu/xur discipline). ~13,000
           inscriptions, mostly short and funerary, in an
           Euboean-Greek-derived alphabet written right-to-left.
           Consumers: the wiktionary-ett and larth-etp shelves and 30
           ett documents (censused 2026-09-27)"

  xlp:
    name: Lepontic
    parent: cel
    band: [-550, -100]
    band_note: "conventional epigraphic span, approximate; the earliest
                inscriptions may reach the 7th c. BCE"
    note: "Continental Celtic of the Lugano/Como/Maggiore lake region —
           the earliest attested Celtic of any kind; ~140 short
           funerary and dedicatory inscriptions in the Lugano alphabet
           (Etruscan-derived, no voice distinction). Whether a distinct
           language or early Cisalpine Gaulish is debated (Schumacher:
           possibly the first branch off Proto-Celtic) — the registry
           claims only the cel edge. Consumer: the lexlep-words shelf
           (Lexicon Leponticum, censused 2026-09-27)"

  xpi:
    name: Pictish
    note: "classification debated (commonly held Brittonic, a non-Celtic
           reading argued historically); the debate keeps the parent edge
           unclaimed. The ogham corpus attests it"

  xly:
    name: Elymian
    note: "fragmentary; an Indo-European (possibly Italic) affiliation
           is argued but unsettled, so no parent edge is claimed"

  scx:
    name: Sicel
    note: "fragmentary; an Indo-European (possibly Italic) affiliation
           is argued but unsettled, so no parent edge is claimed"

  uga:
    name: Ugaritic
    parent: sem
    band: [-1350, -1190]
    band_note: "the Ras Shamra archives to the destruction of Ugarit
                (~1190 BCE), approximate"
    note: "Northwest Semitic (its exact position beside Canaanite is
           debated; the registry claims only the sem edge). Written in
           its own alphabetic cuneiform (the 30-letter long alphabet,
           left-to-right) and occasionally in Sumero-Akkadian cuneiform;
           corpus ~1,800 inscriptions from Ras Shamra. Reference
           dictionary: del Olmo Lete & Sanmartín, A Dictionary of the
           Ugaritic Language in the Alphabetic Tradition (Brill 2003) —
           ORACC's own uga reference. Consuming dictionaries: 3 oracc
           glossaries (censused 2026-09-27)"

  phn:
    name: Phoenician
    parent: sem
    note: "Canaanite, Northwest Semitic; the language of Tyre, Sidon and
           Byblos and of the first alphabet's spread; Punic (xpu) is its
           western descendant"

  xpu:
    name: Punic
    parent: phn
    note: "the Phoenician of the western colonies, Carthage above all;
           attested to late antiquity (Neo-Punic, and Latino-Punic in
           Tripolitania)"

  dra:
    name: Dravidian
    kind: family
    stages:
      pro: {name: Proto-Dravidian, mode: reconstructed, ord: 5, wikt: dra-pro,
            note: "reconstructed over four branches (South, South-Central,
                   Central, North); the DED (Burrow-Emeneau 1984) is the
                   standard cognate corpus. Corpus: starling-dravet (2,171
                   reconstructions, DED correspondences revised and
                   significantly modified by G. Starostin)"}

  ta:
    name: Tamil
    parent: dra-sou
    glottocode: tami1289
    note: "ISO 639-1; SD-I per Krishnamurti 2003. The Sangam corpus
           (~1st c. BCE onward) opens its literature; the consuming
           collections hold classical and modern Tamil under the one
           code. RE-PARENTED dra → dra-sou 2026-10-11: the family node
           arrived with the StarLing sdret mint, and the anchor now
           reads the Tamil–Malayalam–Kannada axis it belongs to. Corpus:
           the DHARMA Tamil-country estate (dharma-tamil, 1,267 editions
           tam-Latn — Pallava to Pāṇḍya epigraphy and the SII
           selections) joins GRETIL's single document; stages stay
           unminted — the epigraphic consumer claims the bare anchor,
           declared coarse (Old/Middle Tamil are named candidates for a
           later wikisource wave)"

  te:
    name: Telugu
    parent: dra-tel
    glottocode: telu1262
    note: "ISO 639-1 (639-3 tel aliases here, the №11 suite).
           South-Central Dravidian: Krishnamurti 2003 groups Telugu with
           Gondi-Kui; the dra-tel parent deliberately records only the
           Teluguic side (its note keeps the subgrouping unsettled, the
           StarLing-vs-Krishnamurti divergence). Attestation: Telugu
           names ride the Prakrit epigraphy of the Amarāvatī region from
           ~2nd c. CE; the first full Telugu inscription is the Renati
           Chola grant of Erragudipadu/Kalamalla (~575 CE); continuous
           epigraphy thereafter; literature opens with Nannaya's
           Āndhramahābhāratamu (11th c.). Corpus: dharma-deccan
           (tfb-telugu 101 editions tel-Latn; Vengī Cālukya bilinguals,
           31 tel-Latn textparts), dharma-mdt (98 Telugu metadata rows
           with the estate's richest dating), dharma-tamil (13 tel-Latn
           passages). The epigraphic consumers date at the document grain
           and claim the bare anchor; Old Telugu proper (the pre-Nannaya
           epigraphic language) is a named candidate stage, unminted"
    stages:
      cls: {name: Classical Telugu, band: [1000, 1850], ord: 20,
            band_note: "the kāvya (grānthika) literary language from
                        Nannaya's Āndhra Mahābhāratamu (begun under
                        Rājarājanarēndra, r. 1022–1061) and the Kavitraya
                        (Tikkana, 13th c.; Errāpragaḍa, 14th c.) through
                        Śrīnātha and Pōtana (15th c.), the Vijayanagara
                        prabandha (16th c.) and the Nāyaka/Thanjavur courts,
                        to the 18th-c. prabandha (Kūcimañci Timmana) — the
                        register the Āndhraśabdacintāmaṇi codified and
                        Chinnaya Sūri's Bālavyākaraṇamu (1858) still
                        prescribed; approximate",
            note: "a REGISTER stage (cls, not old/mid): Krishnamurti's own
                   periodization is linguistic (Old Telugu to ~1100 from
                   the epigraphy, Middle 1100–1600, Modern after 1600), but
                   the literary corpus is written in the classical kāvya
                   register whatever the century of composition — the
                   ms:cls precedent. Old Telugu is the pre-Nannaya
                   epigraphic language and is NOT this stage (ord 20 leaves
                   it room). Corpus: te-wikisource — 73 work trees by
                   pre-1800 poets (Nannaya, Tikkana, Errāpragaḍa, Śrīnātha,
                   Pōtana, Pālkuriki Sōmanātha, Molla, Kūcimañci Timmana …)
                   in their 1891–1930 Madras prints, ~533 pages"}

  kn:
    name: Kannada
    parent: dra-sou
    glottocode: kann1255
    note: "ISO 639-1 (639-3 kan aliases here). SD-I, Tamil–Kannada
           branch (Krishnamurti 2003). Attestation: the Halmidi
           inscription (conventionally ~450 CE) opens the record; Bādāmi
           Cālukya and Rāṣṭrakūṭa epigraphy carry it on; literature
           opens with the Kavirājamārga (~850, the Rāṣṭrakūṭa court) and
           flowers in the campū classics. Corpus: kannada-texts (Ollett
           TEI, 16 classics kan-Latn — Pampa 941 to Kanakadāsa) and
           dharma-deccan (Kalyāṇa Cālukya, 62 editions kan-Latn)"
    stages:
      old: {name: Old Kannada, band: [450, 1200], ord: 10,
            band_note: "Haḷegannaḍa — Halmidi (~450) through the
                        inscriptional record and the campū poets (Pampa
                        941, Ponna 953, Ranna 993, Nāgavarma II ~1042);
                        the 12th–13th c. transition is gradual;
                        approximate"}
      mid: {name: Middle Kannada, band: [1200, 1800], ord: 20,
            band_note: "Naḍugannaḍa — Harihara and Rāghavāṅka's ragaḷe
                        (~1200) through Kumāravyāsa (~1430), the dāsa
                        corpus (Purandara, Kanakadāsa, 16th c.) and the
                        Keḷadi-era prose; approximate"}

  ml:
    name: Malayalam
    parent: dra-sou
    glottocode: mala1464
    note: "ISO 639-1 (639-3 mal aliases here). South Dravidian I, the
           Tamil–Malayalam subgroup (Krishnamurti 2003; prose — the
           anchor parents dra-sou directly, the ta/kn shape): the
           west-coast (Cēra) speech separated from Middle Tamil around
           the 9th c. Attestation: the Vāḻappaḷḷi copper plate of
           Rājaśēkhara (c. 830 CE, Vaṭṭeḻuttu) opens the Old Malayalam
           record; literature in the pāṭṭu tradition (Rāmacaritam,
           12th–14th c.) and in Maṇipravāḷam, the Malayalam–Sanskrit
           literary mix the 14th-c. Līlātilakam describes (Vaiśikatantram,
           Uṇṇunīlisandēśam); Eḻuttaccan (16th c.) fixes the modern
           literary language. Corpus: wiktionary-ml (11,505 entries, mal)
           and GRETIL's Jyotsnikā, a Maṇipravāḷam toxicology text
           (mal-Latn) — both claim the bare anchor; 2,899 Wiktionary
           descendant reflexes. Old Malayalam and Maṇipravāḷam stay prose,
           declared coarse, until a consumer distinguishes them"

  inc:
    name: Indo-Aryan
    kind: family
    parent: iir
    stages:
      pro: {name: Proto-Indo-Aryan, mode: reconstructed, ord: 5, wikt: inc-pro}

  # ── The Indo-Iranian comparative wing (StarLing LEXSTAT, 2026-10-01) ──
  # The IE package's dardet/indet/iranet etymology shelves key their
  # proto-entries to inc-dar-pro / inc-pro / ira-pro; the ira and
  # inc-dar nodes (and the three pro stages) are minted with them.

  ira:
    name: Iranian
    kind: family
    parent: iir
    stages:
      pro: {name: Proto-Iranian, mode: reconstructed, ord: 5, wikt: ira-pro}
    note: "Indo-European > Indo-Iranian; the sister branch to Indo-Aryan.
           Attested from the Avesta (Old Avestan, oral composition
           ~2nd-1st mill. BCE) and the Old Persian cuneiform inscriptions
           (6th c. BCE); the held corpora reach it through Avestan,
           Middle Persian and the StarLing Iranian comparative material
           (iran wordlist + iranet etymology shelves)"

  os:
    name: Ossetian
    parent: ira
    glottocode: osse1243
    note: "ISO 639-1 (639-3 oss aliases here). The Eastern Iranian language
           of North and South Ossetia, the sole living descendant of the
           Scytho-Sarmatian–Alanic line (Glottolog: Iranian > Sogdic-Ossetic
           > Ossetic). Parents ira DIRECTLY: its medieval ancestor Alanic
           (Wiktionary xln — the Zelenchuk inscription, 10th–12th c.; the
           Alanic phrases in Tzetzes' Theogony, 12th c.; 45 etymon edges in
           the kaikki Ossetian extract) stays PROSE — no xln node is minted,
           no consumer holds an Alanic text; the Eastern Iranian / Sogdic-
           Ossetic intermediates stay prose likewise. Two literary
           varieties: Iron (iron1242, ISO oss — the standard) and Digor
           (digo1242), both in the kaikki extract (Digor forms labelled),
           deliberately unminted until a consumer separates them. Written
           from the 18th c. (the 1798 catechism, Cyrillic-based; Sjögren's
           1844 grammar, Kosta Khetagurov's verse). Consumers: kaikki
           Ossetian (913 records) and 59 descendant reflexes"

  inc-dar:
    name: Dardic
    kind: family
    parent: inc
    stages:
      pro: {name: Proto-Dardic, mode: reconstructed, ord: 5, wikt: inc-dar-pro}
    note: "The northwestern Indo-Aryan mountain languages (Kashmiri,
           Shina, Khowar, Kalasha, Indus Kohistani, Bashkarik/Kalami,
           Pashai...). CAVEAT, recorded deliberately: modern scholarship
           (Strand, Bashir) treats Dardic as an AREAL/geographic grouping
           within Indo-Aryan, not a proven genetic clade — this node (and
           its reconstructed pro stage) exists to carry the StarLing
           dardet database's claims, which assume a Proto-Dardic level;
           the registry records the claim without endorsing the clade"

  gu:
    name: Gujarati
    parent: inc
    glottocode: guja1252
    note: "ISO 639-1 (639-3 guj aliases here). Western Indo-Aryan;
           the Old Gujarati / Māru-Gurjar literary record opens
           ~12th c.; the bhakti canon (Narasiṃha Mehtā, 15th c.,
           Mīrāṃbāī, Akho, Premānand, Dayārām) is the consuming
           corpus's substance, held in 1888–1913 print editions.
           Corpus: gu-wikisource (207 scan-backed documents).
           Stages unminted — the editions are modern prints of the
           bhakti compositions; the consumer claims the bare code,
           declared coarse"

  pa:
    name: Punjabi
    parent: inc
    glottocode: panj1256
    note: "ISO 639-1 pa / 639-3 pan (aliases here). Northwestern
           Indo-Aryan, continuous with the Lahndā continuum; the
           literary record opens with the Gurmukhī scriptural canon.
           The granthic written language is not modern Punjabi but
           the Sant Bhāṣā mix — Old Punjabi with Lahndā, Braj and
           Sahaskritī registers side by side in one codex — so the
           pa:old stage carries the canon and the bare anchor stays
           for modern material. Corpus: the shabados line database
           (Gurū Granth Sāhib 60,555 primary lines, the Vārāṅ of
           Bhāī Gurdās, Sarabloh; its Braj and Persian layers claim
           bra and fa through script-qualified codemap rows, never
           pa)"
    stages:
      old: {name: Old Punjabi (granthic), band: [1450, 1708], ord: 10,
            band_note: "the scriptural-canon convention: from Gurū
                        Nānak's bāṇī (b. 1469; compositions from the
                        late 15th c.) through the Ādi Granth
                        compilation (1604, Gurū Arjan) to the canon's
                        closure at Gurū Gobind Singh's death (1708);
                        approximate at both ends",
            note: "the language of the Gurmukhī scriptural corpus:
                   Old Punjabi as the base of the Sant Bhāṣā blend
                   (with Lahndā, Braj and Sahaskritī passages
                   riding their own claims where the source marks
                   them). Witnesses: the Ādi Granth / Gurū Granth
                   Sāhib (1604; the Kartārpur pothī tradition), the
                   Vārāṅ of Bhāī Gurdās (c. 1551-1636). Corpus:
                   shabados, the consuming library's line-grain
                   scripture database"}


  mr:
    name: Marathi
    parent: inc
    glottocode: mara1378
    note: "ISO 639-1 (639-3 mar aliases here). Southern Indo-Aryan, the
           continuation of Maharashtri Prakrit (held under pra; the
           descent stays prose until the registry draws Prakrit
           lineages). Inscriptional record from the early 11th c. (the
           Akṣī stone, Śilāhāra period; the Śravaṇabeḷagoḷa Gommaṭa line
           c. 981 is debated), classical literature from the 13th c.
           (Jñāneśvarī 1290, the Mahānubhāva prose, the vārakarī sant
           poets from Nāmdev to Tukārām). Corpus: a handful of romanized
           Marathi inscriptions (mar-Latn) in the consuming library's
           South Indian epigraphy, from the Maratha-period volumes; the
           bare anchor is the honest claim, declared coarse — stages
           (Old/Middle Marathi) unminted until a consumer needs them"

  si:
    name: Sinhala
    parent: inc
    glottocode: sinh1246
    note: "ISO 639-1 (639-3 sin aliases here). Insular Indo-Aryan, beside
           Dhivehi (dv; the shared Insular node stays prose). The
           longest continuously documented New Indo-Aryan line:
           Sinhalese Prakrit cave
           inscriptions from the 3rd–2nd c. BCE, the Sīgiri graffiti
           (8th–10th c.), classical literature from the 9th–10th c.
           (Siyabaslakara) through the 13th-c. Sidatsan̆garā grammar.
           Corpus: one romanized Sinhala record (sin-Latn) in the
           consuming library's South Indian epigraphy; the bare anchor is
           the honest claim, declared coarse — stages unminted until a
           consumer needs them"

  dv:
    name: Dhivehi
    parent: inc
    glottocode: dhiv1236
    note: "ISO 639-1 (639-3 div aliases here). Insular Indo-Aryan beside
           Sinhala (si): the two descend from the Sinhalese Prakrit of the
           early centuries CE, Dhivehi diverging toward the end of the
           first millennium; the shared Insular node stays prose (the si
           precedent — no subgroup edge minted). Attestation: the lōmāfānu
           copper-plate grants of the 12th–13th c. (Isdhoo, c. 1194; Dhivehi
           Akuru script) and the coral-stone inscriptions; Thaana replaced
           Dhivehi Akuru from the 17th c. and carries the modern language.
           Corpus: wiktionary-dv (2,047 entries, Thaana-headed, div); 29
           Wiktionary descendant reflexes — the bare anchor is the honest
           claim; the lōmāfānu language (Old Dhivehi) stays unminted, no
           consumer holds it"

  bra:
    name: Braj
    parent: inc
    note: "Western Hindi; the dominant literary language of early modern
           North India (Krishna bhakti poetry, 15th-19th c.)"

  awa:
    name: Awadhi
    parent: inc
    note: "Eastern Hindi; the language of Tulsidas's Ramcaritmanas and
           Jayasi's Padmavat (16th c.)"

  # ── The Southeast Asian wing (v1.6.0) ──────────────────────────────────
  # Seven language anchors from one consuming wave — the DHARMA epigraphic
  # corpora (EFEO/ERC; per-file measured xml:lang census) and the Old
  # Burmese inscriptions of Bagan — each wired into its family spine
  # (ISO 639-5 codes), minted here with it: Austroasiatic (aav),
  # Austronesian (map > poz > cmc), Sino-Tibetan (sit > tbq).

  aav:
    name: Austroasiatic
    kind: family

  omx:
    name: Old Mon
    parent: aav
    note: "Austroasiatic, Monic; the language of the Dvaravati and early
           Bagan world, attested ~6th-13th c. CE — the Myazedi
           quadrilingual's fourth leg. No dedicated digital corpus
           exists; the DHARMA Pyu corpus carries two Old Mon inscriptions
           (79 lines, first-sync census 2026-09-02), the consuming
           library's first omx text anywhere; held romanized (omx-Latn)"

  okz:
    name: Old Khmer
    parent: aav
    note: "the Khmeric branch of Austroasiatic (no ISO code for the
           branch); the ancestor of Modern Khmer (khm). Attested from the
           early 7th c. CE (pre-Angkorian) through the Angkorian period,
           ~14th c. The DHARMA Corpus des inscriptions khmeres (the Coedes
           K-numbers) is the corpus; held romanized (okz-Latn), the
           stones' Khmer script rides the consumer's artifact records"

  xhm:
    name: Middle Khmer
    parent: okz
    note: "the stage between Old and Modern Khmer, ~15th-18th c. (the
           post-Angkorian transition); the DHARMA Khmer corpus attests it
           (3 editions, first-sync census 2026-09-01); held romanized
           (xhm-Latn)"

  khm:
    name: Khmer
    parent: xhm
    note: "Modern Khmer; the DHARMA Khmer corpus carries 23 modern-era
           editions (its K-numbering runs to the present); held romanized
           (khm-Latn) there, Khmer script (khmr) natively"

  map:
    name: Austronesian
    kind: family

  poz:
    name: Malayo-Polynesian
    kind: family
    parent: map

  cmc:
    name: Chamic
    kind: family
    parent: poz

  ocm:
    name: Old Cham
    parent: cmc
    note: "the ancestor of the modern Cham languages (cja/cjm). Its
           earliest text (Dong Yen Chau, ~4th c. CE) is the oldest
           attested Austronesian document anywhere. The DHARMA Campa
           corpus attests it beside Sanskrit; held romanized (ocm-Latn)"

  ban:
    name: Balinese
    parent: poz
    glottocode: bali1278
    note: "Bali–Sasak–Sumbawa subgroup of Malayo-Polynesian (the
           subgroup carries no ISO 639-5 code — the kaw precedent;
           the edge reads through poz). Attested from the Old
           Balinese royal edicts (Bebetin/Sembiran, late 9th c. CE);
           the lontar palm-leaf tradition carries Balinese and Kawi
           literature in Balinese script to the present. Corpus:
           ban-wikisource (542 Balinese-script manuscripts / 18,374
           page passages + 5 romanized Leiden copies); Old Balinese
           stays unminted — the manuscript corpus is the living
           literary language, declared coarse"

  sas:
    name: Sasak
    parent: poz
    glottocode: sasa1249
    note: "the language of Lombok; Bali–Sasak–Sumbawa beside ban
           (same no-ISO-branch note). The Sasak lontar tradition
           shares the Balinese script and the Kawi literary
           inheritance. Corpus: ban-wikisource (3 Sasak manuscripts
           — minted because the consumer tags them, the
           smallest-honest-anchor practice)"

  ms:
    name: Malay
    parent: poz
    glottocode: mala1479
    note: "ISO 639-1 (the 639-3 macrolanguage code msa aliases
           here). Malayic; attested from the Old Malay inscriptions
           (Sojomerto, Kedukan Bukit, 7th c. — held via the DHARMA
           Nusantara corpus as omy) and, in Jawi, from the
           Terengganu stone (1303). Corpus: ms-wikisource (64
           Leiden/BL manuscript transcriptions — the hikayat and
           syair court tradition, 62 in Jawi)"
    stages:
      cls: {name: Classical Malay, band: [1300, 1900], ord: 10,
            band_note: "the Jawi literary language from the
                        Terengganu stone through the court hikayat
                        and syair manuscripts (Hikayat Aceh, 17th
                        c.) to the 19th-c. lithographs; approximate"}

  kaw:
    name: Old Javanese (Kawi)
    parent: poz
    note: "the literary ancestor stage of Javanese (jav); the Javanesic
           placement below Malayo-Polynesian carries no ISO branch code.
           Attested from the Sukabumi inscription (804 CE); the kakawin
           court-poetry tradition (Desavarnana, Sutasoma, Pararaton...) is
           its literature. The DHARMA Nusantara philology and epigraphy
           are the corpora; held romanized (kaw-Latn)"

  jv:
    name: Javanese
    parent: kaw
    glottocode: java1254
    note: "ISO 639-1 (639-3 jav aliases here). The Javanesic language of
           central and eastern Java — Austronesian, Malayo-Polynesian; the
           Javanesic placement carries no ISO 639-5 branch code (the kaw
           precedent: the edge reads through kaw to poz). Descent: Old
           Javanese (kaw, the kakawin and charter language from the
           Sukabumi inscription, 804 CE) → the Middle Javanese of the
           kidung (Majapahit-era, carried on in Bali; unminted, a named
           candidate stage) → New/Modern Javanese, the literary language of
           the Islamic pasisir and the Mataram courts (16th c. on), its
           speech-level (ngoko/krama) system fully grammaticalized in the
           Surakarta and Yogyakarta court literature of the 18th–19th c.
           (Yasadipura I–II, Ranggawarsita, Pakubuwana IV, Mangkunegara IV).
           Written in aksara Jawa (hanacaraka, ISO 15924 Java), in pegon
           (Arabic script) and, from the 19th-c. mission and colonial
           presses, in Latin. Corpus: jv-wikisource's dated 19th-century
           cone — the BL MSS Jav 24/28 manuscripts (1803, 1804), Gericke's
           New Testament (1848, aksara Jawa) and Old Testament (1854),
           Winter's Adji Såkå (1857), the Babad Dipa Nagara manuscript (D Or.
           13, 1866), Palmer van den Broek's Serat Kancil (1878), plus the
           1912–1929 prints of the Pararaton, Wulangreh and Wirit Hidayat
           Jati — measured per page jav-Java / jav. Stages unminted: the
           consumer dates at the print grain"

  omy:
    name: Old Malay
    parent: poz
    note: "the Malayic branch of Malayo-Polynesian (no ISO code for the
           branch); the ancestor stage of Malay (msa). Attested from the
           Srivijaya inscriptions (Kedukan Bukit, 683 CE) to the Laguna
           copperplate (900 CE, the Philippines' oldest document). The
           DHARMA Nusantara epigraphy attests it; held romanized
           (omy-Latn)"

  osn:
    name: Old Sundanese
    parent: poz
    note: "the ancestor stage of Sundanese (sun). Attested 14th-17th c.
           (Kawali, Batutulis, the Sanghyang prose treatises). The DHARMA
           Nusantara corpora attest it; held romanized (osn-Latn)"

  su:
    name: Sundanese
    parent: osn
    glottocode: sund1252
    note: "ISO 639-1 (639-3 sun aliases here). The language of West Java
           (Pasundan) — Austronesian, Malayo-Polynesian, its own Sundanese
           subgroup (no ISO 639-5 code; the edge reads through osn to poz,
           the ban/kaw precedent). Descent: Old Sundanese (osn — the Kawali
           and Batutulis inscriptions, 14th c.; the Sanghyang Siksakanda ng
           Karesian, 1518; the Carita Parahyangan, late 16th c.) → Modern
           Sundanese, whose literature from the 17th c. is shaped by
           Javanese-Mataram rule (the wawacan in Javanese-derived metres,
           the cacarakan script — Sundanese written in aksara Jawa) and the
           19th-c. Dutch-colonial schoolbook press (Muhamad Musa,
           Lasminingrat, Moehamad Oemar), alongside the oral pantun
           tradition (the Badui pantun, recorded 1891). Scripts: cacarakan
           (ISO 15924 Java), pegon (Arab), Latin; the Old Sundanese script
           (ISO 15924 Sund) in the old manuscripts and its 1997
           standardization. Corpus: su-wikisource's dated 19th-century cone
           (the 1841–1900 prints, measured sun / sun-Java per page) beside
           the DHARMA Old Sundanese texts held as osn. Stages unminted (the
           consumer dates at the print grain)"

  sit:
    name: Sino-Tibetan
    kind: family
    stages:
      pro: {name: Proto-Sino-Tibetan, mode: reconstructed, ord: 5, wikt: sit-pro,
            note: "no consensus reconstruction (Benedict/Matisoff STEDT vs the
                   Moscow school); this registry's corpus is starling-stibet
                   (2,823 Peiros-Starostin 1996 etymologies, improved
                   reconstructions)"}

  tai:
    name: Tai
    kind: family
    note: "ISO 639-5 tai: the Tai branch (Kra-Dai's largest; the
           Kra-Dai phylum itself carries no ISO 639-5 code — the
           placement stays prose, the aav/map top-level shape).
           Minted with the th anchor"

  th:
    name: Thai
    parent: tai
    glottocode: thai1261
    note: "ISO 639-1 (639-3 tha aliases here). Siamese; attested
           from the Sukhothai-era inscriptions (13th–14th c.); the
           consuming corpus is the royal chronicle compilation
           ประชุมพงศาวดาร in its early-Rattanakosin printings
           (≤ BE 2473 / 1930 CE by the edition rule). Corpus:
           th-wikisource (92 chronicle parts / 11,006 pages)"

  tbq:
    name: Tibeto-Burman
    kind: family
    parent: sit
    note: "the conventional non-Sinitic grouping (ISO 639-5 tbq); its
           validity as a clade is debated, the code is the standard
           filing place"

  pyx:
    name: Pyu
    parent: sit
    note: "Sino-Tibetan, position within it debated (parent edge kept at
           the family root for that reason); extinct, no modern
           descendant. The language of the Pyu city-states of the
           Irrawaddy valley, attested ~5th-13th c. CE. The DHARMA Corpus
           of Pyu Inscriptions (Griffiths et al.) is the corpus; held
           romanized (pyx-Latn)"

  obr:
    name: Old Burmese
    parent: tbq
    note: "Lolo-Burmese, Burmish (no ISO code below tbq); the ancestor of
           Burmese (mya). Attested from the Myazedi inscription (1112/1113
           CE) through the Bagan period. The Bagan stone inscriptions are
           the corpus, held in Myanmar-script Unicode with transliteration"

  # ── The comparative-etymology wing ──────────────────────────────────
  # Anchors forced by the StarLing etymological shelves (the Tower of
  # Babel databases, standing grant 2026-07-15): each proto stage is a
  # RECONSTRUCTED filing place for a named published corpus, and every
  # contested macro-family claim stays a note, never a parent edge.
  # Includes the bat/ccs backfill: starling-baltet and starling-kart
  # shipped bat-pro/ccs-pro before the registry discipline; their
  # anchors land here with the wave.

  tut:
    name: Altaic
    kind: family
    note: "ISO 639-5 tut. The Altaic/Transeurasian macro-family HYPOTHESIS
           (Turkic + Mongolic + Tungusic; 'Macro-Altaic' adds Koreanic and
           Japonic). Genealogical validity is widely doubted (Clauson's and
           Doerfer's areal/loan reading is the mainstream position); the node
           is the standard filing place for Moscow-school reconstructions,
           expressly individual reconstructions under the grant's own caveat.
           Corpus: starling-altet (2,805 Starostin-Dybo-Mudrak AED 2003
           etymologies with five branch databases)."
    stages:
      pro: {name: Proto-Altaic, mode: reconstructed, ord: 5,
            note: "tut-pro by the family-code + -pro convention (the
                   bat-pro/ccs-pro precedent); Wiktionary does not admit
                   Proto-Altaic reconstructions"}

  ccn:
    name: North Caucasian
    kind: family
    note: "ISO 639-5 ccn. The proposed union of Northeast (Nakh-Daghestanian)
           and Northwest (Abkhazo-Adyghean) Caucasian — the Nikolayev-Starostin
           NCED (Moscow 1994) hypothesis; the mainstream treats the two as
           separate families, so the node exists as the filing place for NCED
           reconstructions (often effectively Proto-East-Caucasian, the NCED's
           own admission where West Caucasian reflexes are absent). Corpus:
           starling-caucet (2,327 etymologies)."
    stages:
      pro: {name: Proto-North-Caucasian, mode: reconstructed, ord: 5,
            note: "ccn-pro by the family-code + -pro convention (the ccs-pro
                   sibling)"}

  ccs:
    name: Kartvelian
    kind: family
    glottocode: kart1248
    note: "ISO 639-5 ccs (South Caucasian): Georgian, Mingrelian, Laz, Svan —
           an uncontroversial family. Backfill anchor: starling-kart shipped
           ccs-pro before the registry discipline. Corpus: starling-kart
           (G. Klimov and Faehnrich-Sardshveladze etymological dictionaries,
           with S. Starostin's notes)."
    stages:
      pro: {name: Proto-Kartvelian, mode: reconstructed, ord: 5, wikt: ccs-pro}

  # ── Georgian-Zan (2026-10-21). Svan stands outside as Kartvelian's first
  # split; Georgian and Zan (Mingrelian xmf, Laz lzz) form the other
  # branch. Old Georgian and Georgian are separate ISO codes and stand as
  # SIBLINGS under ccs-gzn (the prg/chu separate-code shape, Glottolog's
  # own sibling placement); the descent between them is stated in prose
  # both ways, never drawn as an edge. Zan and Svan stay unminted — reflex
  # evidence only (xmf 291 · sva 247 · lzz 171), no corpus consumer ──

  ccs-gzn:
    name: Georgian-Zan
    kind: family
    parent: ccs
    glottocode: geor1252
    note: "Kartvelian > Georgian-Zan: Georgian beside Zan (Mingrelian xmf,
           Laz lzz), Svan standing outside as the first split (Klimov;
           Glottolog geor1252). Wiktionary's ccs-gzn family; its
           reconstructed stage keys 185 etymon edges of the kaikki Old
           Georgian extract (Proto-Georgian-Zan *kart-ul-, *ert- …)"
    stages:
      pro: {name: Proto-Georgian-Zan, mode: reconstructed, ord: 5, wikt: ccs-gzn-pro}

  oge:
    name: Old Georgian
    parent: ccs-gzn
    glottocode: oldg1234
    band: [430, 1100]
    band_note: "the earliest inscriptions (Bir el-Qutt in Palestine, 430s;
                the Bolnisi Sioni building inscription, 493/94) and the
                first literature (the Martyrdom of Shushanik, late 5th c.)
                to the close of the classical period around the 11th–12th
                c., when Middle Georgian takes over; approximate"
    note: "the classical literary language of the Georgian church: the
           Gospel and Bible translations (Adishi Gospels 897, the Athonite
           revisions of Euthymius and George the Hagiorite, 10th–11th c.),
           hagiography, hymnography and the chronicle tradition; written in
           the asomtavruli and nuskhuri scripts (khutsuri); held corpora
           transcribe to Mkhedruli. Its continuation is Georgian (ka) —
           PROSE, not an edge: oge and ka are separate ISO codes and stand
           as siblings under ccs-gzn (Glottolog's placement; Wiktionary
           files oge as ka's ancestor). Consumers: UD Old Georgian GLC (151
           sentences / 6,884 words), kaikki Old Georgian (728 records), 199
           descendant reflexes and 10 etymon edges; the TITUS Old Georgian
           corpora are the waiting large shelf"

  ka:
    name: Georgian
    parent: ccs-gzn
    glottocode: nucl1302
    note: "ISO 639-1 (639-3 kat and 639-2/B geo alias here). The
           Mkhedruli-written language of Georgia, the Kartvelian language
           with the longest record. It continues Old Georgian (oge) — PROSE,
           not an edge: the two are separate ISO codes, siblings under
           ccs-gzn. Middle Georgian (12th–18th c.: Rustaveli's Knight in
           the Panther's Skin, the Kartlis Tskhovreba redactions) is
           deliberately NOT staged — no consumer holds it (the TITUS Middle
           Georgian corpora are the candidate). Consumers: 1,195 kaikki
           descendant reflexes and 27 etymon edges; iip's 14 kat-coded
           inscriptions"

  # ── The StarLing branch-base wing (2026-10-07) ────────────────────────
  # The ALTAIC/CAUC/DRAV/SINTIB packages' 28 branch etymology bases
  # (consuming project's P114) key their shelves to the nodes below;
  # Wiktionary family codes used wherever they exist (verified against
  # Module:families 2026-10-07); dra-kui and dra-pem are coined (no
  # Wiktionary code; Konda-Kui subgrouping per Krishnamurti 2003).

  cau-nec:
    name: Northeast Caucasian
    kind: family
    parent: ccn
    note: "Nakh-Daghestanian — the uncontroversial eastern family.
           Parent edge ccn records the NCED's own North Caucasian
