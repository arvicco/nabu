           top-level family. The six branch nodes below carry the
           CAUC package's branch reconstructions"
    stages:
      pro: {name: Proto-Northeast-Caucasian, mode: reconstructed, ord: 5,
            wikt: cau-nec-pro}

  cau-nkh:
