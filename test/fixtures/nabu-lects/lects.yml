# lects.yml — the lect registry.
#
# A lect = anchor [":" stage] ["/" variety] ["~" script] ["@" ortho]
# (see README, docs/schema.md).
# Anchors are ISO 639 / established Wiktionary codes. Stages are time-slices of one
# lineage, ordered by `ord` (never by parent links). `parent:` is a descent edge:
# this lineage continues from that one. `mode: reconstructed` is the one
# machine-load-bearing field; everything else is documentation with provenance.
#
# Bands are per-anchor recorded decisions ([start, end] in years, negative = BCE,
# null = open), each carrying a band_note naming the convention followed. Bands are
# minted lazily and stated only where the editors are confident.

anchors:

  # ── The Indo-European family spine ─────────────────────────────────────────

  ine:
    name: Indo-European
    kind: family
    stages:
      pro: {name: Proto-Indo-European, mode: reconstructed, ord: 5, wikt: ine-pro}

  gem:
    name: Germanic
    kind: family
    parent: ine
    stages:
      pro: {name: Proto-Germanic, mode: reconstructed, ord: 5, wikt: gem-pro}

  gmw:
    name: West Germanic
    kind: family
    parent: gem
    stages:
      pro: {name: Proto-West-Germanic, mode: reconstructed, ord: 5, wikt: gmw-pro}

  gmq:
    name: North Germanic
    kind: family
    parent: gem
    stages:
      pro: {name: Proto-Norse (reconstructed), mode: reconstructed, ord: 5, wikt: gmq-pro}
      run: {name: Runic Proto-Norse (attested), band: [150, 800], ord: 10,
            band_note: "the Elder Futhark epigraphic span, approximate",
            note: "real inscriptions conventionally filed under a proto label —
                   attested epigraphy, hence a distinct attested stage"}

  ine-bsl:
    name: Balto-Slavic
    kind: family
    parent: ine
    stages:
      pro: {name: Proto-Balto-Slavic, mode: reconstructed, ord: 5, wikt: ine-bsl-pro}

  sla:
    name: Slavic
    kind: family
    parent: ine-bsl
    stages:
      pro: {name: Proto-Slavic, mode: reconstructed, ord: 5, wikt: sla-pro}

  itc:
    name: Italic
    kind: family
    parent: ine
    stages:
      pro: {name: Proto-Italic, mode: reconstructed, ord: 5, wikt: itc-pro}

  iir:
    name: Indo-Iranian
    kind: family
    parent: ine
    stages:
      pro: {name: Proto-Indo-Iranian, mode: reconstructed, ord: 5, wikt: iir-pro}

  cel:
    name: Celtic
    kind: family
    parent: ine
    stages:
      pro: {name: Proto-Celtic, mode: reconstructed, ord: 5, wikt: cel-pro}

  # ── Latin and Romance ──────────────────────────────────────────────────────

  lat:
    name: Latin
    glottocode: lati1261
    parent: itc:pro
    stages:
      arch: {name: Old Latin,         band: [-700, -75],  ord: 10, wikt: itc-ola,
             band_note: "conventional philological bands"}
      cla:  {name: Classical Latin,   band: [-75, 200],   ord: 20,
             band_note: "conventional philological bands"}
      late: {name: Late Latin,        band: [200, 600],   ord: 30, wikt: la-lat,
             band_note: "conventional philological bands"}
      med:  {name: Medieval Latin,    band: [600, 1350],  ord: 40, wikt: la-med,
             band_note: "conventional philological bands; boundaries vary by school"}
      ren:  {name: Renaissance Latin, band: [1350, 1550], ord: 50, wikt: la-ren,
             band_note: "conventional philological bands"}
      new:  {name: New Latin,         band: [1550, null], ord: 60, wikt: la-new,
             band_note: "conventional philological bands"}
    varieties:
      vul: {name: Vulgar Latin (attested substandard), kind: register, wikt: la-vul,
            note: "the ATTESTED register (Appendix Probi, graffiti) — the
                   reconstructed Proto-Romance of the comparative method is roa:pro,
                   a different object under the same upstream code"}
      ecc: {name: Ecclesiastical Latin, kind: register, wikt: la-ecc}

  roa:
    name: Romance
    kind: family
    glottocode: roma1334
    parent: lat
    stages:
      pro: {name: Proto-Romance, mode: reconstructed, ord: 5,
            note: "comparative-method étymons (DÉRom-style); Wiktionary files these
                   under la-vul; the reconstructed proxy for the spoken ancestor —
                   cf. lat:late and the lat/vul register"}

  roa-opt:
    name: Old Galician-Portuguese
    parent: roa

  por:
    name: Portuguese
    parent: roa-opt

  glg:
    name: Galician
    parent: roa-opt

  fro:
    name: Old French
    band: [842, 1400]
    band_note: "ISO 639-2/MARC reference name (842–ca. 1400)"
    parent: roa

  frm:
    name: Middle French
    band: [1400, 1600]
    band_note: "ISO 639-2/MARC reference name"
    parent: fro

  fr:
    name: French
    parent: frm

  pro:
    name: Old Occitan
    band: [null, 1500]
    band_note: "ISO 639-2/MARC reference name (Provençal, Old — to 1500)"
    parent: roa
    note: "the ISO code is literally 'pro' — no relation to the ':pro'
           proto-stage convention; an anchor id, never a stage suffix"

  oc:
    name: Occitan
    parent: pro
    # The dialect varieties (№R-41, 2026-08-21): tags are the IANA variant
    # subtag names VERBATIM (the 2018 Occitan registration; the ortho
    # axis's reuse-IANA doctrine, now shared) — Bec's six-dialect
    # classification, which is also the first consuming corpus's own
    # division, plus aranes. Deliberately unminted: nicard/cisaup/creiss
    # (IANA-registered, no holdings — use-case doctrine) and the
    # orthography variants grclass/grital/grmistr (no source
    # distinguishes orthography yet).
    varieties:
      gascon:   {name: Gascon,        kind: dialect}
      lengadoc: {name: Languedocien,  kind: dialect}
      provenc:  {name: Provençal,     kind: dialect}
      auvern:   {name: Auvergnat,     kind: dialect}
      lemosin:  {name: Limousin,      kind: dialect}
      vivaraup: {name: Vivaro-Alpine, kind: dialect}
      aranes:   {name: Aranese, kind: dialect,
                 note: "the Val d'Aran variety of Gascon — its own IANA
                        subtag and orthographic norm; the registry's flat
                        variety set carries the gascon ⊃ aranes nesting
                        in prose, not structure"}

  osp:
    name: Old Spanish
    parent: roa

  es:
    name: Spanish
    parent: osp

  ast:
    name: Asturleonese
    parent: roa
    note: "ISO 639-2 reference name is Asturian; the code conventionally
           covers the whole Asturian-Leonese continuum — no separate
           Leonese code exists"
    stages:
      old: {name: Old Leonese, band: [1150, 1500], ord: 10,
            band_note: "conventional, approximate — the medieval
                        Asturleonese of the charters, fueros and the
                        Fuero juzgo translations"}

  an:
    name: Aragonese
    parent: roa
    stages:
      old: {name: Navarro-Aragonese, band: [1100, 1500], ord: 10,
            band_note: "conventional, approximate — the medieval complex
                        (aragonés, navarro; riojano is the contested
                        transitional case, filed under Castilian by the
                        first consumer)",
            note: "one stage for the whole medieval complex; a /nav
                   (Navarrese) variety split waits on a source that
                   needs the distinction — the consumer's raw facet
                   preserves it meanwhile"}

  it:
    name: Italian
    parent: roa
    stages:
      old: {name: Old Italian, band: [960, 1400], ord: 10, wikt: roa-oit,
            band_note: "conventional, approximate — the Placiti cassinesi
                        to the Trecento (Dante, Petrarca, Boccaccio); the
                        1525 Bembo cut is the other school, recorded not
                        followed"}

  # ── Greek ──────────────────────────────────────────────────────────────────

  grk:
    name: Hellenic
    kind: family
    parent: ine

  grc:
    name: Ancient Greek
    glottocode: anci1242
    parent: grk
    stages:
      hom: {name: Epic (Homeric) Greek, band: [-800, -600], ord: 10,
            band_note: "conventional, approximate"}
      cla: {name: Classical Greek,      band: [-600, -300], ord: 20,
            band_note: "conventional, approximate"}
      koi: {name: Koine Greek,          band: [-300, 330],  ord: 30, wikt: grc-koi,
            band_note: "conventional (~300 BCE – 330 CE)"}
      byz: {name: Byzantine Greek,      band: [330, 1453],  ord: 40, wikt: gkm,
            band_note: "upper bound 1453 is the LoC/ISO cataloguing convention
                        (fall of Constantinople), not a linguistic boundary"}

  gmy:
    name: Mycenaean Greek
    parent: ine
    note: "the earliest attested Greek (Linear B); conventionally the elder
           sibling of the alphabetic tradition rather than its direct
           ancestor — hence a sibling anchor, not grc's parent"

  el:
    name: Modern Greek
    parent: grc

  # ── The English ladder (ISO already staged it) ─────────────────────────────

  ang:
    name: Old English
    glottocode: olde1238
    band: [450, 1100]
    band_note: "ISO 639-2/MARC reference name"
    parent: gmw:pro

  enm:
    name: Middle English
    band: [1100, 1500]
    band_note: "ISO 639-2/MARC reference name"
    parent: ang

  en:
    name: English
    parent: enm
    stages:
      early: {name: Early Modern English, band: [1500, 1700], ord: 10,
              band_note: "conventional English philology, approximate —
                          the Great Vowel Shift's middle passage to the
                          Restoration's settling orthography; the enm
                          band ends 1500 (ISO/MARC), this stage picks
                          up the seam"}

  # ── The other Germanic ladders (the P59 ISO-parentage wave: ISO already
  # staged these — anchors mirror its Historical-type chains within the
  # collection's focus axes; every chain touches holdings or reflexes) ─────

  got:
    name: Gothic
    parent: gem:pro

  goh:
    name: Old High German
    band: [750, 1050]
    band_note: "ISO 639-2/MARC reference name (ca. 750–1050)"
    parent: gmw:pro

  gmh:
    name: Middle High German
    band: [1050, 1500]
    band_note: "ISO 639-2/MARC reference name (ca. 1050–1500)"
    parent: goh

  de:
    name: German
    parent: gmh
    stages:
      early: {name: Early New High German, band: [1350, 1650], ord: 10,
              band_note: "conventional Germanistik (Frühneuhochdeutsch) —
                          gmh's ISO band stops ~1500, so ENHG texts ride
                          the de anchor; band per the Bochum reference
                          corpus (ReF) it was minted for"}

  osx:
    name: Old Saxon
    parent: gmw:pro

  gml:
    name: Middle Low German
    parent: osx

  nds:
    name: Low German
    parent: gml

  odt:
    name: Old Dutch
    parent: gmw:pro

  dum:
    name: Middle Dutch
    band: [1050, 1350]
    band_note: "ISO 639-2/MARC reference name (ca. 1050–1350)"
    parent: odt

  nl:
    name: Dutch
    parent: dum

  ofs:
    name: Old Frisian
    parent: gmw:pro

  fy:
    name: Western Frisian
    parent: ofs

  # ── The Celtic ladders (ISO staged all four; pgl–sga–mga–ga is the ogham
  # shelf's own descent) ───────────────────────────────────────────────────

  pgl:
    name: Primitive Irish
    parent: cel:pro
    note: "the Ogam epigraphic language"

  sga:
    name: Old Irish
    band: [null, 900]
    band_note: "ISO 639-2/MARC reference name (to 900)"
    parent: pgl

  mga:
    name: Middle Irish
    band: [900, 1200]
    band_note: "ISO 639-2/MARC reference name (900–1200)"
    parent: sga

  ga:
    name: Irish
    parent: mga

  owl:
    name: Old Welsh
    parent: cel:pro

  wlm:
    name: Middle Welsh
    parent: owl

  cy:
    name: Welsh
    parent: wlm

  obt:
    name: Old Breton
    parent: cel:pro

  xbm:
    name: Middle Breton
    parent: obt

  br:
    name: Breton
    parent: xbm

  oco:
    name: Old Cornish
    parent: cel:pro

  cnx:
    name: Middle Cornish
    parent: oco

  kw:
    name: Cornish
    parent: cnx

  # ── Chinese ────────────────────────────────────────────────────────────────

  zhx:
    name: Sinitic
    kind: family
    parent: sit

  zho:
    name: Chinese
    parent: zhx
    stages:
      old: {name: Old Chinese,    band: [-1250, -100], ord: 10, iso: och,
            band_note: "conventional, approximate"}
      mid: {name: Middle Chinese, band: [400, 1000],   ord: 20, iso: ltc,
            band_note: "conventional, approximate"}
      oman: {name: Old Mandarin, band: [1200, 1455], ord: 30,
             band_note: "conventional, approximate — the Yuan-era spoken
                         standard the phonological record attests: the
                         Menggu Ziyun (1308, 'Phags-pa) and Zhongyuan
                         Yinyun (1324) rhyme books. No ISO code exists;
                         consumers tag such shelves with the honest-coarse
                         zho and the zho:oman lect row refines"}
    varieties:
      lit: {name: Literary Chinese (wenyan), kind: register, iso: lzh,
            note: "a written register spanning stages, used for roughly two
                   millennia; compose a stage per document where datable
                   (e.g. zho:mid/lit)"}

  # ── Tibetan (the accidentally clean ISO case) ──────────────────────────────

  otb:
    name: Old Tibetan
    parent: tbq
    note: "Tibetic (Bodish); the language of the Dunhuang documents and
           the imperial inscriptions, ancestor of Classical Tibetan (xct)"

  xct:
    name: Classical Tibetan
    glottocode: clas1254
    parent: otb

  bod:
    name: Tibetan
    parent: xct

  # ── Newar (P88 mint: the DACON corpus — the xct/bod two-anchor mold) ──────

  nwc:
    name: Classical Newari
    band: [1100, 1900]
    band_note: "the attested manuscript/inscription span (DACON's four
                texts run 12th–19th century); conventional, approximate"
    parent: sit
    note: "Sino-Tibetan (Newaric); the literary language of the Kathmandu
           valley's manuscript tradition, ancestor of Newar (new); DACON's
           annotated texts are the held corpus"

  new:
    name: Newar
    parent: nwc

  # ── Afro-Asiatic ───────────────────────────────────────────────────────────

  afa:
    name: Afro-Asiatic
    kind: family

  sem:
    name: Semitic
    kind: family
    parent: afa

  # ── Aramaic and Hebrew ─────────────────────────────────────────────────────

  arc:
    name: Aramaic
    parent: sem
    stages:
      imp: {name: Imperial (Official) Aramaic, band: [-700, -300], ord: 10, iso: arc,
            band_note: "ISO 639-2 reference name: Official Aramaic (700–300 BCE)"}
      bib: {name: Biblical (Qumran) Aramaic, ord: 20}
      mid: {name: Middle (Jewish Literary) Aramaic, ord: 30}
    varieties:
      jud: {name: Jewish (Targumic), kind: sociolect}

  syc:
    name: Classical Syriac
    parent: arc
    note: "the Edessan literary Aramaic"

  # The Aramaic dialect fan (ruled 2026-08-09, closing the standing item):
  # BARE anchors with parent arc — plain ISO facts on the descent graph, the
  # chains doctrine. No re-parenting of arc's own stages: sefaria's
  # arc:mid/jud rows model the literary-register axis and stand unchanged.
  jpa:
    name: Jewish Palestinian Aramaic
    parent: arc
  tmr:
    name: Jewish Babylonian Aramaic
    parent: arc
    note: "the Talmudic Aramaic ISO code"
  sam:
    name: Samaritan Aramaic
    parent: arc
  myz:
    name: Classical Mandaic
    parent: arc

  hbo:
    name: Biblical Hebrew
    parent: sem
    note: "Canaanite, Northwest Semitic; the language of the Hebrew Bible"

  heb:
    name: Hebrew
    parent: hbo
    stages:
      rab: {name: Rabbinic Hebrew, ord: 10}
      med: {name: Medieval Hebrew, ord: 20}

  # ── Ethiopic (P88 mint: the Geʿez shelf family — Beta maṣāḥǝft 3,774
  # docs + TraCES 15 + the Dillmann dictionary — was the largest
  # node-less language left after the Anatolian mint) ───────────────────────

  gez:
    name: Geʿez
    parent: sem
    note: "Ethio-Semitic (South Semitic). Band deliberately absent: the
           held corpus spans Aksumite inscriptions to 19th-century
           manuscripts and Geʿez remains liturgically alive"

  # ── Egyptian ───────────────────────────────────────────────────────────────

  egy:
    name: Egyptian
    parent: afa
    stages:
      old:  {name: Old Egyptian,    band: [-2600, -2000], ord: 10,
             band_note: "approximate Egyptological convention"}
      mid:  {name: Middle Egyptian, band: [-2000, -1350], ord: 20,
             band_note: "approximate Egyptological convention"}
      nk:   {name: New Kingdom Egyptian, band: [-1550, -1070], ord: 25,
             band_note: "the New Kingdom span, deliberately overlapping mid and
                         late: corpora dated at period grain straddle the
                         Middle-to-Late transition — the period's texts range
                         from Middle Egyptian literary register to Late
                         Egyptian vernacular. Where a document can be assigned
                         mid or late confidently, prefer those; this stage is
                         the honest coarser claim"}
      late: {name: Late Egyptian,   band: [-1350, -700],  ord: 30,
             band_note: "approximate Egyptological convention"}
      dem:  {name: Demotic,         band: [-650, 450],    ord: 40,
             band_note: "approximate Egyptological convention"}
    varieties:
      trad: {name: Égyptien de tradition, kind: register,
             note: "the Middle Egyptian REGISTER maintained in later copies
                    (Third Intermediate Period through Roman temple texts) — a
                    register claim, deliberately not a dating stage: the copies
                    are late, the language they maintain is not"}

  cop:
    name: Coptic
    parent: egy
    varieties:
      sah: {name: Sahidic, kind: dialect,
            note: "the classical literary dialect of Upper Egypt"}
      boh: {name: Bohairic, kind: dialect,
            note: "the Delta dialect, later the liturgical standard"}

  # ── Sumerian and the proto-cuneiform corpus ────────────────────────────────

  sux:
    name: Sumerian
    glottocode: sume1241
    note: "language isolate. Stage grid per the CDLI period vocabulary. Uruk-era proto-cuneiform
           is deliberately NOT a sux stage — see qpc."
    stages:
      arch: {name: Archaic Sumerian,        band: [-2900, -2700], ord: 10,
             band_note: "ED I-II, per the CDLI period convention — the earliest
                         texts whose Sumerian identification is secure"}
      ed:   {name: Early Dynastic Sumerian, band: [-2600, -2340], ord: 20,
             band_note: "ED IIIa-b (Fara/Abu Salabikh through pre-Sargonic
                         Lagash), per the CDLI period convention"}
      sarg: {name: Sargonic Sumerian,       band: [-2340, -2200], ord: 30,
             band_note: "the Old Akkadian period's Sumerian record (incl.
                         Lagash II), per the CDLI period convention"}
      ur3:  {name: Neo-Sumerian (Ur III),   band: [-2100, -2000], ord: 40,
             band_note: "per the CDLI period convention; the bulk of the
                         surviving record"}
      post: {name: Post-Sumerian,           band: [-2000, 100], ord: 50,
             band_note: "post-vernacular literary/liturgical Sumerian, from
                         the Old Babylonian corpus through the first-millennium
                         library copies to the end of the cuneiform scribal
                         tradition (last dated text 75 CE). Widened from the
                         OB-convention band [-2000,-1600] when the 2026-08-09
                         ruling assigned MB/MA/NA/NB-period copies to this
                         stage — the LANGUAGE claim spans the whole tradition"}
    varieties:
      es: {name: Emesal, kind: sociolect,
           note: "the 'fine tongue' beside main-dialect Emegir: the register
                  of the cult laments (Balaĝ, Eršema) sung by gala priests
                  and of female deities' direct speech, written syllabically
                  because the standard logograms would read as Emegir by
                  default; carried by the lament liturgy deep into the first
                  millennium. ORACC codes it sux-x-emesal (inline es);
                  consuming dictionaries: 9 oracc glossaries (censused
                  2026-09-27)"}

  qpc:
    name: Proto-cuneiform
    band: [-3350, -2900]
    band_note: "the Uruk V-III tablet corpus, per the CDLI period convention"
    note: "CDLI's local-use code — these tablets' only machine-readable home.
           Deliberately NOT mapped onto sux: whether the Uruk IV-III corpus
           encodes Sumerian at all is an open question (Englund contra
           Krebernik/Wilcke/Monaco), and upstream also files Susa
           proto-Elamite tablets and purely numerical Uruk V tablets under
           this code. A holder may claim specific ED I-II documents as
           sux:arch at document grain; the registry itself takes no side."

  elx:
    name: Elamite
    glottocode: elam1244
    note: "language isolate (the Elamo-Dravidian hypothesis remains
           unproven; the registry takes no side). Cuneiform Elamite from
           the Old Elamite treaty era to the Achaemenid chancery, where
           it served as an imperial administrative language alongside
           Old Persian and Babylonian; Proto-Elamite and Linear Elamite
           are script traditions, not stages of this anchor. Stage grid
           per the CDLI period vocabulary — the consuming library's
           2,723 elx documents (cdli 2,700 · oracc 23, censused
           2026-09-25) carry per-document period labels that materialize
           all four stages (Achaemenid 2,139 · Neo-Elamite 300 · Middle
           Elamite 277 · Old Elamite 1)"
    stages:
      old: {name: Old Elamite,        band: [-2700, -1500], ord: 10,
            band_note: "per the CDLI period convention (ca. 2700-1500 BC);
                        the treaty and sukkalmah-era record"}
      mid: {name: Middle Elamite,     band: [-1300, -1000], ord: 20,
            band_note: "per the CDLI period convention (ca. 1300-1000 BC);
                        the Igihalkid-Shutrukid royal record — scholarly
                        usage often opens the stage ~1500"}
      neo: {name: Neo-Elamite,        band: [-770, -539], ord: 30,
            band_note: "per the CDLI period convention (ca. 770-539 BC)"}
      ach: {name: Achaemenid Elamite, band: [-547, -331], ord: 40,
            band_note: "per the CDLI period convention (547-331 BC); the
                        chancery language of the Persepolis archives and
                        the trilingual royal inscriptions"}

  # ── Akkadian ───────────────────────────────────────────────────────────────

  akk:
    name: Akkadian
    parent: sem
    note: "East Semitic. The stage grid is dialect × period (Assyrian and Babylonian run in
           parallel), not a single ladder — ord orders display only"
    stages:
      ear: {name: Early Akkadian,   band: [-2600, -2350], ord: 3,
            band_note: "pre-Sargonic (ED IIIa-b) East Semitic, approximate —
                        the earliest Akkadian-read record, before the
                        Sargonic span old opens",
            note: "ORACC's akk-x-earakk, glossed by ORACC itself 'For
                   pre-Sargonic Akkadian' (ATF inline tutorial) — a distinct
                   period code beside oldakk, so a distinct stage rather
                   than a widened old band"}
      old: {name: Old Akkadian,     band: [-2340, -2200], ord: 5,
            band_note: "the Sargonic record, before the Assyrian/Babylonian
                        split; per the CDLI period convention"}
      ob: {name: Old Babylonian,    band: [-2000, -1600], ord: 10,
           band_note: "approximate Assyriological convention"}
      oa: {name: Old Assyrian,      band: [-1950, -1850], ord: 12,
           band_note: "the kārum-trade archives, per the CDLI period
                       convention; parallel to ob"}
      mb: {name: Middle Babylonian, band: [-1600, -1000], ord: 20,
           band_note: "approximate Assyriological convention"}
      ma: {name: Middle Assyrian,   band: [-1400, -1000], ord: 22,
           band_note: "per the CDLI period convention; parallel to mb"}
      na: {name: Neo-Assyrian,      band: [-1000, -600],  ord: 30,
           band_note: "approximate Assyriological convention"}
      nb: {name: Neo-Babylonian,    band: [-1000, 100],   ord: 40,
           band_note: "approximate Assyriological convention; overlaps na — see
                       the anchor note. The upper bound folds the Late
                       Babylonian / Achaemenid / Hellenistic record (to the
                       latest datable tablets, ~75 CE) into nb rather than
                       minting stages the period labels cut finer than the
                       language does"}
    varieties:
      lit: {name: Standard Babylonian, kind: register,
            note: "the literary register of first-millennium scholarship"}
      peri: {name: Peripheral Akkadian, kind: dialect,
             note: "the western-periphery scribal Akkadian of the Late
                    Bronze international age — Amarna, Nuzi, Emar, Ugarit,
                    Ḫattuša (15th-12th c. BCE): Akkadian as written by
                    non-native chanceries. ORACC codes it per period
                    (akk-x-mbperi 'MB Peripheral', with an obperi sibling),
                    so consumers reach it as the stage/variety compound
                    akk:mb/peri"}

  qca:
    name: Canaano-Akkadian
    parent: sem
