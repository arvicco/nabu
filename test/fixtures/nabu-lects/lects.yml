# lects.yml — the lect registry.
#
# A lect = anchor [":" stage] ["/" variety] ["~" script] ["@" ortho]
# (see README, docs/schema.md).
# Anchors are ISO 639 / established Wiktionary codes. Stages are time-slices of one
# lineage, ordered by `ord` (never by parent links). `parent:` is a descent edge:
# this lineage continues from that one. `mode: reconstructed` is the one
# machine-load-bearing field; everything else is documentation with provenance.
#
# Bands are per-anchor recorded decisions ([start, end] in years, negative = BCE,
# null = open), each carrying a band_note naming the convention followed. Bands are
# minted lazily and stated only where the editors are confident.

anchors:

  # ── The Indo-European family spine ─────────────────────────────────────────

  ine:
    name: Indo-European
    kind: family
    stages:
      pro: {name: Proto-Indo-European, mode: reconstructed, ord: 5, wikt: ine-pro}

  gem:
    name: Germanic
    kind: family
    parent: ine
    stages:
      pro: {name: Proto-Germanic, mode: reconstructed, ord: 5, wikt: gem-pro}

  gmw:
    name: West Germanic
    kind: family
    parent: gem
    stages:
      pro: {name: Proto-West-Germanic, mode: reconstructed, ord: 5, wikt: gmw-pro}

  gmq:
    name: North Germanic
    kind: family
    parent: gem
    stages:
      pro: {name: Proto-Norse (reconstructed), mode: reconstructed, ord: 5, wikt: gmq-pro}
      run: {name: Runic Proto-Norse (attested), band: [150, 800], ord: 10,
            band_note: "the Elder Futhark epigraphic span, approximate",
            note: "real inscriptions conventionally filed under a proto label —
                   attested epigraphy, hence a distinct attested stage"}

  ine-bsl:
    name: Balto-Slavic
    kind: family
    parent: ine
    stages:
      pro: {name: Proto-Balto-Slavic, mode: reconstructed, ord: 5, wikt: ine-bsl-pro}

  sla:
    name: Slavic
    kind: family
    parent: ine-bsl
    stages:
      pro: {name: Proto-Slavic, mode: reconstructed, ord: 5, wikt: sla-pro}

  itc:
    name: Italic
    kind: family
    parent: ine
    stages:
      pro: {name: Proto-Italic, mode: reconstructed, ord: 5, wikt: itc-pro}

  iir:
    name: Indo-Iranian
    kind: family
    parent: ine
    stages:
      pro: {name: Proto-Indo-Iranian, mode: reconstructed, ord: 5, wikt: iir-pro}

  cel:
    name: Celtic
    kind: family
    parent: ine
    stages:
      pro: {name: Proto-Celtic, mode: reconstructed, ord: 5, wikt: cel-pro}

  # ── Latin and Romance ──────────────────────────────────────────────────────

  lat:
    name: Latin
    glottocode: lati1261
    parent: itc:pro
    stages:
      arch: {name: Old Latin,         band: [-700, -75],  ord: 10, wikt: itc-ola,
             band_note: "conventional philological bands"}
      cla:  {name: Classical Latin,   band: [-75, 200],   ord: 20,
             band_note: "conventional philological bands"}
      late: {name: Late Latin,        band: [200, 600],   ord: 30, wikt: la-lat,
             band_note: "conventional philological bands"}
      med:  {name: Medieval Latin,    band: [600, 1350],  ord: 40, wikt: la-med,
             band_note: "conventional philological bands; boundaries vary by school"}
      ren:  {name: Renaissance Latin, band: [1350, 1550], ord: 50, wikt: la-ren,
             band_note: "conventional philological bands"}
      new:  {name: New Latin,         band: [1550, null], ord: 60, wikt: la-new,
             band_note: "conventional philological bands"}
    varieties:
      vul: {name: Vulgar Latin (attested substandard), kind: register, wikt: la-vul,
            note: "the ATTESTED register (Appendix Probi, graffiti) — the
                   reconstructed Proto-Romance of the comparative method is roa:pro,
                   a different object under the same upstream code"}
      ecc: {name: Ecclesiastical Latin, kind: register, wikt: la-ecc}

  roa:
    name: Romance
    kind: family
    glottocode: roma1334
    parent: lat
    stages:
      pro: {name: Proto-Romance, mode: reconstructed, ord: 5,
            note: "comparative-method étymons (DÉRom-style); Wiktionary files these
                   under la-vul; the reconstructed proxy for the spoken ancestor —
                   cf. lat:late and the lat/vul register"}

  roa-opt:
    name: Old Galician-Portuguese
    parent: roa

  por:
    name: Portuguese
    parent: roa-opt

  glg:
    name: Galician
    parent: roa-opt

  fro:
    name: Old French
    band: [842, 1400]
    band_note: "ISO 639-2/MARC reference name (842–ca. 1400)"
    parent: roa

  frm:
    name: Middle French
    band: [1400, 1600]
    band_note: "ISO 639-2/MARC reference name"
    parent: fro

  fr:
    name: French
    parent: frm

  pro:
    name: Old Occitan
    band: [null, 1500]
    band_note: "ISO 639-2/MARC reference name (Provençal, Old — to 1500)"
    parent: roa
    note: "the ISO code is literally 'pro' — no relation to the ':pro'
           proto-stage convention; an anchor id, never a stage suffix"

  oc:
    name: Occitan
    parent: pro

  osp:
    name: Old Spanish
    parent: roa

  es:
    name: Spanish
    parent: osp

  # ── Greek ──────────────────────────────────────────────────────────────────

  grc:
    name: Ancient Greek
    glottocode: anci1242
    stages:
      hom: {name: Epic (Homeric) Greek, band: [-800, -600], ord: 10,
            band_note: "conventional, approximate"}
      cla: {name: Classical Greek,      band: [-600, -300], ord: 20,
            band_note: "conventional, approximate"}
      koi: {name: Koine Greek,          band: [-300, 330],  ord: 30, wikt: grc-koi,
            band_note: "conventional (~300 BCE – 330 CE)"}
      byz: {name: Byzantine Greek,      band: [330, 1453],  ord: 40, wikt: gkm,
            band_note: "upper bound 1453 is the LoC/ISO cataloguing convention
                        (fall of Constantinople), not a linguistic boundary"}

  gmy:
    name: Mycenaean Greek
    parent: ine
    note: "the earliest attested Greek (Linear B); conventionally the elder
           sibling of the alphabetic tradition rather than its direct
           ancestor — hence a sibling anchor, not grc's parent"

  el:
    name: Modern Greek
    parent: grc

  # ── The English ladder (ISO already staged it) ─────────────────────────────

  ang:
    name: Old English
    glottocode: olde1238
    band: [450, 1100]
    band_note: "ISO 639-2/MARC reference name"
    parent: gmw:pro

  enm:
    name: Middle English
    band: [1100, 1500]
    band_note: "ISO 639-2/MARC reference name"
    parent: ang

  en:
    name: English
    parent: enm

  # ── The other Germanic ladders (the P59 ISO-parentage wave: ISO already
  # staged these — anchors mirror its Historical-type chains within the
  # collection's focus axes; every chain touches holdings or reflexes) ─────

  got:
    name: Gothic
    parent: gem:pro

  goh:
    name: Old High German
    band: [750, 1050]
    band_note: "ISO 639-2/MARC reference name (ca. 750–1050)"
    parent: gmw:pro

  gmh:
    name: Middle High German
    band: [1050, 1500]
    band_note: "ISO 639-2/MARC reference name (ca. 1050–1500)"
    parent: goh

  de:
    name: German
    parent: gmh

  osx:
    name: Old Saxon
    parent: gmw:pro

  gml:
    name: Middle Low German
    parent: osx

  nds:
    name: Low German
    parent: gml

  odt:
    name: Old Dutch
    parent: gmw:pro

  dum:
    name: Middle Dutch
    band: [1050, 1350]
    band_note: "ISO 639-2/MARC reference name (ca. 1050–1350)"
    parent: odt

  nl:
    name: Dutch
    parent: dum

  ofs:
    name: Old Frisian
    parent: gmw:pro

  fy:
    name: Western Frisian
    parent: ofs

  # ── The Celtic ladders (ISO staged all four; pgl–sga–mga–ga is the ogham
  # shelf's own descent) ───────────────────────────────────────────────────

  pgl:
    name: Primitive Irish
    parent: cel:pro
    note: "the Ogam epigraphic language"

  sga:
    name: Old Irish
    band: [null, 900]
    band_note: "ISO 639-2/MARC reference name (to 900)"
    parent: pgl

  mga:
    name: Middle Irish
    band: [900, 1200]
    band_note: "ISO 639-2/MARC reference name (900–1200)"
    parent: sga

  ga:
    name: Irish
    parent: mga

  owl:
    name: Old Welsh
    parent: cel:pro

  wlm:
    name: Middle Welsh
    parent: owl

  cy:
    name: Welsh
    parent: wlm

  obt:
    name: Old Breton
    parent: cel:pro

  xbm:
    name: Middle Breton
    parent: obt

  br:
    name: Breton
    parent: xbm

  oco:
    name: Old Cornish
    parent: cel:pro

  cnx:
    name: Middle Cornish
    parent: oco

  kw:
    name: Cornish
    parent: cnx

  # ── Chinese ────────────────────────────────────────────────────────────────

  zho:
    name: Chinese
    stages:
      old: {name: Old Chinese,    band: [-1250, -100], ord: 10, iso: och,
            band_note: "conventional, approximate"}
      mid: {name: Middle Chinese, band: [400, 1000],   ord: 20, iso: ltc,
            band_note: "conventional, approximate"}
    varieties:
      lit: {name: Literary Chinese (wenyan), kind: register, iso: lzh,
            note: "a written register spanning stages, used for roughly two
                   millennia; compose a stage per document where datable
                   (e.g. zho:mid/lit)"}

  # ── Tibetan (the accidentally clean ISO case) ──────────────────────────────

  otb:
    name: Old Tibetan

  xct:
    name: Classical Tibetan
    glottocode: clas1254
    parent: otb

  bod:
    name: Tibetan
    parent: xct

  # ── Aramaic and Hebrew ─────────────────────────────────────────────────────

  arc:
    name: Aramaic
    stages:
      imp: {name: Imperial (Official) Aramaic, band: [-700, -300], ord: 10, iso: arc,
            band_note: "ISO 639-2 reference name: Official Aramaic (700–300 BCE)"}
      bib: {name: Biblical (Qumran) Aramaic, ord: 20}
      mid: {name: Middle (Jewish Literary) Aramaic, ord: 30}
    varieties:
      jud: {name: Jewish (Targumic), kind: sociolect}

  syc:
    name: Classical Syriac
    parent: arc
    note: "the Edessan literary Aramaic. The wider Aramaic dialect fan
           (jpa, tmr, sam, myz) is DELIBERATELY unminted — those codes
           overlap the arc stage/variety model and need their own ruling"

  hbo:
    name: Biblical Hebrew

  heb:
    name: Hebrew
    parent: hbo
    stages:
      rab: {name: Rabbinic Hebrew, ord: 10}
      med: {name: Medieval Hebrew, ord: 20}

  # ── Egyptian ───────────────────────────────────────────────────────────────

  egy:
    name: Egyptian
    stages:
      old:  {name: Old Egyptian,    band: [-2600, -2000], ord: 10,
             band_note: "approximate Egyptological convention"}
      mid:  {name: Middle Egyptian, band: [-2000, -1350], ord: 20,
             band_note: "approximate Egyptological convention"}
      nk:   {name: New Kingdom Egyptian, band: [-1550, -1070], ord: 25,
             band_note: "the New Kingdom span, deliberately overlapping mid and
                         late: corpora dated at period grain straddle the
                         Middle-to-Late transition — the period's texts range
                         from Middle Egyptian literary register to Late
                         Egyptian vernacular. Where a document can be assigned
                         mid or late confidently, prefer those; this stage is
                         the honest coarser claim"}
      late: {name: Late Egyptian,   band: [-1350, -700],  ord: 30,
             band_note: "approximate Egyptological convention"}
      dem:  {name: Demotic,         band: [-650, 450],    ord: 40,
             band_note: "approximate Egyptological convention"}

  cop:
    name: Coptic
    parent: egy

  # ── Sumerian and the proto-cuneiform corpus ────────────────────────────────

  sux:
    name: Sumerian
    glottocode: sume1241
    note: "stage grid per the CDLI period vocabulary. Uruk-era proto-cuneiform
           is deliberately NOT a sux stage — see qpc."
    stages:
      arch: {name: Archaic Sumerian,        band: [-2900, -2700], ord: 10,
             band_note: "ED I-II, per the CDLI period convention — the earliest
                         texts whose Sumerian identification is secure"}
      ed:   {name: Early Dynastic Sumerian, band: [-2600, -2340], ord: 20,
             band_note: "ED IIIa-b (Fara/Abu Salabikh through pre-Sargonic
                         Lagash), per the CDLI period convention"}
      sarg: {name: Sargonic Sumerian,       band: [-2340, -2200], ord: 30,
             band_note: "the Old Akkadian period's Sumerian record (incl.
                         Lagash II), per the CDLI period convention"}
      ur3:  {name: Neo-Sumerian (Ur III),   band: [-2100, -2000], ord: 40,
             band_note: "per the CDLI period convention; the bulk of the
                         surviving record"}
      post: {name: Post-Sumerian,           band: [-2000, -1600], ord: 50,
             band_note: "the Old Babylonian literary/liturgical corpus, written
                         after spoken Sumerian died; the band is the OB period
                         convention, not the end of the scribal tradition"}

  qpc:
    name: Proto-cuneiform
    band: [-3350, -2900]
    band_note: "the Uruk V-III tablet corpus, per the CDLI period convention"
    note: "CDLI's local-use code — these tablets' only machine-readable home.
           Deliberately NOT mapped onto sux: whether the Uruk IV-III corpus
           encodes Sumerian at all is an open question (Englund contra
           Krebernik/Wilcke/Monaco), and upstream also files Susa
           proto-Elamite tablets and purely numerical Uruk V tablets under
           this code. A holder may claim specific ED I-II documents as
           sux:arch at document grain; the registry itself takes no side."

  # ── Akkadian ───────────────────────────────────────────────────────────────

  akk:
    name: Akkadian
    note: "the stage grid is dialect × period (Assyrian and Babylonian run in
           parallel), not a single ladder — ord orders display only"
    stages:
      old: {name: Old Akkadian,     band: [-2340, -2200], ord: 5,
            band_note: "the Sargonic record, before the Assyrian/Babylonian
                        split; per the CDLI period convention"}
      ob: {name: Old Babylonian,    band: [-2000, -1600], ord: 10,
           band_note: "approximate Assyriological convention"}
      oa: {name: Old Assyrian,      band: [-1950, -1850], ord: 12,
           band_note: "the kārum-trade archives, per the CDLI period
                       convention; parallel to ob"}
      mb: {name: Middle Babylonian, band: [-1600, -1000], ord: 20,
           band_note: "approximate Assyriological convention"}
      ma: {name: Middle Assyrian,   band: [-1400, -1000], ord: 22,
           band_note: "per the CDLI period convention; parallel to mb"}
      na: {name: Neo-Assyrian,      band: [-1000, -600],  ord: 30,
           band_note: "approximate Assyriological convention"}
      nb: {name: Neo-Babylonian,    band: [-1000, 100],   ord: 40,
           band_note: "approximate Assyriological convention; overlaps na — see
                       the anchor note. The upper bound folds the Late
                       Babylonian / Achaemenid / Hellenistic record (to the
                       latest datable tablets, ~75 CE) into nb rather than
                       minting stages the period labels cut finer than the
                       language does"}
    varieties:
      lit: {name: Standard Babylonian, kind: register,
            note: "the literary register of first-millennium scholarship"}

  # ── Sanskrit ───────────────────────────────────────────────────────────────

  san:
    name: Sanskrit
    parent: iir:pro
    stages:
      ved: {name: Vedic Sanskrit,     ord: 10, note: "IANA variant precedent: sa-vaidika"}
      epi: {name: Epic Sanskrit,      ord: 20, note: "IANA variant precedent: sa-itihasa"}
      cla: {name: Classical Sanskrit, ord: 30, note: "IANA variant precedent: sa-laukika"}

  # ── Iranian and Armenian (the ISO-parentage wave) ──────────────────────────

  ave:
    name: Avestan
    parent: iir:pro

  peo:
    name: Old Persian
    band: [-600, -400]
    band_note: "ISO 639-2/MARC reference name (ca. 600–400 BCE)"
    parent: iir:pro

  pal:
    name: Middle Persian (Pahlavi)
    parent: peo

  fa:
    name: Persian
    parent: pal

  xcl:
    name: Classical Armenian
    parent: ine

  axm:
    name: Middle Armenian
    parent: xcl

  hy:
    name: Armenian
    parent: axm

  # ── Slavic lects ───────────────────────────────────────────────────────────

  chu:
    name: Church Slavonic
    parent: sla:pro
    note: "the bare anchor names the canonical Old Church Slavonic corpus"
    stages:
      csl: {name: Church Slavonic (post-canonical), ord: 10}
    varieties:
      rus: {name: Russian recension, kind: recension}
      srp: {name: Serbian recension, kind: recension}

  orv:
    name: Old East Slavic
    parent: sla:pro
    stages:
      early: {name: Early Old East Slavic, ord: 10, note: "the birchbark era"}
      mid:   {name: Middle Russian span,   ord: 20}
      ruth:  {name: Ruthenian (prosta mova), ord: 30}

  ru:
    name: Russian
    parent: orv

  uk:
    name: Ukrainian
    parent: orv

  be:
    name: Belarusian
    parent: orv

  sl:
    name: Slovene
    stages:
      old:  {name: Old Slovene, ord: 10, note: "the Freising Fragments era"}
      emod: {name: Early Modern Slovene, ord: 20}
    orthos:
      bohoric: {name: Bohorič alphabet, script: latn, note: "IANA variant name"}

  bul:
    name: Bulgarian
    stages:
      emod: {name: Early Modern Bulgarian, ord: 10}
    varieties:
      dam: {name: Damaskini vernacular, kind: sociolect}

  # ── Others forced by holdings ──────────────────────────────────────────────

  jpn:
    name: Japanese
    stages:
      mod: {name: Modern Japanese, ord: 10}
    orthos:
      kyu: {name: Kyūjitai (pre-reform character forms), script: jpan,
            note: "pre-1946 printings"}

  non:
    name: Old Norse
    band: [800, 1350]
    band_note: "conventional Norse philology, approximate"
    parent: gmq:run
    note: "parent is the ATTESTED runic stage, per the most-specific-ancestor
           rule (attested lect preferred over gmq:pro)"

  isl:
    name: Icelandic
    parent: non
    stages:
      old: {name: Old Icelandic,    band: [1100, 1350], ord: 10,
            band_note: "conventional Icelandic philology, approximate"}
      mid: {name: Middle Icelandic, band: [1350, 1550], ord: 20,
            band_note: "conventional Icelandic philology, approximate"}
      mod: {name: Modern Icelandic, band: [1550, null], ord: 30,
            band_note: "conventional Icelandic philology, approximate"}

  ara:
    name: Arabic
    stages:
      cla: {name: Classical Arabic, ord: 10}

# ── Scripts (the ~ axis) ─────────────────────────────────────────────────────
#
# A GLOBAL table, deliberately not per-anchor: digraphia is open-ended, and
# which scripts a language is attested in is a fact about collections, not
# about the registry. Keys are ISO 15924 codes lowercased; every row is an
# ISO 15924 fact (`iso15924` carries the canonical spelling). The ~ axis
# claims the script of the TEXT AS HELD — the surface a reader of the
# document meets — never the artifact's original writing system (a consumer
# records that separately when it differs; a Latin-transliterated cuneiform
# tablet is `~latn` with the tablet's Xsux in the consumer's artifact
# field). Seeded from the first consuming collection's measured need,
# surface and artifact both; the set is open.

scripts:
  latn: {name: Latin,                                iso15924: Latn}
  grek: {name: Greek,                                iso15924: Grek}
  ogam: {name: Ogham,                                iso15924: Ogam}
  deva: {name: Devanagari (Nagari),                  iso15924: Deva}
  ital: {name: "Old Italic (Etruscan, Oscan, etc.)", iso15924: Ital}
  egyd: {name: Egyptian demotic,                     iso15924: Egyd}
  egyp: {name: Egyptian hieroglyphs,                 iso15924: Egyp}
  xsux: {name: "Cuneiform, Sumero-Akkadian",         iso15924: Xsux}
  hebr: {name: Hebrew,                               iso15924: Hebr}
  arab: {name: Arabic,                               iso15924: Arab}
  syrc: {name: Syriac,                               iso15924: Syrc}
  copt: {name: Coptic,                               iso15924: Copt}
  cyrl: {name: Cyrillic,                             iso15924: Cyrl}
  glag: {name: Glagolitic,                           iso15924: Glag}
  armn: {name: Armenian,                             iso15924: Armn}
  hant: {name: Han (Traditional variant),            iso15924: Hant}
  jpan: {name: Japanese (Han + Hiragana + Katakana), iso15924: Jpan}
  phnx: {name: Phoenician,                           iso15924: Phnx}
  runr: {name: Runic,                                iso15924: Runr}
  goth: {name: Gothic,                               iso15924: Goth}
