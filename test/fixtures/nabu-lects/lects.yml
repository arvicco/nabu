    note: "the mixed scribal language of the Canaanite Amarna letters:
           mainly Akkadian lexicon on Canaanite (Northwest Semitic)
           morphosyntax — an interlanguage of the Egyptian-vassal
           chanceries, not a vernacular (Izre'el, Canaano-Akkadian).
           Both components are Semitic, so the family edge is honest
           while no single-branch descent is claimable — the mixed
           nature stays this note. ORACC's registry names the code
           'Canaanite' (qca — a q- local-use code, the qpc precedent);
           consuming dictionary: the oracc aemw/amarna glossary
           (censused 2026-09-27)"

