  kle:
    name: Kulung
    parent: sit-kir
    note: "Kiranti; G. Tolsma's dictionary is the shelf
           (starling-kulet, 1,466 entries)"

  lif:
    name: Limbu
    parent: sit-kir
    note: "the largest Kiranti language, with its own script tradition
           (Sirijanga); van Driem's 1987 grammar's lexicon is the shelf
           (starling-limet, 2,354 entries)"

  ybi:
    name: Yamphu
    parent: sit-kir
    note: "Kiranti; R. Rutgers's 1998 grammar-dictionary is the shelf
           (starling-yamet, 1,974 entries)"

  dra-sou:
    name: South Dravidian
    kind: family
    parent: dra
    note: "the SD-I branch (Tamil-Malayalam-Kannada-Tulu-Nilgiri axis),
           per Krishnamurti 2003; StarLing's sdret follows the DED's
           South Dravidian scope. Corpus: starling-sdret (4,692
           etymologies)"
    stages:
      pro: {name: Proto-South-Dravidian, mode: reconstructed, ord: 5,
            wikt: dra-sou-pro}

  dra-tkt:
    name: Toda-Kota
    kind: family
    parent: dra-sou
    note: "the Nilgiri pair; StarLing's ktet ('KT') base. Corpus:
           starling-ktet (1,665 etymologies)"
    stages:
      pro: {name: Proto-Toda-Kota, mode: reconstructed, ord: 5,
            wikt: dra-tkt-pro}

  dra-tel:
    name: Teluguic
    kind: family
    parent: dra
    note: "Telugu and its closest relatives (SD-II's Telugu side).
           Parent kept coarse at dra: Krishnamurti groups Telugu with
           Gondi-Kui as South-Central; StarLing chains telet directly
           under dravet — the coarse edge records neither subgrouping
           as settled. Corpus: starling-telet (2,774 etymologies)"
    stages:
      pro: {name: Proto-Telugu, mode: reconstructed, ord: 5,
            wikt: dra-tel-pro,
            note: "Wiktionary's Teluguic proto is Old Telugu (dra-ote);
                   the StarLing reconstructions sit above the attested
                   stage, so the generic pro stage carries them"}

  dra-cen:
    name: Central Dravidian
    kind: family
    parent: dra
    note: "Kolami-Naiki + Parji-Gadaba; StarLing's kogaet
           ('Kolami-Gadaba') base IS this branch. Corpus:
           starling-kogaet (1,509 etymologies)"
    stages:
      pro: {name: Proto-Central-Dravidian, mode: reconstructed, ord: 5,
            wikt: dra-cen-pro}

  dra-nor:
    name: North Dravidian
    kind: family
    parent: dra
    note: "Kurux, Malto, Brahui. Corpus: starling-ndret (989
           etymologies)"
    stages:
      pro: {name: Proto-North-Dravidian, mode: reconstructed, ord: 5,
            wikt: dra-nor-pro}

  brh:
    name: Brahui
    parent: dra-nor
    note: "the Dravidian outlier of Balochistan; North Dravidian per
           Krishnamurti. Corpus: starling-braet (269 entries)"

  dra-gki:
    name: Gondi-Kui
    kind: family
    parent: dra
    note: "the SD-II/South-Central core minus Telugu (see dra-tel's
           coarseness note): Gondi + Konda-Kui. StarLing's gndet
           ('Gondwan') base. Corpus: starling-gndet (1,428 etymologies)"
    stages:
      pro: {name: Proto-Gondi-Kui, mode: reconstructed, ord: 5,
            wikt: dra-gki-pro}

  dra-gon:
    name: Gondi
    kind: family
    parent: dra-gki
    note: "the Gondi dialect continuum. Corpus: starling-gonet (1,475
           etymologies, 17 dialect/source columns)"
    stages:
      pro: {name: Proto-Gondi, mode: reconstructed, ord: 5,
            wikt: dra-gon-pro}

  dra-kki:
    name: Konda-Kui
    kind: family
    parent: dra-gki
    note: "Konda + Pengo-Manda + Kui-Kuwi, per Krishnamurti 2003 —
           the structural parent of the three nodes below"

  kfc:
    name: Konda
    parent: dra-kki
    note: "Konda (Kubi); single-language shelf. Corpus: starling-konet
           (961 entries)"

  dra-kui:
    name: Kui-Kuwi
    kind: family
    parent: dra-kki
    note: "COINED CODE (no Wiktionary family code exists): the Kui +
           Kuwi pair within Konda-Kui. Exists to carry StarLing's kuiet
