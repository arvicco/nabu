           corpus ~1,800 inscriptions from Ras Shamra. Reference
           dictionary: del Olmo Lete & Sanmartín, A Dictionary of the
           Ugaritic Language in the Alphabetic Tradition (Brill 2003) —
           ORACC's own uga reference. Consuming dictionaries: 3 oracc
           glossaries (censused 2026-09-27)"

  phn:
    name: Phoenician
    parent: sem
    note: "Canaanite, Northwest Semitic; the language of Tyre, Sidon and
           Byblos and of the first alphabet's spread; Punic (xpu) is its
           western descendant"

  xpu:
    name: Punic
    parent: phn
    note: "the Phoenician of the western colonies, Carthage above all;
           attested to late antiquity (Neo-Punic, and Latino-Punic in
           Tripolitania)"

  dra:
    name: Dravidian
    kind: family
    stages:
      pro: {name: Proto-Dravidian, mode: reconstructed, ord: 5, wikt: dra-pro,
            note: "reconstructed over four branches (South, South-Central,
                   Central, North); the DED (Burrow-Emeneau 1984) is the
                   standard cognate corpus. Corpus: starling-dravet (2,171
                   reconstructions, DED correspondences revised and
                   significantly modified by G. Starostin)"}

  ta:
    name: Tamil
    parent: dra
    note: "ISO 639-1; South Dravidian. The Sangam corpus (~1st c. BCE
           onward) opens its literature; the consuming collections hold
           classical and modern Tamil under the one code"

  inc:
    name: Indo-Aryan
    kind: family
    parent: iir

  bra:
    name: Braj
    parent: inc
    note: "Western Hindi; the dominant literary language of early modern
           North India (Krishna bhakti poetry, 15th-19th c.)"

  awa:
    name: Awadhi
    parent: inc
    note: "Eastern Hindi; the language of Tulsidas's Ramcaritmanas and
           Jayasi's Padmavat (16th c.)"

  # ── The Southeast Asian wing (v1.6.0) ──────────────────────────────────
  # Seven language anchors from one consuming wave — the DHARMA epigraphic
  # corpora (EFEO/ERC; per-file measured xml:lang census) and the Old
  # Burmese inscriptions of Bagan — each wired into its family spine
  # (ISO 639-5 codes), minted here with it: Austroasiatic (aav),
  # Austronesian (map > poz > cmc), Sino-Tibetan (sit > tbq).

  aav:
    name: Austroasiatic
    kind: family

  omx:
    name: Old Mon
    parent: aav
    note: "Austroasiatic, Monic; the language of the Dvaravati and early
           Bagan world, attested ~6th-13th c. CE — the Myazedi
           quadrilingual's fourth leg. No dedicated digital corpus
           exists; the DHARMA Pyu corpus carries two Old Mon inscriptions
           (79 lines, first-sync census 2026-09-02), the consuming
           library's first omx text anywhere; held romanized (omx-Latn)"

  okz:
    name: Old Khmer
    parent: aav
    note: "the Khmeric branch of Austroasiatic (no ISO code for the
           branch); the ancestor of Modern Khmer (khm). Attested from the
           early 7th c. CE (pre-Angkorian) through the Angkorian period,
           ~14th c. The DHARMA Corpus des inscriptions khmeres (the Coedes
           K-numbers) is the corpus; held romanized (okz-Latn), the
           stones' Khmer script rides the consumer's artifact records"

  xhm:
    name: Middle Khmer
    parent: okz
    note: "the stage between Old and Modern Khmer, ~15th-18th c. (the
           post-Angkorian transition); the DHARMA Khmer corpus attests it
           (3 editions, first-sync census 2026-09-01); held romanized
           (xhm-Latn)"

  khm:
    name: Khmer
    parent: xhm
    note: "Modern Khmer; the DHARMA Khmer corpus carries 23 modern-era
           editions (its K-numbering runs to the present); held romanized
           (khm-Latn) there, Khmer script (khmr) natively"

  map:
    name: Austronesian
    kind: family

  poz:
    name: Malayo-Polynesian
    kind: family
    parent: map

  cmc:
    name: Chamic
    kind: family
    parent: poz

  ocm:
    name: Old Cham
    parent: cmc
    note: "the ancestor of the modern Cham languages (cja/cjm). Its
           earliest text (Dong Yen Chau, ~4th c. CE) is the oldest
           attested Austronesian document anywhere. The DHARMA Campa
           corpus attests it beside Sanskrit; held romanized (ocm-Latn)"

  kaw:
    name: Old Javanese (Kawi)
    parent: poz
    note: "the literary ancestor stage of Javanese (jav); the Javanesic
           placement below Malayo-Polynesian carries no ISO branch code.
           Attested from the Sukabumi inscription (804 CE); the kakawin
           court-poetry tradition (Desavarnana, Sutasoma, Pararaton...) is
           its literature. The DHARMA Nusantara philology and epigraphy
           are the corpora; held romanized (kaw-Latn)"

  omy:
    name: Old Malay
    parent: poz
    note: "the Malayic branch of Malayo-Polynesian (no ISO code for the
           branch); the ancestor stage of Malay (msa). Attested from the
           Srivijaya inscriptions (Kedukan Bukit, 683 CE) to the Laguna
           copperplate (900 CE, the Philippines' oldest document). The
           DHARMA Nusantara epigraphy attests it; held romanized
           (omy-Latn)"

  osn:
    name: Old Sundanese
    parent: poz
    note: "the ancestor stage of Sundanese (sun). Attested 14th-17th c.
           (Kawali, Batutulis, the Sanghyang prose treatises). The DHARMA
           Nusantara corpora attest it; held romanized (osn-Latn)"

  sit:
    name: Sino-Tibetan
    kind: family
    stages:
      pro: {name: Proto-Sino-Tibetan, mode: reconstructed, ord: 5, wikt: sit-pro,
            note: "no consensus reconstruction (Benedict/Matisoff STEDT vs the
                   Moscow school); this registry's corpus is starling-stibet
                   (2,823 Peiros-Starostin 1996 etymologies, improved
                   reconstructions)"}

  tbq:
    name: Tibeto-Burman
    kind: family
    parent: sit
    note: "the conventional non-Sinitic grouping (ISO 639-5 tbq); its
           validity as a clade is debated, the code is the standard
           filing place"

  pyx:
    name: Pyu
    parent: sit
    note: "Sino-Tibetan, position within it debated (parent edge kept at
           the family root for that reason); extinct, no modern
           descendant. The language of the Pyu city-states of the
           Irrawaddy valley, attested ~5th-13th c. CE. The DHARMA Corpus
           of Pyu Inscriptions (Griffiths et al.) is the corpus; held
           romanized (pyx-Latn)"

  obr:
    name: Old Burmese
    parent: tbq
    note: "Lolo-Burmese, Burmish (no ISO code below tbq); the ancestor of
           Burmese (mya). Attested from the Myazedi inscription (1112/1113
           CE) through the Bagan period. The Bagan stone inscriptions are
           the corpus, held in Myanmar-script Unicode with transliteration"

  # ── The comparative-etymology wing ──────────────────────────────────
  # Anchors forced by the StarLing etymological shelves (the Tower of
  # Babel databases, standing grant 2026-07-15): each proto stage is a
  # RECONSTRUCTED filing place for a named published corpus, and every
  # contested macro-family claim stays a note, never a parent edge.
  # Includes the bat/ccs backfill: starling-baltet and starling-kart
  # shipped bat-pro/ccs-pro before the registry discipline; their
  # anchors land here with the wave.

  tut:
    name: Altaic
    kind: family
    note: "ISO 639-5 tut. The Altaic/Transeurasian macro-family HYPOTHESIS
           (Turkic + Mongolic + Tungusic; 'Macro-Altaic' adds Koreanic and
           Japonic). Genealogical validity is widely doubted (Clauson's and
           Doerfer's areal/loan reading is the mainstream position); the node
           is the standard filing place for Moscow-school reconstructions,
           expressly individual reconstructions under the grant's own caveat.
           Corpus: starling-altet (2,805 Starostin-Dybo-Mudrak AED 2003
           etymologies with five branch databases)."
    stages:
      pro: {name: Proto-Altaic, mode: reconstructed, ord: 5,
            note: "tut-pro by the family-code + -pro convention (the
                   bat-pro/ccs-pro precedent); Wiktionary does not admit
                   Proto-Altaic reconstructions"}

  ccn:
    name: North Caucasian
    kind: family
    note: "ISO 639-5 ccn. The proposed union of Northeast (Nakh-Daghestanian)
           and Northwest (Abkhazo-Adyghean) Caucasian — the Nikolayev-Starostin
           NCED (Moscow 1994) hypothesis; the mainstream treats the two as
           separate families, so the node exists as the filing place for NCED
           reconstructions (often effectively Proto-East-Caucasian, the NCED's
           own admission where West Caucasian reflexes are absent). Corpus:
           starling-caucet (2,327 etymologies)."
    stages:
      pro: {name: Proto-North-Caucasian, mode: reconstructed, ord: 5,
            note: "ccn-pro by the family-code + -pro convention (the ccs-pro
                   sibling)"}

  ccs:
    name: Kartvelian
    kind: family
    note: "ISO 639-5 ccs (South Caucasian): Georgian, Mingrelian, Laz, Svan —
           an uncontroversial family. Backfill anchor: starling-kart shipped
           ccs-pro before the registry discipline. Corpus: starling-kart
           (G. Klimov and Faehnrich-Sardshveladze etymological dictionaries,
           with S. Starostin's notes)."
    stages:
      pro: {name: Proto-Kartvelian, mode: reconstructed, ord: 5, wikt: ccs-pro}

  bat:
    name: Baltic
    kind: family
    parent: ine-bsl
    note: "ISO 639-5 bat: Lithuanian, Latvian, Old Prussian. Whether Baltic is
           a clade or a paraphyletic remnant beside Slavic is itself debated
           (Wiktionary reconstructs only at the Balto-Slavic level); the node
           is the filing place for the StarLing Baltic etymology base.
           Backfill anchor: starling-baltet shipped bat-pro before the
           registry discipline."
    stages:
      pro: {name: Proto-Baltic, mode: reconstructed, ord: 5,
            note: "bat-pro by the family-code + -pro convention; a
                   Moscow-school reconstruction level mainstream scholarship
                   folds into Balto-Slavic"}

  qfa-cka:
    name: Chukotko-Kamchatkan
    kind: family
    note: "no ISO 639-5 code; qfa-cka is Wiktionary's family code
           (Reconstruction:Proto-Chukotko-Kamchatkan pages verified live
           2026-09-26). Two branches: Chukotkan (Chukchi, Koryak, Alutor,
           Kerek) and Kamchatkan (Itelmen + the extinct Kamchadal varieties).
           Family-level unity is generally accepted (Glottolog chuk1271),
           Itelmen's membership debated historically; O. Mudrak's comparative
           work (1997/2000, the StarLing databases) supports it. Corpus:
           starling-kamet (1,099 reconstructions, Russian glosses)."
    stages:
      pro: {name: Proto-Chukotko-Kamchatkan, mode: reconstructed, ord: 5,
            wikt: qfa-cka-pro}

  qfa-chk:
    name: Chukotkan
    kind: family
    parent: qfa-cka
    note: "the northern branch — Chukchi (ckt), Koryak (kpy), Alutor (alr),
           Kerek; a shallow dialect-chain-like group. CODE COINED in
           Wiktionary's qfa- style: neither ISO 639-5 nor Wiktionary names
           the branch. Corpus: starling-chuket (O. Mudrak's 2,281
           Chukchee-Koryak reconstructions, subordinate to the qfa-cka base)."
    stages:
      pro: {name: Proto-Chukotkan (Chukchee-Koryak), mode: reconstructed,
            ord: 5}

  itl:
    name: Itelmen
    parent: qfa-cka
    note: "sole survivor of the Kamchatkan branch (Western Itelmen, moribund;
           Eastern and Southern Kamchadal extinct by the 19th c. — recorded in
           Krasheninnikov's and Dybowski's wordlists). Parent edge kept at the
           family root: the Kamchatkan branch node is deliberately not minted,
           Itelmen being its only coded member. Corpus: starling-itelet
           (O. Mudrak's 1,673 Proto-Itelmen reconstructions carrying
           Dybowski's W/S Kamchadal records)."
    stages:
      pro: {name: Proto-Itelmen, mode: reconstructed, ord: 5,
            note: "the gmq:pro shape — a reconstructed stage on a language
                   anchor, standing for the Kamchatkan branch proto"}

  qfa-yen:
    name: Yeniseian
    kind: family
    note: "no ISO 639-5 code; qfa-yen is Wiktionary's family code
           (Reconstruction:Proto-Yeniseian pages verified live 2026-09-26).
           Ket (ket, sole survivor) and Yugh (yug, extinct ~1970s) plus the
           18th/19th-c.-recorded extinct Kott (zko), Arin (xrn), Pumpokol
           (xpm), Assan. External proposals stay claims, no parent edge:
           Starostin's Sino-Caucasian (with North Caucasian and Sino-Tibetan)
           and Vajda's Dene-Yeniseian (2010). Corpus: starling-yenet (1,059
           Starostin 1995 reconstructions, Russian glosses)."
    stages:
      pro: {name: Proto-Yeniseian, mode: reconstructed, ord: 5,
            wikt: qfa-yen-pro}

# ── Scripts (the ~ axis) ─────────────────────────────────────────────────────
#
# A GLOBAL table, deliberately not per-anchor: digraphia is open-ended, and
# which scripts a language is attested in is a fact about collections, not
# about the registry. Keys are ISO 15924 codes lowercased; every row is an
# ISO 15924 fact (`iso15924` carries the canonical spelling). The ~ axis
# claims the script of the TEXT AS HELD — the surface a reader of the
# document meets — never the artifact's original writing system (a consumer
# records that separately when it differs; a Latin-transliterated cuneiform
# tablet is `~latn` with the tablet's Xsux in the consumer's artifact
# field). Seeded from the first consuming collection's measured need,
# surface and artifact both; the set is open.

scripts:
  latn: {name: Latin,                                iso15924: Latn}
  grek: {name: Greek,                                iso15924: Grek}
  ogam: {name: Ogham,                                iso15924: Ogam}
  deva: {name: Devanagari (Nagari),                  iso15924: Deva}
  ital: {name: "Old Italic (Etruscan, Oscan, etc.)", iso15924: Ital}
  egyd: {name: Egyptian demotic,                     iso15924: Egyd}
  egyp: {name: Egyptian hieroglyphs,                 iso15924: Egyp}
  xsux: {name: "Cuneiform, Sumero-Akkadian",         iso15924: Xsux}
  hebr: {name: Hebrew,                               iso15924: Hebr}
  arab: {name: Arabic,                               iso15924: Arab}
  syrc: {name: Syriac,                               iso15924: Syrc}
  copt: {name: Coptic,                               iso15924: Copt}
  cyrl: {name: Cyrillic,                             iso15924: Cyrl}
  glag: {name: Glagolitic,                           iso15924: Glag}
  armn: {name: Armenian,                             iso15924: Armn}
  hant: {name: Han (Traditional variant),            iso15924: Hant}
  jpan: {name: Japanese (Han + Hiragana + Katakana), iso15924: Jpan}
  phnx: {name: Phoenician,                           iso15924: Phnx}
  runr: {name: Runic,                                iso15924: Runr}
  goth: {name: Gothic,                               iso15924: Goth}
  tibt: {name: Tibetan,                              iso15924: Tibt}
  ethi: {name: "Ethiopic (Geʿez)",                   iso15924: Ethi}
  hang: {name: Hangul,                               iso15924: Hang}
  avst: {name: Avestan,                              iso15924: Avst}
  ugar: {name: Ugaritic,                             iso15924: Ugar}
  xpeo: {name: Old Persian cuneiform,                iso15924: Xpeo}
  mymr: {name: Myanmar (Burmese),                    iso15924: Mymr}
