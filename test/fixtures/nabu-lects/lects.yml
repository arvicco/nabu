                        + baroque), to the Revival's 1775 conventional
                        start; approximate. Wiktionary's cs-ear 'Early
                        Modern Czech' names the same rung (ancestor
                        zlw-ocs, descendant cs)",
            note: "the Kralice Bible (1579–93; one-volume 1613), Veleslavín,
