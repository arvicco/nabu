           (nn/nno) — standards, not stages; both deliberately unminted
           until a consumer holds modern Norwegian text. When one does,
           the descent question is a trap the single-parent tree cannot
           dodge: Bokmål continues the DANISH written norm of the union
           centuries over a Norwegian substrate, Nynorsk was built on
           the dialects continuing Middle Norwegian — prose here, never
           edges, per the contact doctrine. Parent is the undivided Old
           Norse anchor (the isl/sv precedent)."
    stages:
