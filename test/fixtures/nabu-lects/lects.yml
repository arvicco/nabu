  # ── Sanskrit ───────────────────────────────────────────────────────────────

  san:
    name: Sanskrit
    parent: iir:pro
    stages:
      ved: {name: Vedic Sanskrit,     ord: 10, note: "IANA variant precedent: sa-vaidika"}
      epi: {name: Epic Sanskrit,      ord: 20, note: "IANA variant precedent: sa-itihasa"}
      cla: {name: Classical Sanskrit, ord: 30, note: "IANA variant precedent: sa-laukika"}

  pli:
    name: Pali
    parent: san
    note: "Middle Indo-Aryan; the language of the Theravada canon — the
           consuming library's largest Indic holding (SuttaCentral's
           7,288 pli documents) and the Pali inscriptions of Bagan (the
           DHARMA Pyu corpus, 10 editions). The descent edge reads the
           lineage from Old Indo-Aryan (san), the pra shape; held
           romanized"

  pra:
    name: Prakrit
    parent: san
    note: "ISO 639-2 collective code, kept DELIBERATELY coarse: the
           consuming corpus (SuttaCentral's 22 pra docs) claims no finer
           identity, so the member codes (pka/pmh/psu/pgd…) stay
           unminted until a consumer distinguishes them. The descent
           edge reads the lineage — Middle Indo-Aryan continues from
           Old Indo-Aryan (san); the literary-register nuance stays
           here as prose. 2026-10-11: pka minted below — the first
           member a consumer distinguishes; pmh/psu/pgd stay unminted"

  pka:
    name: Ardhamāgadhī
    parent: pra
    note: "ISO 639-3 pka; the canonical Middle Indo-Aryan of the
           Śvētāmbara Jain Āgamas — Pischel's 'half-Māgadhī' (Grammatik
           §17), sharing features with Māgadhī and Māhārāṣṭrī. The
           canon's language layer reaches back toward the late
           centuries BCE; the received redaction was fixed at the
           Valabhī council (traditionally 453 or 466 CE). Corpus:
           prakrit-texts' Nandī and Anuogaddārāiṃ (pka-Latn, 764
           passages; the Āgamas proper stay excluded upstream — no
           grant on their files). Descent reads through pra (Middle ←
           Old Indo-Aryan); the dialect-geography nuance stays prose"

