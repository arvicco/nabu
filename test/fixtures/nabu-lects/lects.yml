  # ISO 639-5 code, so the pair rides directly under ine) ───────────────────

  xto:
    name: Tocharian A
    parent: ine
    band: [400, 1000]
    band_note: "the Tarim manuscript horizon, approximate — absolute
                Tocharian chronology rests on palaeography and carbon
                dates, both debated"
    note: "Agnean; the eastern (Turfan/Shorchuk) member of the pair, a
           liturgical/literary language possibly already dead in daily
           use when copied. With txb the branch rides directly under
           ine — no established family code, the hlu/xlu discipline.
           Consumers: kaikki extract (581 senses) now; the manuscript
           corpus is ask-gated (censused 2026-09-28)"

  txb:
    name: Tocharian B
    parent: ine
    band: [400, 1000]
    band_note: "the Tarim manuscript horizon, approximate — see xto"
    note: "Kuchean; the western and far better attested member —
           thousands of fragments (monastic, economic, medical,
           caravan passes) across three dialect areas. See xto on the
           codeless branch. Consumers: kaikki extract (2,856 senses)
           now; CEToM is ask-gated (censused 2026-09-28)"

  xcl:
    name: Classical Armenian
    parent: ine
    glottocode: clas1249
    band: [405, 1100]
    band_note: "Mesrop Mashtots' alphabet (c. 405) and the 5th-c. Bible
                translation to the rise of Middle Armenian; continued as the
                learned language (grabar) to the 19th c.; approximate"
    note: "grabar, Armenian's own branch of Indo-European: the 5th-c.
           Bible, Koriwn, Ełišē, Movsēs Xorenacʿi, the translated Greek and
           Syriac patristics. Glottolog groups Classical and Middle Armenian
           as one language (clas1249); Wiktionary keeps xcl and axm apart,
           as here. Descent from Proto-Armenian (Wiktionary hyx-pro, 58
           etymon edges in the kaikki Old Armenian extract) stays PROSE:
           minting an hyx family node would re-parent xcl off ine — a
           structural change deliberately deferred. Consumers: PROIEL (the
           New Testament), UD CAVaL, kaikki Old Armenian (8,541 records),
           iip"

  axm:
    name: Middle Armenian
    parent: xcl
    band: [1100, 1700]
    band_note: "the Cilician kingdom's written vernacular (12th–17th c.);
                approximate"
    note: "Cilician Armenian: the law codes, the medical literature
           (Mxitʿar Heracʿi's Consolation of Fevers, 1184), chronicles and
           colophons. No glottocode of its own (Glottolog folds it into
           clas1249 with xcl). Consumers: UD Middle Armenian ArmTDP (27
           sentences from a law code and a medical treatise), kaikki Middle
           Armenian (478 records), 481 descendant reflexes"

  hy:
    name: Armenian
    parent: axm
    glottocode: nucl1235
    note: "ISO 639-1 (639-3 hye and 639-2/B arm alias here). Modern
           Armenian — Eastern (Glottolog nucl1235, ISO hye) and Western;
           the two standards are varieties, deliberately unminted until a
           consumer separates them. Consumers: 6,385 kaikki descendant
           reflexes"

  # ── Slavic lects ───────────────────────────────────────────────────────────

  # The Slavic branch families (2026-10-10). Wiktionary's Module:families
  # carries zls / zlw / zlw-lch (all verified 2026-10-10, parents sla /
  # sla / zlw); none carries a -pro reconstruction there, so none is
  # minted here. East Slavic (zle) stays unminted: orv already roots the
  # East Slavic ladder on sla:pro and no consumer has asked for the clade.

  zls:
    name: South Slavic
    kind: family
    parent: sla
    note: "ISO 639-5 zls. The Slavic dialect continuum south of the
           Pannonian–Romanian wedge, separated from West and East Slavic
           by the Magyar and Vlach settlement of the 9th–10th c.
           Conventionally split into a WESTERN group (Slovene and the
           Serbo-Croatian complex: Kajkavian, Čakavian, Štokavian) and an
           EASTERN group (Bulgarian, Macedonian) — the split is a
           bundle of isoglosses across a continuum (Torlak transitional),
           kept as prose, not as zls-sub nodes (no standard code exists
           for either half). Old Church Slavonic is codified on an
           Eastern South Slavic base (the Thessaloniki dialect of Cyril
           and Methodius, 863). Attestation: the canonical OCS
           manuscripts (10th–11th c.), the Freising Fragments (~972–1039,
           Slovene), the Baška tablet (~1100, Croatian glagolitic), the
           Miroslav Gospel (c. 1186, Serbian recension). Members: chu,
           sl, sr, hr, bul, mk"

  zlw:
    name: West Slavic
    kind: family
    parent: sla
    note: "ISO 639-5 zlw. Three subgroups: Lechitic (zlw-lch: Polish,
           Kashubian, extinct Polabian and Slovincian), Czech–Slovak, and
           Sorbian (Upper/Lower). Diagnostics against the rest of Slavic:
           *tl/*dl kept (Cz. šídlo, Pl. mydło vs South/East Slavic loss),
           *kv-/*gv- kept before front vowels from the second
           palatalization (Pl. kwiat, Cz. květ vs Ru. cvet). The Czech–
           Slovak subgroup carries no standard code and is not minted —
           cs hangs directly on zlw. Attestation: Czech glosses and names
           from the 11th c., Polish names in the Bull of Gniezno (1136);
           Polabian only in 17th–18th-c. word lists. Corpus: korba
           (Middle Polish), prague-bible-1488 (Old Czech), the
           pl-wikisource and cs-wikisource premodern cones"

  zlw-lch:
    name: Lechitic
    kind: family
    parent: zlw
    note: "Wiktionary family code (Module:families, parent zlw, verified
           2026-10-10); no ISO 639-5 code. Polish, Kashubian (csb), the
           extinct Slovincian and Polabian (pox — the Drawehn Wendish of
           the Lüneburg Wendland, recorded c. 1700 in Hennig von Jessen's
           Vocabularium Venedicum, extinct by the mid-18th c.). Defining
           innovation: the Lechitic ablaut (przegłos lechicki: *e > 'o,
           *ě > 'a before hard dentals — Pl. niosę/niesie, las/lesie).
           Wiktionary further nests a Pomeranian node (zlw-pom: Kashubian,
           Slovincian) — unminted until a Kashubian consumer exists"

  chu:
    name: Church Slavonic
    parent: zls
    note: "the bare anchor names the canonical Old Church Slavonic corpus
           (the 10th–11th-c. glagolitic and early cyrillic codices:
           Zographensis, Marianus, Assemanianus, Suprasliensis, Savvina
           kniga, the Kiev Missal). Parent zls (re-wired 2026-10-10 from
           sla:pro when the South Slavic family was minted): OCS is the
           literary norm Cyril and Methodius codified (863) on the
           Eastern South Slavic speech of Thessaloniki, developed in the
           Ohrid and Preslav schools after 886 — Wiktionary files cu
           under zls likewise. It stands so close to Late Common Slavic
           that it served as its proxy for a century of comparative work;
           that closeness is the note's to state, not an edge.
           RECENSION CONVENTION (documented 2026-10-10): after the
           canonical period the language is written everywhere with the
           local vernacular bleeding into its phonology and orthography —
           a recension is that regional written tradition, an axis
           orthogonal to time, so it rides the VARIETY slot with kind
           recension, never a stage. Recensions are by construction
           post-canonical, so the honest lect id combines both axes:
           chu:csl/<recension> (chu:csl/bul, chu:csl/srp). Bare
           chu/<recension> stays grammatical for a consumer that cannot
           date its witness, but no codemap row targets it. The tag set
           follows the ISO 639-2 spelling of the recension's community
           (rus, srp, bul; cro for the glagolitic Croatian tradition).
           Macedonian (Ohrid) and Moldo-Wallachian recensions are
           recognized in the literature and deliberately unminted until
           a consumer holds them. Recorded future rules (censused
           2026-10-10, not forced): the consuming library's
           bg-wikisource charters carry the wiki's own recension
           grouping — 10 Serbian (Dušan, Milutin, Vukašin, Vuk Branković)
           → chu:csl/srp, 6 Bulgarian (Rila 1378, Zograf, Mrachka,
           Vatopedi, Dubrovnik, Brashov) → chu:csl/bul; the Povaljska
           listina (Brač, 1250, Croatian cyrillic, a Croatian/Church
           Slavonic mix) in hr-wikisource is a chu:csl/cro candidate.
           Those assignments are the consumer's facet rules — this file
           only guarantees the targets"
    stages:
      csl: {name: Church Slavonic (post-canonical), ord: 10}
      ncs: {name: New Church Slavonic (Synodal), ord: 20,
            band: [1650, 2100],
            band_note: "Patriarch Nikon's book revision (1650s-60s) onward;
                        the standard remains in liturgical use today, so
                        the band stays open at the modern end",
            note: "the post-reform standard of the Russian Church after
                   Nikon's book revision, fixed in the Elizabethan Bible
                   (1751) and used since as the liturgical language of the
                   Russian, Ukrainian, Belarusian, Serbian and Bulgarian
                   Orthodox churches. Classification: the latest stage of
                   Church Slavonic, Russian-recension in origin but
                   supra-regional by construction — which is why ncs rides
                   the STAGE slot bare, not a recension variety (the
                   recension convention above covers regional written
                   traditions; this one displaced them). Descent: from
                   chu:csl/rus through the Kyivan grammatical normalization
                   (Smotryc'kyj's Grammatica, 1619). Attestation: printed
                   liturgical books from the 1650s; hagiography and church
                   prose of the 18th c. Corpus: SCAT's 18th-c. Northern
                   Russian saints' lives (CC BY-SA 4.0); the DIACU dataset
                   (Cassese et al. 2025, doi 10.18653/v1/2025.bsnlp-1.12)
                   labels this period 'New Church Slavonic'. Coarseness
                   declared: the 17th/18th-c. boundary is a period label,
                   not an orthographic diagnosis"}
    varieties:
      rus: {name: Russian recension, kind: recension}
      srp: {name: Serbian recension, kind: recension,
            note: "Raška-school Serbian Church Slavonic from the Miroslav
                   Gospel (c. 1186) and the Nemanjić charters (Milutin,
                   Dušan) to its 18th-c. displacement by Russian Church
                   Slavonic"}
      cro: {name: Croatian recension, kind: recension,
            note: "the glagolitic Croatian Church Slavonic tradition"}
      bul: {name: Bulgarian recension (Middle Bulgarian), kind: recension,
            wikt: cu-bgm,
            note: "the written language of the Second Bulgarian Empire,
                   12th–14th c., culminating in Patriarch Euthymius's
                   Tărnovo orthographic reform (late 14th c.); Wiktionary's
                   cu-bgm 'Middle Bulgarian' (an etymology variety of cu,
                   verified 2026-10-10). Hallmarks: the yus confusion
                   (ѫ/ѧ mixing), ъ/ь merger tendencies, and the
                   Euthymian archaizing spellings. Witnesses: the royal
                   charters — Vatopedi and Dubrovnik (Ivan Asen II,
                   c. 1230), Zograf and Mrachka (Ivan Alexander, 1340s),
                   Brashov (Ivan Sratsimir), Rila (Ivan Shishman, 1378).
                   Corpus: bg-wikisource's six Bulgarian-group charters"}

