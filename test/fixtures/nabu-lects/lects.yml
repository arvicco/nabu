  pl:
    name: Polish
    parent: zlw-lch
    note: "Lechitic. Periodization after Zenon Klemensiewicz, Historia
           języka polskiego (1961–72): przedpiśmienny (before 1136),
           staropolski (1136 – turn of the 16th c.), średniopolski (16th c.
           – the 2nd half of the 18th), nowopolski (to 1939), najnowszy.
           The two premodern rungs are minted as stages; Modern Polish is
           the bare anchor's open end (the da precedent). Wiktionary's
           pl lists zlw-mpl as ancestor and nests zlw-opl as a separate
           language; here both are stages of one lineage (stages are
           time-slices, the codemap carries the crosswalk)"
    stages:
      old: {name: Old Polish, band: [1136, 1500], ord: 10, wikt: zlw-opl,
            band_note: "Klemensiewicz's staropolski — from the Bull of
                        Gniezno (1136, some 410 Polish names in a Latin
                        papal bull) to the turn of the 16th c.;
                        approximate",
            note: "witnesses: the Book of Henryków (first Polish sentence,
                   1270), Bogurodzica, the Holy Cross Sermons (c. 1300),
                   the Florian Psalter, Queen Sophia's Bible (1455)"}
      mid: {name: Middle Polish, band: [1500, 1780], ord: 20, wikt: zlw-mpl,
            band_note: "Klemensiewicz's średniopolski — the print era
                        (the first Polish books c. 1513) through the
                        Golden Age to the Enlightenment's reforms (the
                        Collegium Nobilium, the first partition 1772);
                        approximate. The KorBa corpus closes at 1772 by
                        its own definition",
            note: "Rej, Kochanowski, the Jakub Wujek Bible (1599), the
                   Baroque. Corpus: korba (850 texts, 1601–1775, the
                   IJP PAN Baroque corpus) and pl-wikisource's
                   Renaissance/Baroque cone"}

  cs:
    name: Czech
    parent: zlw
    note: "West Slavic, Czech–Slovak subgroup (unminted — see zlw).
           Periodization after Lamprecht, Šlosar & Bauer, Historická
           mluvnice češtiny (1986): pre-literary Czech before c. 1100;
           staročeština to c. 1500; střední čeština 1500–1775 (humanist to
           1620, baroque to 1775); nová čeština from the National Revival
           (Dobrovský). Modern Czech is the bare anchor's open end.
           Jan Hus's diacritic orthography (De orthographia bohemica,
           c. 1406–12) falls inside cs:old and rides no orthography tag
           until a consumer distinguishes the digraphic witnesses"
    stages:
      old: {name: Old Czech, band: [1100, 1500], ord: 10, wikt: zlw-ocs,
