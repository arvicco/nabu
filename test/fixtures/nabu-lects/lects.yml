  bat:
    name: Baltic
    kind: family
    parent: ine-bsl
    note: "ISO 639-5 bat: Lithuanian, Latvian, Old Prussian. Whether Baltic is
           a clade or a paraphyletic remnant beside Slavic is itself debated
           (Wiktionary reconstructs only at the Balto-Slavic level); the node
           is the filing place for the StarLing Baltic etymology base.
           Backfill anchor: starling-baltet shipped bat-pro before the
           registry discipline."
    stages:
      pro: {name: Proto-Baltic, mode: reconstructed, ord: 5,
            note: "bat-pro by the family-code + -pro convention; a
                   Moscow-school reconstruction level mainstream scholarship
                   folds into Balto-Slavic"}


  # ── The Baltic anchors. East Baltic (Lithuanian, Latvian) vs West Baltic
  # (Old Prussian) is the standard internal split; it is stated in prose,
  # never as edges (the sv/non undivided-parent precedent) — every anchor
  # parents on the bat family node directly. Glottolog has no Baltic
  # clade (Eastern Baltic east2280 sits directly under Balto-Slavic);
  # the bat filing node stays the parent, east2280 deliberately unminted ──

  lt:
    name: Lithuanian
    parent: bat
    glottocode: lith1251
    note: "East Baltic (Glottolog places it under Eastern Baltic east2280
           within Balto-Slavic). The most conservative living Indo-European
           language in its nominal accent and inflection. Written from 1547
           (Martynas Mažvydas' Catechismusa prasty szadei, Königsberg — the
           first Lithuanian book) in two traditions: Prussian Lithuania
           (Mažvydas, Bretkūnas' Bible manuscript 1590, the Wolfenbüttel
           Postil 1573, Donelaitis' Metai, written 1765–75) and the Grand
           Duchy (Daukša's Catechism 1595 and Postil 1599, Sirvydas'
           dictionary c. 1620). Modern standard from the late 19th c.
           (Jablonskis' grammar 1901). Corpus: none held yet; 3,757
           Wiktionary descendant reflexes resolve here (Zinkevičius,
           Lietuvių kalbos istorija III–IV, 1987–88)"
    stages:
      old: {name: Old Lithuanian, band: [1547, 1800], ord: 10, wikt: olt,
            band_note: "from the first book (Mažvydas 1547) to the end of
                        the 18th c. — the conventional Old Lithuanian
                        (senoji lietuvių kalba) span of the printed
                        tradition; approximate",
            note: "the language of the 16th–18th-c. religious prints and
                   dictionaries of both traditions (Mažvydas, Vilentas,
                   Bretkūnas, Daukša, Sirvydas, Donelaitis). Wiktionary's
                   olt — 188 descendant reflexes held. Corpus: none held"}

  lv:
    name: Latvian
    parent: bat
    glottocode: latv1249
    note: "East Baltic, beside Lithuanian (Glottolog: Eastern Baltic
           east2280 within Balto-Slavic); heavily shaped by centuries of
           contact with Middle Low German and Livonian Finnic (prose, never
           edges). The ISO macrolanguage lav covers Standard Latvian (lvs)
           and Latgalian (ltg — deliberately unminted until a consumer
           holds it). Written from the early 16th c.: Lord's-prayer
           specimens (Gisbert 1507, Grunau 1520), the first books the
           Catholic catechism of 1585 and the Lutheran Enchiridion of 1586,
           then Mancelius (Lettus 1638), Glück's Bible (1685–94), the
           manuscript dictionaries of Fürecker and Langius; the orthography
           follows German print conventions until the 1908–1920s reform.
           Corpus: SENIE (the Corpus of Early Written Latvian): 183
           documents / 48,995 passages, 1507–1800, every run
           language-tagged; 2,727 Wiktionary descendant reflexes"
    stages:
      old: {name: Old Latvian, band: [1500, 1800], ord: 10,
            band_note: "the written Latvian of the 16th–18th c. — SENIE's
                        own 16th–18th-century span (earliest specimen 1507,
                        latest prints 1800); the close is the conventional
                        turn to the Neo-Latvian (jaunlatviešu) 19th-c.
                        literary language; approximate",
            note: "the German-orthography written language of the Lutheran
                   and Catholic prints, the Bible, the hymnals, the laws and
                   the manuscript dictionaries — German- and Latin-trained
                   authors writing for Latvian congregations. Corpus: SENIE
                   (all 183 documents fall inside the band)"}

  prg:
    name: Old Prussian
    parent: bat
    glottocode: prus1238
    band: [1350, 1700]
    band_note: "from the earliest fragment (the Basel epigram, c. 1369) to
                extinction around 1700; approximate"
    note: "West Baltic — the best-attested member of the branch (its sister
           Yotvingian/Sudovian and Curonian are known from names and
           glosses only; prose, not nodes). Glottolog makes it a direct
           Balto-Slavic daughter (no Baltic clade). Attested in the Elbing
           Vocabulary (c. 1400, 802 words, German-Prussian), Simon Grunau's
           vocabulary (early 16th c.), and three Lutheran catechism
           translations printed at Königsberg — 1545 (two editions) and Abel
           Will's Enchiridion of 1561, the longest text. Extinct by c. 1700.
           Deliberately stage-less (a closed corpus; the hit precedent).
           Wiktionary prg. Corpus: none held; 1,152 Wiktionary descendant
           reflexes resolve here (Mažiulis, Prūsų kalbos etimologijos
           žodynas, 1988–97)"

  # ── Uralic. Glottolog (ural1272) lists the branches flat — Finnic, Saami,
  # Mordvinic, Mari, Permic, Hungarian, Mansi, Khanty, Samoyedic; the
  # intermediate Finno-Ugric / Finno-Permic / Finno-Volgaic groupings are
  # contested and recorded as prose, never edges. Minted with the first
  # held members ─────────────────────────────────────────────────────────

  urj:
    name: Uralic
    kind: family
    glottocode: ural1272
    note: "ISO 639-5 urj. No parent edge: the Uralic family has no
           established external relative (Uralo-Altaic, Indo-Uralic and
           Uralo-Yukaghir stay hypotheses — prose, never edges, the
           qfa-kor discipline). Corpus: none held at family grain; the
           Finnic anchors are its first members"
    stages:
      pro: {name: Proto-Uralic, mode: reconstructed, ord: 5, wikt: urj-pro}

  urj-fin:
    name: Finnic
    kind: family
    parent: urj
    glottocode: finn1317
    note: "Wiktionary's family code urj-fin (Baltic-Finnic). Finnish,
           Estonian, Karelian, Veps, Votic, Ingrian, Livonian; the Finnic–
           Saami tie (\"Finno-Saamic\") is not drawn as an edge. Parent is
           urj directly per Glottolog's flat Uralic; Glottolog's own
           internal nesting (Coastal Finnic > Neva > North/Central Finnic)
           stays prose — the contested-intermediates discipline"
    stages:
      pro: {name: Proto-Finnic, mode: reconstructed, ord: 5, wikt: urj-fin-pro}

  fi:
    name: Finnish
    parent: urj-fin
    glottocode: finn1318
    note: "North Finnic. Written from Mikael Agricola's Abckiria (1543) —
           the literary language rests on the south-western dialects of
           Turku, with eastern features admitted through the 19th c. Kotus'
           periodization: Old Literary Finnish (vanha kirjasuomi) 1540–1810,
           Early Modern Finnish (varhaisnykysuomi) 1810–1880 (deliberately
           unminted until a consumer holds it), Modern Finnish from 1880 —
           the bare anchor's open end. Corpus: VKS (Vanhan kirjasuomen
           korpus) — 4,133,202 tokens / 134 text files, 1543–1810; 1,620
           Wiktionary descendant reflexes (Häkkinen, Kehittyvä kieli, 1994)"
    stages:
      old: {name: Old Literary Finnish, band: [1540, 1810], ord: 10,
            band_note: "Kotus' vanha kirjasuomi — Agricola's first prints
                        (1543) to the end of Swedish rule (1809) and the
                        turn of the century; VKS's own span 1543–1810",
            note: "the Reformation-born written language: Agricola's ABC,
                   prayer book, New Testament (1548) and psalter, the first
                   full Bible (1642), Hemminki of Masku's hymnal, the
                   Swedish realm's laws and decrees in Finnish, sermons,
                   almanacs and Lizelius' first Finnish newspaper (1775–76).
                   Corpus: VKS — every text inside the band"}

  et:
    name: Estonian
    parent: urj-fin
    glottocode: esto1258
    note: "South Finnic (Tallinn-based North Estonian is the standard; the
           South Estonian Võro-Seto tradition is a variety, deliberately
           unminted until a consumer holds it; Glottolog's ISO is ekk,
           Standard Estonian — the est macrolanguage aliases here). Written
           from the 1520s–30s (the Kullamaa prayers c. 1524–32, the
           Wanradt–Koell catechism of 1535); the first full Bible in North
           Estonian 1739. Corpus: none held yet (VAKK, the Old Written
           Estonian corpus, is the candidate shelf); 1,139 Wiktionary
           descendant reflexes"
    stages:
      old: {name: Old Written Estonian, band: [1520, 1739], ord: 10,
            band_note: "the earliest written records (the Kullamaa prayers,
                        1520s–30s) to the 1739 North Estonian Bible, the
                        conventional close of the old written language
                        (vana kirjakeel); approximate",
            note: "the German-clergy written language of catechisms,
                   sermons (Müller's 1600–06), hymnals and the first
                   grammars (Stahl 1637, Gutslaff 1648). Corpus: none held"}

  # ── Basque: the European isolate. Parentless by the ecy/xht discipline;
  # the Aquitanian inscriptions of Roman Gaul are its acknowledged
  # ancestor-or-sister, recorded in prose until a consumer holds them ────

  eu:
    name: Basque
    glottocode: basq1248
    note: "Language isolate of the western Pyrenees (Gipuzkoa, Bizkaia,
           Araba, Navarre; Lapurdi, Lower Navarre, Zuberoa). The Aquitanian
           personal and divine names of Roman-era inscriptions are its
           earliest trace (prose — xaq unminted). Written from the 15th-c.
           fragments and Bernard Etxepare's Linguae Vasconum Primitiae
           (Bordeaux 1545) in strongly dialectal literary traditions
           (Labourdin, Souletin, Biscayan, Gipuzkoan, Navarrese) until the
           unified standard Euskara Batua (1968) — dialects are varieties,
           deliberately unminted until a consumer distinguishes them (the
           BIM/SAHCOBA works carry their dialect as a facet already).
           Periodization after the BIM/SAHCOBA projects: Archaic and Old
           Basque (15th c. to the mid-18th), Early and Late Modern Basque
           (mid-18th to mid-20th). Corpus: BIM/SAHCOBA — 15 works, 669,109
           tokens, 1545–1782; 13 Wiktionary descendant reflexes (Michelena,
           Fonética histórica vasca, 1961/1977; Trask, The History of
           Basque, 1997)"
    stages:
      arch: {name: Archaic Basque, band: [1400, 1599], ord: 5,
             band_note: "BIM's 'Archaic Basque': the earliest connected
                         texts (15th-c. fragments) through the 16th-c.
                         books; the 1600 close is the conventional cut;
                         approximate",
             note: "Etxepare (1545), Leizarraga's New Testament (1571), the
                    Lazarraga manuscript (c. 1564–67) — BIM's three Archaic
                    works"}
      old: {name: Old Basque, band: [1600, 1744], ord: 10,
            band_note: "BIM's 'Old Basque', 17th c. to the mid-18th; the
                        1745 close is Larramendi's trilingual dictionary,
                        the conventional turn; approximate",
            note: "the Labourdin classical prose (Materra 1617/1623,
                   Axular's Gero 1643, Pouvreau), the Souletin
                   (Tartas 1666, Belapeire 1696), the southern catechisms
                   (Beriain 1621, Kapanaga 1656, Otxoa de Arin 1713).
                   Corpus: BIM/SAHCOBA — 7 dated works inside the band"}
      emod: {name: Early Modern Basque, band: [1745, 1900], ord: 20,
             band_note: "SAHCOBA's 'Early Modern Basque' from the
                         mid-18th c.; the record names Early and Late
                         Modern Basque without a dividing year — 1900 is a
                         provisional round close, to be refined",
             note: "Larramendi's school, the Imitation-of-Christ
                    translations (Chourio's 1760 edition, Maister 1757),
                    the 1782 Avignon Rodríguez. Corpus: BIM/SAHCOBA — 3
                    dated works inside the band"}

  qfa-cka:
    name: Chukotko-Kamchatkan
    kind: family
    note: "no ISO 639-5 code; qfa-cka is Wiktionary's family code
           (Reconstruction:Proto-Chukotko-Kamchatkan pages verified live
           2026-09-26). Two branches: Chukotkan (Chukchi, Koryak, Alutor,
           Kerek) and Kamchatkan (Itelmen + the extinct Kamchadal varieties).
           Family-level unity is generally accepted (Glottolog chuk1271),
           Itelmen's membership debated historically; O. Mudrak's comparative
           work (1997/2000, the StarLing databases) supports it. Corpus:
           starling-kamet (1,099 reconstructions, Russian glosses)."
    stages:
      pro: {name: Proto-Chukotko-Kamchatkan, mode: reconstructed, ord: 5,
            wikt: qfa-cka-pro}

  qfa-chk:
    name: Chukotkan
    kind: family
    parent: qfa-cka
    note: "the northern branch — Chukchi (ckt), Koryak (kpy), Alutor (alr),
           Kerek; a shallow dialect-chain-like group. CODE COINED in
           Wiktionary's qfa- style: neither ISO 639-5 nor Wiktionary names
           the branch. Corpus: starling-chuket (O. Mudrak's 2,281
           Chukchee-Koryak reconstructions, subordinate to the qfa-cka base)."
    stages:
      pro: {name: Proto-Chukotkan (Chukchee-Koryak), mode: reconstructed,
            ord: 5}

  itl:
    name: Itelmen
    parent: qfa-cka
    note: "sole survivor of the Kamchatkan branch (Western Itelmen, moribund;
           Eastern and Southern Kamchadal extinct by the 19th c. — recorded in
           Krasheninnikov's and Dybowski's wordlists). Parent edge kept at the
           family root: the Kamchatkan branch node is deliberately not minted,
           Itelmen being its only coded member. Corpus: starling-itelet
           (O. Mudrak's 1,673 Proto-Itelmen reconstructions carrying
           Dybowski's W/S Kamchadal records)."
    stages:
      pro: {name: Proto-Itelmen, mode: reconstructed, ord: 5,
            note: "the gmq:pro shape — a reconstructed stage on a language
                   anchor, standing for the Kamchatkan branch proto"}

  qfa-yen:
    name: Yeniseian
    kind: family
    note: "no ISO 639-5 code; qfa-yen is Wiktionary's family code
           (Reconstruction:Proto-Yeniseian pages verified live 2026-09-26).
           Ket (ket, sole survivor) and Yugh (yug, extinct ~1970s) plus the
           18th/19th-c.-recorded extinct Kott (zko), Arin (xrn), Pumpokol
           (xpm), Assan. External proposals stay claims, no parent edge:
           Starostin's Sino-Caucasian (with North Caucasian and Sino-Tibetan)
           and Vajda's Dene-Yeniseian (2010). Corpus: starling-yenet (1,059
           Starostin 1995 reconstructions, Russian glosses)."
    stages:
      pro: {name: Proto-Yeniseian, mode: reconstructed, ord: 5,
            wikt: qfa-yen-pro}

  # ── The Americas (2026-10-11) ─────────────────────────────────────────
  # The registry's first American nodes, forced by the consuming
  # library's americas wave: the Ticha colonial Valley Zapotec corpus and
  # the two colonial UD treebanks (TuDeT Tupinambá, OldTuDeT Guaraní).
  # Families are minted on standard codes only (ISO 639-5 omq/tup, the
  # Wiktionary Module:families codes omq-zap/tup-gua, verified
  # 2026-10-11) and only where a real anchor hangs from them; the deeper
  # Glottolog-only intermediates (Eastern Otomanguean, Popoloca-Zapotecan,
  # Eastern Tupian, Maweti-Guarani, the Tupi-Guarani subgroups) carry no
  # standard code and stay prose with their glottocodes. Glottocodes and
  # Glottolog classifications verified against glottolog.org 2026-10-11;
  # ISO 639-3 facts against the SIL code tables of the same day.

  omq:
    name: Oto-Manguean
    kind: family
    glottocode: otom1299
    note: "ISO 639-5 omq (the LoC hierarchy files it under cai, Central
           American Indian); Wiktionary omq. The most internally diverse
           family of Mesoamerica — every member tonal — spoken from
           Hidalgo and Querétaro to Oaxaca and Guerrero, historically to
           Nicaragua (Mangue, Subtiaba). Kaufman's (1983, 1988) split,
           followed by Campbell (1997) and Glottolog: an EASTERN branch
           (east2557: Popoloca-Zapotecan popo1292 — Popolocan +
           Zapotecan — and Amuzgo-Mixtecan) against a WESTERN one
           (Oto-Pamean–Chinantecan, Tlapanec–Manguean). Both branch nodes
           and Popoloca-Zapotecan carry no ISO or Wiktionary code and are
           not minted: the chain omq > east2557 > popo1292 > zapo1436 is
           recorded here, and Zapotecan (omq-zap, which Wiktionary hangs
           directly on omq) is the first coded node below. Proto-
           Oto-Manguean (Rensch 1976, Kaufman 1983) carries no pro stage
           here — no reconstruction corpus is held. Attestation: the
           Zapotec glyphic inscriptions of the Oaxaca valley (from the
           mid-1st millennium BCE; only partially deciphered — the
           language ISO codes xzp, see zap) and the Mixtec pictographic
           codices are the earliest records; alphabetic writing begins
           with the mendicant grammars and catechisms of the 1560s–1590s
           (Feria's Zapotec Doctrina 1567, Córdova's Zapotec Arte and
           Vocabulario 1578, Reyes's and Alvarado's Mixtec Arte and
           Vocabulario 1593). Members here: omq-zap"

  omq-zap:
    name: Zapotecan
    kind: family
    parent: omq
    glottocode: zapo1436
    note: "Wiktionary family code (Module:families, parent omq, verified
           2026-10-11); no ISO 639-5 code. Two groups: Zapotec (the zap
           macrolanguage; Wiktionary's own sub-family omq-zpc) and Chatino
           (ctp, cya, ctz, …), on the southern Oaxaca coast. Glottolog
           nests it as Otomanguean > Eastern Otomanguean (east2557) >
           Popoloca-Zapotecan (popo1292) > Zapotecan; the two intermediate
           nodes have no standard code and stay this prose (see omq) —
           the edge to omq is the most specific CODED ancestor, not a
           claim that Zapotecan is a primary branch. Proto-Zapotec is
           reconstructed in Kaufman's unpublished drafts (1990s–2000s); no pro stage is
           minted without a held corpus. Members here: zap"

  zap:
    name: Zapotec
    parent: omq-zap
    glottocode: zapo1437
    note: "ISO 639-2/3 zap, a MACROLANGUAGE of 58 active individual
           languages (SIL macrolanguage table, 2026-10-11) — Valley,
           Sierra Norte, Sierra Sur and Isthmus groups, many mutually
           unintelligible; Glottolog's crosswalk for zap is the family
           node zapo1437 'Zapotec' under Zapotecan. Wiktionary keeps zap
           as a language under omq-zap beside its family omq-zpc
           'Zapotec' (parent of the individual codes zab, zai, …); no
           codemap row folds omq-zpc here — a family code is not a
           macrolanguage spelling, and no consumer holds it. The bare
           anchor names the whole Zapotec complex across time, the
           shape the no anchor takes for a macrolanguage; the individual
           modern languages stay unminted until a consumer holds modern
           text. The colonial written record is one stage, zap:col.
           ANCIENT ZAPOTEC (ISO 639-3 xzp) IS DELIBERATELY NOT FOLDED
           HERE: xzp is an active individual historical code (change
           request 2006-065, Linguist List, adopted 2007-07-18; not a
           member of the zap macrolanguage) whose request defines it as
           'the language of possibly the earliest Mesoamerican script',
           the pre-Hispanic glyphic inscriptions (Monte Albán, San José
           Mogote), 'a very early precursor of the modern Zapotec
           languages'. That is not the colonial alphabetic language, so a
           universal codemap row xzp → zap:col would misread every
           glyphic-epigraphy collection; identity leaves xzp bare (no
           Glottolog languoid carries xzp; Wiktionary lists it
           unaffiliated). A collection whose encoders spell 16th-c.
           Valley Zapotec xzp (Córdova's TEI header in the Ticha corpus
           does) folds it onto zap:col in its own per-collection
           override — collection knowledge, never this file's"
    stages:
      col: {name: Colonial Valley Zapotec, band: [1550, 1850], ord: 10,
            band_note: "the alphabetic colonial record of the Valley of
                        Oaxaca as the Ticha project and its scholarship
                        (Lillehaugen, Broadwell, Oudijk, Smith Stark)
                        delimit it — from the mendicant grammars and the
                        first native-hand documents of the mid-16th c. to
                        the last Zapotec-language notarial papers of the
                        early national period (the colonial era closes
                        1821 by name; the writing tradition does not);
                        approximate",
            note: "the term (CVZ) is the field's own for the Valley
                   Zapotec written in Latin script under Spanish rule —
                   a set of closely related Valley varieties written in
                   a shared mendicant orthography, not one dialect.
                   Printed works: Pedro de Feria's Doctrina cristiana
                   (México 1567), Juan de Córdova's Arte en lengua
                   zapoteca and Vocabulario en lengua çapoteca (México
                   1578), Cristóbal de Agüero's Miscelaneo espiritual
                   (México 1666), Leonardo Levanto's Cathecismo (Puebla
                   1766). Manuscripts: the testaments, bills of sale and
                   cabildo papers of the Valley towns written by native
                   notaries. Corpus: ticha (93 documents — the printed
                   works plus the Valley manuscripts, dated 1633–1832 in
                   the consuming lane's census)"}

  tup:
    name: Tupian
    kind: family
    glottocode: tupi1275
    note: "ISO 639-5 tup; Wiktionary tup (alias Tupi). Some seventy
           languages in ten branches after Rodrigues (1958, 1986):
           Tupi-Guarani, Arikem, Aweti, Juruna, Mawe, Monde, Munduruku,
           Purubora, Ramarama, Tupari — the non-Tupi-Guarani branches
           clustered in Rondônia, the Madeira–Guaporé region taken as the
           family homeland. Glottolog groups Tupi-Guarani with Aweti
           (Aweti-Guarani awet1245), then Mawe (Maweti-Guarani
           mawe1252), inside Eastern Tupian (east2909); none of those
           three carries a standard code, so they stay prose and
           tup-gua hangs on tup directly. Proto-Tupian (Rodrigues &
           Cabral, Galucio et al. 2015) carries no pro stage — no
           reconstruction corpus is held. Attestation begins with the
           16th-c. European records of the coastal Tupinambá (Staden
           1557, Léry 1578) and the Jesuit grammars. Members here:
           tup-gua"

  tup-gua:
    name: Tupi-Guarani
    kind: family
    parent: tup
    glottocode: tupi1276
    note: "Wiktionary family code (Module:families, parent tup, alias
           Tupí-Guaraní; verified 2026-10-11); no ISO 639-5 code. The
           largest Tupian branch, some fifty languages from the Atlantic
           coast to the Andean foothills and the Amazon, in eight
           subgroups after Rodrigues & Cabral (2002): Guarani is
           subgroup I, Tupinambá subgroup III (Glottolog: Southern
           Tupi-Guarani sout3271 > Tupi-Guarani Subgroup I tupi1277 /
           III tupi1287 — subgroups unminted, no standard codes).
           Proto-Tupi-Guarani is a well-founded reconstruction (Lemle
           1971, Jensen 1998, Schleicher 1998) but no pro stage is minted
           without a held corpus. The two colonial lingue franche of the
           Jesuit enterprise both belong here — the coastal Tupi of
           Brazil (tpn) and the Guarani of the Paraguay province (gn) —
           sister lineages, never one another's ancestor. Members here:
           tpn, gn"

  tpn:
    name: Tupinambá
    parent: tup-gua
    glottocode: tupi1273
    band: [1549, 1760]
    band_note: "the European-record span of the coastal language,
                approximate — from the Jesuits' arrival at Bahia (1549)
                and the first travellers' records (Staden 1557) to the
                Pombaline Diretório (1757, applied from 1758), which
                banned the Língua Geral in favour of Portuguese; the
                coastal Tupinambá themselves were extinct as a speech
                community well before"
    note: "ISO 639-3 tpn, individual, extinct (SIL 2026-10-11); Glottolog
           tupi1273 (Tupi-Guarani Subgroup III). The language the
           Jesuits called the língua mais usada na costa do Brasil —
           Old Tupi (tupi antigo) in Brazilian scholarship (Rodrigues;
           Navarro's Dicionário de tupi antigo 2013), spoken in close
           dialects from São Paulo to Maranhão (Tupinambá, Tupiniquim,
           Potiguara, Tamoio). ISO RETIRED tpw 'Tupí' as a duplicate of
           tpn (change request 2022-012, effective 2023-01-20), and
           Wiktionary still files the same language as tpw 'Old Tupi' —
           both readings converge here, hence the codemap row tpw →
           tpn. Tupinikin (tpk) stays a separate ISO code, unfolded.
           Its colonial descendants, the Língua Geral Paulista (extinct;
           Glottolog files tpw as its dialect node tupi1274) and the
           Língua Geral Amazônica, whose modern continuation is
           Nheengatu (yrl), stay unminted until a consumer holds them;
           that descent is a koiné story, recorded here, not an edge
           yet. Attestation: José de Anchieta's Arte de grammatica da
           lingoa mais usada na costa do Brasil (Coimbra 1595); Antônio
           de Araújo's Catecismo na lingoa brasilica (Lisbon 1618); Luís
           Figueira's Arte da lingua brasilica (Lisbon 1621); the Tupi
           letters of the Potiguara leaders (the Camarão letters, 1645,
           from the Dutch war in Pernambuco); Bettendorf's Compendio da
           doutrina christãa (Lisbon 1687, Amazonian). Corpus: the UD
           Tupinambá-TuDeT treebank (581 sentences in the consuming
           library's census)"

  gn:
    name: Guarani
    parent: tup-gua
    note: "ISO 639-1 gn / 639-2/3 grn, a MACROLANGUAGE of five active
           individual languages (SIL 2026-10-11): Paraguayan Guaraní
           (gug), Mbyá (gun), Chiripá/Ava (nhd), Eastern and Western
           Bolivian Guaraní (gui, gnw). Wiktionary instead treats gn as a
           FAMILY code (Guarani, parent tup-gua) holding gn-cls
           'Classical Guarani' and gug (ancestor gn-cls). The registry
           anchors gn as the macrolanguage, the shape of the no anchor —
           the UD treebanks spell it gn, and grn aliases onto it. No
           glottocode: Glottolog has no languoid for the macrolanguage
           (its nearest node, Paraguay-Brazil Guarani para1319, excludes
           the Bolivian members). gug gets NO alias row: Paraguayan
           Guaraní is one member, and folding it onto the macrolanguage
           would blur a living standard the registry may later anchor;
           identity leaves gug bare until a modern-Guarani consumer
           arrives (it would then hang from gn and descend through
           gn:old — see the stage's note). Subgrouping: Tupi-Guarani
           subgroup I (Rodrigues & Cabral 2002)"
    stages:
      old: {name: Old (Classical) Guaraní, band: [1600, 1800], ord: 10,
            wikt: gn-cls,
            band_note: "the Jesuit-province convention (guaraní
                        jesuítico), approximate — from the catechism of
                        Luis de Bolaños approved by the Asunción synod
                        (1603) and the Province of Paraguay's first
                        reductions (1609–10) through the mission presses
                        and the Jesuit expulsion (1767–68) to the
                        post-expulsion cabildo papers of the late 18th c.",
            note: "the missionary standard written on the Guarani of the
                   Paraná–Paraguay reductions. DESCENT NUANCE, kept as
                   prose: Glottolog files Old Guarani (oldp1258) as a
                   DIALECT under Paraguayan Guaraní (para1311), i.e. the
                   ancestor of the gug lineage specifically, while the
                   other macrolanguage members (Mbyá, Chiripá, the
                   Bolivian Chiriguano varieties) continue the precontact
                   continuum, not the mission norm. As a stage of the
                   macrolanguage anchor it is the time-slice of the
                   lineage the written record follows; a future gug
                   anchor declares its parent as gn:old (the
                   most-specific rule), the other members gn bare.
                   Witnesses: Antonio Ruiz de Montoya's Tesoro de la
                   lengua guaraní (Madrid 1639), Arte y bocabulario and
                   Catecismo de la lengua guaraní (Madrid 1640); Paulo
                   Restivo's mission-press revisions of Montoya, the
                   Vocabulario (1722) and the Arte (1724). Corpus: the UD Guarani-OldTuDeT
                   treebank (59 sentences from Montoya and Restivo in
                   the consuming library's census)"}

  nic:
    name: Niger–Congo
    kind: family
    glottocode: null
    note: "ISO 639-5 nic. The largest conventional African phylum —
           Atlantic–Congo at its core with contested outliers; Glottolog
           declines a single node (Atlantic–Congo atla1278 is its
           largest accepted unit), so no glottocode is claimed. Minted
           as the conventional hat for the consuming library's West
           African and Bantu anchors; placement disputes stay in prose
           on the members"

  alv:
    name: Atlantic–Congo
    kind: family
    parent: nic
    glottocode: atla1278
    note: "ISO 639-5 alv; Glottolog's largest accepted African unit"

  alv-fwo:
    name: Fula–Wolof
    kind: family
    parent: alv
    note: "Wiktionary family code (Module:families — the Senegambian
           grouping of Fula and Wolof within Atlantic); no ISO 639-5
           code exists at this grain"

  bnt:
    name: Bantu
    kind: family
    parent: alv
    glottocode: narr1281
    note: "ISO 639-5 bnt; Glottolog Narrow Bantu. The Benue–Congo
           intermediates between Atlantic–Congo and Bantu carry no
           ISO 639-5 rungs and stay prose"

  cdc:
    name: Chadic
    kind: family
    parent: afa
    glottocode: chad1250
    note: "ISO 639-5 cdc; the Afro-Asiatic branch of Hausa"

  dmn:
    name: Mande
    kind: family
    glottocode: mand1469
    note: "ISO 639-5 dmn. Deliberately PARENTLESS: Mande's inclusion
           in Niger–Congo is a live dispute (Glottolog treats it as an
           independent family; the lexical evidence for the phylum link
           is thin) — the registry states the dispute rather than
           ruling it"

  nub:
    name: Nubian
    kind: family
    glottocode: nubi1251
    note: "ISO 639-5 nub. Deliberately PARENTLESS: the traditional
           placement (Nilo-Saharan > Eastern Sudanic) is a live
           dispute — Glottolog treats Nubian as an independent family
           and accepts neither Nilo-Saharan nor Eastern Sudanic as
           demonstrated genetic units; the registry states the
           hypothesis rather than ruling it (the dmn shape)"

  onw:
    name: Old Nubian
    parent: nub
    glottocode: oldn1245
    note: "ISO 639-3 onw. The written language of the medieval Nile
           Nubian kingdoms (Nobadia and Makuria), attested ~8th–15th
           c. CE — the oldest written sub-Saharan African language
           with a substantial corpus. Alphabet derived from the
           Coptic uncial (Greek-based) with three signs adapted from
           Meroitic (ⳡ ⳣ ⳟ). Corpus: the Qasr Ibrim finds
           (documentary and literary — letters, land sales, legal
           instruments), Serra East, the Miracle of Saint Menas, the
           Stauros text, lectionaries and liturgical fragments;
           Griffith 1913 is the foundational edition, Browne's
           grammar and dictionary the standard references. Direct
           ancestor of modern Nobiin (not minted — no consumer
           claims it). Consumers: the Old Nubian UD treebank (124
           CoNLL-U sentences, the first machine-readable Old Nubian)
           and africa-pd object-language metadata (Griffith 1913)"

  ha:
    name: Hausa
    parent: cdc
    glottocode: haus1257
    note: "ISO 639-1 ha / 639-3 hau (aliases here). West Chadic; the
           largest Chadic language. Written in Ajami (Arabic script)
           since at least the Sokoto Caliphate — Usman ɗan Fodio
           (1754–1817) and Nana Asmaʾu (1793–1864) anchor the literary
           tradition; the Latin boko orthography is colonial-era.
           Corpus: 20 bu-ajami manuscripts (Kano, Zaria, Kaduna) in
           romanized transcription, plus Schön 1885 and Robinson 1896
           as object language on the africa-pd shelf"

  wo:
    name: Wolof
    parent: alv-fwo
    glottocode: wolo1247
    note: "ISO 639-1 wo / 639-3 wol (aliases here). Atlantic
           (Senegambian); the lingua franca of Senegal. The Wolofal
           Ajami tradition is the written record — above all the Murid
           poets Serigne Moussa Ka (1889–1963) and Serigne Mor Kayre
           (1869–1951). Corpus: 20 bu-ajami manuscripts, mostly from
           Touba, in romanized transcription"

  fuf:
    name: Pular (Fuuta Jalon)
    parent: alv-fwo
    glottocode: pula1263
    note: "ISO 639-3 fuf — the Fuuta Jalon member of the Fula
           macrolanguage (ff/ful), minted directly because the
           consuming corpus claims fuf; the macrolanguage stays
           unminted until a consumer spells it (the gn/gug shape,
           inverted). The Ajami tradition of the 18th-century Fuuta
           Jalon imamate — Cerno Samba Mombeya (1755–1852), whose
           Oogirde Malal argued for writing Pular itself. Corpus: 20
           bu-ajami manuscripts (Labé, Dalaba, Conakry)"

  mnk:
    name: Mandinka
    parent: dmn
    glottocode: mand1436
    note: "ISO 639-3 mnk. Manding cluster (Mande); the Casamance and
           Gambian member. Ajami tradition in the Casamance (Sitookoto
           Daabo among the copyists). Corpus: 20 bu-ajami manuscripts
           (Sedhiou, Ziguinchor, Kolda) in romanized transcription"

  sw:
    name: Swahili
    parent: bnt
    glottocode: swah1253
    note: "ISO 639-1 sw / 639-2/3 swa (aliases here; the individual
           code swh is a future ruling, not defaulted). Bantu G42
           (Sabaki). The Arabic-script utenzi tradition runs from the
           18th century (Utendi wa Tambuka, 1728); the Latin standard
           is colonial-era. Corpus: Velten 1907 claims sw on the
           africa-pd shelf; Steere, Taylor and Büttner carry it as
           object language"

# ── Scripts (the ~ axis) ─────────────────────────────────────────────────────
#
# A GLOBAL table, deliberately not per-anchor: digraphia is open-ended, and
# which scripts a language is attested in is a fact about collections, not
# about the registry. Keys are ISO 15924 codes lowercased; every row is an
# ISO 15924 fact (`iso15924` carries the canonical spelling). The ~ axis
# claims the script of the TEXT AS HELD — the surface a reader of the
# document meets — never the artifact's original writing system (a consumer
# records that separately when it differs; a Latin-transliterated cuneiform
# tablet is `~latn` with the tablet's Xsux in the consumer's artifact
# field). Seeded from the first consuming collection's measured need,
# surface and artifact both; the set is open.

scripts:
  latn: {name: Latin,                                iso15924: Latn}
  grek: {name: Greek,                                iso15924: Grek}
  ogam: {name: Ogham,                                iso15924: Ogam}
  deva: {name: Devanagari (Nagari),                  iso15924: Deva}
  guru: {name: "Gurmukhi",                           iso15924: Guru}
  ital: {name: "Old Italic (Etruscan, Oscan, etc.)", iso15924: Ital}
  egyd: {name: Egyptian demotic,                     iso15924: Egyd}
  egyp: {name: Egyptian hieroglyphs,                 iso15924: Egyp}
  xsux: {name: "Cuneiform, Sumero-Akkadian",         iso15924: Xsux}
  hebr: {name: Hebrew,                               iso15924: Hebr}
  arab: {name: Arabic,                               iso15924: Arab}
  syrc: {name: Syriac,                               iso15924: Syrc}
  copt: {name: Coptic,                               iso15924: Copt}
  cyrl: {name: Cyrillic,                             iso15924: Cyrl}
  glag: {name: Glagolitic,                           iso15924: Glag}
  armn: {name: Armenian,                             iso15924: Armn}
  hant: {name: Han (Traditional variant),            iso15924: Hant}
  jpan: {name: Japanese (Han + Hiragana + Katakana), iso15924: Jpan}
  phnx: {name: Phoenician,                           iso15924: Phnx}
  runr: {name: Runic,                                iso15924: Runr}
  goth: {name: Gothic,                               iso15924: Goth}
  tibt: {name: Tibetan,                              iso15924: Tibt}
  ethi: {name: "Ethiopic (Geʿez)",                   iso15924: Ethi}
  hang: {name: Hangul,                               iso15924: Hang}
  avst: {name: Avestan,                              iso15924: Avst}
  ugar: {name: Ugaritic,                             iso15924: Ugar}
  xpeo: {name: Old Persian cuneiform,                iso15924: Xpeo}
  mymr: {name: Myanmar (Burmese),                    iso15924: Mymr}
  java: {name: Javanese (aksara Jawa),               iso15924: Java}
  sund: {name: Sundanese,                            iso15924: Sund}
  bali: {name: Balinese,                             iso15924: Bali}
  rjng: {name: "Rejang (Redjang, Kaganga)",           iso15924: Rjng}
  lina: {name: Linear A,                             iso15924: Lina}
  linb: {name: Linear B,                             iso15924: Linb}
  cprt: {name: Cypriot syllabary,                    iso15924: Cprt}
