  # review request) ─────────────────────────────────────────────────────────

  ine-ana:
    name: Anatolian
    kind: family
    parent: ine
    note: "established Wiktionary family code; the earliest-attested
           branch of Indo-European"

  hit:
    name: Hittite
    parent: ine-ana
    band: [-1650, -1180]
    band_note: "conventional Hittitological span, approximate — the Old
                Kingdom archives to the fall of Ḫattuša"
    note: "deliberately stage-less: the conventional Old/Middle/New
           Hittite grid is real, but no consuming source carries
           per-document stage data to materialize it — CDLI's period
           facet is one blanket value ('Middle Hittite (ca. 1500-1100
           BC)', 14,653 of 14,671 hit docs censused 2026-08-21) and
           TLHdig carries CTH numbers and project sigla only. The
           stages are a future mint for a consumer that can use them"

  xlu:
    name: Cuneiform Luwian
    parent: ine-ana

  hlu:
    name: Hieroglyphic Luwian
    parent: ine-ana
    note: "with xlu the two written traditions of the Luwian complex
           (hieroglyphic vs cuneiform script, largely one language in two
           garbs); a joint Luwic node below ine-ana carries no established
           code, so the pair rides as siblings"

  plq:
    name: Palaic
    parent: ine-ana

  # The Boğazköy-archive neighbors riding the same sources but NOT
  # Anatolian Indo-European — bare anchors, no parent edge where no
