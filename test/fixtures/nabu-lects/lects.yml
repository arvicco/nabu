    parent: orv

  be:
    name: Belarusian
    parent: orv

  sl:
    name: Slovene
    parent: zls
    note: "Western South Slavic; parent re-wired 2026-10-10 from sla to
           the newly minted zls (the most-specific-ancestor rule).
           Kajkavian's many Slovene-shared features are continuum
           prose, not an edge"
    stages:
      old:  {name: Old Slovene, band: [950, 1550], ord: 10,
             note: "the Freising Fragments era",
             band_note: "Freising (~972-1039) through the late-medieval
                         manuscripts; approximate periodization convention"}
      emod: {name: Early Modern Slovene, band: [1550, 1850], ord: 20,
             band_note: "Trubar's 1550 print through the pre-standard era;
                         approximate convention"}
      mod:  {name: Modern Slovene, band: [1850, 2100], ord: 30,
             band_note: "the unified standard (novoslovenščina) onward —
                         minted so date-banded staging covers the 19th-20th
                         century corpora"}
    orthos:
      bohoric: {name: Bohorič alphabet, script: latn, note: "IANA variant name"}

  bul:
    name: Bulgarian
    parent: zls
    note: "Eastern South Slavic; parent re-wired 2026-10-10 from sla to
           the newly minted zls. The Old Bulgarian literary stage IS
           canonical OCS in Bulgarian scholarship's naming, and the
           12th–14th-c. written language is chu:csl/bul (Wiktionary's
           cu-bgm, which Wiktionary lists as bg's ancestor) — that
           literary descent stays prose: the vernacular ancestry runs
           through the Eastern South Slavic dialects, of which the
           Thessaloniki base of OCS was one, and the edge would also
           claim Macedonian's ancestry by implication. Corpus: Paisiy's
           История славянобългарска (1762) in bg-wikisource, hosted in a
           modern literary rendering"
    stages:
      emod: {name: Early Modern Bulgarian, ord: 10}
    varieties:
      dam: {name: Damaskini vernacular, kind: sociolect}

  mk:
    name: Macedonian
    parent: zls
    note: "Eastern South Slavic, Bulgarian's closest relative; the
           standard was codified in 1944–45 on the West-Central dialects
           (Prilep–Bitola–Veles). The Ohrid region is one of the two
           cradles of the Slavonic literary tradition — the Ohrid school
           of Clement and Naum (from 886) — but the registry draws no edge
           from chu: OCS is a literary norm, and the mk/bul naming and
           descent dispute (Bulgarian scholarship treats the dialects as
           West Bulgarian; Macedonian scholarship as a distinct language
           since the 19th-c. awakening) is recorded here as prose, per
           the contact doctrine. The pre-standard 19th-c. record is
           written in Church-Slavonic-tinged vernacular and in competing
           local orthographies: Joakim Krčovski and Kiril Pejčinović
           (1810s), the Miladinov brothers' folk-song collection (Zagreb
           1861, printed under the title Български народни песни — a
           corpus both traditions claim), Kuzman Šapkarev, Marko
           Cepenkov, and Gjorgjija Pulevski (Речник од три јазика 1875,
           Слогница речовска 1880) — the first explicit Macedonian-
           language programme. No stages minted: the 19th-c. corpus sits
           before the standard and a pre-standard rung needs a consumer
           that can date it. Corpus: mk-wikisource's 19th-c. cone (851
           pages; the Miladinov and Cepenkov texts hosted in MODERNIZED
           orthography, Pulevski in the original)"

  sr:
    name: Serbian
    parent: zls
    note: "Western South Slavic; one of the standard varieties of the
           Serbo-Croatian complex (ISO 639-3 macrolanguage hbs;
           Wiktionary treats it as ONE language, sh, with Wikimedia codes
           sr/hr/bs). The pluricentric shape follows the registry's
           own 'no' precedent read from the other side: there the
           consumers hold the macrolanguage code and the standards stay
           unminted; here they hold the standard codes (srp, hrv), so the
           standards are the anchors and hbs/sh stays unminted — no
           Serbo-Croatian node, because the premodern record is not one
           lineage: Serbian writing runs through Serbian-recension Church
           Slavonic (chu:csl/srp, the Miroslav Gospel c. 1186, the
           Nemanjić charters, Dušan's Code 1349), then Russian Church
           Slavonic and the 18th-c. Slavenoserbian mix, to Vuk
           Karadžić's Neo-Štokavian vernacular standard (Srpski rječnik
           1818; the 1847 victory with Daničić) — while Croatian's
           tri-dialectal literature (see hr) is a different history over
           the same continuum. Sharing Neo-Štokavian is continuum fact,
           recorded as prose. Bosnian (bs/bos) and Montenegrin (cnr)
           stay unminted. Corpus: sr-wikisource's oral-tradition cone —
           the Erlangen manuscript (c. 1720, the oldest large collection
           of South Slavic epic and lyric song, edited by Gesemann 1925)
           and Vuk's collections (Leipzig 1823–24, Vienna 1841–62, the
           SANU volumes)"

  hr:
    name: Croatian
    parent: zls
    note: "Western South Slavic; a standard variety of the Serbo-Croatian
           complex — see sr for the pluricentric shape (hbs/sh
           unminted, the standards anchored). The premodern literature is
           tri-dialectal and tri-scriptal: Čakavian (the Split and
           Dalmatian-island writers — Marko Marulić's Judita, written
           1501, printed Venice 1521, the founding epic), Štokavian of
           Dubrovnik (Vetranović, Držić, Gundulić's Osman, Đurđević) and
           Kajkavian (the northern, Zagreb tradition); written in
           glagolitic, Croatian cyrillic (bosančica) and Latin. The
           glagolitic Church Slavonic tradition is chu:csl/cro (Baška
           tablet ~1100). The modern standard settled on Neo-Štokavian
           Ijekavian in the 19th-c. Illyrian movement; Kačić Miošić's
           Razgovor ugodni naroda slovinskoga (1756) is its popular
           forerunner. No stages minted: an Old Croatian rung would need
           a periodization that ranges across three dialect bases, and
           the consumer's era bands (medieval, 15th–18th c.) date the
           texts without one. Corpus: hr-wikisource's premodern century
           cone (1,401 pages)"

  # The West Slavic pair (2026-10-10): Polish and Czech with their
  # historical ladders, on the Wiktionary codes verified that day
