  peo:
    name: Old Persian
    band: [-600, -400]
    band_note: "ISO 639-2/MARC reference name (ca. 600–400 BCE)"
    parent: iir:pro

  pal:
    name: Middle Persian (Pahlavi)
    parent: peo

  xpr:
    name: Parthian
    parent: iir:pro
    band: [-250, 250]
    band_note: "the Arsacid attestation core, approximate — ostraca and
                inscriptions from the 3rd c. BCE (Nisa) through the
                Sasanian trilinguals; the Manichaean Parthian literary
                corpus carries the language to ~the 9th c. in Turfan
                copies"
    note: "Northwestern Middle Iranian, pal's northwestern counterpart —
           parented to iir:pro like peo (no Proto-Iranian node is
           minted; the NW/SW split stays this note). First consuming
           document: the ŠKZ trilingual's Parthian version (word-
           aligned with pal and grc)"

  kho:
    name: Khotanese
    parent: iir:pro
    band: [400, 1000]
    band_note: "the Khotan and Dunhuang document horizon, approximate —
                Old Khotanese (Book of Zambasta era) through Late
                Khotanese business documents"
    note: "Eastern Middle Iranian (Saka); the Buddhist literary and
           documentary language of the Khotan oasis, written in Brahmi.
           Its sibling xtq is minted below (the no-consumer hold lifted
           2026-10-13). Consumers: 552 IEDC documents + the 2,357-record
           British Library transliteration set (censused 2026-09-28)"

  xtq:
    name: Tumshuqese
    parent: iir:pro
    band: [600, 800]
    band_note: "the Tumshuq and Maralbashi manuscript horizon,
                approximate — the Karmavācanā and jātaka fragments'
                palaeographic window"
    note: "Eastern Middle Iranian (Saka), Khotanese's poorly attested
           northern sibling from the Tumshuq oasis — ISO 639-3 xtq;
           written in a distinctive Brahmi with Fremdzeichen. The
           corpus is ~70 known pieces (Maue's provisional handlist,
           2009): Konow's eight founding texts (1935), the Berlin and
           Paris fragments, the St. Petersburg document, and the two
           London leaves found among the Tocharian manuscripts —
           IOL Toch 162 (the Tumshuqese Araṇemijātaka; Bailey 1968,
           Skjærvø 2002) and IOL Toch 185. Minted when a consumer
           arrived: the library's titus-tocharian-b chain holds those
           two leaves as its first xtq documents (2026-10-13)"

  sog:
    name: Sogdian
    parent: iir:pro
    band: [300, 1000]
    band_note: "the Ancient Letters (early 4th c.) through the Mugh
                archive and the Turfan/Dunhuang religious corpora,
                approximate"
    note: "Eastern Middle Iranian; the lingua franca of the Silk Road —
           secular documents, Buddhist/Manichaean/Christian literatures,
           each in its own script tradition. Yaghnobi, its living
           descendant, stays unminted (no consumer). Consumers: 111
           IEDC documents (censused 2026-09-28)"

  xbc:
    name: Bactrian
    parent: iir:pro
    band: [100, 850]
    band_note: "the Kushan inscriptions (Rabatak) through the Islamic-era
                economic documents, approximate"
    note: "Eastern Middle Iranian, the one Iranian language regularly
           written in GREEK script (the Kushan chancery's inheritance).
           Consumers: 26 IEDC documents — the open rail into the
           Bactrian economic-document corpus (censused 2026-09-28)"

  fa:
    name: Persian
    parent: pal

  jpr:
    name: Judeo-Persian
    parent: fa
    note: "New Persian written in Hebrew script — including some of the
           EARLIEST New Persian documents of any kind (8th c. letters).
           An ISO-coded script-community tradition minted as an anchor
           on the jpa/tmr precedent. Consumers: 27 IEDC documents
           (censused 2026-09-28)"

