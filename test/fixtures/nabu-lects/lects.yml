  xht:
    name: Hattic
    note: "language isolate, the pre-Hittite substrate of central
           Anatolia; survives in Hittite ritual contexts and rides the
           Hittite archives (tlhdig)"

  xhu:
    name: Hurrian
    note: "Hurro-Urartian, xur's sibling; the family carries no ISO
           639-5 or Wiktionary code, and anchors require one, so the
           pair rides as sibling anchors without a family node"

  xur:
    name: Urartian
    note: "Hurro-Urartian, xhu's sibling; see xhu on the codeless
