# codemap.yml — universal defaults: standard code → lect.
#
# IDENTITY IS THE DEFAULT RULE: any code not listed here maps to itself as a
# bare anchor (ang → ang, otb → otb, srd → srd). This file lists ONLY the
# non-identity mappings, so every line is a decision.
#
# These are universal statements — true for any consumer of the code, not
# facts about any particular collection. Consumers layer their own overrides
# ABOVE these defaults (per-collection, per-document); identity sits below.
# Precedence, highest first: per-document > per-collection > this file > identity.

map:
  # The 639-3 ↔ 639-1 alias suite (№11, 2026-08-10; completed 2026-08-21,
  # the maturity-review gap): the registry anchors the two-letter codes; a
  # collection spelling the same language in 639-3 means exactly that
  # language — a code alias, not a claim.
  deu:     de
  nld:     nl
  spa:     es
  arg:     an
  swe:     sv
  ita:     it
  eng:     en
  fra:     fr
  fas:     fa
  oci:     oc
  gle:     ga
  cym:     cy
  cor:     kw
  tam:     ta
  tel:     te
  kan:     kn
  guj:     gu
  pan:     pa
  hau:     ha
  wol:     wo
  swa:     sw
  kor:     ko
  # The shabados line database's script-qualified claims: the Dasam
  # Granth-tradition Braj corpus (Kabitt Savayye, Sarabloh) and Bhai
  # Nand Lal's Persian works (the Zafarnama, the Hikayatan) are held
  # in Gurmukhi transcription — the language claims are bra and fa,
  # the script fact rides the ~ axis.
  bra-Guru: "bra~guru"
  fas-Guru: "fa~guru"
  msa:     ms
  tha:     th
  ger:     de   # the 639-2/B bibliographic spelling (deu is the /T twin)
  nor:     "no" # the macrolanguage alias, claiming nothing historical (quoted: YAML 1.1 reads bare no as false)
  dan:     da

  # The suite mirrored: where the registry anchored the 639-2/3 code, a
  # collection spelling the same language in 639-1 means exactly that
  # language — the same №11 logic, opposite spelling.
  ar:      ara
  is:      isl

  # 639-2 Syriac, read as the classical literary language: historical text
  # collections use syr in its pre-2007 scope (syc was split out of syr in
  # 2007). A collection holding the MODERN Neo-Aramaic members of today's
  # 639-3 syr macrolanguage overrides per-collection — the gkm precedent,
  # a code whose default reading is a specific historical lect.
  syr:     syc

  # Old Swedish / Old Italian / Old Danish (Wiktionary etymology-only codes)
  gmq-osw: sv:old
  roa-oit: it:old
  gmq-oda: da:old

  # Old/Middle Polish, Old/Middle Czech, Middle Bulgarian (Wiktionary
  # codes verified 2026-10-10: zlw-opl and zlw-ocs full languages,
  # zlw-mpl / cs-ear / cu-bgm etymology-only varieties). cu-bgm lands on
  # the Church Slavonic recension convention (chu's note): the
  # post-canonical stage with the Bulgarian recension variety.
  zlw-opl: pl:old
  zlw-mpl: pl:mid
  zlw-ocs: cs:old
  cs-ear:  cs:mid
  cu-bgm:  chu:csl/bul

  # Greek stages that outgrew their codes
  gkm:     grc:byz
  grc-koi: grc:koi

  # Chinese: two stages and the register ISO coded as their sibling
  och:     zho:old
  ltc:     zho:mid
  lzh:     zho/lit

  # The ORACC Akkadian dialect suite (2026-09-27): ORACC's published
  # akk-x-* period/dialect codes onto the standing akk grid — universal
  # statements (the codes are ORACC's documented conventions, meaningful
  # to any consumer). ltebab folds into nb per the nb band's own recorded
  # decision; stdbab and mbperi land on the registry's variety axis.
  akk-x-earakk: akk:ear
  akk-x-oldakk: akk:old
  akk-x-oldbab: akk:ob
  akk-x-oldass: akk:oa
  akk-x-midbab: akk:mb
  akk-x-midass: akk:ma
  akk-x-neoass: akk:na
  akk-x-neobab: akk:nb
  akk-x-ltebab: akk:nb
  akk-x-stdbab: akk/lit
  akk-x-mbperi: akk:mb/peri

  # Emesal (ORACC sux-x-emesal): the Sumerian cult-lament sociolect
  sux-x-emesal: sux/es

  # 639-3 Russian → the anchored 639-1 code (the №11 alias suite's shape,
  # recorded when the first rus-coded shelf arrived)
  rus:     ru

  # The Slavic package (2026-10-10): the same alias suite for the newly
  # anchored two-letter codes. cze and mac are the 639-2/B bibliographic
  # spellings (the ger precedent). No hbs/sh row: an alias from the
  # Serbo-Croatian macrolanguage onto either standard would claim the
  # other's texts (see sr's note) — identity leaves the code bare.
  pol:     pl
  ces:     cs
  cze:     cs
  srp:     sr
  hrv:     hr
  mkd:     mk
  mac:     mk

  # The americas package (2026-10-11). grn is the 639-2/3 spelling of the
  # Guarani macrolanguage the registry anchors as gn (the nor precedent).
  # gn-cls is Wiktionary's Classical Guarani (exceptional-language code,
  # verified 2026-10-11), the Jesuit-era stage. tpw 'Tupí' was RETIRED by
  # ISO 639-3 as a duplicate of tpn (CR 2022-012, effective 2023-01-20)
  # and Wiktionary still spells the same language tpw 'Old Tupi' — both
  # readings name Tupinambá. NO gug row (one member of the macrolanguage;
  # identity leaves it bare — see gn's note). NO xzp row: ISO's Ancient
  # Zapotec is the pre-Hispanic glyphic language by its CR 2006-065, not
  # the colonial alphabetic stage; a collection spelling Córdova's
  # Zapotec xzp folds it in its own override (see zap's note).
  grn:     gn
  gn-cls:  gn:old
  tpw:     tpn

  # The Latin stage suite (Wiktionary etymology-only codes)
  la-vul:  lat/vul      # the ATTESTED register is the universal default reading
  la-lat:  lat:late
  la-med:  lat:med
  la-ecc:  lat/ecc
  la-ren:  lat:ren
  la-new:  lat:new
  itc-ola: lat:arch

  # Reconstructed proto-languages: the stage is pro, the machine truth is
  # the registry's mode field, never the code suffix
  ine-pro:     ine:pro
  gem-pro:     gem:pro
  gmw-pro:     gmw:pro
  gmq-pro:     gmq:pro
  sla-pro:     sla:pro
  itc-pro:     itc:pro
  iir-pro:     iir:pro
  ine-bsl-pro: ine-bsl:pro
  cel-pro:     cel:pro
  tut-pro:     tut:pro
  jpx-pro:     jpx:pro
  inc-pro:     inc:pro
  ira-pro:     ira:pro
  inc-dar-pro: inc-dar:pro
  trk-pro:     trk:pro
  xgn-pro:     xgn:pro
  tuw-pro:     tuw:pro
  qfa-kor-pro: qfa-kor:pro
  cau-nec-pro: cau-nec:pro
  cau-nkh-pro: cau-nkh:pro
  cau-ava-pro: cau-ava:pro
  cau-tsz-pro: cau-tsz:pro
  cau-drg-pro: cau-drg:pro
  cau-lzg-pro: cau-lzg:pro
  cau-nwc-pro: cau-nwc:pro
  sit-kir-pro: sit-kir:pro
  dra-sou-pro: dra-sou:pro
  dra-tkt-pro: dra-tkt:pro
  dra-tel-pro: dra-tel:pro
  dra-cen-pro: dra-cen:pro
  dra-nor-pro: dra-nor:pro
  dra-gki-pro: dra-gki:pro
  dra-gon-pro: dra-gon:pro
  dra-kui-pro: dra-kui:pro
  dra-pem-pro: dra-pem:pro
  ccn-pro:     ccn:pro
  ccs-pro:     ccs:pro
  bat-pro:     bat:pro
  sit-pro:     sit:pro
  dra-pro:     dra:pro
  qfa-cka-pro: qfa-cka:pro
  qfa-chk-pro: qfa-chk:pro
  itl-pro:     itl:pro
  qfa-yen-pro: qfa-yen:pro

  # The script-suffix suite (P61): BCP-47-style tags whose script subtag
  # is used per the standard's own semantics -- it describes the CONTENT.
  # Every row was byte-verified surface-honest in the first consuming
  # collection's census (2026-08-06: Unicode-script classification over
  # every carrier's held passages) before earning its line. Deviant uses
  # (egy-Egyd artifact claims, -Ital-x- transliteration tags) are
  # per-collection knowledge and stay OUT of this file by the standing
  # rule.
  san-Latn: "san~latn"
  san-Deva: "san~deva"
  ta-Latn:  "ta~latn"
  bra-Deva: "bra~deva"
  awa-Deva: "awa~deva"
  xct-Latn: "xct~latn"
  grc-Latn: "grc~latn"
  lat-Latn: "lat~latn"
  lat-Ogam: "lat~ogam"
  cel-Latn: "cel~latn"
  pgl-Ogam: "pgl~ogam"
  pgl-Latn: "pgl~latn"
  sga-Ogam: "sga~ogam"
  mga-Ogam: "mga~ogam"
  non-Ogam: "non~ogam"
  xpi-Ogam: "xpi~ogam"
  xpi-Latn: "xpi~latn"
  xtg-Grek: "xtg~grek"
  xtg-Latn: "xtg~latn"
  xcg-Latn: "xcg~latn"
  xly-Grek: "xly~grek"
  xly-Latn: "xly~latn"
  scx-Grek: "scx~grek"
  scx-Latn: "scx~latn"
  xpu-Grek: "xpu~grek"
  xpu-Latn: "xpu~latn"

  # The Southeast Asian wing (v1.6.0): the DHARMA corpora hold romanized
  # editions whose measured per-file codes carry the -Latn suffix; each
  # resolves to its anchor with the latn surface claim, the san-Latn shape.
  okz-Latn: "okz~latn"
  xhm-Latn: "xhm~latn"
  khm-Latn: "khm~latn"
  omx-Latn: "omx~latn"
  obr-Latn: "obr~latn"
  pli-Latn: "pli~latn"
  pra-Latn: "pra~latn"
  ocm-Latn: "ocm~latn"
  kaw-Latn: "kaw~latn"
  omy-Latn: "omy~latn"
  osn-Latn: "osn~latn"
  pyx-Latn: "pyx~latn"
  osc-Grek: "osc~grek"
