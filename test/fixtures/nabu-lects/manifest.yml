# Nabu fixture manifest (P5-4). Schema documented in
# test/fixtures/perseus/manifest.yml. Built from this directory's README.md.
#
# Both files are VERBATIM WHOLE copies of the two data files nabu-lects
# ships (arvicco/nabu-lects at commit 8f3912f, main at retrieval) — the
# module is small by design and the drift guard needs the full graph. The
# raw URLs track `main`; upstream is in its pre-1.0 instability window, so
# a byte-diff flags a new registry release to re-adopt via the README
# recipe (identity grammar + drift guard re-check), not silent drift.
source: nabu-lects
adapter_test: test/adapters/nabu_lects_test.rb
retrieved: 2026-08-04
files:
  - path: lects.yml
    url: https://raw.githubusercontent.com/arvicco/nabu-lects/main/lects.yml
    whole: true
    trim: none
  - path: codemap.yml
    url: https://raw.githubusercontent.com/arvicco/nabu-lects/main/codemap.yml
    whole: true
    trim: none
  - path: lect_overrides.yml
    # NOT upstream: a frozen mirror of Nabu's own config/lect_overrides.yml
    # at the P57-3 seed state (derom + rundata) — tests must not read the
    # live config file (see README, the hermeticity note).
    url: none (Nabu-authored fixture)
    whole: true
    trim: none
