# Nabu fixture manifest (P5-4 "fixture sentinel"). Schema documented in
# test/fixtures/perseus/manifest.yml. Built from this directory's README.md.
#
# The Corpus of Middle English serves the whole May-2026 normalization as
# plain files behind the medictionary.info /texts/ Apache autoindex (the
# grant-№77-2 bulk channel). The four texts are WHOLE upstream files
# (untrimmed); the fetch listing is a DOCUMENTED TRIM of the real
# autoindex page. adapter_test is null — the source-specific test pins
# urns/counts/snippets a refetch would not false-fail.
source: cme
adapter_test:
retrieved: 2026-08-23
files:
  - path: texts/CME301.xml
    url: http://www.medictionary.info/texts/CME301.xml
    whole: true
    trim: none
  - path: texts/tenwives.xml
    url: http://www.medictionary.info/texts/tenwives.xml
    whole: true
    trim: none
  - path: texts/CME00011.xml
    url: http://www.medictionary.info/texts/CME00011.xml
    whole: true
    trim: none
  - path: texts/CME00121.xml
    url: http://www.medictionary.info/texts/CME00121.xml
    whole: true
    trim: none
  - path: fetch/texts-index.html
    url: http://www.medictionary.info/texts/
    whole: false
    trim: the 297 row lines trimmed to six (the four fixture texts +
      3KCol.xml + the 20 MB outlier afz9170.xml); header, sort links,
      parent row and tail byte-intact (ISO-8859-1 as served).
