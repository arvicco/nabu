# Nabu fixture manifest (P5-4). Schema documented in
# test/fixtures/perseus/manifest.yml. Built from this directory's README.md.
#
# Real OKHC records: the repo's published sample.jsonl filtered to the
# adapter's included corpora and routed into deposit-named files, plus one
# live-probed ilseongnok row. A fresh GET of the sample returns the whole
# 343-row file, so it is liveness-only (whole: false); re-apply the README
# filter after any refresh. The per-file deposit URLs are the adapter's
# own fetch targets — liveness rides the source's remote probe, not this
# manifest.
source: okhc
adapter_test: null
retrieved: 2026-09-01
files:
  - path: sagi/sagi.jsonl
    url: https://raw.githubusercontent.com/seyoungsong/OKHC/master/sample.jsonl
    whole: false
    trim: rows with the sagi id-prefix, first 3 (README filter)
  - path: ilseongnok_part_001_of_003/ilseongnok_part_001_of_003.jsonl
    url: https://raw.githubusercontent.com/seyoungsong/OKHC/master/sample.jsonl
