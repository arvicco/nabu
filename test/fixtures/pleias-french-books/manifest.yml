    refetchable: false
    reason: materialized by the adapter's own fetch from the trimmed shards, never served upstream
  - path: shards/100.jsonl
    whole: false
    trim: the adapter's fetch output (shard catalogue)
    refetchable: false
    reason: materialized by the adapter's own fetch from the trimmed shards, never served upstream
  - path: books/bpt6k9671998b.json.gz
    whole: false
    trim: the adapter's fetch output (one cone row with its text, gzip mtime 0)
    refetchable: false
    reason: materialized by the adapter's own fetch from the trimmed shards, never served upstream
  - path: books/bpt6k54293789.json.gz
