# adapter_test is null: the adapter test asserts slice-level counts, which
# untrimmed upstream files would false-fail. Re-trim per the README table
# after any refresh. Pinned upstream commit:
# 9a56288e6777bad6328856acf055c780e65dd5d9 (master, retrieved 2026-10-22).
