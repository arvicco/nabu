      level2→3→4→5 chain, two dated 기사 articles, the seven-calendar apparatus with
      the 일본연호 line filled (the post-annexation structural witness)
  - path: 2nd_waa_200.xml
    url: https://www.data.go.kr/data/15053647/fileData.do
    whole: false
    reason: Taejo appendix, byte-verbatim — level3 leaves with archive-source citations
