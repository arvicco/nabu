  - path: 2nd_wqa_000.xml
    url: https://www.data.go.kr/data/15053647/fileData.do
    whole: false
    reason: Hyojong 總序, byte-verbatim — the level1-rooted member (root id is the bare
      reign code; only the filename disambiguates)
  - path: history.dtd
    url: https://www.data.go.kr/data/15053647/fileData.do
    whole: true
    reason: the Korean History Database unified DTD ver 1.3, shipped verbatim in every
