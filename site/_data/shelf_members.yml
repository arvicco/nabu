# The shelf map behind the collection table on /library/ (site/library.md):
# which registered sources each table row sums. HAND-EDITED curation — the
# counterpart to the GENERATED numbers: `rake site:data` reads this map and
# writes each shelf's live document/passage totals into site/_data/sources.yml
# (the `shelves` section), and the table renders them through Liquid, so a
# growth wave never leaves a row's size stale.
#
# Keys are the table rows' anchor ids (/library/#shelf-<key>). Every live
# source holding documents belongs to exactly one shelf, and every member
# must be a live public source — test/site/site_data_test.rb fails the suite
# on an unplaced or unknown slug. Dictionary-only sources (no documents)
# ride the reference shelf, whose row reads the census entry total instead.
