# HAND-CURATED (not generated): the per-row prose of the /sources/ corpus
# table, keyed by source slug. `rake site:sources` (Nabu::Ops::SourcesTable)
# READS this file and never writes it; the table's MEMBERSHIP comes from
# config/sources.yml (every live public source gets a row), its holdings
# column from the generated sources.yml.
#
# Each note carries three cells, rendered verbatim (Markdown, no Liquid —
# Liquid in a data file never renders):
#   upstream: the upstream project, linked, with its editors/institution
#   contents: what the source holds; counts are first-sync facts, dated
#   license:  the license statement as upstream gives it
# `with: [slug, ...]` folds sibling sources into this row (a corpus and its
# lexicon); each member keeps its own /sources/#src-<slug> anchor and
# holdings. A live source with no note renders "Description pending."
# until its prose is written here. A note naming a source that is not live
# and public fails the suite (test/site/sources_table_test.rb).
achemenet:
  upstream: "[Achemenet Babylonian](https://zenodo.org/records/19067652) (Helsinki)"
  contents: 2,774 linguistically annotated Achaemenid-period Babylonian texts, lemmatized at an honest silver tier (synchronized 17 August 2026)
  license: CC BY 4.0
