  upstream: "[ACLT — Annotated Corpus of Luwian Texts](https://luwian.web-corpora.net/) (I. Yakubovich; corpus files prepared by T. Arkhangelskiy)"
  contents: 266 Hieroglyphic Luwian inscriptions / 2,682 clauses, each with full morphology and a sign-by-sign transliteration (synchronized 30 September 2026)
  license: Personal research grant (I. Yakubovich, by email, 2026-09-28) — held at `research_private`, never redistributed
