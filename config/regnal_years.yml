# The ruled regnal-year table (owner ruling 2026-08-11 — the
# P73-6 scout ratified as recommended). Converts cdli dates_referenced
# regnal datings ("Šulgi.44.02.06") to absolute year spans.
#
# CHRONOLOGY COMMITMENT (stated in-band wherever derived years surface):
# - Ur III / Isin / Larsa / Babylon I: the MIDDLE CHRONOLOGY (the field's
#   citation convention; the low chronology would move these dates 64
#   years — a consumer needing another chronology shifts uniformly).
# - Lagash II (Gudea): the conventional middle-chronology placement —
#   the dynasty floats harder than Ur III; the OFFSET is conventional,
#   the intra-reign year arithmetic is exact.
# - Neo-Assyrian / Neo-Babylonian / Achaemenid: astronomically anchored
#   (Parker & Dubberstein's tables; eponym-list-fixed for Assyria).
#
# Keys are cdli's dates_referenced ruler spellings VERBATIM. accession =
# the ruler's YEAR 1 as a signed year (negative = BCE, the catalog
# convention: 2094 BC → -2094). reign = the count of numbered regnal
# years. Year YY maps to accession + (YY - 1); the "(us2 year)" and
# "(us2-us2 year)" year-name marks read as written, no shift (owner-ruled
# 2026-10-20 — CDLI's own year-name tables number those formulae under
# their canonical years); YY = 00 (year unknown) maps to the whole-reign span.
#
# DELIBERATELY EXCLUDED (censused as unruled, never guessed):
# - ED III Lagash (Lugalanda, Urukagina_l): absolute anchoring is ±many
#   decades — a per-year conversion would claim false precision.
# - Old Akkadian (Naramsin): year-NAME system + identity ambiguity with
#   later homonyms; the period band stays the honest answer.
# - Sin-kashid (Uruk) and other floating OB local dynasts.
# - Unnumbered homonyms ("Nebuchadnezzar" bare) and placeholder shapes
#   (HE, EH, xx, --).
#
# THE 2026-10-20 EXTENSION (owner-ruled; census of the first
# dates_referenced entries whose ruler had no row: 17,754 rows under 702
# spellings) adds the major rulers of the established dynastic sequences,
# each row naming its published basis — Isin I / Larsa / Babylon I and the
# Middle Assyrian kings on Brinkman's 1977 tables (middle chronology; the
# second-millennium Assyrian dates carry the field's known ~10-year
# latitude before 1179 BC — the offset is conventional, the intra-reign
# arithmetic exact), the Kassites on Brinkman 1976, Erishum I on the
# revised Old Assyrian eponym list, the first-millennium reigns on Parker &
# Dubberstein / the eponym canon; cdli's spelling variants of an already
# ruled king get their own row carrying the same reign. STILL OUT —
# absolute chronology genuinely contested, the period band the honest
# fallback:
# - ED III dynasts (Lugalanda, Urukagina, Enmetena, Eannatum, Ur-Nanshe,
#   Enentarzi, Lugalzagesi, …) and every Old Akkadian king (Sargon,
#   Rimush, Manishtusu, Naramsin, Shar-kali-sharri): no anchored reign
#   sequence.
# - Lagash II beyond Gudea (Ur-Baba, Nammahni, Ur-Ningirsu …): reign
#   lengths and order debated.
# - The OB local dynasties outside the Isin/Larsa/Babylon lines (Uruk:
#   Sin-kashid, Anam, IRnene, Rim-Anum; Eshnunna: Ibal-pi-el, Dāduša;
#   Mari: Zimri-Lim, Yahdun-Lim), Shamshi-Adad I (reign length contested)
#   and Rim-Sin II (a rebel of a few years).
# - The post-Assurbanipal Assyrian kings (Assur-etel-ilani,
#   Sin-sharru-ishkun): the sequence 631–612 BC is disputed.
# - Isin II / Second Sealand / Early Neo-Babylonian kings and the Middle
#   Elamite kings: editions of the tables differ by several years.
# - Unnumbered Kassite and Achaemenid homonyms (Kurigalzu, Kadašman-Enlil,
#   Burna-Buriash, Kashtiliashu, Cyrus, Cambyses, Darius, Xerxes,
#   Artaxerxes) under the homonym rule above.
