# The ruled regnal-year table (owner ruling №R-28, 2026-08-11 — the
# P73-6 scout ratified as recommended). Converts cdli dates_referenced
# regnal datings ("Šulgi.44.02.06") to absolute year spans.
#
# CHRONOLOGY COMMITMENT (stated in-band wherever derived years surface):
# - Ur III / Isin / Larsa / Babylon I: the MIDDLE CHRONOLOGY (the field's
#   citation convention; the low chronology would move these dates 64
#   years — a consumer needing another chronology shifts uniformly).
# - Lagash II (Gudea): the conventional middle-chronology placement —
#   the dynasty floats harder than Ur III; the OFFSET is conventional,
#   the intra-reign year arithmetic is exact.
# - Neo-Assyrian / Neo-Babylonian / Achaemenid: astronomically anchored
#   (Parker & Dubberstein's tables; eponym-list-fixed for Assyria).
#
# Keys are cdli's dates_referenced ruler spellings VERBATIM. accession =
# the ruler's YEAR 1 as a signed year (negative = BCE, the catalog
# convention: 2094 BC → -2094). reign = the count of numbered regnal
# years. Year YY maps to accession + (YY - 1); "(us2 year)" shifts +1;
# YY = 00 (year unknown) maps to the whole-reign span.
#
# DELIBERATELY EXCLUDED (censused as unruled, never guessed):
# - ED III Lagash (Lugalanda, Urukagina_l): absolute anchoring is ±many
#   decades — a per-year conversion would claim false precision.
# - Old Akkadian (Naramsin): year-NAME system + identity ambiguity with
#   later homonyms; the period band stays the honest answer.
# - Sin-kashid (Uruk) and other floating OB local dynasts.
# - Unnumbered homonyms ("Nebuchadnezzar" bare) and placeholder shapes
#   (HE, EH, xx, --).
rulers:
  # -- Lagash II (conventional placement) ------------------------------
  Gudea:
    accession: -2144
    reign: 20
    dynasty: Lagash II
    basis: conventional middle-chronology placement (dynasty floats)
