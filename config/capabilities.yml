# config/capabilities.yml — the capability registry: every user-facing
# capability of the library, the data layers it reads, and how each layer
# is produced. HAND-CURATED (the site/_data/shelf_members.yml pattern);
# completeness is suite-guarded by test/capability_registry_test.rb, which
# fails naming the offender when a CLI command or MCP tool is missing here.
#
# capabilities.<name>:
#   desc      one line: what the user can do
#   surfaces  where it is exposed —
#               cli:   commands as typed ("search", "lect assign"); every
#                      Thor command appears under exactly one capability
#               mcp:   MCP tool names (Nabu::MCP::Tools::TOOLS); each once
#               skill: the desk skills (skills/), site: the public site
#                      pages (site/) — curated, not machine-checked
#   layers    the layer keys below that the capability reads
#
# layers.<name>:
#   home      where the data lives (file, or file + tables)
#   producer  sync          — written by fetch/load (`nabu sync`)
#             rebuild       — derived by `nabu rebuild` (and kept live by
#                             the sync's index refresh)
#             enrichment    — written only by its own separate command,
#                             never by rebuild (the cost law, architecture §1)
#             tool          — regenerated by a rake task outside rebuild
#             write_through — written by an owner-facing CLI gateway
#             curated       — hand-authored files
#   cost      derived     — free to regenerate from the permanent folders
#             time_heavy  — free in money, hours in time (enrichment-class)
#             paid        — costs money to regenerate (paid model output)
#             ruled       — an owner/project decision; not regenerable
#             acquired    — fetched or imported from outside the code
#             log         — operational record of what happened
#   command   the producing command (required whenever cost != derived)
#   desc      one line, optional
#
# uncataloged: Thor's built-ins, skipped at the root and inside every
# subcommand family (matched on the command's own name). Prefer cataloging.
---
uncataloged: [help, tree]

capabilities:
  search:
    desc: full-text, lemma, fragment, translation, gloss and semantic search with KWIC concordance
    surfaces: {cli: [search, concord], mcp: [nabu_search, nabu_concord]}
    layers: [catalog, facets_timeline, passages_fts, passage_lemmas, trigram_lane, cjk_lane,
             translations_lane, annotation_lanes, char_postings, entity_index, lects_journal,
             lemma_shelf, dates_shelf, meter_shelf, vectors]
  read:
    desc: read a passage, range or document by urn (withdrawn items flagged, notes shown)
    surfaces: {cli: [show], mcp: [nabu_show]}
    layers: [catalog, facets_timeline, shelf_indexes, ledger]
  clarify:
    desc: normalize a partial or misspelled title/reference into urns and candidates
    surfaces: {cli: [clarify], mcp: [nabu_clarify]}
    layers: [catalog, clarify_lane]
  alignment:
    desc: one citation rendered across every witness of a registered work
    surfaces: {cli: [align], mcp: [nabu_align]}
    layers: [catalog, alignment_refs, project_config]
  dictionary:
    desc: dictionary lookup across the lexicon shelf
    surfaces: {cli: [define], mcp: [nabu_define]}
    layers: [dictionaries, passage_lemmas]
  lexical_profiles:
    desc: a lemma's attestation curve and a document's lemma-frequency profile vs the corpus
    surfaces: {cli: [lemma, vocab]}
    layers: [catalog, passage_lemmas, lemma_rollup, dictionaries]
  etymology:
    desc: reconstruction walks and cognates across aligned witnesses
    surfaces: {cli: [etym, cognates], mcp: [nabu_etym, nabu_cognates]}
    layers: [dictionaries, reflex_closure, alignment_refs, facets_timeline, catalog]
  intertext:
    desc: parallels, repeated formulas and the mined cross-reference graph around a passage
    surfaces: {cli: [parallels, formulas, links], mcp: [nabu_parallels, nabu_links]}
    layers: [catalog, passages_fts, passage_lemmas, cjk_lane, links_journal, mined_links]
  character_desk:
    desc: Han / cuneiform / hieroglyph character cards and sign-by-sign ATF reading
    surfaces: {cli: [char, signs], mcp: [nabu_char, nabu_signs]}
    layers: [dictionaries, char_postings, sign_data, catalog]
  language_desk:
    desc: language/lect/script dossier cards — name, family, stages, holdings
    surfaces: {cli: [info, language]}
    layers: [shelf_indexes, language_dossiers, dictionaries, facets_timeline, passage_lemmas,
             lects_journal, catalog]
  place_desk:
    desc: gazetteer facts plus the library's holdings at a place
    surfaces: {cli: [place], mcp: [nabu_place]}
    layers: [place_index, facets_timeline, place_dossiers, catalog]
  person_desk:
    desc: the derived prosopography card for a person
    surfaces: {cli: [person]}
    layers: [person_index, facets_timeline, catalog]
  marked_names_and_senses:
    desc: passages by a name marked in their text, or by the word sense their gold tokens cite
    surfaces: {cli: [entity, sense]}
    layers: [entity_index, facets_timeline, dictionaries, catalog]
  holdings_census:
    desc: what the library holds and its sync state — shelves, sources, axes, kinds
    surfaces: {cli: [status, list, kind, axis], mcp: [nabu_status]}
    layers: [catalog, facets_timeline, shelf_indexes, source_dossiers, ledger, project_config,
             instance_config]
  notes:
    desc: the owner's annotations on any urn or language code
    surfaces: {cli: [note]}
    layers: [notes_shelf, shelf_indexes]
  library_intake:
    desc: file the owner's own PDFs, scans and articles (and dossier scaffolds) onto the shelves
    surfaces: {cli: [ingest]}
    layers: [library_shelf, language_dossiers, source_dossiers]
  acquisition:
    desc: fetch and load sources onto this box — enablement, credentials, the starter shelf
    surfaces: {cli: [sync, quickstart, enable, disable, focus, creds set, creds list]}
    layers: [canonical, catalog, ledger, instance_config, project_config]
  derivation:
    desc: regenerate and maintain the derived stores — rebuild, index refresh/maintenance, run hygiene
    surfaces: {cli: [rebuild, index doctor, index refresh, index maintain, runs close-stale]}
    layers: [canonical, catalog, passages_fts, ledger, project_config, instance_config]
  integrity:
    desc: health checks, bitrot verification, backups and instance migration
    surfaces: {cli: [health, verify, backup, migrate-local, version]}
    layers: [canonical, catalog, ledger, mined_links, instance_config]
  lect_rulings:
    desc: per-document lect rulings and the core-layer posture census (lect, dating, places, script)
    surfaces: {cli: [lect assign, lect list, lect apply-rules, lect infer-dates, lect stage-dictionaries,
                     lect materialize, lect suggest, lect dossiers, lect check-dates, lect withdraw,
                     layer suggest, layer dates, layer artifacts]}
    layers: [lect_rulings, lects_journal, facets_timeline, project_config, language_dossiers, catalog]
  silver_enrichment:
    desc: machine-produced silver lemmas, date estimates and meter scansions, projected on the owner's word
    surfaces: {cli: [lemma-enrich, silver-dates, scan-meter, model-budget]}
    layers: [lemma_shelf, dates_shelf, meter_shelf, instance_config, catalog]
  semantic_vectors:
    desc: build/refresh the semantic vectors behind `search --similar`
    surfaces: {cli: [embed]}
    layers: [vectors, catalog]
  research_exports:
    desc: passages, documents, links, lemma matrix, alignment and collation tables with a license manifest
    surfaces: {cli: [export passages, export documents, export links, export lemmas, export align,
                     export collation]}
    layers: [catalog, facets_timeline, links_journal, mined_links, lemma_rollup, alignment_refs]
  data_rail:
    desc: build the publishable nabu-data datasets
    surfaces: {cli: [data list, data build]}
    layers: [catalog, passage_lemmas, dictionaries, language_dossiers]
  reconstruction:
    desc: the bare-clone bootstrap plan with measured estimates, the combined-path backup set, the probe battery against the published census, and the portable reference manifest with its arrival check
    surfaces: {cli: [reconstruct plan, reconstruct backupset, reconstruct verify, reconstruct manifest, reconstruct check]}
    layers: [catalog, passages_fts, ledger, mined_links, vectors, site_data, project_config, instance_config, canonical]
  mcp_server:
    desc: serve the read-only tool set to an AI client over MCP
    surfaces: {cli: [mcp]}
    layers: [catalog]
  desk_skills:
    desc: the research-desk Claude skills, driving the MCP tools per desk
    surfaces: {skill: ["skills/nabu-*"]}
    layers: [catalog]
  public_site:
    desc: the public site — library, sources, languages, places, dates, kinds, layers, MCP and tools pages
    surfaces: {site: [index, library, sources, languages, places, dates, kinds, layers, mcp, tools,
                      quickstart, examples, faq, news, axis]}
    layers: [site_data]

layers:
  # The asset, the instance, the project definition.
  canonical:
    home: canonical/<slug>/
    producer: sync
    cost: acquired
    command: "nabu sync SLUG"
  ledger:
    home: local/history.sqlite3
    producer: sync
    cost: log
    command: "appended by every nabu sync / rebuild / health run"
    desc: run history, pins, revisions, probes, stage timings
  project_config:
    home: config/
    producer: curated
    cost: ruled
    command: "hand-edited, git-tracked"
  instance_config:
    home: local/config/
    producer: write_through
    cost: ruled
    command: "nabu enable|disable, nabu creds set, nabu model-budget, nabu health --accept-*"
    desc: profile, grants, creep acceptances, credentials, link scopes, model budget
  lect_rulings:
    home: local/config/lect_rulings.yml
    producer: write_through
    cost: ruled
    command: "nabu lect assign | withdraw | apply-rules"

  # The derived catalog (db/catalog.sqlite3).
  catalog:
    home: db/catalog.sqlite3 (sources, documents, passages, provenance, enrichments, source_stats)
    producer: rebuild
    cost: derived
  facets_timeline:
    home: db/catalog.sqlite3 (document_facets, document_axes, passage_facets, kind_stats, lect_stats)
    producer: rebuild
    cost: derived
    desc: the library axes — dates, places, kinds, lects, morphology facets
  dictionaries:
    home: db/catalog.sqlite3 (dictionaries, dictionary_entries/citations/crossrefs/reflexes, entry_facets)
    producer: rebuild
    cost: derived
  lemma_rollup:
    home: db/catalog.sqlite3 (lemma_rollup, language_curve, language_mix)
    producer: rebuild
    cost: derived
  place_index:
    home: db/catalog.sqlite3 (place_index, place_index_names, place_crosswalk)
    producer: rebuild
    cost: derived
  person_index:
    home: db/catalog.sqlite3 (person_index, person_index_names, person_index_texts)
    producer: rebuild
    cost: derived
  entity_index:
    home: db/catalog.sqlite3 (passage_entity_names, passage_entities)
    producer: rebuild
    cost: derived
  sign_data:
    home: db/catalog.sqlite3 (sign_concordances, hiero_postings)
    producer: rebuild
    cost: derived
  shelf_indexes:
    home: db/catalog.sqlite3 (language_records, source_records, urn_notes)
    producer: rebuild
    cost: derived
    desc: the catalog's index of the owner shelves

  # The fulltext index family.
  passages_fts:
    home: db/fulltext.sqlite3 (passages_fts, fts_row_shas)
    producer: rebuild
    cost: derived
  passage_lemmas:
    home: db/fulltext.sqlite3 (passage_lemmas, lemma_frequencies)
    producer: rebuild
    cost: derived
    desc: gold/silver/equivalence tiers; silver rows project from lemma_shelf
  trigram_lane:
    home: db/fulltext-trigram.sqlite3
    producer: rebuild
    cost: derived
  cjk_lane:
    home: db/fulltext-cjk.sqlite3
    producer: rebuild
    cost: derived
    desc: rebuild-cadence only — syncs never write it
  clarify_lane:
    home: db/fulltext.sqlite3 (clarify_fts, clarify_trigram)
    producer: rebuild
    cost: derived
  translations_lane:
    home: db/fulltext.sqlite3 (passages_translations)
    producer: rebuild
    cost: derived
  annotation_lanes:
    home: db/fulltext.sqlite3 (passages_annotations, passages_gloss_lines, token_glosses)
    producer: rebuild
    cost: derived
  char_postings:
    home: db/fulltext.sqlite3 (char_postings, passage_chars)
    producer: rebuild
    cost: derived
  alignment_refs:
    home: db/fulltext.sqlite3 (alignment_refs)
    producer: rebuild
    cost: derived
  reflex_closure:
    home: db/fulltext.sqlite3 (reflex_roots, reflex_root_stats)
    producer: rebuild
    cost: derived

  # Sibling derived dbs and the heavy layers.
  links_journal:
    home: db/links.sqlite3
    producer: rebuild
    cost: derived
    desc: the cheap batch-mined edges, re-mined by rebuild's links stage from link_scopes.yml
  lects_journal:
    home: db/lects.sqlite3
    producer: rebuild
    cost: derived
    desc: re-derived from lect_rulings + the facet rules; kept live by the lect CLIs
  mined_links:
    home: local/mined-links.sqlite3
    producer: enrichment
    cost: time_heavy
    command: "nabu links mine SCOPE | nabu parallels --batch SCOPE"
  vectors:
    home: db/vectors.sqlite3
    producer: enrichment
    cost: time_heavy
    command: "nabu embed"
    desc: never dropped by rebuild; rows keyed by model + urn + text sha

  # The owner shelves (local/shelves/, architecture §16).
  notes_shelf:
    home: local/shelves/local-notes/
    producer: write_through
    cost: ruled
    command: "nabu note URN|CODE TEXT"
  language_dossiers:
    home: local/shelves/local-language/
    producer: write_through
    cost: ruled
    command: "nabu ingest --shelf language CODE | nabu language --export-dossiers | nabu lect dossiers"
  source_dossiers:
    home: local/shelves/local-source/
    producer: write_through
    cost: ruled
    command: "nabu ingest --shelf source SLUG | nabu list --export-source-dossiers"
  place_dossiers:
    home: local/shelves/local-place/
    producer: curated
    cost: ruled
    command: "hand-authored essays, read at desk time"
  library_shelf:
    home: local/shelves/local-library/
    producer: write_through
    cost: acquired
    command: "nabu ingest FILE|URL"
  lemma_shelf:
    home: local/shelves/local-lemmas/
    producer: enrichment
    cost: time_heavy
    command: "nabu lemma-enrich LANGUAGE (projected by --index-only)"
  dates_shelf:
    home: local/shelves/local-dates/
    producer: enrichment
    cost: acquired
    command: "nabu silver-dates --import FILE"
    desc: model/tool date estimates, projected into document_axes as silver
  meter_shelf:
    home: local/shelves/local-meter/
    producer: enrichment
    cost: time_heavy
    command: "nabu scan-meter --run (projected by --project)"

  # The public site.
  site_data:
    home: site/_data/
    producer: tool
    cost: derived
    command: "bundle exec rake site:refresh"
