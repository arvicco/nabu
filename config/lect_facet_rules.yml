# config/lect_facet_rules.yml — facet→lect assignment rules (P58-2).
#
# The DOCUMENT-GROUP grain of lect assignment: a catalog facet value (a
# period label, a corpus slice) names the historical stage of every document
# that carries it, per source. Rules are COMPILED, not resolved live:
# `nabu lect apply-rules` reads this file, censuses the catalog, and writes
# per-document rows into the lect journal (db/lects.sqlite3) with
# basis rule:<id> — so every assignment is inspectable in one place, a rule
# re-run supersedes exactly its own rows, and hand rulings always win
# (an existing (urn, code) row is never overwritten by a rule).
#
# Matching: the facet value is normalized (parentheticals stripped —
# "Old Babylonian (ca. 1900-1600 BC)" → "Old Babylonian"; a trailing "?"
# cataloguer's-uncertainty marker stripped) and then matched EXACTLY against
# the map keys. Compound values ("ED I-II (…), Old Babylonian (…)") match
# nothing and are reported as unmatched — deliberate: an ambiguous dating
# stays a bare anchor. Every map target must exist in the registry.
#
# Every rule here is a ratified owner decision — do not add one without one.
# Ruled 2026-08-04 (P58 D58-a/b/c + the D57-f survey pattern): tier states
# certain (the label IS the stage) vs approximation (corpus-level reading;
# per-document overlay refines later).
rules:
  # ── D58-a: the Akkadian period grid (CDLI vocabulary; cdli + ebl carry
  # the facet). Old Akkadian predates the Assyrian/Babylonian split; the
  # ruled fold sends Late Babylonian / Achaemenid (Persian) / Hellenistic /
  # Parthian into nb rather than minting stages the period labels cut finer
  # than the language does. Deliberately unmatched (bare-anchor honesty):
  # Ur III akk, ED IIIb akk, Ebla, Middle Elamite — period labels that
  # describe OTHER chronologies or predate the stage grid's confidence.
  - id: akk-period
    tier: certain
    # oracc joined P62-2: the catalogue period now rides discovery as an
    # adapter-emitted facet (the 123k-entry census), so the same ruled map
    # reaches oracc's own labels.
    sources: [cdli, ebl, oracc]
    code: akk
    facet: period
    map:
      "Old Akkadian": "akk:old"
      "Old Babylonian": "akk:ob"
      "Early Old Babylonian": "akk:ob"
      "Old Assyrian": "akk:oa"
      "Middle Babylonian": "akk:mb"
      "Middle Assyrian": "akk:ma"
      "Neo-Assyrian": "akk:na"
      "Neo-Babylonian": "akk:nb"
      "Early Neo-Babylonian": "akk:nb"
      "Late Babylonian": "akk:nb"
      "Achaemenid": "akk:nb"
      "Persian": "akk:nb"
      "Hellenistic": "akk:nb"
      "Parthian": "akk:nb"

  # ── D58-b: the Sumerian period grid (same vocabulary). ED I-II → arch is
  # the sux-coded archaic corpus (the qpc-coded ED I-II documents are a
  # separately ratifiable claim — registry qpc note). Old Akkadian-period
  # and Lagash II Sumerian → sarg; Early OB and OB → post (the literary/
  # liturgical corpus). №10 (owner ruling 2026-08-09): the first-millennium
  # copies join post — MB/MA/NA/NB-period Sumerian is the same
  # post-vernacular literary/liturgical corpus in later library copies
  # (the №1 etcsl claim at period grain; 4,400 docs measured at ruling).
  - id: sux-period
    tier: certain
    # oracc joined P62-2 (Ur III alone ≈ 80k sux docs once re-parsed).
    sources: [cdli, ebl, oracc]
    code: sux
    facet: period
    map:
      "ED I-II": "sux:arch"
      "ED IIIa": "sux:ed"
      "ED IIIb": "sux:ed"
      "Old Akkadian": "sux:sarg"
      "Lagash II": "sux:sarg"
      "Ur III": "sux:ur3"
      "Early Old Babylonian": "sux:post"
      "Old Babylonian": "sux:post"
      "Middle Babylonian": "sux:post"
      "Middle Assyrian": "sux:post"
      "Neo-Assyrian": "sux:post"
      "Neo-Babylonian": "sux:post"

  # ── D58-c + D59-a: the AES corpus slices (facet `period` on source aes).
  # Ruled D58-c: ok-fip → egy:old, mk-sip → egy:mid. Ruled D59-a
  # (2026-08-06): nk → egy:nk — the whole New Kingdom slice onto the stage
  # minted for exactly this straddle (band [-1550,-1070] overlaps mid and
  # late deliberately; the owner's no-excessive-complexity call — no
  # per-subcorpus splitting). №9 (owner ruling 2026-08-09): tip-roman →
  # egy/trad — the registry's égyptien-de-tradition REGISTER variety,
  # minted for exactly this material (Middle Egyptian register in late
  # copies; a dating-grain stage would be linguistically wrong, which is
  # why P59 left it bare).
  - id: egy-aes-period
    tier: certain
    sources: [aes]
    code: egy
    facet: period
    map:
      "ok-fip": "egy:old"
      "mk-sip": "egy:mid"
      "nk": "egy:nk"
      "tip-roman": "egy/trad"

  # ── №2 (owner ruling 2026-08-09): the Coptic Scriptorium corpus tags its
  # dialect per document ("Sahidic Coptic" 417 · "Bohairic Coptic" 62,
  # censused at ruling); the adapter surfaces it as the `dialect` facet.
  # Lycopolitan (1 doc) and the two mixed-feature values stay honestly
  # unmatched — no registry variety claims them.
  - id: cop-dialect
    tier: certain
    sources: [coptic-scriptorium]
    code: cop
    facet: dialect
    map:
      "Sahidic Coptic": "cop/sah"
      "Bohairic Coptic": "cop/boh"

  # ── №3 (ruled 2026-08-09) + P66-1: the Avestan stage split. The adapter
  # derives avestan-stage per page from its verse anchors (the Gathic
  # chapter set Y 28-41, 43-51, 53 = the Gathas + Yasna Haptaŋhāiti — the
  # standard scholarly division; every other book is Young Avestan; a page
  # mixing both emits no facet and stays a bare ave anchor). Tier certain:
  # the chapter set IS the corpus division.
  - id: ave-stage
    tier: certain
    sources: [titus-avestan]
    code: ave
    facet: avestan-stage
    map:
      "old-avestan": "ave:old"
      "young-avestan": "ave:yng"

  # ── D58-d (facet half): the DCS Vedic school tags — a rv/av/sv/yv-tagged
  # text IS Vedic Sanskrit. Untagged DCS texts stay bare san (the epi/cla
  # split needs per-text knowledge this facet does not carry).
  - id: san-dcs-veda
    tier: certain
    sources: [dcs]
    code: san
    facet: veda
    map:
      "rv": "san:ved"
      "av": "san:ved"
      "sv": "san:ved"
      "black yv": "san:ved"
      "white yv": "san:ved"

  # ── D59-b (2026-08-06): the Sefaria Aramaic split by subshelf. The 215
  # arc docs divide cleanly: the Talmud side (six sedarim + the minor
  # tractates, 162 docs) is Jewish Literary/Babylonian Aramaic → arc:mid;
  # the Targum side (53 docs) composes the ratified jud Targumic sociolect
  # → arc:mid/jud. Tier approximation: a few Hebrew-mixed tractates ride
  # arc wholesale.
  - id: sefaria-arc-subshelf
    tier: approximation
    sources: [sefaria]
    code: arc
    facet: subshelf
    map:
      "seder-zeraim": "arc:mid"
      "seder-moed": "arc:mid"
      "seder-nashim": "arc:mid"
      "seder-nezikin": "arc:mid"
      "seder-kodashim": "arc:mid"
      "seder-tahorot": "arc:mid"
      "minor-tractates": "arc:mid"
      "onkelos": "arc:mid/jud"
      "targum-jonathan": "arc:mid/jud"
      "targum-jerusalem": "arc:mid/jud"
      "aramaic-targum": "arc:mid/jud"

  # ── D59-b (2026-08-06): the eBL Standard Babylonian register — the
  # registry's own note ("the literary register of first-millennium
  # scholarship") made a rule. kind: compose refines EXISTING stage rows
  # in place (basis and supersede lifecycle stay the base rule's;
  # re-running the base rule un-composes, re-running this re-refines —
  # so this rule stays LAST in the file, after every stage-writing rule).
  # The genre facet is hierarchical (CANONICAL/Divination/Celestial…),
  # hence prefix matching; onto na/nb only — the OB/MB literary tail and
  # no-period docs stay uncomposed (98% of CANONICAL akk is
  # first-millennium; census 2026-08-06: NA 4,864 · NB 2,237 · LB 100).
  - id: ebl-akk-lit
    tier: certain
    kind: compose
    sources: [ebl]
    code: akk
    facet: genre
    match_prefix: "CANONICAL"
    variety: lit
    onto: ["akk:na", "akk:nb"]
