      "Sanskrit -- Śāstra -- Philosophy -- Vedānta": literary/wisdom   # 31
      "Sanskrit -- Śāstra -- Philosophy -- Śaiva": literary/wisdom     # 30
      "Sanskrit -- Śāstra -- Philosophy -- Sāṃkhya": literary/wisdom   # 18
      "Sanskrit -- Śāstra -- Philosophy -- Nyāya": literary/wisdom     # 12
      "Sanskrit -- Śāstra -- Philosophy -- Mīmāṃsā": literary/wisdom   # 7
      "Sanskrit -- Śāstra -- Philosophy -- Yoga": literary/wisdom      # 6
      "Sanskrit -- Śāstra -- Philosophy -- Vaiśeṣika": literary/wisdom # 4
      "Sanskrit -- Śāstra -- Philosophy -- Advaita": literary/wisdom   # 2
      "Sanskrit -- Śāstra -- Philosophy": literary/wisdom              # 3 — the bare shelf
      "Sanskrit -- Śāstra -- Āyurveda": scholarly/medicine       # 20
      "Sanskrit -- Śāstra -- Jyotiḥśāstra": [scholarly/astronomy, divination/astrology]  # 13 —
      #   jyotiṣa spans mathematical astronomy and horoscopy/omens; ruled split (the
      #   cdli Prayer/Incantation shape)
      "Sanskrit -- Śāstra -- Dharma -- Smṛti": legal/law         # 13 — the dharma codes
      "Sanskrit -- Śāstra -- Dharma -- Nibandha": legal/law      # 1 — the legal digest
      "Sanskrit -- Śāstra -- Dharmaśāstra -- Sūtra": legal/law   # 6 — the dharmasūtras
      "Sanskrit -- Śāstra -- Grammar": lexical/grammar           # 7
      "Sanskrit -- Śāstra -- Lexikography": lexical/word-list    # 1 — the kośa (the
      #   tamilex nikaṇṭu precedent)
      "Sanskrit -- Śāstra -- Kāmaśāstra": scholarly              # 5 — the erotic-science treatises
      "Sanskrit -- Śāstra -- Arthaśāstra": scholarly             # 1 — statecraft (the KR3b
      #   military-treatise precedent)
      # -- Poetry and its theory
      "Sanskrit -- Poetry -- Kāvya": literary/poetry             # 55
      "Sanskrit -- Poetry -- Subhāṣita": literary/wisdom/proverbs  # 7 — the gnomic anthologies
      "Sanskrit -- Poetry -- Narrative Literature": literary/narrative  # 7
      "Sanskrit -- Poetry -- Historical": [literary/poetry, historiography]  # 2 — historical
      #   kāvya: verse that is also a history of its kings — both claims
      "Sanskrit -- Poetry -- Drama": literary/drama              # 10
      "Sanskrit -- Poetry -- Alaṃkāra": literary/essay/criticism # 27 — poetics (Dhvanyāloka …)
      "Sanskrit -- Poetry -- Nāṭya": literary/essay/criticism    # 2 — dramaturgy treatises
      #   (Nāṭyaśāstra, Daśarūpaka), theory of the stage rather than plays
      "Sanskrit -- Poetry -- Chandas": scholarly                 # 4 — the metrical handbooks
      #   (chandas is its own vedāṅga, apart from grammar in the Sanskrit tradition)
      # -- Epic and Purāṇa
      "Sanskrit -- Epic -- Mahābhārata": literary/narrative/epic # 4
      "Sanskrit -- Epic -- Rāmāyaṇa": literary/narrative/epic    # 2
      "Sanskrit -- Epics -- Rāmāyaṇa": literary/narrative/epic   # 1 — upstream's variant
      "Sanskrit -- Purāṇa": literary/narrative/myth              # 19 — the mythological-
      #   cosmological compendia, by form (their smṛti standing in reception is not
      #   claimed as a genre — the tamilex canon stance)
      # -- the non-Sanskrit shelves
      "Manipravalam -- Vyākhyānas": exegesis                     # 1 — the Śrīvaiṣṇava
      #   commentary on Perumāḷ Tirumoḻi
    deliberate:
      "Sanskrit -- later works -- 20th century": "a period shelf (when written), not a genre claim"
      "Tibetan -- Translation": "a language shelf (the Tibetan rendering of a Buddhist work), not a genre claim"
      "Tibetan": "a language shelf, not a genre claim"
  ecco-tcp:           # 3,101 docs; the header's Gale subject module, <IDNO TYPE="ContentSet">
    #                   (metadata content_set, on every file — census 2026-11-03 over both zips).
    # A module is the subject SHELF the Gale ECCO edition filed the source book on, so
    # only the modules that ARE one house class fold; the shelves spanning several
    # classes are declared, never guessed. ECCO's LCSH headings (29 files) are too
    # thin to fold.
    metadata: content_set
    map:
      "ECLL": literary              # 1,541 — Literature and Language: the poems, plays,
      #   novels, songs and essays that dominate ECCO-TCP. Declared coarseness: the
      #   module's language minority (grammars, dictionaries) rides the literary head
      #   too — the module carries no finer signal to tell them apart
      "ECMS": scholarly             # 362 — Medicine, Science and Technology: the learned
      #   disciplines (the bare head; the module does not say which one)
      "ECLW": legal                 # 28 — Law: statutes, trials, cases and legal treatises
    deliberate:
      "ECSS": "Social Sciences (415) — politics, economics, education, trade pamphlets: a subject shelf spanning several house classes, not a genre claim"
      "ECHG": "History and Geography (322) — histories beside gazetteers and travel accounts: a subject shelf, not a genre claim"
      "ECRP": "Religion and Philosophy (283) — sermons, tracts, devotions and philosophy together: a subject shelf, not a genre claim"
      "ECFA": "Fine Arts (96) — music, architecture, painting treatises: a subject shelf, not a genre claim"
      "ECGR": "General Reference (54) — catalogues, directories, miscellanies: a subject shelf, not a genre claim"
  eebo-tcp:           # 60,325 docs; the LCSH subject facet (config/facet_map.yml subjects → subject)
    # An OPEN vocabulary: TEXTCLASS/KEYWORDS/TERM headings on 57,064 of 60,326
    # canonical files, 34,617 distinct full headings / 12,432 distinct main
    # headings (census over canonical/eebo-tcp, 2026-10-20) — overwhelmingly
    # topical (Great Britain 13,511 docs · Bible 3,699 · Church of England 2,445 …)
    # or name headings. `vocabulary: open`: a heading no rule covers mints NO
    # kind row and is counted as uncovered (`nabu kind census --uncovered`), never
    # filed as unmapped. The rules read the FORM signal LCSH carries in two places
    # — a form main heading ("Sermons, English", "Ballads, English") and a form
    # subdivision ("… -- Sermons.", "… -- Poetry.", "… -- Proclamations.") — and
    # every rule refuses "-- History and criticism" (a book ABOUT the form is not
    # an instance of it). Counts: docs carrying a matching heading. First wave:
    # 15,085 docs kinded (census replay of these rules, same date).
    facet: subject
    vocabulary: open
    regex_map:
      # -- sermon (the head ruled 2026-10-19 for exactly this corpus)
      '\A(?!.*History and criticism)(?!Funeral )(?:[A-Z][\w-]* )?[Ss]ermons(?:, [A-Z][a-z]+)?\.?(?: --|\z)': sermon
      #   4,552 — the form main headings: "Sermons, English" (4,312), Sermons,
      #   American/Irish/Scottish/Welsh/French, and the occasion forms Fast-day,
      #   Visitation, Lenten, Farewell, Christmas, Coronation, Election, Assize …
      #   sermons. An author-title heading ("X. -- Sermon preached at …") is a
      #   work ABOUT that sermon and never matches (singular, mid-heading)
      '\A(?!.*History and criticism)Funeral sermons\b': sermon/funeral-sermon  # 602 — the ruled sub
      '\A(?!.*History and criticism).* -- Sermons\.?(?: --|\z)': sermon
      #   3,044 — the LCSH form subdivision ("Church of England -- Sermons.",
      #   "Great Britain -- History -- Civil War, 1642-1649 -- Sermons …")
      # -- literary
      '\A(?!.*History and criticism)(?:[A-Z][\w-]*(?: [a-z][\w-]*)* )?[Pp]oetry(?:, [A-Z][a-z]+)?\.?(?: --|\z)': literary/poetry
      #   715 — the form main headings: Elegiac/English/Love/Political/Religious/
      #   War poetry, "Poetry, Latin"
      '\A(?!.*History and criticism).* -- Poetry\.?(?: --|\z)': literary/poetry
      #   2,753 — the form subdivision (verse on a person or event: "Charles -- II,
      #   -- King of England, 1630-1685 -- Poetry.")
      '\A(?!.*History and criticism)(?:[A-Z][a-z]+ )?[Bb]allads\b': literary/poetry
      #   1,968 — "Ballads, English" (1,779), "Political ballads and songs": the
      #   broadside ballad is sung verse
      '\A(?!.*History and criticism)(?:[A-Z][\w-]* )?[Ss]ongs(?:, [A-Z][a-z]+)?\.?(?: --|\z)': literary/poetry
      #   163 — "Songs, English" (song texts; "Songs and music" never matches)
      '\ACollege verse\b': literary/poetry   # 28 — university commemorative verse
      '\A(?!.*History and criticism)[A-Z][a-z]+ drama\b': literary/drama  # 57 — English drama (Comedy) …
      '\A(?!.*History and criticism)Masques\b': literary/drama   # 28 — the court masque, a performance text
      '\A(?!.*History and criticism).* -- Drama\.?(?: --|\z)': literary/drama  # 186 — the form subdivision
      '\A(?!.*History and criticism)(?:[A-Z][a-z]+ )?[Ss]atire\b': literary
      #   388 — Political/Religious/Verse satire, "Satire, English": satire is a
      #   literary mode in verse OR prose, so the bare head (literature, not
      #   further classified) — never a guessed sub-family
      '\A(?!.*History and criticism)Voyages and travels\b': literary/diary/travelogue  # 73 — travel accounts
      '\AVoyages, Imaginary\b': literary/narrative  # 11 — the imaginary voyage is fiction
      '\A(?!.*History and criticism)Fables\b': literary/narrative/fable  # 29
      '\A(?!.*History and criticism)Romances\b': literary/narrative  # 23 — prose and verse romances
      '\A(?!.*History and criticism)Proverbs(?! in )\b': literary/wisdom/proverbs
      #   39 — proverb collections ("Proverbs in the Bible" is topical, refused)
      '\A(?!.*History and criticism)Dialogues\b': literary/wisdom/dialogue  # 29
      '\A(?!.*History and criticism)Riddles\b': literary/wisdom/riddle  # 8
      # -- prayer and hymn
      '\APrayers\.?(?: --(?!.*(?:Law and legislation|History and criticism))|\z)': hymn-prayer/prayer
      #   182 — prayer texts; "Prayers -- Law and legislation" (prayer law) and
      #   the topical "Prayer." never match
      '\A(?!.*History and criticism)(?:.* -- )?Prayer-books and devotions\b': hymn-prayer/prayer  # 147
      '\A(?!.*History and criticism)(?:Primers \()?Prayer-books\b': hymn-prayer/prayer  # 30 — incl. Primers
      '\A(?!.*History and criticism)Hymns\b': hymn-prayer/hymn  # 56 — "Hymns, English"
      # -- periodical (the head ruled 2026-10-19)
      '\A(?!.*History and criticism).* -- (?:Periodicals|Newspapers)\.?(?: --|\z)': periodical
      #   59 — the form subdivisions (newsbooks: "Europe -- History -- 1648-1715
      #   -- Periodicals."); EEBO carries few serials, so this stays small
      '\A(?!.*(?:History and criticism|Anecdotes))(?:English (?:newspapers|periodicals)|Newsletters)\b': periodical  # 11
      # -- legal
      '\A(?!.*History and criticism)Proclamations\b': legal/law
      #   193 — royal and civic proclamations carry the force of law
      '\A(?!.*History and criticism).* -- Proclamations\.?(?: --|\z)': legal/law  # 268 — "England -- Proclamations"
      '\A(?!.*History and criticism)Trials\b': legal/court
      #   382 — "Trials (Treason) -- England …": LCSH's form heading for trial
      #   proceedings and reports
      '\A(?!.*History and criticism).* -- Trials, litigation, etc\.?(?: --|\z)': legal/court  # 250
      '\A(?!.*History and criticism).* -- Treaties\.?(?: --|\z)': legal/treaty  # 70 — treaty texts
      '\ALetters patent\b': legal   # 7 — the royal grant instrument (a legal act, not a letter)
      # -- letter
      '\A(?!.*History and criticism).* -- Pastoral letters and charges\b': letter
      #   326 — Quaker epistles and episcopal pastoral letters; LCSH's combined
      #   form also covers visitation charges, folded with the letters it names
      '\A(?:English letters|Love-letters|Letters)\.?(?: --(?!.*History and criticism)|\z)': letter
      #   27 — letter collections ("Letters patent" never matches: no "." or "--")
      '\A(?!.*History and criticism).* -- Correspondence\.?(?: --|\z)': letter  # 25
      # -- exegesis
      '\A(?!.*History and criticism).* -- Commentaries\.?(?: --|\z)': exegesis
      #   763 — every held instance is scriptural or creedal (Bible books, Lord's
      #   prayer, Apostles' Creed, Ten Commandments, one Koran)
      # -- lexical
      '\A(?!.*History and criticism).* -- Grammar\.?(?: --|\z)': lexical/grammar  # 77 — Latin/English grammars
      '\A(?!.*History and criticism).* -- Dictionaries\b': lexical  # 50
      '\A(?!.*History and criticism).* -- Glossaries, vocabularies, etc\b': lexical/glossary  # 5
      # -- scholarly + divination: discipline main headings. EEBO pairs them with
      # "-- Early works to 1800" — LCSH's mark that the book IS a work of the
      # discipline; controversy, humor and history-of headings are refused
      '\A(?!.*(?:History and criticism|Controversial literature|Humor))(?:Medicine|Surgery|Materia medica|Pharmacy|Botany, Medical)\b': scholarly/medicine  # 682
      '\A(?!.*(?:History and criticism|Controversial literature|Humor))Astronomy\b': scholarly/astronomy  # 66
      '\A(?!.*(?:History and criticism|Controversial literature|Humor))(?:Mathematics|Arithmetic|Geometry)\b': scholarly/mathematics  # 83
      '\A(?!.*(?:History and criticism|Controversial literature|Humor))(?:Navigation(?! acts)|Chemistry|Alchemy|Botany(?!, Medical))\b': scholarly
      #   166 — the sciences without a named sub ("Navigation acts" is trade law, refused)
      '\A(?!.*(?:History and criticism|Controversial literature|Humor))Cookery\b': scholarly/recipe  # 47
      '\A(?!.*History and criticism).* -- Formulae, receipts, prescriptions\b': scholarly/recipe
      #   212 — the receipt books; with "Medicine --" also scholarly/medicine (multi-label)
      '\A(?!.*(?:History and criticism|Controversial literature|Humor))Astrology\b': divination/astrology  # 254
      '\A(?!.*(?:History and criticism|Controversial literature|Humor|Religious aspects))Prophecies\b': divination/oracle
      #   202 — prophecy pamphlets (Mother Shipton, Lilly …): oracle is the ruled sub
      # -- historiography
      '\A(?!.*History and criticism)(?!(?:Christian saints|Martyrs)\b).* -- Biography\.?(?: --|\z)': historiography
      #   153 — lives (the elephantine "biography" fold); a saint's or martyr's life goes to
      #   hagiography instead (2026-11-07, below)
      # -- funerary
      '\A(?!.*History and criticism)Epitaphs\b': funerary/epitaph  # 16 — epitaph collections
      # -- theology, catechesis (the heads ruled 2026-11-07; counts = live catalog 2026-11-07)
      '\A(?!.*History and criticism)(?!(?:Medicine|Surgery|Materia medica|Pharmacy|Astronomy|Mathematics|Arithmetic|Geometry|Navigation|Chemistry|Alchemy|Alchemists|Botany|Cookery|Astrology)\b).* -- Controversial literature\b': theology/controversial
      #   3,197 — LCSH's form subdivision for works arguing for or against a religion,
      #   church or doctrine: Catholic Church 1,269 · Society of Friends 402 · Church of
      #   England 370 · Jesuits, Protestantism, Anabaptists, Presbyterianism … — the
      #   confessional pamphlet war. "-- Humor" stays (anti-papal satire is still
      #   controversy); a discipline main heading is refused (a medical or astrological
      #   controversy is no theology — the scholarly rules refuse it from their side).
      #   Declared residue: a few dozen secular mains carry the subdivision too (Women,
      #   East India Company, Whig Party, trade and coinage pamphlets) and fold here
      '\A(?!.*History and criticism)Apologetics\b': theology/apologetics
      #   87 — the form main heading ("Apologetics -- Early works to 1800")
      '\A(?!.*History and criticism).* -- Apologetic works\b': theology/apologetics
      #   946 — the form subdivision: Society of Friends 507 · Church of England 165 ·
      #   Catholic Church 159 … defenses of the faith. An author-title heading ("Goodwin,
      #   Thomas -- Apologeticall narration.") is a work ABOUT that work and never matches
      '\A(?!.*(?:History and criticism|Humor))Catechisms\b': catechesis
      #   271 — "Catechisms, English/Welsh/Polish/Latin" ("-- Humor" is the parody, refused);
      #   a name-title heading ("Westminster Assembly -- Shorter catechism") never matches
      '\A(?!.*(?:History and criticism|Humor)).* -- Catechisms\b': catechesis
      #   149 — the form subdivision ("Church of England -- Catechisms")
      '\A(?!.*(?:History and criticism|Humor))(?:.* -- )?Creeds\b': catechesis
      #   68 — LCSH's form for confessions of faith, the catechesis head's ruled grain
      #   ("Church of England -- Creeds", "Creeds."). "Confession" (the sacrament of
      #   penance) is a topical heading and never matches
      '\A(?!.*History and criticism)Theology, Doctrinal\b': theology/treatise
      #   459 — LCSH's doctrinal-theology heading: common-places, doctrine in lectures,
      #   "Fides Catholica", conciliatory judgments — doctrine argued in prose (titles read
      #   2026-11-07). A catechism or a controversy co-tagged here keeps its own claim too
      # -- oratory
      '\A(?!.*History and criticism)(?:.* -- )?Speeches, addresses, etc\b': oratory
      #   62 — "Speeches, addresses, etc., English" (parliamentary and civic speeches) and
      #   the form subdivision ("Society of Friends -- Speeches, addresses, etc.")
      # -- hagiography. Bare "Saints" is refused: in EEBO it heads Puritan treatises on
      # "the saints" (the elect) as often as lives; "-- Cult", "-- Controversial
      # literature", devotions and pictorial works are about the saints, not lives of them
      '\A(?!.*(?:History and criticism|Controversial literature|Cult|Prayer-books|Pictorial))Christian saints\b': hagiography
      #   11 — lives of saints ("Christian saints -- Biography", "… -- Italy -- Assisi")
      '\A(?!.*History and criticism)Saints(?:, [A-Z][a-z]+)? -- Legends\b': hagiography
      #   5 — the saints' legends (the Legenda aurea shape)
      '\A(?!.*(?:History and criticism|Controversial literature))Martyrs\b': hagiography/martyrdom
      #   24 — martyrologies and martyr accounts (Foxe abridged, the Japanese martyrs, the
      #   primitive persecutions); "-- Poetry" keeps its verse claim beside
  evans-tcp:          # 5,012 docs; the LCSH subject facet (config/facet_map.yml subjects → subject)
    # The same TCP MARC-to-TEI headers as eebo-tcp, so the same OPEN vocabulary and the
    # same refusals ("-- History and criticism": a book ABOUT a form is no instance of
    # it). Evans's cataloguing adds what EEBO's lacks: the rare-book GENRE headings
    # as main headings, dated ("Sermons -- 1760.", "Poems -- 1785.", "Plays -- 1798.") —
    # the strongest form signal in the corpus. Census 2026-11-03 over all 5,012 files
    # (4,832 carry headings); counts = docs carrying a matching heading. First wave:
    # 2,342 docs kinded (census replay of these rules, same date).
    facet: subject
    vocabulary: open
    regex_map:
      # -- sermon
      '\A(?!.*History and criticism)(?!Funeral )(?:[A-Z][\w-]*(?: [a-z][\w-]*)* )?[Ss]ermons(?:, [A-Z][a-z]+)?\.?(?: --|\z)': sermon
      #   1,210 — "Sermons -- 1760." and the occasion genres: Election, Artillery
      #   election, Execution, Thanksgiving, Fast day, Ordination, Dedication sermons
      '\A(?!.*History and criticism)Funeral sermons\b': sermon/funeral-sermon  # 213
      '\A(?!.*History and criticism).* -- Sermons\.?(?: --|\z)': sermon  # 19 — the form subdivision
      # -- literary
      '\A(?!.*History and criticism)Poems\b': literary/poetry
      #   316 — the genre heading ("Poems -- 1785.")
      '\A(?!.*History and criticism)(?:[A-Z][\w-]*(?: [a-z][\w-]*)* )?[Pp]oetry(?:, [A-Z][a-z]+)?\.?(?: --|\z)': literary/poetry
      #   5 — "Christian poetry", "American poetry", "Political poetry"
      '\A(?!.*History and criticism).* -- Poetry\.?(?: --|\z)': literary/poetry  # 154
      '\A(?!.*History and criticism)(?:Elegies|Acrostics|Songsters|Carriers'' addresses)\b': literary/poetry
      #   119 — elegies, acrostics, the songster (a pocket song collection) and
      #   the carrier's New Year verses to a newspaper's customers
      '\A(?!.*History and criticism)(?:[A-Z][a-z]+ )?[Bb]allads\b': literary/poetry  # 6
      '\A(?!.*History and criticism)(?:[A-Z][\w-]* )?[Ss]ongs(?:, [A-Z][a-z]+)?\.?(?: --|\z)': literary/poetry  # 47
      '\A(?!.*History and criticism)Plays\b': literary/drama  # 92 — the genre heading ("Plays -- 1798.")
      '\A(?!.*History and criticism)[A-Z][a-z]+ drama\b': literary/drama  # 1 — "American drama (Comedy)"
      '\A(?!.*History and criticism).* -- Drama\.?(?: --|\z)': literary/drama  # 31
      '\A(?!.*History and criticism)(?:[A-Z][a-z]+ )?[Ss]atires?\b': literary
      #   52 — "Satires -- 1789." and "Political satire": a mode in verse OR prose,
      #   so the bare head (the eebo-tcp call)
      '\A(?!.*History and criticism)(?:Captivity narratives|Memoirs)\b': literary/diary/memoir
      #   92 — the first-person captivity account and the memoir genre
      '\A(?!.*History and criticism)Fables\b': literary/narrative/fable  # 1
      '\A(?!.*History and criticism)Dialogues\b': literary/wisdom/dialogue  # 53
      '\A(?!.*History and criticism)Proverbs(?! in )\b': literary/wisdom/proverbs  # 1
      # -- prayer and hymn
      '\APrayers\.?(?: --(?!.*(?:Law and legislation|History and criticism))|\z)': hymn-prayer/prayer  # 42
      '\A(?!.*History and criticism)Hymns\b': hymn-prayer/hymn  # 54
      # -- legal
      '\A(?!.*History and criticism)(?:(?:Fast day|Thanksgiving Day) )?[Pp]roclamations\b': legal/law
      #   34 — the governors' and councils' proclamations, the fast- and
      #   thanksgiving-day ones included (each appoints the day by authority)
      '\A(?!.*History and criticism)Trials\b': legal/court  # 102 — LCSH's trial-proceedings form
      '\A(?!.*History and criticism).* -- Treaties\.?(?: --|\z)': legal/treaty  # 46 — treaty texts
      # -- exegesis, lexical, scholarly
      '\A(?!.*History and criticism).* -- Commentaries\.?(?: --|\z)': exegesis  # 4
      '\A(?!.*History and criticism).* -- Grammar\.?(?: --|\z)': lexical/grammar  # 4
      '\A(?!.*History and criticism).* -- Dictionaries\b': lexical  # 3
      '\A(?!.*(?:History and criticism|Controversial literature|Humor))(?:Medicine|Surgery|Materia medica|Pharmacy)\b': scholarly/medicine  # 41
      '\A(?!.*(?:History and criticism|Controversial literature|Humor))(?:Mathematics|Arithmetic|Geometry)\b': scholarly/mathematics  # 3
      '\A(?!.*(?:History and criticism|Controversial literature|Humor))Astronomy\b': scholarly/astronomy  # 6
      '\A(?!.*(?:History and criticism|Controversial literature|Humor))Cookery\b': scholarly/recipe  # 6
      # -- historiography
      '\A(?!.*History and criticism).* -- Biography\.?(?: --|\z)': historiography  # 30
      # -- oratory, catechesis, theology (the heads ruled 2026-11-07; live census same date)
      '\A(?!.*History and criticism)Fourth of July orations\b': oratory
      #   162 — the Independence Day oration, the early republic's civic speech form
      #   ("Fourth of July orations -- 1798."), one dated heading per year
      '\A(?!.*(?:History and criticism|Humor))(?:.* -- )?Catechisms\b': catechesis
      #   33 — "Catechisms.", "Congregational churches -- Catechisms", "… -- Catechisms
      #   and creeds" (the eebo-tcp rule)
      '\A(?!.*(?:History and criticism|Humor))(?:.* -- )?Creeds\b': catechesis
      #   6 — confessions of faith, the catechesis head's ruled grain (the eebo-tcp rule)
      '\A(?!.*History and criticism).* -- Doctrinal and controversial works\b': theology
      #   180 — the older LCSH combined subdivision under a church (Society of Friends 123,
      #   Church of England 19 …): doctrine AND controversy in one heading, so the bare head
      '\A(?!.*History and criticism)Apologetics\b': theology/apologetics  # 11 — "Apologetics -- 18th century."
    # Left uncovered on purpose (counted, never filed unmapped): Broadsides (a format),
    # Juvenile literature (an audience), Booksellers' advertisements / Advertisements /
    # Prospectuses / Subscribers' lists (the book trade's ephemera — a class the taxonomy
    # does not carry), Almanacs. "-- Controversial literature" stays uncovered HERE (41 docs,
    # unlike eebo-tcp): Evans's instances are overwhelmingly the slavery debate ("Slavery --
    # United States -- Controversial literature"), not confessional controversy.
  pta:                # census 2026-11-02: the work __cts__.xml dct:type labels of the 105
    metadata: genre   # non-Bible works carrying Greek — the comphistsem text-type head + sub,
    #                   "|"-joined at parse ("Paraenetic|Sermon"); each fragment folds alone
    map:
      "Paraenetic": literary/wisdom              # 66 — moral exhortation, the edification
      #   fold (the dwds Erbauungsliteratur / sefaria Musar precedent); 63 pair it with Sermon
      "Sermon": sermon                           # 63 — Severian's and the Pseudo-Chrysostom
      #   homilies (upstream says sermon; the homily sub is not its claim)
      "Theological": theology                    # 9 — comphistsem's theology HEAD, paired with its
      #   sub on every work (Dogmatic Treatise 4 · Polemics 3 · Bible Exegesis 2): the bare head,
      #   the sub carries the grain (the "Scholarly" head fold below). CORRECTED 2026-11-07
      #   with the two below: all three were scholarly before the theology head was ruled
