# The kind axis — per-source folds (P99-4, under the ruled class list, owner
# 2026-09-13; tail drained P101 under the 2026-09-18 restructure ruling). Every entry is rule curation like a lect
# rule: upstream's own vocabulary on the left, a ruled class path
# (head or head/sub from kind_classes.yml) on the right. Values the
# map does not cover surface as the counted `unmapped` bucket
# (`nabu kind census --unmapped` is the worklist); a `deliberate:`
# block declares reviewed NOT-genre values (layout, cult, copy
# markers) that fold to nothing and render as their own census
# section. A source may declare `vocabulary: open` (default closed) for
# an OPEN vocabulary — subject headings, mostly topical — where a value
# no rule covers mints NOTHING instead of `unmapped`, counted on the
# census board as uncovered (`nabu kind census --uncovered`). Census evidence:
# .docs/surveys/document-classification-survey.md §2/§4a + the live
# document_facets census 2026-09-13 + the full-worklist audit
# 2026-09-18 (4,409 values read; folds below carry their counts).
split: ["|", ";"]     # elephantine pipes, cdli/oracc semicolons
strip: ["?", "(?)"]   # cataloguer uncertainty (edh "epitaph?", cdli "Administrative ?", HGV "Quittung (?)")
sources:
  aio:                # P154 — the page's Inscription type, folded to its HEADS at parse time
    #                   (AioRecordParser.type_heads: "Decree (Council/People)" → Decree,
    #                   "Statue base, Metrical (elegaic couplets)" → Statue base + Metrical).
    #                   Counts = the 80-page sample census 2026-11-02; the full vocabulary
    #                   lands with the first sync (`nabu kind census --unmapped aio`).
    facet: genre
    map:
      "Decree": legal/law                        # 33 — the house decree fold (isicily/iip)
      "Dedication": dedicatory                   # 30 — choregic/private/ephebic/emperor…
      "Funerary": funerary                       # 5
      "Boundary marker": boundary                # 2 — horoi
      "List of names": administrative/list       # 2 — prytany/ephebic name lists
      "Statue base": honorific                   # 2 — the honorific statue's inscribed base
      "Metrical": literary/poetry                # 2 — the verse claim rides beside its head
      "Law": legal/law                           # 2
      "Building contract": legal/contract        # 1
      "Sacrificial Calendar": ritual/festival    # 1 — the cult calendar of sacrifices
      "Cult regulation": ritual                  # 1 — sacred law: how the cult is run
      "Account": administrative/account          # 1
      "Building inscription": building           # 1
      "Milestone": boundary/milestone            # 1
      "Graffito": mark/graffito                  # 1 ("Graffito?" — the global ? strip)
      "Topos-inscription": mark/ownership        # 1 — a reserved-place mark (the edh seat fold)
  cgpg:               # P160 — the carved work's Latin title, cut to ONE keyword head at parse
    #                   time (Adapters::CgpgTitleGenre: the earliest genre noun of the main
    #                   title; a fragment/excerpt/preface takes the genre of the work it is
    #                   part of; a keywordless "De <topic>" title is its own head and folds
    #                   title by title). Upstream and the carve plan carry no genre field —
    #                   the title IS the label. Five single-genre whole volumes declare their
    #                   head in Cgpg::VOLUMES (PG 71, 73 Cyril's commentaries; PG 121, 148,
    #                   153 the histories); mixed or apparatus volumes and the residua make no
    #                   claim. Counts = documents, the pinned carve plan through the adapter
    #                   (2026-11-05): 209 works + 5 volumes carry a head; 145 fold, 69 stay
    #                   unmapped by design — until the 2026-11-07 heads: 193 fold, 21 stay
    #                   unmapped (the block after the map).
    facet: genre
    map:
      # -- commentary on scripture and the classics
      "Expositio in": exegesis                   # 28 — Theophylact's NT + minor-prophet expositions,
      #                                            Psellus' exposition of the Chaldaean Oracles
      "Commentarius": exegesis                   # 10 — Commentarii/Commentarius in (Procopius, Photius,
      #                                            ps.-Oecumenius, ps.-Theophylact Acts, Psellus on the
      #                                            Timaeus psychogony) + the PG 71/73 Cyril volumes
      "Fragmenta in": exegesis                   # 10 — catena fragments on a named book (Photius;
      #                                            Oecumenius, whose served text is the full catena)
      "Enarratio": exegesis                      # 4 — Theophylact on the four Gospels
      "Amphilochia": exegesis                    # 2 — Photius' questions, upstream's own volume label
      #                                            "Exegetica: Quaestiones Amphilochiana"
      "In": exegesis                             # 2 — the Latin "In <book>" commentary title: Procopius
      #                                            In Proverbia; Psellus' note on the Poimandres
      "Scholia": exegesis                        # 1 — Procopius on Kings and Chronicles
      # -- letters, preaching, verse
      "Epistulae": letter                        # 14 — letters by form, the two martyr-letters of the
      #                                            churches of Smyrna and Lyon included (they ARE letters);
      #                                            synodal-letter fragments fold here too
      "Homiliae": sermon/homily                  # 2 — Palamas; Leo VI's Orationes (homiliae et panegyrici)
      "Sermones": sermon                         # 2 — Isidore's Marian sermons; Theophylact's mid-Lent oration
      "Oratio in praesentationem Deiparae": sermon  # 1 — a feast oration, preached on the Presentation
      "Carmina": literary/poetry                 # 3 — Leo VI's carmina and Carmen compunctorium; a carmen politicum
      "Versus": literary/poetry                  # 2
      "Poemata": literary/poetry                 # 1 — Psellus' poems, the didactic verse synopses included
      # -- writing the past
      "Historia": historiography                 # 12 — church and Byzantine histories (Socrates, Sozomen,
      #                                            Callistus, Choniates, Ducas, Zonaras' Epitome historiarum,
      #                                            Scylitzes Continuatus) + the PG 121/148/153 volumes
      "Excerpta": historiography                 # 7 — Constantine VII's Excerpta de legationibus (with its
      #                                            prooemium): excerpted historians, history by selection
      "Chronographia": historiography/chronicle  # 3 — the Byzantine chronographia is the chronicle form
      "Chronicon": historiography/chronicle      # 2 — incl. ps.-Codinus' Chronicon breve (De annis ab orbe condito)
      "Annales": historiography/chronicle        # 1 — Glycas' world chronicle under its Latin editors' title,
      #                                            not year-entry annals
      "Patria": historiography                   # 2 — the Patria of Constantinople: the city's legendary history
      "Parastaseis": historiography              # 1 — Parastaseis syntomoi chronikai, the same antiquarian strand
      "Basileiai": historiography                # 1 — Genesius' reigns
      "De expugnatione Thessalonicae": historiography  # 1 — Cameniates' narrative of the 904 sack
      # -- rite, oracle
      "Exapostilaria": ritual/chant              # 1 — Leo VI's resurrection exapostilaria: the troparion sung
      #                                            at Matins after the canon, an individual sung piece of the
      #                                            rite (the cantus Office-chant precedent), not a free hymn
      "Oracula": divination/oracle               # 1 — the Oracles of Leo the Wise
      # Symeon of Thessalonica's sacramental-liturgical chapters (the great dialogue's
      # 33-373 and its companion exposition): each sets out HOW a rite is performed and
      # in what order, with its mystagogy — the late-Byzantine rite's own description,
      # so ritual/liturgy. exegesis is the commentary on scripture and the classics; a
      # rite is neither. His Creed expositions and polemic stay unmapped (below).
      "De sacramentis": ritual/liturgy           # 1
      "De sancto chrismate": ritual/liturgy      # 1
      "De sacra liturgia": ritual/liturgy        # 1
      "De sacro templo et eius consecratione": ritual/liturgy  # 1
      "De sacris ordinationibus": ritual/liturgy  # 1
      "De poenitentia": ritual/liturgy           # 1
      "De honesto et legitimo matrimonio": ritual/liturgy  # 1 — the marriage rite
      "De sancto oleo": ritual/liturgy           # 1 — the euchelaion
      "De sacra precatione": ritual/liturgy      # 1 — the divine office
      "De fine et exsequiarum ordine": ritual/liturgy  # 1 — the funeral order
      "Expositio de divino templo": ritual/liturgy  # 1 — the church and its rites, explained
      # -- law and the registers of church and empire
      "Tomus": legal/law                         # 3 — the Palamite synodal tomoi (1341–1368): conciliar decrees
      #                                            (the house decree fold)
      "Novellae": legal/law                      # 2 — the novels of Leo VI and Constantine VII
      "Delectus": legal/law                      # 1 — Delectus legum compendiarius, a law digest
      "Notitiae": administrative/list            # 1 — Notitiae episcopatuum: the see register in rank order
      "Synecdemus": administrative/list          # 1 — Hierocles' table of the provinces and their cities
      # -- learning, instruction, criticism
      "Quaestiones naturales": scholarly         # 1 — Quaestionum naturalium solutiones
      "De omnifaria doctrina": scholarly         # 1 — Psellus' Didaskalia pantodape
      "De lapidum virtutibus": scholarly         # 1 — the lapidary
      "De anima celebres opiniones": scholarly   # 1 — philosophical doxography
      "Quaenam sunt Graecorum opiniones de daemonibus": scholarly  # 1 — doxography likewise
      "De legum nominibus": lexical/glossary     # 1 — Roman-law terms and Latin legal loanwords
      "De actionum nominibus": lexical/glossary  # 1 — the names of Attic lawsuits, defined
      "De locis et nominibus Atticis": lexical/glossary  # 1
      "Paraenesis": literary/wisdom              # 2 — Basil I's exhortation chapters to Leo: gnomic instruction
      "Institutio": literary/wisdom              # 1 — Theophylact's Paideia basilike, a mirror of princes
      "Characteres": literary/essay              # 1 — Psellus' stylistic characters of four Fathers: criticism
      # -- the five heads ruled 2026-11-07 take 48 of the 69 formerly unmapped-by-design
      # documents (census through the adapter over the pinned plan, same date).
      # hagiography: writing the saints
      "Vita": hagiography/vita                   # 3 — Clement of Ohrid's long life, the Vita S. Basilii
      #                                            iunioris excerpts; the third is the Narratio de vita
      #                                            Mohammedis, an anti-Islamic polemical life the head
      #                                            cannot tell apart (declared stray: polemic in a vita's form)
      "Martyrium": hagiography/martyrdom         # 3 — the Ignatius and Justin martyr acts, Theophylact's
      #                                            Historia martyrii of the fifteen Tiberiopolitan martyrs
      "Encomium": hagiography/encomium           # 1 — Philotheus' encomium of Gregory Palamas, the saint
      #                                            he canonized
      "Laudatio": hagiography/encomium           # 1 — the excerpt from the encomium of St Demetrius (the
      #                                            904 capture of Thessalonica); a part takes its work's genre
      "Narratio de imagine Edessena": hagiography  # 1 — the feast narrative of the Mandylion's translation
      #                                            (944), BHG-catalogued: hagiography of a relic, no ruled sub
      # theology/apologetics: the faith defended outward, to pagans and the Roman state
      "Apologia": theology/apologetics           # 3 — Justin's two Apologies; Quadratus' fragment
      "Legatio": theology/apologetics            # 1 — Athenagoras' plea to the emperors for the Christians
      "Cohortatio": theology/apologetics         # 1 — ps.-Justin's exhortation to the Greeks
      "Oratio ad gentiles": theology/apologetics  # 1 — ps.-Justin
      "Oratio ad Graecos": theology/apologetics  # 1 — Tatian: an "oratio" by title, an apology by function
      "Ad Autolycum": theology/apologetics       # 1 — Theophilus of Antioch
      "Irrisio": theology/apologetics            # 1 — Hermias' mockery of the pagan philosophers
      "De monarchia": theology/apologetics       # 1 — ps.-Justin: the one God against polytheism, from the
      #                                            poets' own testimony
      # theology/polemic: the refutation of a named error or opponent
      "Adversus": theology/polemic               # 2 — Apollonius against the Montanists; Adversus iconoclastas
      "Refutatio": theology/polemic              # 1 — Agallianus against Argyropulus (the Florentine union)
      "Confutatio": theology/polemic             # 1 — ps.-Justin's confutation of Aristotelian dogmas
      "Antirrhetici": theology/polemic           # 1 — Philotheus against Gregoras (the Palamite controversy)
      "De iis quorum Latini incusantur": theology/polemic  # 1 — Theophylact on the charges against the Latins
      "Logos dialektikos": theology/polemic      # 1 — Hilarion on leavened bread against the Latin azymes
      "De processione Spiritus Sancti ad magnum ducem": theology/polemic  # 1 — Argyropulus on the filioque
      #                                            and the Florentine decree: a side taken in the controversy
      "Dialogus": theology                       # 4 — Cum Tryphone (apologetic, to a Jew), Symeon of
      #                                            Thessalonica against the heresies and Nicetas against the
      #                                            Latins (polemic), ps.-Psellus on demons (doctrine): one head,
      #                                            three subs — the bare head, declared coarse (a form word, not
      #                                            literary/wisdom's dialogue)
      # theology/erotapokriseis: doctrinal question-and-answer
      "Quaestiones": theology/erotapokriseis     # 3 — the ps.-Justinian question-answer collections (not
      #                                            exegesis proper: the questions are doctrinal)
      "Responsa ad Gabrielem Pentapolitanum": theology/erotapokriseis  # 1 — Symeon's answers on liturgical
      #                                            and canonical questions
      # theology/treatise: doctrine argued in prose
      "De resurrectione": theology/treatise      # 2 — Athenagoras; ps.-Justin
      "Expositio rectae fidei": theology/treatise  # 1 — ps.-Justin's trinitarian-christological exposition
      "Expositio de sacro symbolo": theology/treatise  # 1 — Symeon on the Creed (an exposition, not the creed
      #                                            itself: no confession is being made)
      "Expositio necessaria de sacri symboli dictionibus": theology/treatise  # 1 — the Creed's terms expounded
      "De essentia et operatione Dei": theology/treatise  # 1 — the Palamite essence-energies doctrine
      "Λόγοι δύο": theology/treatise             # 1 — the anonymous two theological discourses
      "De mortis determinatione": theology/treatise  # 1 — Psellus' Antigraphe: is the term of life fixed by God
      "De sacerdotio": theology/treatise         # 1 — Symeon on the priesthood, epistle-framed
      # catechesis: the confession of faith is the ruled grain
      "Confessio": catechesis                    # 1 — Patriarch Joseph II's confession of faith (Florence, 1439)
      # oratory: rhetoric as a form — the Byzantine monody and the imperial oration
      "Monodia": oratory                         # 2 — Cydones on the slain of Thessalonica; Psellus on the
      #                                            collapse of Hagia Sophia: the funeral lament as oration
      "Oratio in imperatorem Alexium I Comnenum": oratory  # 1 — Theophylact's basilikos logos
    # -- still unmapped by design (21 documents): no ruled head fits. They surface in the
    #    unmapped bucket (`nabu kind census --unmapped cgpg`), never forced onto a near class.
    #  bare fragments of lost works (13): Fragmenta 12, Prooemium 1 — the lost or parent
    #    work's genre is not in the title (Job the Monk's prooemium is an author's preface
    #    to his Psalms exposition — part of a work, not edition paratext)
    #  "Narratio" (1): John of Jerusalem's narrative of the iconoclast heresy's origin —
    #    history written as polemic; the bare head would capture any future narratio
    #  the court, administration and war (7): "De cerimoniis aulae Byzantinae" 2,
    #    "De officiis", "De administrando imperio", "De thematibus", Tactica,
    #    "De sepulcris imperatorum quae sunt in templo sanctorum apostolorum"
    #  The edition's own apparatus (Migne's testimonia, prefaces, monita — the paratext
    #  grain) sits in the residuum documents, which carry no genre facet: the residuum
    #  mixes apparatus with rescans and uncarved text, so a paratext claim is an adapter
    #  question, not a fold line.
  cantus:             # the chant record's genre — upstream's own abbreviation list
    #                   (cantusdatabase.org/genres/), the facet value = upstream's genre NAME,
    #                   the code raw (CantusCsvParser::GENRES). Counts = the 17-source sample
    #                   census 2026-11-04 (34,269 records); the full spread lands with the first
    #                   sync. The fold: sung liturgical items (Office and Mass propers and
    #                   ordinary, their verses, tropes and liturgical-drama elements) are
    #                   ritual/chant — the individual sung piece of the rite (the sub minted
    #                   with these folds; ritual/liturgy keeps a rite's running text and order);
    #                   hymns and the strophic cantiones are hymn-prayer/hymn; the spoken
    #                   orations hymn-prayer/prayer; a psalm or canticle written out is the
    #                   biblical text itself (scripture).
    facet: genre
    map:
      "Antiphon": ritual/chant                 # A 14,319 — the Office's framing chant
      "Responsory": ritual/chant               # R 7,674 — the Matins responsory
      "Responsory verse": ritual/chant         # V 5,946
      "Versicle": ritual/chant                 # W 3,153
      "Hymn": hymn-prayer/hymn                   # H 1,754 — the strophic Office hymn
      "Hymn verse": hymn-prayer/hymn             # HV 35 — a hymn strophe
      "Invitatory antiphon": ritual/chant      # I 724
      "Antiphon verse": ritual/chant           # AV 184
      "Lesson": ritual/chant                   # L 78 — a notated reading of the rite
      "Sequence": ritual/chant                 # Sq 3 — the Mass's sung sequence (its
      #                                            poetry rides the text; the function is liturgical)
      "Sequence verse": ritual/chant
      "Invitatory psalm": scripture              # IP 49 — Psalm 94 written out (Venite)
      "Psalm": scripture                         # PS 2 — the psalm text written out
      "Canticle": scripture                      # Ca — a biblical canticle (Magnificat, Benedictus)
      "Canticle verse": scripture
      "Alleluia": ritual/chant                 # Al 22 — Mass propers from here down
      "Alleluia verse": ritual/chant
      "Gradual": ritual/chant                  # Gr 13
      "Gradual verse": ritual/chant            # GrV 10
      "Introit": ritual/chant                  # In 5
      "Introit verse": ritual/chant            # InV 7
      "Versus ad repetendum for the introit": ritual/chant
      "Offertory": ritual/chant                # Of 7
      "Offertory verse": ritual/chant          # OfV 1
      "Communion": ritual/chant                # Cm 5
      "Communion verse": ritual/chant          # CmV 1
      "Versus ad repetendum for the communion": ritual/chant
      "Tract": ritual/chant                    # Tc 2
      "Tract verse": ritual/chant              # TcV 4
      "Ingressa": ritual/chant                 # Ig — the Beneventan introit
      "Kyrie": ritual/chant                    # Ky 13 — the Mass ordinary from here down
      "Gloria": ritual/chant                   # Gl 9
      "Credo": ritual/chant                    # Cr 6
      "Sanctus": ritual/chant                  # Sa 14
      "Agnus dei": ritual/chant                # Ag 12
      "Ite missa est": ritual/chant            # Ite 5
      "Benedicamus domino": ritual/chant       # BD 1
      "Pater noster": ritual/chant             # Pn 1 — the Lord's Prayer as SUNG in the Mass
      "Prefatio": ritual/chant                 # Pr 5 — the sung preface
      "Litany": ritual/chant
      "Litany verse": ritual/chant
      "Preces": ritual/chant                   # PRCS — Old Hispanic sung intercessions
      "Verse for the Preces": ritual/chant
      "Capitulum": ritual/chant                # Cap — the Office's short chapter reading
      "Mass chant": ritual/chant               # G — early-index generic Mass code
      "Verse for a Mass chant": ritual/chant   # GV
      "Mass Ordinary": ritual/chant            # MO
      "Tropus": ritual/chant                   # Tp 10 — a trope, sung inside the rite
      "Prosa": ritual/chant                    # Psa 1
      "Prosula": ritual/chant                  # Psl — a texted melisma (a trope)
      "Troped Agnus dei": ritual/chant
      "Troped Alleluia": ritual/chant
      "Troped Benedicamus domino": ritual/chant   # TpBD 2
      "Troped Communion": ritual/chant
      "Troped Gloria": ritual/chant
      "Troped Introit": ritual/chant
      "Troped Ite missa est": ritual/chant
      "Troped Kyrie": ritual/chant
      "Troped Offertory": ritual/chant
      "Troped Sanctus": ritual/chant
      "Dramatic element": [ritual/chant, literary/drama]   # D 3 — liturgical drama: both
      "Varia": ritual/chant                    # Va 2 — upstream's replacement for M
      "Varia within Holy Week": ritual/chant   # VaHW 5
      "Miscellaneous": ritual/chant            # M — Te Deum, Versus in Triduo, prosulae
      "Collect": hymn-prayer/prayer              # Co — the spoken orations from here down
      "Oratio / Prayer": hymn-prayer/prayer      # Or
      "Secret / Oratio secreta": hymn-prayer/prayer   # Sec
      "Postcommunion": hymn-prayer/prayer        # Pc
      "Cantio": hymn-prayer/hymn                 # Cn — paraliturgical strophic sacred song
      "Cantio Verse": hymn-prayer/hymn           # CnV
      "Unknown, ambiguous, unidentifiable, illegible": unknown   # ? — upstream's own claim
  armepic:            # the records' keywords/term[@xml:lang=en] (ArmEpiC's inscription-type
    #                   authority, urn:armepic:ist:*); counts = the full-deposit census
    #                   2026-11-04 (50 records, a record may carry two terms). The three
    #                   heads left unmapped at the first sync were ruled 2026-11-04: fold
    #                   onto existing heads, no new taxonomy heads for a 50-document
    #                   source; "religious-ethical" (1) stays deliberately unclassified
    #                   (one record, no honest existing head).
    facet: genre
    map:
      "construction": building                   # 22 — church/gavit/bridge building records
      "construction / building": building        # 2
      "donation": dedicatory                     # 15 — gifts of land, oxen, revenues to a church
      "donation / dedication": dedicatory        # 1 — the authority list's own label
      "dedication": dedicatory                   # 1
      "epitaph": funerary/epitaph                # 1 — ART0010, a catholicos's tombstone
      "canonical-legal": legal                   # 1 — ART0046, the villagers' tax exemption
      #                                            of a zhamatun (beside its construction term)
      "commemorative": funerary                  # 13 — hishatakagrayin memorial inscriptions;
      #                                            the ogham precedent (Commemorative →
      #                                            funerary, "memorial stones"): remembrance
      #                                            records, the house's memorial head
      "commemoration": funerary                  # 1 — the authority list's own variant label
      "khachkar erection": dedicatory/votive     # 5 — a cross-stone erected for the soul of a
      #                                            named person; upstream's own note ("subtype
      #                                            of construction, commemoration") folds here
      #                                            as the votive act, ruled 2026-11-04
  cdli:               # 288,629 docs — the largest vocabulary by rows
    facet: genre
    map:
      "Administrative": administrative           # 194,477 (+3,985 "?")
      "Royal/Monumental": royal                  # 22,261
      "Legal": legal                             # 16,553
      "Letter": letter                           # 15,844
      "Lexical": lexical                         # 8,144 (+287 "?")
      "School": school                           # 3,894
      "Omen": divination/omen                    # 3,042
      "uncertain": unknown                       # 2,793
      "Mathematical": scholarly/mathematics      # 1,947
      "Astronomical": scholarly/astronomy        # 1,628
      "Prayer/Incantation": [hymn-prayer, magic/incantation]   # 971 — ruled split
      "Scientific": scholarly                    # 763
      "Ritual": ritual                           # 420
      "Literary": literary                       # 9,657 (+98 "?") — owner-ruled: upstream's own
      #   literature catch-all folds to the bare literary head
      "Historical": historiography               # 55
      "Private/Votive": dedicatory/votive        # 54
      "fake (modern)": unknown                   # 230 — owner-ruled: authenticity claim, not a
      #   genre; the verbatim label stays on every card
      "Other (see subgenre)": unknown            # 39 — upstream's own other-pointer; the
      #   subgenre field is not walked (P105-6)
  ebl:                # slash-path vocabulary — prefix rules, most-specific first
    facet: genre
    prefix_map:
      "CANONICAL/Literature/Lamentations": hymn-prayer/lament    # 582
      "CANONICAL/Literature/Hymns": hymn-prayer/hymn             # 318+
      "CANONICAL/Literature/Narrative": literary/narrative       # 68
      "CANONICAL/Literature": literary                           # 181 remainder
      "CANONICAL/Technical/Medicine": scholarly/medicine         # 260+
      "CANONICAL/Technical/Astronomy": scholarly/astronomy       # 88 + Astronomical Diaries 80
      "CANONICAL/Technical/Commentary": scholarly/commentary     # 69
      "CANONICAL/Technical/Ritual texts": ritual                 # 170
      "CANONICAL/Technical": scholarly                           # remainder
      "CANONICAL/Divination/Extispicy": divination/extispicy     # 747
      "CANONICAL/Divination/Celestial": divination/astrology     # 1,076
      "CANONICAL/Divination": divination                         # 472+ remainder
      "CANONICAL/Magic": magic                                   # 539
      "CANONICAL/Lexicography": lexical
      "CANONICAL/School Tablet": school                          # 58
      "CANONICAL": literary                      # 576 bare — owner-ruled: eBL's canonical series
      #   ARE the Babylonian literary canon; the bare tag says no more than "Literary"
      "ARCHIVAL/Letter": letter                                  # 470
      "ARCHIVAL/Administrative": administrative                  # 273
      "ARCHIVAL/Legal": legal
      "ARCHIVAL": administrative                 # 348 bare — the archival half IS the
      #   documentary record (letters/admin/legal are its own sub-paths)
      "MONUMENTAL": royal                                        # 213
      "OTHER/Uncertain": unknown                                 # 394
  edh:                # 81,881 docs, English vocabulary
    facet: genre
    map:
      "epitaph": funerary/epitaph                # 26,706 (+1,376 "?")
      "unknown": unknown                         # 20,632
      "votive inscription": dedicatory/votive    # 13,335 (+858 "?")
      "owner/artist inscription": mark/ownership # 4,725 (+611 "?")
      "honorific inscription": honorific         # 3,383 (+621 "?")
      "building/dedicatory inscription": building # 2,677 (+646 "?")
      "mile-/leaguestone": boundary/milestone    # 1,701
      "identification inscription": mark/label   # 1,369 (+201 "?")
      "military diploma": legal                  # 500
      "acclamation": honorific                   # 497
