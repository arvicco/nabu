  aozora:             # NDC codes ("NDC 913", children's "NDC K913", multi "NDC 913 914")
    metadata: ndc
    regex_map:
      '\bK?9\d1\b': literary/poetry              # 911 ×1,355 + K911 ×172 …
      '\bK?9\d2\b': literary/drama               # 912 ×199
      '\bK?9\d3\b': literary/narrative/novel     # 913 ×4,728 + K913 ×1,222 …
      '\bK?9\d4\b': literary/essay               # 914 ×3,450
      '\bK?9\d5\b': literary/diary               # 915 ×488
      '\bK?9\d0\b': scholarly                    # 910 ×169 — literature studies/criticism
      '\bK?9\d6\b': literary                     # 916 ×74 — reportage/records: literature,
      #   not further classified
      '\bK?289\b': historiography                # 289 ×214 — individual biography
      '\bK?21\d\b': historiography               # 210s ×~90 — Japanese history
      '\bK?121\b': literary/essay                # 121 ×94 — Japanese philosophy (the dta
      #   Philosophie precedent)
      # P105-6 fold round:
      '\bK?9[1-9]9\b': literary                  # 9x9 "other" literature shelves (949 ×49
      #   incl. K949, 919 kanshi, 929/939/…) — literature, not further classified;
      #   909 (children's-lit studies) deliberately excluded from the pattern
      '\bK?22\d\b': historiography               # 220s ×~60 — Asian history (222 ×36)
      '\bK?29\d\b': scholarly                    # 290s ×~90 — geography and travel
      #   (291 ×34 + "291 786" ×44; the dta Geographie precedent)
      '\bK?4\d\d\b': scholarly                   # 400s ×~150 — natural-science writings
      #   (451 meteorology ×40, 401 ×31, 460, 481 …; the dta Physik/Biologie shape)
      '\bK?388\b': literary/narrative/tale       # 388 ×32 — legends and folktales: the
      #   texts themselves, not folklore studies
      '\bK?38[02467]\b': scholarly               # 380/382/384/386/387 — folklore and
      #   ethnography of manners, festivals and beliefs (the dta
      #   Gesellschaftswissenschaften precedent; 384 ×14 + 387 ×14 + 380 ×19
      #   joined 2026-10-12 under the same ruled shape)
      '\bK?917\b': literary                      # 917 ×12 — humor and satire: a form
      #   class (the 2026-10-12 fold round), literature not further classified
      # remaining non-9xx compounds and singletons stay worklist-visible.
    deliberate:
      # Ruled 2026-09-26 (P103 gate, as recommended): the bare modern
      # NDC subject-shelving heads are not genre claims.
      "NDC 367": "modern NDC subject shelving (society), not genre"
