      "NDC 751": "modern NDC subject shelving (ceramics), not genre"
      "NDC 728": "modern NDC subject shelving (calligraphy), not genre"
      # Ruled 2026-10-12 (the fold round re-confirmed the standing stance:
      # the library's own heads, subject shelving never a genre claim) —
      # the recurring unmapped tail above ~15 docs, same wording:
      "NDC 361": "modern NDC subject shelving (sociology), not genre"
      "NDC 370": "modern NDC subject shelving (education), not genre"
      "NDC 377": "modern NDC subject shelving (universities), not genre"
