  ceipom:
    kind: {posture: unclassified}
    lect: {posture: dates}
    dating: {posture: dated}
    places: {posture: linked, note: "refs on 27% — names reach 100%"}
    script: {posture: implied}
  corph:
    kind: {posture: unclassified}
    lect: {posture: dates}
    dating: {posture: partial}
    places: {posture: unplaced}
    script: {posture: implied}
  croala:
