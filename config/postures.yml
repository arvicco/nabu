# config/postures.yml — per-source CORE-LAYER posture declarations
# (P61-0 consolidation of the P59-4 config/lect_posture.yml; the D59-f
# wave-1 frame of the ratified core-layers design; usage in
# docs/operating-library.md §2).
#
# One row per source, one key per layer (lect / dating / places /
# script), each holding what pure JUDGMENT can state — machine-knowable
# postures are NEVER declared here (a source named by a
# lect_facet_rules.yml rule or a lect_overrides.yml row is lect-postured
# by those files; an artifact_scripts.yml row states its own machine
# fact). The suite (test/postures_test.rb) fails when a passage-serving
# source lacks a required layer's posture; pending rows must name their
# candidate. Vocabularies (ratified):
#
#   lect    identity / pending / dates / codemap   (P59-4, verbatim)
#   dating  dated / partial / undatable / pending
#   places  linked / named / unplaced / pending
#   script  implied / qualified / mixed
#
# New-adapter duty (the front-door checklist): run `nabu layer suggest
# <slug>`, then wire the machine files or declare the rows. A missing
# row fails the suite.
sources:
  # ── dates: the dating-inferred epigraphic/documentary corpora ──────────
  ceipom:
    kind: {posture: unclassified}
    lect: {posture: dates}
    dating: {posture: dated}
    places: {posture: linked, note: "refs on 27% — names reach 100%"}
    script: {posture: implied}
  corph:
    kind: {posture: unclassified}
    lect: {posture: dates}
    dating: {posture: partial}
    places: {posture: unplaced}
    script: {posture: implied}
  croala:
    kind: {posture: unclassified}
    lect:
      posture: dates
      note: ruled DELIBERATELY unstaged at source grain (D57-f — genuinely
        mixed Renaissance-to-modern Latin); per-document date-band rows ride.
    dating: {posture: partial}
    places: {posture: named, note: "the creation placeName on 298 of 573 texts; 69 carry
        a Wikidata place URL that rides the axis place_ref verbatim (no wikidata gazetteer
        join is held, so the posture stays named)"}
    script: {posture: implied}
  edh:
    lect: {posture: dates}
    dating: {posture: partial}
    places: {posture: linked, note: "fo_antik findspot + Pleiades/GeoNames ref + the koordinaten1 WGS84
        pair (place_lat/lon, 79,462/81,460 axis rows live 2026-10-18); koordinaten2 (a second locus on
        838 rows) stays canonical-only — no second column pair to carry it"}
    script: {posture: implied}
  edr:
    lect: {posture: dates}
    dating: {posture: partial}
    places: {posture: linked, note: "P64-1 apply: refs on 99,249/115,590 axis rows (86%) — registry
        pleiades:/tm: mints incl. 28 homonym rulings"}
    script: {posture: implied}
  iip:
    lect: {posture: dates}
    dating: {posture: dated}
    places: {posture: linked, note: "P64-1 apply: refs on 1,828/5,499 axis rows (33%) — English-exonym
        tail stays named"}
    script: {posture: implied}
  isicily:
    lect: {posture: dates}
    dating: {posture: partial}
    places: {posture: linked}
    script: {posture: qualified}
  lexlep:
    lect: {posture: dates}
    dating: {posture: partial}
    places: {posture: named}
    script: {posture: implied}
  oracc:
    # lect declaration retired P62-2: the extended akk/sux period rules
    # machine-posture oracc now (the shadowing rule).
    dating: {posture: dated, note: "P62-1/2: 116,708/118,366 via catalogue date_of_origin + the ruled
        period table (the recursive-glob fix reached the triply-nested epsd2 catalogue); 2026-10-18:
        regnal_dates (4,359 members, absolute BCE reign spans) bands at reign precision ahead of the
        period when date_of_origin is absent; dynastic_seat is the ruler's political seat — no
        ruled table dates it, it rides metadata + facet only"}
    places: {posture: linked, note: "refs on 20% — names reach 29%; 2026-10-18: the SAA letters'
        sender_loc (2,678 members, 1,733 with Pleiades id + coordinates) rides its OWN place row
        (axis_source oracc-sender) beside the provenience row; findspot_square is an excavation grid
        square below the place axis (metadata only)"}
    script: {posture: implied}

  # ── codemap: refined universally, no Nabu-specific knowledge needed ────
  okhc:
    # P91-1: three codes, each with a real anchor — lzh rides the korean
    # shelves' codemap precedent (Hanmun = Literary Sinitic as read in
    # Korea); ko is the honest-coarse claim for the Early Modern/Modern
    # Korean labels (the stage refinement is a future date-band story
    # over the per-record year field); okm would ride the held
    # ko-wikisource-mk precedent if Middle Korean rows surface at sync.
    lect: {posture: codemap, note: "lzh → zho/lit (the sillok mold); ko/okm identity;
        Korean stage refinement deferred to a ruled year-band table"}
    dating: {posture: dated, note: "P92-6: the per-record integer year projects
        through MetadataDates :year_key — 490,014 of 1,198,779 records carry one
        (censused 2026-09-01, range 695–1995). The klc munjip records (652,405, none
        with a year) join the itkc-catalog module's 서지 records by the ITKC work id in
        the urn (ItkcAuthorDates, axis_source okhc-authors): the author's birth–death
        years band the work — date_class composition, precision era, an attributed
        author-era claim, never a text's own date; an unknown death falls back to the
        original print year as the terminus. Census 2026-10-19: 650,232 banded (837
        with an open lower side — birth unknown), 2,173 left undated (6 munjip whose
        author has a birth year only and no print year); dated share 41% → 95%"}
    places: {posture: unplaced, note: "archive/corpus provenance rides document metadata"}
    script: {posture: qualified, note: "the per-record script field (Hanja / Old Hangeul /
        Hangeul mixes) rides document metadata verbatim"}
  sillok:
    lect:
      posture: codemap
      note: lzh → zho/lit (the kanripo precedent — Literary Chinese as read
        in Korea; a ko-tradition lect claim stays DELIBERATELY coarse until
        a use case needs it, P78-1)
    dating: {posture: dated, note: "per-volume 서기 year via MetadataDates :structured; P81-1: the
        per-day entry dates also project as passage-grain year runs (NikhEntryDates), and undated
        volumes (prefaces/indexes) gain leaf-derived envelopes"}
    places: {posture: unplaced, note: "the 531,956 지명 index tags ride passage annotations + the
        passage 'place' facet as tag-grain MENTIONS (no upstream ref on any) — where a text was
        made or found is not what they say, so no axis claim is minted"}
    script: {posture: implied}
    # The index markup (NikhXmlParser entities): 1,572,270 이름 person tags
    # (1,352,152 carrying M_ ids → the "sillok" person-index slice, 68,285
    # persons; `nabu person sillok:M_… | nikh:M_…`), 51,261 서명 books and
    # 6,382 연호 eras ride passage annotations and the person/book/era
    # passage facets (facet_map.yml) — mentions with refs, never claims
    # about the article's own author, date or place.
    # The per-article 분류 subject classes (413,102 of 414,321 passages,
    # 216 labels) are a passage-grain facet (facet_map.yml passage_fields
    # → "subject"), reachable by `search --facet subject=…`; they are
    # topical classes, not a document kind, so no kind fold rides them.
  sjw:
    lect: {posture: codemap, note: lzh → zho/lit (the sillok/kanripo precedent, P78-2)}
    dating: {posture: dated, note: "per-member 서기 year via MetadataDates :structured; P81-1: the
        per-day entry dates also project as passage-grain year runs (NikhEntryDates); weather still
        rides annotations raw"}
    places: {posture: unplaced, note: "the 1,335,483 지명 index tags ride passage annotations + the
        passage 'place' facet as tag-grain MENTIONS (no upstream ref) — no findspot/creation claim"}
    script: {posture: implied}
    # The index markup (NikhXmlParser entities): 8,355,291 이름 person and
    # 140,958 서명 book tags ride passage annotations and the person/book
    # passage facets. Persons and books are VALUED by upstream's own normalized
    # @name (its resolution claim, transcribed — variants group in the facet, a
    # book under its WORK identity; the raw surface rides beside it where it differs; the 미결
    # unresolved sentinel leaves the surface). No person-key ids (only the cross-database
    # pid on a few thousand tags) — sjw mints no person authority.
  viet-wikisource:
    kind: {posture: unclassified}
    lect:
      posture: codemap
      note: lzh → zho/lit (the kanripo/sillok precedent — Literary Chinese as
        written in Đại Việt; a vi-tradition lect claim stays DELIBERATELY
        coarse until a use case needs it, P78-5)
    dating: {posture: partial, note: "header year params only — the hịch carries 1284; the DVSKTT quyển
        pages carry no machine year (compilation strata 1479/1665/1697 ride the docs, not claims)"}
    places: {posture: unplaced}
    script: {posture: implied, note: "Han script implied by lzh; Ext-B/rare-Han codepoints ride as-is"}
  goryeosa:
    lect:
      posture: codemap
      note: lzh → zho/lit (hanmun — the kanripo/sillok precedent, P78-3)
    dating: {posture: dated, note: "P81-1: the leaf-grain 음/양 machine dates (877–1392, '0877-01-99L0';
        '9999' filler skipped counted) project via NikhEntryDates — document envelopes + passage-grain
        year runs; volume fronts still carry no dateOccured, so the envelope IS the document claim"}
    places: {posture: unplaced, note: "the 16,876 지명 index tags (16,862 with NIKH t-ids) ride passage
        annotations + the passage 'place' facet as tag-grain MENTIONS with nikh: refs — no findspot or
        creation claim is minted, and NIKH's place ids are not a held gazetteer"}
    script: {posture: implied}
    # The index markup (NikhXmlParser entities): 66,285 이름 persons (p-ids
    # → the "goryeosa" person-index slice, 11,505 persons, aliases grouped
    # under one id), 37,477 관직 offices, 2,666 단체 orgs and 1,092 서명
    # books ride passage annotations and the person/office/org/book
    # passage facets, refs verbatim under the shared nikh: namespace.
  goryeosa-jeoryo:
    lect:
      posture: codemap
      note: lzh → zho/lit (hanmun — the kanripo/sillok precedent, P78-3)
    dating: {posture: dated, note: "P81-1: the per-article 음 machine dates (918–1434) project via
        NikhEntryDates — document envelopes + passage-grain year runs; root fronts still carry only
        coveragePeriod prose, so the envelope IS the document claim"}
    places: {posture: unplaced, note: "the 6,965 지명 index tags (6,149 with NIKH t-ids) ride passage
        annotations + the passage 'place' facet as tag-grain MENTIONS — no findspot/creation claim"}
    script: {posture: implied}
    # The index markup: 31,997 이름 persons (23,941 with p-ids — goryeosa's
    # own id space, 6,924 of 6,937 ids shared; this source's own slice,
    # 6,937 persons), 13,419 관직 offices, 596 단체 orgs, 283 서명 books —
    # passage annotations + facets as for goryeosa; id-less tags ride bare.
  bibyeonsa:
    lect:
      posture: codemap
      note: lzh → zho/lit (hanmun — the kanripo/sillok precedent, P78-3)
    dating: {posture: dated, note: "P81-1: the untyped per-entry machine dates (1616–1892,
        '1617-01-00L0') project via NikhEntryDates — document envelopes + passage-grain year runs
        (bb_001's interleaved years stay separate runs, never merged); book fronts still carry only
        the 1959 print-edition data, so the envelope IS the document claim"}
    places: {posture: unplaced, note: "the deposit carries no 지명 index tags at all (census 2026-10-18)"}
    script: {posture: implied}
    # The index markup is thin here: 998 이름 person tags (923 mentions
    # once upstream's 75 double-tags fold, 26 persons by their
    # cross-database pid) ride passage annotations + the person facet; no
    # person-key ids, so no authority is minted.
  itkc:
    # The per-article 문체분류 genre classes (37,182 of 37,184 passages, 29
    # labels: 詩類 23,207 · 書簡類 12,832 · 其他類 · 雜著類 …) are a
    # passage-grain facet (facet_map.yml passage_fields → "genre"),
    # reachable by `search --facet genre=…`. They
    # classify ARTICLES inside a collected-works fascicle, so the
    # document-grain kind stays unclassified: a fascicle mixes genres and
    # a kind fold over its articles would misstate the whole.
    kind: {posture: unclassified}
    lect: {posture: codemap, note: lzh → zho/lit (the kanripo precedent; upstream's 언어 "coc" is ITKC-internal, P78-7)}
    dating: {posture: dated, note: "per-work 원문간행년 original print year via MetadataDates :structured;
        fascicles of a work without one join the itkc-catalog 서지 record by work id
        (ItkcAuthorDates, axis_source itkc-authors — the author's life band,
        date_class composition): census 2026-10-19 at the volume grain, 608 of 758
        print-year dated + 78 author-banded (총쇄, 농산집, 임하필기); 72 stay undated
        (국조인물고 — compiler, years and print all unknown)"}
    places: {posture: unplaced}
    script: {posture: implied}
  classical-modern:
    # kind machine-postured: config/kind_map.yml folds metadata.book (the
    # 97 works by their Siku seat — all 14,608 documents incl. siblings).
    lect: {posture: codemap, note: lzh → zho/lit (the kanripo precedent; the
        cmn translation siblings are modern-Chinese apparatus, no lect claim)}
    dating: {posture: dated, note: "the chapter units carry no dates, but the WORK is known:
        config/work_eras.yml rules each of the 97 works' attributed composition era (class
        composition, precision era) — 7,241 of the 7,304 classical chapters band; the 3
        contested works declared undated (将苑, 素书, 文昌孝经 — 63 chapters) and the 7,304
        modern-translation siblings (axis-exempt by design) mint nothing"}
    places: {posture: unplaced}
    script: {posture: qualified, note: "SIMPLIFIED script on BOTH sides
        (censused 2026-08-29 — 岂/国/宪 on the 古文 side too): a modern-web
        re-encoding of classical text, never traditional-script witness"}
  kanripo:
    lect: {posture: codemap, note: lzh → zho/lit (Literary Chinese)}
    dating: {posture: dated, note: "P104-1: KanripoDates ladders the KR-Catalog —
        the entry's own clean :DATE: year (typed, precision year), else the first 人物
        person's :DATES: life/floruit span, else the :DYNASTY: attribution banded via
        period_bands.yml sinological rows (both precision `era`, the grade-2 class);
        era-name years (乾隆十三年) and compound seats honestly mint nothing"}
    places: {posture: unplaced}
    script: {posture: mixed, note: "gaiji variant characters ride annotations"}
  cbeta:
    lect: {posture: codemap, note: "lzh → zho/lit for T/X/K/J; the N canon (漢譯南傳大藏經,
        the Yuan Heng Temple 1990–98 Chinese translation of the Pāli Tipiṭaka via the
        Japanese Nanden daizōkyō) is modern written Chinese and claims bare cmn (identity —
        the classical-modern translation-sibling precedent), never lzh; its Pāli source
        rides metadata translated_from: pli and per-line PTS cRef annotations (P126)"}
    dating: {posture: dated, note: "P104-1 (the aggressive-mining law's attributed-era grade, owner-ruled 2026-09-26): the header byline's dynasty seat
        (3,163 of 3,707 headers censused 2026-09-26) bands via period_bands.yml through
        MetadataDates :dynasty_band — precision `era`, an attributed translation-era claim,
        never a typed date; seat-less bylines (失譯, Indian masters) honestly mint nothing.
        P126: J bylines carry 明/清 seats (both banded rows) and date the same way; N's
        modern translator bylines (悟醒譯) carry no seat and DELIBERATELY mint nothing — the
        1990–98 translation era is source-level knowledge, not a per-file upstream claim"}
    places: {posture: unplaced}
    script: {posture: implied}
  suttacentral:
    lect: {posture: codemap, note: the lzh slice → zho/lit; pli is identity}
    dating: {posture: undatable}
    places: {posture: unplaced}
    script: {posture: implied}
  ud:
    kind: {posture: unclassified, note: "every treebank README's Genre line (UD genre tags,
        all 34 treebanks) rides each split document as the genre facet, verbatim — never
        kind-folded: a split file mixes whatever its treebank mixes, so one kind over the
        union would misstate each text (census 2026-10-19)"}
    # lect machine-postured (codemap + the 2026-10-11 gn → gn:old override,
    # the ruled narrow exception to D57-f: the Old Guaraní treebank is a
    # stage witness and the only gn-claiming document); the lzh treebanks →
    # zho/lit via codemap; the rest stays DELIBERATELY unstaged (D57-f).
    dating: {posture: partial, note: "the sentence-comment dates of four treebanks (census
        2026-10-19): birchbark date_created on 1,203 letters (25 bands), rnc created on 56
        documents, ruthenian date/created on 83, egyptian-pc date on 3,089 sentences (5th/6th
        Dynasty, banded by the TLA thesaurus nodes in period_bands.yml) — passage-grain runs +
        a document envelope (UdSentenceDates). The other 30 treebanks state no date"}
    places: {posture: named, note: "egyptian-pc's place comment (Saqqara, all 3,089 sentences)
        rides the UdSentenceDates rows; no other treebank states a place"}
    script: {posture: implied}

  # ── identity: the bare code IS the claim ───────────────────────────────
  # Stage-specific ISO codes (the code already names the historical stage):
  oncoj:
    kind: {posture: unclassified}
    lect: {posture: identity, note: ojp IS Old Japanese}
    dating: {posture: undatable}
    places: {posture: unplaced, note: "no findspot or origin claim exists — the poems are
        transmitted texts. The corpus does tag place NAMES inside the poems (pos pln /
        pln-kke, 3,343 tokens over 910 lemma ids, census 2026-10-18): they ride a
        per-passage 'places' annotation (surface + lemma id + headword) at token grain —
        mentions, never a document place"}
    script: {posture: implied}
  rem:
    kind: {posture: unclassified}
    lect: {posture: identity, note: gmh IS Middle High German}
    dating: {posture: dated, note: "the ReM-v2.1_coraxml.zip sibling's element
        header: <date> (clean parses, 225 filled) with upstream's comma-spelled
        century-half <time> grid (396 of 406) behind prose; MetadataDates
        :structured"}
    places: {posture: named, note: "P109-4 (the unmined-metadata drain): the header's
        orig_place scriptorium claims (Vorau, 'Siegburg (?)' — 79 of 406
        docs, uncertainty markers verbatim) project via PLACE_KEYS; the
        genre code projects as a labeled facet in the same packet"}
    script: {posture: implied}
  ren:
    kind: {posture: unclassified}
    lect: {posture: identity, note: gml IS Middle Low German}
    dating: {posture: dated, note: "the CorAXML_1.1.zip sibling's date_ReN (clean
        parses) with upstream's century-half time grid behind prose datings —
        the grid is on all 235 headers; MetadataDates :structured"}
    places: {posture: named, note: "the CorA header place (80 of 235 docs once
        the explicit 'unbekannt' sentinel is excluded) rides the default
        place key verbatim"}
    script: {posture: implied}
  bfm:
    kind: {posture: unclassified}
    lect: {posture: identity, note: fro IS Old French}
    dating: {posture: dated}
    places: {posture: unplaced}
    script: {posture: implied}
  helipad:
    kind: {posture: unclassified}
    lect: {posture: identity, note: osx IS Old Saxon}
    dating: {posture: undatable}
    places: {posture: unplaced}
    script: {posture: implied}
  menotec:
    kind: {posture: unclassified}
    lect: {posture: identity, note: non IS Old Norse}
    dating: {posture: undatable}
    places: {posture: unplaced}
    script: {posture: implied}
  menota:
    kind: {posture: unclassified, note: "no genre vocabulary in the headers; the msItem
        work titles (metadata work, 72 of 91 texts — Konungs skuggsjá, Njáls saga,
        Landslǫg …) are work NAMES, faceted as work; a per-work kind fold is later curation"}
    # lect: machine-postured (owner-ruled 2026-08-24, nabu-lects v1.1.0
    # minted no/no:old + da/da:old + the nor/dan/gmq-oda codemap rows) —
    # the pending row retired, the ref add-then-retire shape. Coverage:
    # nor/dan/swe ride the universal codemap; isl/non are identity
    # anchors; the menota-dan rule stages the two Scanian docs (dates
    # unparsed upstream); the onw override reads Menota's deprecated
    # legacy code (ISO Old Nubian collision — never a codemap row);
    # nor stages into no:old via lect infer-dates off real origDates
    # (25/27 contained; two boundary straddlers honestly bare).
    dating: {posture: dated, note: "P82-1: the msDesc origDate's own
        notBefore/notAfter attributes via MetadataDates :structured, raw
        preserved (censused: all 91 catalogue rows carry an origDate);
        attr-less dates ride raw only — never guessed"}
    places: {posture: named, note: "origPlace rides metadata verbatim
        ('Norway', 'Vadstena kloster' — an origin claim); repository/
        settlement/country are the holding library, kept distinct"}
    script: {posture: implied, note: "Latin alphabet with MUFI entity
        extensions (many PUA); the menota-rune Corpuscle sibling corpus
        is deliberately out of v1 scope"}
  aspr:
    kind: {posture: unclassified}
    lect: {posture: identity, note: ang IS Old English}
    dating: {posture: undatable}
    places: {posture: unplaced}
    script: {posture: implied}
  cme:
    kind: {posture: unclassified}
    lect:
      posture: identity
      note: "enm IS Middle English (registry band 1100–1500, parent ang;
        P82-2) — the corpus's own definition is the claim; upstream
        LANGUSAGE declarations are inconsistent (censused 2026-08-23: 150
        files declare enm, 61 'eng', others list only their FOREIGN
        languages) and ride document metadata verbatim, never the claim"
    dating:
      posture: dated
      note: "P109-4 (the unmined-metadata drain): the SOURCE EDITION's print year(s)
        project with date_class 'edition' — an 1886 edition of a 1200
        text is still not a composition claim, and the class label says
        exactly that; the e-text pub_date stays machinery (declared,
        Invariants::MINING_EXEMPT). Real per-text composition/MS dates
        live in the MED HyperBibliography stencils, not publicly
        downloadable — 'exceptions ... on request' (an owner ask via the
        existing upstream contact, a future instrument, deliberately NOT
        a pending commitment)"
    places: {posture: unplaced, note: "P109-4: both place keys are
        edition/publisher lineage (Ann Arbor; mixed modern/early imprint
        publishers), never the Middle English text's origin — declared,
        Invariants::MINING_EXEMPT"}
    script: {posture: implied}
  eebo-tcp:
    kind: {posture: pending, note: "candidate: a kind_map fold over the LCSH subject facet's
        FORM headings (Ballads, English 1,779 · Funeral sermons 589 · Elegiac poetry, English
        205 · Prayers 198 · English poetry 168 · Hymns, English 49 · English drama 46 …;
        census 2026-10-19). Not ruled yet: the subject facet is an OPEN vocabulary (~34.6k
        distinct headings, overwhelmingly topical — Great Britain -- History …), so a
        facet fold today would file every topical heading as `unmapped`; it needs a fold
        shape where uncovered headings mint nothing (a kinds-core change), and the corpus's
        largest form — Sermons, English 4,317 (+ Fast-day/Visitation/Funeral sermons) — has
        no ruled class (homiletic) on the kind list"}
    lect:
      posture: identity
      note: "en IS the claim and it is TRUE today (P83-1): 97.6% of the
        corpus declares LANGUSAGE eng (censused ×3,325), mapped through
        the codemap's eng→en alias; the registry anchor is en (parent
        enm). The en:early stage mint is APPROVED (owner ruling 2026-08-26,
        nabu-lects PR #9: en:early [1500, 1700] — the de:early shape,
        pending owner merge); once the v1.2.0 mint reaches
        canonical/nabu-lects the en:early staging rides DATE-BAND
        INFERENCE over the imprint envelopes (the no:old/Menota
        precedent — no blanket rule), and the registry-fixture sweep
        happens at that merge, not here. Identity stays the honest
        declaration meanwhile. The foreign-language minority (lat 1.4%;
        wel/roa/frm/fre/dut/spa/iri/ita tails) claims its upstream MARC
        code verbatim — those ride as-is, deliberately coarse"
    dating:
      posture: dated
      note: "the BIBLFULL imprint year via MetadataDates :structured —
        the censused molds (plain/bracketed years, [i.e. YYYY]
        corrections, ranges, OS/NS split years, Anno Dom.) date 85.7% of
        the 3,325-file sample; ?/ca. uncertainty stays raw-only, bounds
