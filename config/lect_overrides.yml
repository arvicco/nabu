# config/lect_overrides.yml — per-source lect resolution overrides (P57-3).
#
# Universal code -> lect defaults live in the nabu-lects module's own
# codemap.yml (canonical/nabu-lects/codemap.yml, mirrored at
# test/fixtures/nabu-lects/codemap.yml): those are statements true for ANY
# consumer of the code. THIS file holds NABU-SPECIFIC knowledge — what one
# particular source's use of a code actually means in ITS holdings, which the
# universal codemap cannot state (a fact about a collection, not about the
# code). Read by Nabu::Lects (lib/nabu/lects.rb).
#
# Precedence in Nabu::Lects#resolve, highest first: per-document overlay >
# THIS FILE (per-source) > codemap.yml (universal) > identity (the code
# itself). Rows transcribing the corpus's own definition onto an existing
# node are parse-time work with their reasoning (the owner's 2026-10-18
# generalization); only judgment-grade assignments escalate — do not add such a row
# without one.
#
# Row shape (P81 U-5): either the bare lect id string, or
# `{ lect: "<id>", tier: certain|approximation }` — the ruling's stated
# tier promoted from prose comment to machine field, so render surfaces
# can gloss it (Nabu::LectGloss over Certainty's :lect_tier carrier:
# certain is silent, approximation glosses "probable — override <slug>,
# approximation"). The comments keep the ruling's own wording.
sources:
  derom:
    # DÉRom (config/sources.yml `derom`) files its etymon articles under the
    # Wiktionary Vulgar-Latin code la-vul, but DÉRom's own doctrine is that
    # these ARE comparative-method reconstructions (the whole point of the
    # dictionary) — the reconstructed roa:pro lect, not the universal
    # codemap's attested-register default (lat/vul). Owner ruling, P57-3.
    la-vul: { lect: "roa:pro", tier: certain }
  rundata:
    # Rundata (config/sources.yml `rundata`) tags urnordisk-dated
    # inscriptions gmq-pro (the wiktionary-recon proto-language convention —
    # no ISO code exists), but the inscriptions themselves are ATTESTED
    # runic epigraphy (the Elder Futhark span), not the universal codemap's
    # reconstructed default (gmq:pro) — nabu-lects registers exactly this
    # distinction as the attested gmq:run stage. Owner ruling, P57-3.
    gmq-pro: { lect: "gmq:run", tier: certain }

  # ── D57-f (owner ruling 2026-08-02): the first text-corpus stage
  # assignments. Two tiers, stated per row: CERTAIN (the corpus's own
  # definition IS the stage) and APPROXIMATION (corpus-level reading per
  # the sanctioned survey pattern; per-document overlay refines later).
  # Epigraphy (edr, edh, isicily, iip, ceipom) and genuinely mixed corpora
  # (croala, first1k-greek, diorisis, glaux, ud) stay DELIBERATELY
  # unstaged — bare-anchor honesty at source grain. (glaux's per-text
  # dialect labels refine its date-banded stages at DOCUMENT grain via
  # the glaux-dialect-* compose rules — no source-grain claim.)
  openmgh:
    # MGH medieval critical editions — certain.
    lat: { lect: "lat:med", tier: certain }
  analecta-hymnica:
    # The Analecta Hymnica MEDII AEVI define their own scope as the hymnody
    # of the Middle Ages — the registry's lat:med node (the openmgh shape),
    # transcribed from the series' title (parse-time work, the 2026-10-18
    # generalization). Tier APPROXIMATION, not certain: the stage band is
    # [600, 1350], while Bd. 50–52 (Hymnographi Latini II, Thesauri
    # hymnologici hymnarium) reach back to Hilary and Ambrose (4th c.) and
    # the Reimgebete / Psalterien / Cantiones volumes run into the 15th–16th
    # (lat:ren). The row also keeps date-band inference off the PRINT years
    # (1886–1922), which would otherwise stage the volumes to lat:new. The
    # liturgical register (lat/ecc) is not claimed — a refinement for a
    # ruling, not a transcription.
    lat: { lect: "lat:med", tier: approximation }
  vulgate:
    # Jerome — certain.
    lat: { lect: "lat:late/ecc", tier: certain }
  digiliblt:
    # The corpus is defined as "testi latini tardoantichi" — certain.
    lat: { lect: "lat:late", tier: certain }
  vedaweb:
    # The corpus IS the Rigveda — Vedic Sanskrit by definition (the D57-f
    # certain class; the same claim the dcs "rv" facet rule makes per text).
    san: { lect: "san:ved", tier: certain }
  sblgnt:
    # The SBL Greek New Testament — certain.
    grc: { lect: "grc:koi", tier: certain }
  papyri-ddbdp:
    # Documentary papyri, Ptolemaic through Roman — approximation.
    grc: { lect: "grc:koi", tier: approximation }
    # P61-3 (D60-b): Demotic papyri held as Latin transliteration — the
    # surface claim; the artifact's Egyd rides config/artifact_scripts.yml.
    egy-Egyd: { lect: "egy~latn", tier: certain }
  perseus-greek:
    # Classical canon — approximation; Homer refines to grc:hom per-doc.
    grc: { lect: "grc:cla", tier: approximation }
  perseus-latin:
    # Classical canon — approximation; Plautus refines to lat:arch per-doc.
    lat: { lect: "lat:cla", tier: approximation }
  elephantine:
    # The island's Greek record is Ptolemaic — approximation. (The source's
    # other twelve languages are untouched: overrides are per (source, code).)
    grc: { lect: "grc:koi", tier: approximation }
    # The island's Aramaic record IS the Imperial Aramaic corpus — certain.
    # Owner ruling, P58 D58-d.
    arc: { lect: "arc:imp", tier: certain }
    # P61-3 (D60-b): the Demotic papyri are HELD as Latin transliteration
    # (byte-census P60-1) — surface claim ~latn; the artifact's Egyd rides
    # config/artifact_scripts.yml.
    egy-Egyd: { lect: "egy~latn", tier: certain }
  openiti:
    # OpenITI is the premodern Classical Arabic written tradition —
    # approximation (the fas rows are untouched). Owner ruling, P58 D58-d.
    ara: { lect: "ara:cla", tier: approximation }
  dss:
    # The Scrolls' Aramaic IS the corpus the registry stage is named for
    # ("Biblical (Qumran) Aramaic") — certain. The source carries zero
    # facets and zero dating axes (censused 2026-08-06), so source grain
    # is the only machine grain available; the hbo majority (857 docs)
    # stays deliberately bare — the registry mints no Qumran-Hebrew stage.
    # Owner ruling, P59 D59-b.
    arc: { lect: "arc:bib", tier: certain }
  # P61-3 (D60-b applied; the wave-1 architecture the owner ratified
  # 2026-08-07): the ARTIFACT-claiming script suffixes — the byte-census
  # (P60-1) measured these codes' held text 100% Latin transliteration,
  # so the suffix names the artifact's script, not the surface. The
  # surface claim lands here (~latn, the D60-b primary fact); the
  # artifact's script rides config/artifact_scripts.yml into
  # document_axes.artifact_script. Universal codemap rows are deliberately
  # NOT minted for these codes: their wild usage is not surface-honest.
  # (papyri-ddbdp's egy-Egyd row lives in its section ABOVE — YAML takes
  # the LAST duplicate key, so a second section would silently SHADOW the
  # first; the P61-3 incident that cost grc:koi 57,911 rows for one
  # materialize run.)
  itant:
    osc-Ital-x-oscetr: { lect: "osc~latn", tier: certain }
    xcg-Ital-x-xcglep: { lect: "xcg~latn", tier: certain }
  # Owner ruling 2026-08-09: ETCSL is the canonical Sumerian literary
  # corpus — Old Babylonian-era copies from after Sumerian died as a
  # vernacular, exactly the registry's sux:post claim. Source-grain tier
  # approximation (394 sux docs at ruling; the eng siblings stay bare).
  etcsl:
    sux: { lect: "sux:post", tier: approximation }
  # Owner ruling 2026-08-09: the CCMH corpus IS Croatian Church
  # Slavonic — the chu/cro recension minted upstream for exactly this
  # (19 chu docs at ruling). torot's six canonical mss stay BARE chu:
  # the registry's bare anchor names the canonical corpus itself.
  ccmh:
    chu: { lect: "chu/cro", tier: certain }
  # Owner ruling 2026-08-09: the Freising Fragments are literally the
  # exemplar the registry's sl:old note names (12 sl docs at ruling).
  freising:
    sl: { lect: "sl:old", tier: certain }
  # Owner ruling 2026-08-21 (option A): the aranese corpus IS
  # Aranese — the Val d'Aran variety of Gascon, minted as oc/aranes by
  # nabu-lects PR #6 (its own IANA subtag and orthographic norm; the
  # gascon ⊃ aranes nesting rides the registry note). A per-collection
  # fact the universal codemap cannot state: upstream codes the whole
  # ~420k-pair Occitan side bare `oci`. Tier certain: the corpus is
  # definitionally Aranese (the card's own description).
  aranese:
    oci: { lect: "oc/aranes", tier: certain }
  # menota: the onw → no:old row (owner ruling 2026-08-24 — Menota's
  # deprecated legacy code for Old Norwegian, ISO's Old Nubian) RETIRED
  # 2026-11-02: the adapter corrects the RAW code at parse (onw → nor,
  # upstream's code kept in metadata language_raw) and the live catalog's
  # menota holdings carry no onw after the P153 re-parse (dan 2 · isl 53 ·
  # non 1 · nor 31 · swe 4), so the routing had nothing left to route.
  # The menota-dan rule still machine-postures the source.
  # P110 (the P108 add-then-retire completed; jpn:emj minted in the
  # p108-japonic-stages nabu-lects release, in canonical since P108's
  # sister sync): 校異源氏物語 IS the Heian classical stage — Genji,
  # c. 1008, inside emj's [794, 1185] band; the whole 54-doc corpus is
  # one work. A per-collection fact: upstream codes it bare jpn.
  kouigenji:
    jpn: { lect: "jpn:emj", tier: certain }
  # Same flip for the kokubunken kokin side: the 古今和歌集 texts (kana
  # preface included, compiled 905) are Heian classical — jpn:emj. The
  # manyo docs ride ojp and stay identity (Old Japanese whatever the
  # manuscript copy date — the P108-4 posture note).
  kokubunken:
    jpn: { lect: "jpn:emj", tier: certain }
  # ninjal-textdb's Kirishitan slice is the Jesuit mission press's
  # romanized Japanese: the Amakusa Feiqe (1592) and Esopo (1593), the
  # Contemptus Mundi (1596) and the Nippo Jisho headwords (1603) — the
  # material the registry's own jpn:lmj note names ("the Christian-mission
  # romanizations (Nippo Jisho 1603 documents its close)"); the 1603 print
  # sits at the band's conventional edge, which the note itself places
  # there. The held surface is the original Latin-script romanization (the
  # kanji-kana layer rides annotations), so the ~latn surface claim lands
  # here — the ppchy yi~latn shape; no jpn-Latn codemap row exists, and the
  # adapter codes bare jpn. Tier certain: upstream's own work dates and the
  # registry note agree.
  ninjal-textdb:
    jpn: { lect: "jpn:lmj~latn", tier: certain }
  # GregoBase is the Gregorian repertory of the Roman rite and its
  # religious orders (Solesmes, Vatican, Dominican, Cistercian…): its Latin
  # is the liturgy's own register by definition — the registry's
  # lat/ecc variety (the vulgate's register, lat:late/ecc). Deliberately
  # UNSTAGED: the texts span the late-antique psalter and antiphon
  # tradition, medieval hymns and sequences, and 19th–21st-century
  # compositions and revisions in one table with no per-chant composition
  # date (the D57-f mixed-at-source-grain class). The vernacular rows
  # (eng, vie, pol, grc …) stay bare. Tier certain: the register claim is
  # the database's definition, not an inference.
  gregobase:
    lat: { lect: "lat/ecc", tier: certain }
  divinum-officium:
    # The Roman Rite's liturgical books ARE Ecclesiastical Latin by the
    # corpus's own definition — the same stageless lat/ecc register claim
    # the gregobase row makes for the chant repertory (both adopted
    # 2026-11-04, the liturgy wave): strata from the Vulgate psalter and
    # patristic lessons through medieval hymnody to twentieth-century
    # feasts, so no stage is claimed at source grain. Tier certain: a
    # register transcription of the corpus's identity, not a reading.
    lat: { lect: "lat/ecc", tier: certain }
  # P116-1's add-then-retire completed (2026-10-11; the Slavic nabu-lects
  # package minted cs with cs:old [1100, 1500], in canonical): the Prague
  # Bible of 1488 IS Old Czech by every periodization (staročeština to
  # c. 1500; the registry's own cs:old note names it the first complete
  # printed Old Czech Bible). A per-collection fact: upstream codes the
  # whole edition bare cs. Tier certain: one dated print, inside the band.
  prague-bible-1488:
    cs: { lect: "cs:old", tier: certain }
  # P155: EMMO's 100 manuscripts declare textLang "eng" every one, and every
  # catalogue date (origin@when, 1552–1697 — census 2026-11-03) sits inside
  # en:early's [1500, 1700] band: the whole collection IS Early Modern
  # English. A per-collection fact: upstream codes it bare eng. Tier certain:
  # dated manuscripts, all inside the band. The inline Latin <foreign> spans
  # ride page annotations, never the document code.
  emmo:
    en: { lect: "en:early", tier: certain }
  # P160: the Stationers' Register copy entries are the Company Clerk's
  # English, and every entry's own Register date (SortDate 1557-07-19 …
  # 1640, census 2026-11-05 over all 10,453) sits inside en:early's
  # [1500, 1700] band: the whole source IS Early Modern English. A
  # per-collection fact — upstream marks no language at all; the adapter
  # codes it en. Tier certain: dated entries, all inside the band. The
  # Latin formulae and the three unlabelled foreign copy-titles ride
  # inside it, declared coarse in the adapter.
  stationers-register:
    en: { lect: "en:early", tier: certain }
  ticha:
    # The colonial Valley Zapotec corpus (Córdova 1578 through the Valley
    # notarial record to 1832): every holding falls inside the zap:col band
    # by the corpus's own construction. The parser folds the encoders' own
    # "cvz" label to zap; Córdova's TEI header declares ISO xzp, which SIL
    # defines as the PRE-HISPANIC Monte Albán glyphic language (CR 2006-065)
    # — a universal codemap row would misread glyphic collections, so the
    # americas registry package deliberately left it unmapped and THIS
    # per-collection row carries the fold (owner adoption 2026-10-11, the
    # americas package merged the same day).
    zap: { lect: "zap:col", tier: certain }
    xzp: { lect: "zap:col", tier: certain }
  ig-cyprus:
    # The Cypriot syllabary fascicle IS pre-Hellenistic Cyprus: its Greek
    # is the Arcadocypriot dialect by the edition's own identity (the
    # registry's grc/cyp variety, minted 2026-10-18). Eteocypriot (ecy)
    # and und-Latn documents are untouched — the override keys on grc
    # alone. Upstream metadata taken at face value, the parse-time
    # mapping discipline. The syllabary-in-transliteration documents
    # carry grc-Latn and are the dialect's core witnesses — both
    # spellings take the variety; und-Latn (double-labeled titles)
    # and ecy stay untouched.
    grc: { lect: "grc/cyp", tier: certain }
    grc-Latn: { lect: "grc/cyp", tier: certain }
  ud:
    # The ruled exception to D57-f (ud deliberately unstaged): the Old
    # Guaraní treebank (Montoya/Restivo, 1639-1724) is precisely a stage
    # witness, and it is the ONLY ud document claiming bare gn (gug and the
    # modern treebanks claim their own codes). Ruled 2026-10-11 and
    # re-confirmed by the 2026-10-12 posture-folds ruling (the gn:old
    # band [1600, 1800] is the guaraní jesuítico convention); revisit if
    # a modern gn-coded treebank ever registers.
    gn: { lect: "gn:old", tier: certain }
  te-wikisource:
    # The Telugu Wikisource cone is composition-bounded by construction
    # (73 works of pre-1800 classical poets, Nannaya onward — the scan
    # Index year admits only pre-1800 WORKS, whatever the print year), so
    # the whole source IS the kāvya language: te:cls (Classical Telugu,
    # the registry's 2026-10-22 stage). The override states the collection
    # fact the per-document print year cannot (an 1870 edition of Nannaya
    # is still Classical Telugu). Transcription of the cone's own
    # admission rule — parse-time work, the 2026-10-18 generalization.
    tel: { lect: "te:cls", tier: certain }
    te: { lect: "te:cls", tier: certain }
  tipitaka-lk:
    # The surface-script claim (the D60-b ~script axis, the itant ~latn
    # shape): tipitaka.lk holds its Pali (the Buddha Jayanti canon and the
    # CST commentaries) in SINHALA letters, the BJT's own print convention
    # (the pali.entries text is Sinhala-block bytes), unlike the library's
    # romanized Pali. The registry's sinh row (2026-10-27) makes the claim
    # expressible; no stage is claimed (the canon spans its whole
    # redaction history). The si translation siblings stay bare si:
    # Sinhala in Sinhala script is the language's own default.
    pli: { lect: "pli~sinh", tier: certain }
  lexicon-itant:
    # Upstream tags its Pre-Samnite and Capenate lexicons snt and xca —
    # both UNASSIGNED in ISO 639-3 (xca's nearest assigned neighbour,
    # Chorasmian, is xco). The registry deliberately does not adopt
    # unassigned codes (the no-squatting rule); the 2026-10-30 Italic
    # minor-languages mint carries them as local-use anchors instead.
    # These rows transcribe upstream's own language naming onto those
    # nodes — parse-time work, the 2026-10-18 generalization.
    snt: { lect: "qps", tier: certain }
    xca: { lect: "qcp", tier: certain }
  fsv-lexica:
    # Söderwall's Ordbok öfver svenska medeltids-språket (+ its
    # supplement) and Schlyter's glossary to the medieval laws are by
    # title and scope dictionaries of medieval Swedish — the registry's
    # sv:old stage (nabu-lects PR #4, the node the held fornsvenska
    # corpus resolves to). The shelves store sv (the held text's own
    # tag) so the dictionary-language filter meets fornsvenska; this row
    # transcribes the books' own definition onto the existing node.
    sv: { lect: "sv:old", tier: certain }
  wiktionary-gmq-osw:
    # Wiktionary's Old Swedish (gmq-osw, no ISO code; the codemap's own
    # gmq-osw → sv:old row) stored under the held fornsvenska tag sv so
    # the dictionary-language filter meets the text; this row restores
    # the stage the upstream code names.
    sv: { lect: "sv:old", tier: certain }
  elizabeth-bible:
    # The Elizabeth Bible IS the text the registry's chu:ncs node names
    # as fixing the post-Nikonian Synodal standard ("fixed in the
    # Elizabethan Bible (1751)"); getBible codes the whole edition bare cu
    # (→ chu). This row transcribes that identity onto the existing node —
    # parse-time work, the 2026-10-18 generalization. The held text is a
    # modernized-SPELLING rendering (civil script, no titla, no ѣ/і/ѵ):
    # spelling is an orthographic layer the node deliberately does not
    # diagnose ("a period label, not an orthographic diagnosis"), so the
    # rendering rides document metadata (rendering / orthography), not the
    # lect. Tier certain: one edition, the stage's own founding text.
    chu: { lect: "chu:ncs", tier: certain }
  etcbc-targum:
    # Every text of the ETCBC Targum Corpus IS a Jewish Aramaic targum of
    # the Pentateuch (upstream's own title: "Graph Datasets of the Jewish
    # Aramaic Pentateuch") — the registry's Jewish (Targumic) sociolect of
    # Middle Aramaic, arc:mid/jud, the node the sefaria targum shelves
    # already resolve to (the sefaria-arc-subshelf rule, Onkelos /
    # Jonathan / Jerusalem alike). The adapter codes the whole corpus bare
    # arc (the bhsa/sefaria stance — byte-verbatim pointing); this row
    # transcribes upstream's own self-description onto the existing node —
    # parse-time work, the 2026-10-18 generalization. The finer Palestinian
    # (Neofiti, Fragment and Genizah targums → jpa) vs literary (Onqelos)
    # split is deliberately NOT drawn here: the house targum precedent
    # files Targum Jerusalem under arc:mid/jud too, and re-filing would be
    # a classification change.
    arc: { lect: "arc:mid/jud", tier: certain }
  ppchy:
    # The Penn Parsed Corpus of Historical Yiddish holds its texts
    # ROMANIZED ("more or less according to the YIVO system" — upstream's
    # transliteration note), never in the Hebrew script of the originals:
    # the surface-script claim (the D60-b ~script axis, the papyri
    # egy~latn shape) lands here as yi~latn on the yi anchor the
    # 2026-11-02 registry mint created. No stage is claimed at source
    # grain — the corpus runs 1478–1959 — so date-band inference stages
    # each text onto yi:old/mid/mod from its own sources-page Date, and
    # the ppchy-dialect compose rules refine those stages onto yi/west and
    # yi/east (config/lect_facet_rules.yml). Tier certain: upstream's own
    # statement of its transliteration.
    yi: { lect: "yi~latn", tier: certain }
  typikon-bible:
    # The 1688 Bucharest Bible (Biblia de la București) is the monument
    # the registry's ro:old note names — the Cyrillic church-print literary
    # language, band [1521, 1780] — and the edition is dated 1688, inside
    # the band. The mint's own consumer note prescribes exactly this row:
    # the stage, in the Cyrillic of the print (the ~cyrl surface the
    # adapter's ron-Cyrl tag states). Transcription of the edition's own
    # identity onto the existing node — parse-time work, the 2026-10-18
    # generalization. Tier certain: one dated edition, the stage's own
    # exemplar.
    ron-Cyrl: { lect: "ro:old~cyrl", tier: certain }
    # cs-eliz (owner-ruled admission 2026-11-03): the Elizabeth Bible in
    # its Church Cyrillic print orthography — the text the registry's
    # chu:ncs node names as fixing the post-Nikonian standard ("fixed in
    # the Elizabethan Bible (1751)"), the edition year 1751 inside the
    # stage band [1650, 2100]. The elizabeth-bible row's mold: the adapter
    # tags the edition bare chu (the dump's own language field: cu), and
    # this row transcribes the edition's identity onto the existing node.
    # Tier certain: one edition, the stage's own founding text.
    # (ka-mcxeta needs no row: it is tagged oge, the Old Georgian anchor,
    # by its own title "ძველი ქართულით".)
    chu: { lect: "chu:ncs", tier: certain }
  armepic:
    # The Artsakh inscriptions (1183–1998) are written grabar — the
    # editors' own description: "grabar with Middle Armenian vernacular
    # features" — and the registry's xcl note anticipates exactly this
    # continued learned register ("continued as the learned language to
    # the 19th c."). Ruled 2026-11-04: the corpus pins to xcl; no
    # date-band staging into axm (a carving date does not reclassify a
    # conservative written register). Spot-read at execution: the 1998
    # Berdzor dedication is pure learned grabar (շինեցաք, the զ-
    # accusative, Աստուծոյ/եղբարց genitives, an Armenian-era date); the
    # 1918 stone keeps the grabar memorial formula with vernacular
    # intrusions — the editors' reading holds at corpus grain. Tier
    # certain: the corpus's own editorial definition.
    xcl: { lect: "xcl", tier: certain }
  ponomar:
    # The Ponomar service texts are the Hours of the Russian Synodal
    # service books in their printed Church Cyrillic orthography (titla,
    # accents, psili, ѿ/ꙋ/ѧ/ѣ/ѵ) — the post-Nikonian standard "used since
    # as the liturgical language of the Russian ... Orthodox churches"
    # that the registry's chu:ncs node names, its band [1650, 2100] open
    # at the modern end for exactly this living liturgical use. Upstream
    # files them under the language folder cu (→ chu); this row
    # transcribes the corpus's own identity onto the existing node —
    # parse-time work, the 2026-10-18 generalization. Tier certain: every
    # file is the modern liturgical text, none a pre-reform witness.
    chu: { lect: "chu:ncs", tier: certain }
  glt:
    # The Greek Orthodox service books: the hymnography and euchology are
    # Byzantine liturgical Greek (the liturgies of Basil and Chrysostom,
    # Romanos, Andrew of Crete, John of Damascus, Kosmas, the Studites,
    # Joseph the Hymnographer). The Menaia also carry a few post-Byzantine
    # services written in the same received register (St Nektarios †1920,
    # the Agia Skepi services), so the stage is a corpus-level reading —
    # the perseus-latin shape, tier approximation (render glosses it
    # "probable"; a per-document refinement can sharpen the moderns later).
    grc: { lect: "grc:byz", tier: approximation }
  lasla:
    # The LASLA classical canon, Plautus to the 2nd c. AD — a corpus-level
    # classical-Latin reading, exactly the perseus-latin shape (Plautus/
    # Cato would refine to lat:arch per document if ever wanted). Tier
    # approximation: the corpus spans past the band's core, and the stage
    # is a reading, not the corpus's own definition.
    lat: { lect: "lat:cla", tier: approximation }
