# The inline-entity index roster (Store::EntityIndex → `nabu entity`,
# `nabu show --entities`): the sources whose adapters mine names marked
# INSIDE the passage text into the "entities" passage annotation. The
# builder probes only these slices — a rebuild never scans the whole
# passages table for the layer. A new adapter emitting the layer joins
# this list in the same change.
#
# Census: live catalog, 2026-10-21 (non-withdrawn passages carrying the
# layer · records · the type split, verbatim upstream types).
