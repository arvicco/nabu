  # The Aegean ceramic-phase rows (the Linear B tablet corpus's whole
  # chronology vocabulary — 27 raw labels / 4,019 of 5,932 documents
  # censused in the live catalog 2026-10-19; the trailing "?" folds in
  # the shared normalize). basis `aegean` = the conventional absolute
  # chronology after Warren & Hankey, Aegean Bronze Age Chronology
  # (1989), the standard handbook convention (round conventional
  # bounds, middle-of-road: LM II from the Knossos destruction horizon
  # debate's conventional 1450, LH IIIC's end at the conventional
  # 1070). Compound labels ("X or Y", "X-Y", "X/Y") band as the
  # ENVELOPE of their phases — the upstream cataloguer's uncertainty
  # kept as an honest wide interval (the Neo/Late Babylonian
  # precedent).
  "LM II":                 {band: [-1450, -1400], basis: aegean}
  "LM IIIA1":              {band: [-1400, -1370], basis: aegean}
  "LM IIIA2":              {band: [-1370, -1330], basis: aegean}
  "LM IIIB":               {band: [-1330, -1190], basis: aegean}
  "LM IIIB1":              {band: [-1330, -1260], basis: aegean}
  "LM IIIB2":              {band: [-1260, -1190], basis: aegean}
  "LH IIIA":               {band: [-1410, -1300], basis: aegean}
  "LH IIIA2":              {band: [-1370, -1300], basis: aegean}
  "LH IIIB":               {band: [-1300, -1190], basis: aegean}
  "LH IIIB1":              {band: [-1300, -1230], basis: aegean}
  "LH IIIB2":              {band: [-1230, -1190], basis: aegean}
  "LH IIIC":               {band: [-1190, -1070], basis: aegean}
  "LH IIIC1":              {band: [-1190, -1130], basis: aegean}
  "LM IIIA2 or LM IIIB":   {band: [-1370, -1190], basis: aegean,
                            note: the Knossos main-deposit dating debate, enveloped}
  "LM IIIA1 or LM IIIA2 or LM IIIB": {band: [-1400, -1190], basis: aegean}
  "LM II-LM IIIA1 or LM IIIB": {band: [-1450, -1190], basis: aegean,
                            note: the Room of the Chariot Tablets debate, enveloped}
  "LH IIIB2/LH IIIC":      {band: [-1230, -1070], basis: aegean,
                            note: the Pylos archive horizon, enveloped}
  "LH IIIB1 or LH IIIB2":  {band: [-1300, -1190], basis: aegean}
  "LH IIIB2/LH IIIB1":     {band: [-1300, -1190], basis: aegean, note: upstream order variant}
  "LH IIIA2-LH IIIB":      {band: [-1370, -1190], basis: aegean}
  "LH IIIB2-LH IIIC":      {band: [-1230, -1070], basis: aegean}
  "LH IIIB-LH IIIC":       {band: [-1300, -1070], basis: aegean}
  "LH IIIB or LH IIIC":    {band: [-1300, -1070], basis: aegean}
  "LH IIIA2/LH IIIB1 or LH IIIC": {band: [-1370, -1070], basis: aegean}
  "LH IIIA2-LH IIIC":      {band: [-1370, -1070], basis: aegean}
  # Re-census 2026-10-22 over the held canonical/damos items (5,890):
  # COVERED 27 of 27 raw chronology labels = 4,020 items (LM IIIA2 or
  # LM IIIB 1,252 · LH IIIB2/LH IIIC 981 · LM IIIA1 or LM IIIA2 or LM
  # IIIB 709 · LM II-LM IIIA1 or LM IIIB 417 · LH IIIB2 350 · … the
  # "?"-suffixed forms folding onto their rows); UNCOVERED none; 1,870
  # items carry upstream's "-" (no claim, honestly nil). The live
  # catalog already holds the 4,020 period-class rows — nothing for
  # damos is pending here.
  #
  # The Minoan Middle/Late phases the Linear A corpus (sigla, SigLA)
  # dates by — its whole period vocabulary, census 2026-10-22 over the
  # 802 inscriptions: LM IB 640 · MM IIB 34 · MM IIIB 28 · MM II 19 ·
  # LM IA 18 (+2 "?") · LM I 17 · MM III 5 (+2 "?") · LM I general 2 ·
  # LM II 2 · LM IB-II 2 · MM III-LM IA 1 · MM IIA 1 · MM IIIA 1 ·
  # MH III-LH I 1 = 775 covered; 18 with no period field, 6 empty,
  # "unknown" 2 and "n/a" 1 stay honestly nil (27). Bounds: the
  # CONVENTIONAL (low, Egyptian-synchronism) chronology in the round
  # form the rows above already use — LM II from 1450 — so the phases
  # abut: MM II 1800–1700 (the Old Palace destructions), MM III
  # 1700–1600, LM IA 1600–1500, LM IB 1500–1450 (the LM IB
  # destruction horizon). THE HIGH-VS-LOW DISPUTE: radiocarbon dating
  # of the Thera (Santorini) eruption, late in LM IA, to c. 1600 BC
  # (S. W. Manning, A Test of Time, 1999, and later work) supports a
  # HIGH chronology that raises LM IA to c. 1700–1600 and LM IB into
  # the 16th century; the archaeological/Egyptian synchronisms of the
  # conventional scheme (Warren & Hankey 1989) put the eruption c.
  # 1530–1500. These rows take the CONVENTIONAL span, declared — not
  # an envelope of both, which would double LM IA's width.
  "MM II":                 {band: [-1800, -1700], basis: aegean,
                            note: the Protopalatial MM II phase, unsubphased}
  "MM IIA":                {band: [-1800, -1750], basis: aegean}
  "MM IIB":                {band: [-1750, -1700], basis: aegean,
                            note: the Phaistos palace archive horizon}
  "MM III":                {band: [-1700, -1600], basis: aegean}
  "MM IIIA":               {band: [-1700, -1650], basis: aegean}
  "MM IIIB":               {band: [-1650, -1600], basis: aegean}
  "LM I":                  {band: [-1600, -1450], basis: aegean, note: LM IA and LM IB joined}
  "LM I general":          {band: [-1600, -1450], basis: aegean,
                            note: SigLA's label for an unsubphased LM I}
  "LM IA":                 {band: [-1600, -1500], basis: aegean,
                            note: "the conventional (low) span; the high chronology (Thera
                              radiocarbon) would read c. 1700–1600 — see the block comment"}
  "LM IB":                 {band: [-1500, -1450], basis: aegean,
                            note: the Haghia Triada archive horizon (the bulk of Linear A)}
  "LM IB-II":              {band: [-1500, -1400], basis: aegean, note: the two phases' envelope}
  "MM III-LM IA":          {band: [-1700, -1500], basis: aegean, note: the two phases' envelope}
  "MH III-LH I":           {band: [-1700, -1500], basis: aegean,
                            note: "the mainland (Helladic) pair contemporary with MM III–LM IA —
                              conventional MH III c. 1700–1600, LH I c. 1600–1500"}

  # -- Ancient North Arabian script-tradition spans (basis `ana`; OCIANA's
  # held per-record script field, census 2026-10-19: Safaitic 30,795 ·
  # Hismaic 3,624 · Dadanitic 1,704 · Taymanitic 482 · Mixed Safaitic/
  # Hismaic 46, of 36,794 documents). The deposit dates no inscription;
  # these rows band the TRADITION each record is written in — an
  # attributed era claim (consumers label it precision "era"), never a
  # per-inscription date. Bounds after M. C. A. Macdonald, "Reflections on
  # the linguistic map of pre-Islamic Arabia", Arabian Archaeology and
  # Epigraphy 11 (2000) 28–79 (cited by section below), and OCIANA's own
  # corpus introductions (Oxford 2017 Preliminary Editions:
  # ociana_taymanitic.pdf, ociana_hismaic.pdf, ociana_dadanitic.pdf).
  # Deliberately WITHOUT a row: Thamudic B/C/D (Macdonald's "pending
  # file" — no tradition span to claim), Hasaitic, Dispersed Oasis North
  # Arabian, Dumaitic, and the non-ANA scripts (Greek, Latin, Nabataean,
  # Minaic, South Arabian).
  "Safaitic":              {band: [-100, 400],   basis: ana,
                            note: "Macdonald 2000 § Safaitic — written by nomads 'probably between
                              the first century BC and the fourth century AD'"}
  "Hismaic":               {band: [-100, 400],   basis: ana,
                            note: "OCIANA Hismaic intro — 'very little dating evidence', but the
                              basileophoric Nabataean royal names make the authors contemporary with
                              or later than the Nabataean occupation of southern Jordan; Macdonald
                              2000 § Hismaic calls the two scripts 'perhaps chronologically' close
                              neighbours — the Safaitic envelope, declared coarse"}
  "Taymanitic":            {band: [-800, -400],  basis: ana,
                            note: "Macdonald 2000 § Oasis North Arabian — the ONA script 'by the
                              eighth century BC'; OCIANA Taymanitic intro — the only datable texts
                              name Nabonidus (mid-6th c. BC) and it is unknown whether most graffiti
                              predate or outlast his stay, so the envelope keeps a century past it"}
  "Dadanitic":             {band: [-800, 100],   basis: ana,
                            note: "Macdonald 2000 § Oasis North Arabian — Early Dadanitic is the ONA
                              script (by the eighth century BC); at Dadan Aramaic displaced it only
                              under Nabataean domination (ended AD 106); its phase dating is
                              'anyway uncertain' — a deliberately wide honest envelope"}
  "Mixed Safaitic/Hismaic": {band: [-100, 400],  basis: ana, note: the two traditions' envelope}

  # -- The Digital Corpus of Sanskrit's composition time slots (the
  # dcsTimeSlot of lookup/chapter-info.xml, census 2026-10-19: slot 1 7,150
  # · 2 2,944 · 3 2,334 · 4 2,110 · 5 1,496 · None 17 chapters; asset
  # CC BY 4.0). The corpus names the slots on its own text list
  # (sanskrit-linguistics.org/dcs, corpus page, read 2026-10-19: early ·
  # epic · classical · medieval · late) and describes its span as
  # 500 BCE–1900 CE, but publishes NO per-slot boundary table — so each
  # bound below cites what pins it: basis `hellwig2020` = O. Hellwig,
  # "Dating and Stratifying a Historical Corpus with a Bayesian Mixture
  # Model", LT4HALA 2020, §4.2 (the corpus author's own Vedic priors:
  # Rigvedic 1300–1000 BCE … Sūtra level 600–300 BCE); `dcs` = the
  # corpus's own stated outer span; `indological` = the conventional
  # handbook periodization of post-Vedic Sanskrit literature (the epics
  # c. 400 BCE–400 CE after J. L. Brockington, The Sanskrit Epics, 1998),
  # checked against the texts each slot actually holds. Adjacent slots
  # OVERLAP on purpose: they are attributed envelopes, not a partition.
  # Consumers label rows class "composition", precision "era".
  "DCS time slot 1":       {band: [-1300, -300], basis: hellwig2020,
                            note: "early — the Vedic corpus, Ṛgveda through the Sūtras (Hellwig 2020
                              §4.2 priors); the lower bound predates the corpus's 500 BCE
                              self-description because the Ṛgveda sits in this slot"}
  "DCS time slot 2":       {band: [-500, 400],   basis: indological,
                            note: "epic — Mahābhārata, Rāmāyaṇa, Aṣṭādhyāyī, Arthaśāstra, Manusmṛti,
                              Buddhacarita, Yogasūtra: the corpus's 500 BCE floor through the epics'
                              conventional close"}
  "DCS time slot 3":       {band: [300, 1000],   basis: indological,
                            note: "classical — Kālidāsa, Amarakośa, Harṣacarita, Kāśikāvṛtti,
                              Vācaspati Miśra's works, the major Purāṇas"}
  "DCS time slot 4":       {band: [800, 1500],   basis: indological,
                            note: "medieval — Bhāgavatapurāṇa, Tantrāloka, Kathāsaritsāgara,
                              Gītagovinda, the rasaśāstra compendia, Sarvadarśanasaṃgraha"}
  "DCS time slot 5":       {band: [1400, 1900],  basis: dcs,
                            note: "late — Haṭhayogapradīpikā, Bhāvaprakāśa, Gheraṇḍasaṃhitā,
                              Tarkasaṃgraha; the upper bound is the corpus's own 1900 CE"}
