  "後漢":                  {band: [25, 220],      basis: sinological}    # Eastern Han
  "魏":                    {band: [220, 265],     basis: sinological}    # Cao Wei
  "曹魏":                  {band: [220, 265],     basis: sinological, note: Cao Wei spelled out}
  "蜀":                    {band: [221, 263],     basis: sinological}    # Shu Han
  "吳":                    {band: [222, 280],     basis: sinological}    # Eastern Wu
