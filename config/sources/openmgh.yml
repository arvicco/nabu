                   # unchanged. OWNER QUEUE: `nabu sync openmgh` now
                   # fetches the other 96 volumes too (~20 MB zipped;
                   # EXPECT ~15,000-20,000 new passages, 153 docs total) —
                   # then eyeball counts + 5 random passages, especially
                   # the byte-censused gmh exceptions bsb00000691 (Unrest)
