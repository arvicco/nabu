  # openMGH — Monumenta Germaniae Historica critical editions (MGH + Bayerische
  # Staatsbibliothek, "digital MGH") as per-volume TEI-XML: medieval Latin
  # chronicles, vitae, letters, charters — plus the Dt. Chron. series in Middle
  # High German (gmh; no xml:lang upstream, the adapter's per-series table). A
  # bespoke `openmgh-tei` parser family — the compose bet was REFUTED from the
  # bytes: the body is a bare <pb>/<lb> milestone stream inside one <ab> (zero
  # <p>/<l> reading elements — croala/sarit iterators find nothing), hyphenated
  # words are <w> pairs that re-join across line AND page breaks, and Diplomata
  # volumes are <teiCorpus> roots (one inner <TEI> per charter). Citations:
  # w<k>.p<page> (work ordinal + PRINTED page — how MGH is cited) for
  # Scriptores; c<charternum> (the edition's own charter number, medieval date
  # verbatim in annotations) for Diplomata. LICENSE (page + every volume's
  # in-file grant, read 2026-07-25, verbatim): "The resources are provided
  # under the licence of Creative Commons Attribution 4.0 International
  # (CC BY 4.0). The licence includes the annotations (tags)… The edited
  # medieval texts themselves are free from copyright." Cite
  # www.mgh.de/mgh-digital/openmgh + MGH + BSB → attribution.
