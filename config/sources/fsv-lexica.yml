fsv-lexica:   # P154, 02-sources row 342
  adapter: Nabu::Adapters::FsvLexica
  adopted: "2026-11-02"
  axes: [germanic]
  wired: true   # first sync verified 2026-11-03: 3 dictionary docs / 51,811 entries
  # Språkbanken's three Old Swedish dictionaries (Söderwall 1884–1918,
  # its supplement 1925–1973, Schlyter's law glossary 1877) as three
  # shelves of one source, for the held fornsvenska corpus. Karp LMF
  # (new family spraakbanken-lmf); entry id = the lemgram (shared across
  # the three books), headword = the lemgram baseform (the keyed
  # writtenForm carries head-line noise). CC-BY-4.0 per resource page →
  # attribution. Language sv, lect sv:old via config/lect_overrides.yml.
  sync_policy: manual
