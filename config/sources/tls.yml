tls:
  adapter: Nabu::Adapters::Tls
  adopted: "2026-07-20"
  group: signs  # P68-4: the sign-restore sweep (nabu enable signs && nabu sync signs)
  axes: [sinitic]
  wired: true   # flipped 2026-07-20 (owner order, post-P34 gate: P32+P33 sources on)
                   # GitFetch of tls-kr/tls-data; the P34-4 cone is
                   # concepts/ + words/ + notes/doc + notes/swl, ~441 MB
                   # working tree out of the 4.7 GB repo — an existing
                   # checkout widens its cone on the next sync; CLAUDE.md
                   # checklist §6: bin/nabu sync tls, eyeball nabu define 棄
                   # (six concept blocks incl. ABANDON with urns, sense
                   # attestations resolving into synced kanripo texts) and
                   # define DIE (definition + criteria + member words),
                   # then flip). Expect 3,018 och entries on tls-concepts +
                   # 20,163 on tls-words (2 skip-by-rule strays censused:
                   # the percent-encoded CRONY-uuid duplicate, the
                   # empty-orth superEntry aggregate) + ~189K attestation
                   # citations on attested words.
  # Thesaurus Linguae Sericae (Harbsmeier) — the first ONOMASIOLOGICAL
  # shelf: concepts (definition + synonym-group criteria + hypernymy/
  # taxonymy/antonymy/see pointer urns + member words inverted from the
  # words side) and words (superEntry grain, every entry block naming its
  # concept + urn, pinyin/OC/MC readings, sense uuids verbatim — joined
  # since P34-4 by the attestation crosswalk: notes/doc + notes/swl
  # tls:ann rows (191,484 censused 2026-07-20) mint dictionary_citations
  # per (sense, seg) pair; KR-shaped text ids resolve into synced kanripo
  # texts at page or document grain AT QUERY TIME, so coverage grows as
  # kanripo waves land; 02-sources row 106 records the census).
  # CC BY-SA 4.0 (LICENSE.md, sha256-identical in tls-texts + tls-data;
  # both README badges say CC BY 4.0 — recorded discrepancy, LICENSE
  # governs). Upstream is a live eXist-db working repo → manual.
  sync_policy: manual
