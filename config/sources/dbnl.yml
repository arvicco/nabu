dbnl:   # P165, 02-sources row 399
  adapter: Nabu::Adapters::Dbnl
  adopted: "2026-11-08"
  axes: [germanic]
  wired: true   # FIRST SYNC VERIFIED 2026-11-08, exact: 3,653 docs / 950,870 passages, 1 quarantined (the known upstream defect), searchable
  sync_policy: manual   # one 692 MB zip, regenerated by DBNL at irregular intervals
  # DBNL (Digitale Bibliotheek voor de Nederlandse Letteren, KB): the
  # public-domain collection — hand-corrected transcriptions of Dutch and
  # Flemish literature and language, Middle Ages to 1899. ONE GET of the
  # offered xml_pd.zip (3,654 TEI.2 titles, 2.0 GB extracted) + the
  # titels_pd.csv register — never a per-title page (robots Disallow: /,
  # the terms forbid bulk per-title download). PD "voor elk doel" →
  # attribution (credit DBNL/KB; the KB's database right on the whole).
  # Document = title, passage = printed page (folio for manuscripts; div
  # for the 21 pb-less titles). Dated from the register (edition years
  # classed "edition"); lect nld/dum/lat/fra… from the header langUsage.
