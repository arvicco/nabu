ebible-pacific:   # P154, 02-sources row 336
  adapter: Nabu::Adapters::EbiblePacific
  adopted: "2026-11-02"
  axes: [biblical, pacific]   # pacific joined 2026-11-21 when the desk was minted
                              # with niupepa — the mission Bibles are the desk's
                              # own persona line
  wired: true   # first sync verified 2026-11-03: 100 docs / 48,762 passages, 15 rule skips
  # eBible.org's public-domain Pacific Bibles as USFM (the usfm family):
  # Hawaiian 1868 revision (haw), the ABS Chamorro Gospels/Acts/Psalms
  # (cha, sword cha1908), the Pohnpeian NT + Psalms in the old alphabet
  # (pon, sword pon1922). One document per (translation, book). kos is
  # refused: its own front matter declares a 1992-onward new translation,
  # not the 1928 print. Each copyright.htm: "Public Domain" → open.
  sync_policy: manual
