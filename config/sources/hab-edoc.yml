hab-edoc:   # 02-sources row 442
  adapter: Nabu::Adapters::HabEdoc
  adopted: "2026-11-27"
  axes: [germanic, romance]
  wired: true    # verified 2026-11-27: 1,050 documents / 37,229 passages, 319 skipped by rule, 0 errored
                 # (the first sync held 472 / 4,972; the per-edition review added 578 the same day)
  sync_policy: manual
  # The Herzog August Bibliothek Wolfenbüttel's digital editions
  # (diglib.hab.de/edoc/): the Editiones Electronicae Guelferbytanae, the
  # Wolfenbütteler Digitale Editionen and the project editions hosted in
  # the Wolfenbütteler Digitale Bibliothek — hand-keyed TEI transcriptions
  # of early modern prints and manuscripts (Hans Sachs 1523, Kaempfer
  # 1712, Lipsius, Orsini, Dasypodius, the Paesi novamente retrovati,
  # Heyden's colloquies in fifteen printings, Sibylla Schwarz 1650, the
  # Lüne convent letters c. 1460–1555 …). Latin, Early New High German,
  # Middle Low German, Italian, French, some Greek.
  # Fetch: the METS id walk (ed000001 upward, no complete upstream list;
  # sitemap.xml stops at ed000229) + every admitted transcript, 1 request
  # per second, file-grain resume; robots.txt leaves /edoc/ open.
  # Licence per transcript: the TEI <licence> (CC BY 4.0 / CC BY-SA 3.0 DE
  # / 4.0 → attribution; CC0 → open), else the edition's METS rights
  # statement (CC BY-SA 3.0), else the site's stated CC BY-SA default.
  # EXPECTED FIRST SYNC (census 2026-11-27): 255 edition METS; 25 editions
  # list 550 transcripts → 472 documents if every listed file is served
  # (3 editions held back = 70 files, 1 listed file 404, 7 part files
  # superseded); skipped by rule: 230 transcript-less editions + 3 held-back
  # editions (70 listed files) + 1 unserved file + 7 superseded parts;
  # page passages ≈ 5,000–10,000 (unmeasured — the transcripts total
  # ≈ 20 MB, estimated from the first file of each edition).
  # PER-EDITION REVIEW (2026-11-27): the editions keeping their texts under
  # their own names reviewed one by one (HabEdoc::EDITIONS) — 12 admitted
  # by a rule (517 own-name texts: Grimmelshausen, Lessing's translations,
  # Serranus, Christian II's diaries, Bahnsen, the Middle Low German
  # psalter, Rist, Hainhofer, Duchess Sibylla, Liber modorum, Tuberinus,
  # Hartlieb) and the FMG letters (ed000249) through their description
  # files' textLang; 18 held back with their reasons (Rubens, the
  # Magdeburg Centuries, Karlstadt, Opitz, the FG letters …). SYNCED
  # 2026-11-27: 578 of the 580 listed texts landed (Lessing's
  # law_ermunterung.xml is listed and not served; Serranus's part_back.xml
  # is a textless shell, held back by rule) → 1,050 documents / 37,229
  # page passages, 319 skipped by rule, 0 errored.
