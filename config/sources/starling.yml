  # StarLing / Tower of Babel package (terms: any use "as long as the
  # source is properly acknowledged" → attribution). THE CONDITION: credit the specific compilers of
  # each base (roster: starlingdb.org/descrip.php?lan=en#bases) — Pokorny:
  # scanned/recognized by George Starostin, corrected by A. Lubotsky; PIET:
  # compiled by S. L. Nikolayev (after Walde-Pokorny), Hitt./Tokh. reflexes
  # by S. Starostin; Vasmer: the project's scan/OCR/database conversion of
  # M. Vasmer's dictionary (roster; vasmer.inf is blank); Germanic + Baltic:
  # compiled by S. Nikolayev, subordinate to the PIE base (.inf DBINFO);
  # Kartvelian (P46-6, the KART.exe second package under the SAME site-wide
  # grant — "all etymological data"): compiled by S. Starostin after
  # G. Klimov and Fähnrich–Sardshveladze (kartet.inf DBINFO + roster item
  # 6) — all carried verbatim in the adapter MANIFEST.license so every
  # serving surface renders them. Upstream is a hand-curated 2005-era
  # package family: re-fetch is an owner decision. The terms cover all
  # remaining DOWNLOADABLE databases, same conditions (any use, per-base
  # attribution wherever displayed).
  sync_policy: manual
  # P42-r1: THE FETCH RIGHT is not conveyed by a public license, so a PUBLIC
  # clone of nabu does NOT carry it — so `nabu sync starling` demands an
  # explicit, recorded acknowledgment before its first fetch (the grant gate,
  # docs/maintenance-and-extension.md §4). This is NOT the same as the CC/nc
  # license machinery above (attribution obligations); the gate criterion is
  # solely "the right to FETCH is not conveyed by a public license."
  grant_required: true
  grant:
    terms: >-
      any use; per-base attribution required (credit each base's compilers
      wherever displayed)
    request_hint: >-
      Contact the StarLing project (starlingdb.org) for a license grant, and
      promise to credit each base's compilers per
      starlingdb.org/descrip.php?lan=en#bases (Pokorny, PIET, Vasmer, Germet,
      Baltet, Kartet) verbatim on every serving surface.
