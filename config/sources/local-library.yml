local-library:
  adapter: Nabu::Adapters::LocalLibrary
  adopted: "2026-07-14"
  kind: shelf   # P39-0: a memory shelf — local fetch, no network, up=local (no sync_policy)
  axes: [local]
  wired: true    # P19-4: wired by DEFAULT — the P19-1 argument verbatim:
                   # the checklist's "wired: false until first real sync"
                   # guards network cost and unverified licenses, and a LOCAL
                   # shelf has neither (no upstream; per-item licenses come
                   # from the owner's own manifests, defaulting
                   # research_private; rebuild replays it regardless of this
                   # flag, and `sync --all` skips non-live policies anyway).
                   # The shelf populates through `bin/nabu ingest FILE...`
                   # (P19-5, the sanctioned front door: copy + categorize +
                   # manifest append + sync), or by hand-creating
                   # canonical/local-library/<collection>/ + manifest.yml
                   # and firing `bin/nabu sync local-library`.
  # The second canonical-memory shelf (architecture §16): PDFs, scans and
  # scholarly articles. Documents + page-grain passages (mutool text layer);
  # scans/images stay metadata-only until the HTR era. license_class
  # research_private by DEFAULT (MCP-excluded, never redistributed) with
  # per-entry manifest overrides; manifests' related: urns feed
  # kind=reference edges into the links journal at every sync.
