titus-khotanese:   # 02-sources row 228
  adapter: Nabu::Adapters::TitusKhotanese
  adopted: "2026-10-10"
  axes: [etym, iranian, buddhist]  # the Eastern Middle Iranian (Saka) stage of the iranian
                         # desk, beside the Skjærvø/IEDC Khotanese shelves; etym because the
                         # Khotanese forms feed the comparative shelves; buddhist (owner ruling
                         # 2026-10-10) because the Book of Zambasta and the KBT sūtras are
                         # Buddhist scripture, the corpus's volume-majority — source-grain axis
                         # membership on the dharma-* / titus-tocharian-a precedent.
  # Grant-gated PRIVATE research material, the titus-avestan posture verbatim
  # (the fetch right is not conveyed by a public license, so not by a clone):
  availability: blocked
  wired: true    # First retrieval + recovery verified 2026-10-10: 1,648 docs / 20,279 passages / 0 quarantines.
  # TITUS Corpus of Khotanese Saka Texts (titus.uni-frankfurt.de/texte/etcs/iran/miran/
  # khot/khotsak/): data entry R.E. Emmerick, corrections (with some text improvements)
  # H. Kumamoto, TITUS version J. Gippert (1998-2000) — on the basis of H.W. Bailey's
  # Buddhist Khotanese Texts (KBT) and Khotanese Texts I-V (KT1-KT5) and R.E. Emmerick's
  # Book of Zambasta: seven books, 1,648 texts, one page per text (khotsNNN.htm,
  # khotNNNN.htm from page 1000). One document per page; one passage per <!Level 5>
  # Line (book.text.folio-side.line — the Zambasta verse joins its unnumbered second
  # line). Language kho throughout; KBT's Sanskrit work titles and manuscript references
  # ride document metadata (a reference's site word mines the findspot, declared coarse).
  sync_policy: manual
  grant_required: true
  grant:
    terms: >-
      the Middle Iranian families on TITUS, to whatever extent TITUS hosts them as
      retrievable text: one retrieval per corpus, local personal research use only,
      no redistribution; TITUS and the editors credited wherever displayed
    request_hint: >-
      Contact TITUS (titus.uni-frankfurt.de) for a license grant, and promise
      to credit TITUS and the editors (data entry R.E. Emmerick, corrections
      H. Kumamoto; the Bailey and Emmerick editions)
      wherever any text is displayed.
