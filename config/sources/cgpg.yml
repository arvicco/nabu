cgpg:   # P153, 02-sources row 320
  adapter: Nabu::Adapters::Cgpg
  adopted: "2026-11-02"
  axes: [classical]
  wired: true   # first sync 2026-11-02 exactly on census (33 docs / 18,701 passages, 0 errored); pg153:p37 eyeballed; FTS συμβασιλεύων green
                 # bin/nabu sync cgpg (one 103 MB Zenodo GET, sha256-pinned;
                 # 718 MB unpacked). EXPECT 33 docs / 18,701 passages,
                 # 0 errored, 0 skipped (census 2026-11-02 through the
                 # adapter over the whole unpack: 6,779,355 tokens, 6,770,076
                 # lemmatized; ~70 s parse). Eyeball nabu show
                 # urn:nabu:cgpg:pg153:p37 (Cantacuzene, "Ὁ τοίνυν βασιλεὺς
                 # οὐτοσὶ Μιχαὴλ") and 5 random pages; probe nabu search
                 # "συμβασιλεύων"; then flip.
                 # WORK GRAIN (2026-11-05): bin/nabu sync cgpg --force (the
                 # PG.zip GET + the carve plan's one GET into carve/, both
                 # sha256-pinned; --force because 22 carved volume docs are
                 # withdrawn for their works, over the 20% breaker). EXPECT
                 # 232 docs (209 works + 12 residua + 11 volumes) / 18,701
                 # passages, 0 errored, 10 skipped by rule (empty residua),
                 # 22 withdrawn; 227/227 incipit checks verified. Eyeball nabu
                 # show urn:nabu:cgpg:photius.amphilochia:pg101:p44 ("Τῆς
                 # σπουδῆς σου τὸ γνήσιον") and urn:nabu:cgpg:pg153:p37.
  sync_policy: manual
  # CGPG — Calfa GREgORI Patrologia Graeca (J.-M. Auwers, UCLouvain;
  # GREgORI; Calfa): the OCR of 33 Migne PG volumes, Greek column only,
  # with automatic lemma + POS, as Sketch Engine verticals (Zenodo
  # 19915273, license field cc-by-4.0 → attribution). The middle/late
  # Byzantine core the library lacked — Photius, Leo VI, Theophanes
  # Continuatus, Constantine VII, Cedrenus/Skylitzes/Psellus, Theophylact,
  # Zonaras, Choniates, Gregoras, Palamas, Cantacuzene, Doukas, Glykas —
  # plus eleven patristic volumes. Document = WORK where open-greek-
  # corpus's carve plan (CC BY 4.0, pinned at tag corpus-2026-10-28.2)
  # carves the volume (22 volumes → 209 works + their residua), VOLUME
  # elsewhere (no work markup upstream); passage = PDF page.
  # Witness overlap, not duplication: PG 67 Socrates/Sozomen and PG 134
  # Zonaras Annales sit beside held First1K editions of other prints.
  # Uncorrected OCR (declared per document) + machine lemmas:
  lemma_tier: silver
