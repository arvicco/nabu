# P89-3
seal:
  adapter: Nabu::Adapters::Seal
  adopted: "2026-08-30"
  axes: [cuneiform]
  wired: true   # first real sync verified 2026-08-31: 408 docs / 14,953 passages / 3 broken-markup quarantines
  sync_policy: manual
  # SEAL — Sources of Early Akkadian Literature (P89-3; seal.huji.ac.il;
  # Michael P. Streck & Nathan Wasserman): the edition of record for
  # third/second-millennium Akkadian literature — 1,065 texts (scout census
  # 2026-08-30). TERMS (no public license): local
  # personal-research use ONLY, CC BY-NC-ND terms — local machine, NO
  # redistribution/mirroring/derivative publication, attribution on display,
  # scholarly reference by the fixed SEAL number + permanent URL, TEXT ONLY
  # (third-party visual material excluded; the crawl never touches images)
  # → license_class research_private. NO corpus bytes in the public repo:
  # fixtures live under gitignored local/fixtures/seal/, the suite skips
  # when absent (the corpus-oudnederlands/freising mold). Identity: urn =
  # urn:nabu:seal:<SEAL no.> — the page's own "SEAL no." field (node ids
  # are NOT SEAL numbers; the node id rides metadata as the permanent URL).
  # FOUR censused transliteration shapes parse (first-sync census
  # 2026-08-30 against all 1,011 fetched pages): the _ts_tb line table,
  # the <p>-per-line paragraph form (labels may carry a witness letter —
  # "A1"), the Word-export score tables (line no. | witness siglum | text;
  # witness rows join their line), and the free-form-prose ordinal
  # fallback (the GRETIL precedent — p1/p2/… refs, FLAGGED in metadata,
  # 30 pages). The English translation rides as document metadata;
  # Vocabulary/Statistics tabs deliberately out of v1. CENSUSED SKIPS, by
  # rule: 89 sister-series pages (DLL/LBPL — the terms name SEAL; held
  # out pending a widened blessing), 474 catalog-only pages (no online
  # transliteration), 37 stubs (pointer/fragment note only); 3 pages with
  # Word-broken markup quarantine honestly. FETCH: ~54 search-page GETs
  # (page count from page 0's own pager; the listing's 1,065 rows hold
  # 1,011 unique texts — upstream's own duplicate genre rows) + node GETs
  # at 1 req/s ≈ 20 min. EXPECTED STEADY PARSE: 408 documents / 14,953
  # passages / 3 quarantined.
