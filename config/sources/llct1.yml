  adapter: Nabu::Adapters::Llct1
  adopted: "2026-11-08"
  axes: [romance]
  wired: true    # FIRST SYNC VERIFIED 2026-11-08, exact: 519 docs / 9,227 passages / 0 errored; staged 519 lat:med
                 # file, sha256-pinned; Zenodo throttles one connection to ~17 kB/s —
                 # the download can take ~40 min; the parse takes seconds). EXPECT 519
                 # docs / 9,227 passages, 0 errored, 0 skipped (census through the
                 # family's span scan + Reader over the whole v1.2 file, 2026-11-08).
                 # Eyeball nabu show urn:nabu:llct1:CDL-208:2936672 ("Et ecce breue
                 # scriptum, quam dictauit Barbenti presbiter …", Monte San Quirico 767),
                 # probe nabu search "breue scriptum quam dictauit", then flip.
