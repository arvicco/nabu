  # LLCT1 — the Late Latin Charter Treebank 1 (Korkiakangas, Helsinki; v1.2):
  # 519 private charters of Lombard and Carolingian Tuscany, 714–869 (Lucca
  # above all), from three editions (CDL Schiaparelli, CDT Brunetti, MED the
  # Lucca Memorie e documenti), LDT-style gold lemma/morphology/dependency
  # annotation on every word, in PML — NEW family aldt-pml. Document =
  # charter (urn:nabu:llct1:<siglum>-<number>), passage = sentence tree.
  # Date, place of issue, scribe, type and original/copy per charter;
  # formulaic/free/subscription segment and abbreviation/damage status per
  # word. NOT the held ud latin-llct (= LLCT2, a disjoint charter set).
  # CC BY 4.0 (Zenodo record license field) → attribution.
