edh:
  adapter: Nabu::Adapters::Edh
  adopted: "2026-07-13"
  axes: [epigraphy]
  # soft edge, not requires: (architecture §5): place.pleiades ids
  # resolve through the pleiades module, which the core chain already
  # carries (nabu-places requires it) — no edge to declare.
  # P84-1: the epigraphy dictionary filter (see edr) — same argument, the
  # provinces' half of the same corpus family.
  lemma_dictionary_filter: true
  wired: true    # owner sign-off 2026-07-13: synced 81,856 docs / 406,281 passages
                   # (27 quarantines pending triage), flipped. Original gate note
                   # (P17-2): awaiting the owner-fired first (and only) sync —
                   # ~220 MB canonical: 9 EpiDoc zips (153.8 MB) + 2 CSVs.
  # Upstream archived: funding closed 2021, staff gone, dumps Last-Modified
  # 2021-12-16 (all HEAD-verified 2026-07-13) — the preservation argument
  # (.docs/surveys/edh-survey.md §1). Frozen = one-shot snapshot, no re-sync.
  sync_policy: frozen
  # P16-4: the trigram fragment index's designed third documentary shelf —
  # the survey's one-config-line promise (~447k lines at 23.8 chars/line,
  # projected +~70 MB; edh-survey §3).
  fuzzy_index: true
  # license_watch candidate (P16-5, owner decision — the CC BY-SA 4.0 grant
  # lives on the /data page, which serves the terms directly):
  # license_watch: https://edh.ub.uni-heidelberg.de/data
