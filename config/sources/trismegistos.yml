trismegistos:
  adapter: Nabu::Adapters::Trismegistos
  adopted: "2026-07-24"
  kind: module   # P43-3: machinery-only — a links instrument, zero catalog rows, up=module
  axes: [epigraphy]
  wired: true    # channel verified (first fetch landed; canonical present). `--all`
                   # participation is governed by kind + sync_policy, NEVER by wired
                   # (owner semantics ruling 2026-08-18, reaffirming 2026-07-24:
                   # wired = the sync link is tested and declared working).
  # P43-3: Trismegistos TexRelations — the cross-project concordance
  # crosswalk (trismegistos.org/dataservices/texrelations/<id>). Makes the
  # library's dangling tm:<id> reference edges resolvable: each response's
  # partner ids (EDH/EDCS/EDR/ISic/DDBDP/HGV/PHI/CPI/… 80+) become kind=
  # reference edges from the tm hub, and where two held sources witness one
  # stone (an isicily record + the edh record its EDH partner names) the
  # TrismegistosCrosswalk producer mints the same-stone internal edge
  # urn:nabu:<held> ↔ urn:nabu:<held>. LICENSE: dataservices page verbatim
  # "open access to our data on a CC BY-SA 4.0 license" → attribution (the
  # house BY-SA class). Fetch is an owner decision (the sweep is thousands
  # of polite sequential requests).
  sync_policy: manual
