  # Datasets, available at https://github.com/Clear-Bible/macula-greek/" →
  # attribution. COLUMN-LEVEL CAVEAT, verbatim: "Word sense data from the
  # United Bible Societies MARBLE project. (`@ln`, `@domain`) Used with
  # permission." — a permission to MACULA, not a CC BY grant onward, so the
  # domain/ln columns are EXCLUDED AT PARSE (pinned by test) and the
  # caveat rides the manifest license string verbatim. Constituents:
  # SBLGNT (CC BY 4.0), Berean Interlinear glosses (public domain since
  # 2023-04-30), Cherith glosses (CC BY 4.0, Andi Wu).
  # PIN: main @ 8423afe4 (2026-07-07); the TSV blob there (542e91a2) was
