ucd:
  adapter: Nabu::Adapters::Ucd
  adopted: "2026-08-28"
  axes: [epigraphy]   # a universal char-identity instrument has no one desk;
                      # the epigraphy desk is the most script-diverse home
                      # (Greek/Latin/Old Italic/ogham/runic/Phoenician…), where
                      # `nabu char` identity questions cluster
  kind: module   # P85: character-identity instrument (names/category/numeric/
                 # decomposition for every code point), zero document rows
  wired: true    # channel verified (first sync landed; canonical present, 40,575
                   # code points at 17.0; card eyeballed 2026-08-28). `--all`
                   # participation is governed by kind + sync_policy, NEVER by
                   # wired (owner semantics ruling 2026-08-18)
  sync_policy: manual
  # P85 (owner ruling: Shape C): UCD core — the universal character-identity
  # backbone of `nabu char`: name, general category, numeric value and
  # canonical decomposition for EVERY Unicode code point, the "any character,
  # any writing system" floor. P86-1 (owner-ruled 2026-08-28, a/b) widened the ingest to the
  # useful-context member set: ONE ZipFetch of UCD.zip on the versioned
  # immutable pin (17.0.0 — Blocks/Scripts/NameAliases/DerivedAge/Jamo/
  # NamesList/radicals/Tangut-Nushu sources ride the same artifact), plus
  # confusables.txt from the security tree's OWN version line (16.0.0 —
  # UTS #39 lags the main release) under canonical/ucd/security/. LICENSE:
  # Unicode License v3 (MIT-style) → open, the Unihan/Unikemet class.
