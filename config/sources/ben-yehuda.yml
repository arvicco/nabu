ben-yehuda:   # 02-sources row 426
  adapter: Nabu::Adapters::BenYehuda
  adopted: "2026-11-18"
  axes: [hebrew]
  wired: true    # first sync verified 2026-11-18, EXACTLY the dump census at the pin:
                 # +6,043 docs / 171,359 passages / 0 errored, 20,412 out-of-band
                 # works skipped by rule, 0 unrecognized (band walk 4 GETs, then the
                 # sparse GitFetch at tag 2026-03). Halevi m2245 + Yannai m34427
                 # eyeballed (nikud verbatim, credit on every hit), search probed
                 # with the pointed Halevi line, ancient band dates ≤ 900 CE.
  sync_policy: manual   # release-pinned; a re-pin to a later release is an owner decision
  # Project Ben-Yehuda's public-domain dump (github.com/projectbenyehuda/
  # public_domain_dump): the volunteer library of Hebrew literature, taken
  # for its PRE-MODERN layer only — the ruled cut: upstream's own period
  # taxonomy's two pre-modern bands, antiquity + piyyut (to 900 CE) and the
  # Middle Ages + Renaissance (900–1700) — about 217 authors / 6,591 works
  # on the site (13 + 202 listed authors on 2026-11-18): Yannai, Qillir,
  # Shmuel HaNagid, Ibn Gabirol, Yehuda Halevi, the Ibn Ezras, Alharizi,
  # Shabazi … Everything else (the modern bulk of 26,455 works) is skipped
  # by rule and counted. The dump has no period field, so the fetch reads
  # the site's keyless author browse by period into periods.json (declared
  # materialization). Document = manifestation (txt/ with nikud, hbo —
  # NFC-exempt, byte-verbatim), passage = upstream's blank-line block (the
  # verse in the Andalusian/piyyut layout). LICENSE: "The data files in this
  # repository are in the public domain" → open; credit "Project Ben-Yehuda
  # volunteers" (requested, not required — carried anyway).
