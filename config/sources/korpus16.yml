korpus16:   # P160-6, 02-sources row 387
  adapter: Nabu::Adapters::Korpus16
  adopted: "2026-11-05"
  axes: [slavic]
  wired: true    # first sync verified 2026-11-06: 45 docs / 12,902 page passages,
                 # 0 errored, 3 front-matter pages skipped by rule (the ~4 h paced crawl)
  sync_policy: manual
  index_policy: inline   # inline because: a one-run corpus (45 books, ~13k page passages) far under the in-place row budget
  # Korpus 16 — the 16th-century Slovene Protestant writers (ZRC SAZU,
  # ed. Kozma Ahačič; fran.si/korpus16, v1.0 2019): 45 books / 12,945
  # pages, 1550–1595 — Trubar, Dalmatin, Krelj, Juričič, Tulščak, Trošt
  # and others. Double-keyed transcription (CyberData India), reviewed
  # against the prints, TEI-converted; evident misprints kept. Colophon:
  # CC BY-SA 4.0 verbatim → attribution. No bulk deposit (the promised
  # CLARIN.SI one never landed; re-checked 2026-11-05) → a paced (1 req/s),
  # resumable crawl of the reading pages, raw HTML kept (~210 MB).
  # Document = book, passage = page with text; forme work and margin
  # notes ride annotations. EXPECTED at the first sync: 45 documents /
  # ≤ 12,945 page passages (blank pages mint nothing), 3 portal pages
  # skipped by rule. Overlaps (provenance, never deduped): mdz-protestant
  # OCR of four prints, sl-wikisource 1584 pages, goo300k/imp DB 1584.
