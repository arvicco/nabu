osbct:   # P154, 02-sources row 337
  adapter: Nabu::Adapters::Osbct
  adopted: "2026-11-02"
  axes: [indic, buddhist]
  wired: true   # first sync verified 2026-11-03: 118 docs / 89,512 passages, 4 rule skips
  sync_policy: frozen   # an immutable Zenodo version; a new release = an owner re-pin
  # The Sixth Buddhist Council Tipiṭaka Unicode corpus (IEBH / BTHAR;
  # Zenodo 23541744 v2.11.0): the Chaṭṭha Saṅgāyana canon WITH its
  # Aṭṭhakathā and Ṭīkā, converted from the Ministry of Religious Affairs,
  # Yangon romanised edition (2008, from the Myanmar edition of 2001) —
  # NOT VRI's CST digital edition (the record says so). Document = volume,
  # passage = paragraph; the printed apparatus (variant readings with
  # sigla, cross-references) rides each paragraph. License: the record's
  # field is cc-by-4.0, but the deposit's LICENSE.md grants CC BY 4.0 over
  # its DERIVED data only; the Pāḷi text it redistributes "on [the
  # edition's] terms" — the Ministry edition's notice permitting
  # duplication "for free, non-commercial distribution" (README: "It is
  # not public domain") → class nc, RATIFIED by owner ruling 2026-11-03
  # (the redistributor's own statement is the best evidence held; the
  # class is reversible if the Ministry notice ever surfaces with
  # broader terms). Unverified: the Ministry's notice itself (the
  # deposit omits the source PDFs) and the edition's rights position;
  # commercial reuse is referred by the deposit to the publisher. Overlap census (adapter header): a witness beside
  # suttacentral and tipitaka-lk, not a duplicate; the Ṭīkā layer is new.
