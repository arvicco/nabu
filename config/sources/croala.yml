croala:
  adapter: Nabu::Adapters::Croala
  adopted: "2026-07-24"
  embed_index: true   # P93-4: the semantic-vector literary core
  axes: [classical, romance]  # D45-a (owner 2026-07-25): the continuum's Latin side
  wired: true    # Owner flip 2026-07-25 (first sync 2026-07-24: 570 docs /
                   # 309,180 passages; eyeballed via
                   # urn:nabu:croala:albert-i-inscr:d1.p1 + random passages —
                   # the P44-i4 string-place crash found and fixed in that
                   # verification). Sparse GitFetch of
                   # github.com/nevenjovanovic/croatiae-auctores-latini-textus
                   # scoped to the cone [txts, LICENSE.md, README.md]: a
                   # blobless no-checkout clone (the DCS/GLAUx recipe),
                   # skipping the schemas/ scripts/ oXygen cruft. One file
                   # ~6 MB — why the parser streams.
  # CroALa — Croatiae auctores Latini (Jovanović, ed.): the TEI P5 edition of
  # Croatian Latin authors, 976 CE onward through the neo-Latin centuries — the
  # classical desk's medieval-Latin edge (lat). A composed `croala-tei` parser
  # (bespoke, sibling to SARIT — the compose-an-existing-family bet was refuted
  # from the bytes: reading text lives in <opener>/<closer> that reading-TEI
  # families drop, and a sparse every-fifth-line @n would corrupt an @n-first
  # citation ladder). Passages at line grain (verse) / prose-block grain,
  # addressed positionally: urn:nabu:croala:<work-id>:<div-path>.<l|p><n>. The
  # teiHeader creation <date>/@notBefore feeds the timeline where present.
  # LICENSE (D44-b): the in-repo LICENSE.md is CC BY 4.0 verbatim ("Attribution
  # 4.0 International"; README: "freely available under a CC-BY license"),
  # resolving the recorded site-vs-GitHub fork to the in-file grant → class
  # attribution. Cite CroALa (croala.ffzg.unizg.hr), doi:10.5281/zenodo.10456561.
  # Living edition (509 → 569 already) → sync_policy manual.
  sync_policy: manual
