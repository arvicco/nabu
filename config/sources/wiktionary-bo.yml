wiktionary-bo:
  adapter: Nabu::Adapters::WiktionaryBo
  adopted: "2026-07-28"
  axes: [tibetan]
  wired: true   # flipped 2026-07-28 (owner ruling "flip them all wired"; first sync verified live: 3,651 entries (exact))
                   # bin/nabu sync wiktionary-bo (one ~4.5 MB JSONL GET),
                   # expect 3,651 entries; eyeball `nabu define
                   # བྱང་ཆུབ་སེམས་དཔའ` and 5 random entries, then flip.
  # English Wiktionary's Tibetan entries via the kaikki.org wiktextract
  # extraction (the wiktionary-cu shape exactly): 3,651 records / 3,394
  # words censused 2026-07-28, stored language bod. The per-language JSONL
  # carries the same DEPRECATION caveat as wiktionary-cu (wiktextract
  # #1178); fallback = filter the full enwiktionary extract by
  # lang_code == "bo". The Classical Tibetan (xct) and Old Tibetan (otb)
  # extracts do NOT exist upstream (404s verified 2026-07-28) — the bo
  # extract is the one kaikki Tibetan artifact. Descendants crosswalk as
  # reflexes (134 bearing records / 307 edges censused). Same CC-BY-SA +
  # GFDL statement → attribution.
  sync_policy: manual
