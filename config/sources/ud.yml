ud:
  adapter: Nabu::Adapters::UniversalDependencies
  adopted: "2026-07-04"
  cjk_index: true   # P93-3: the CJK bigram substring lane
  # P35-0 vs the D35 draft: +celtic (two sga treebanks) +sinitic (two lzh treebanks) — TREEBANKS-verified
  # P43-1: +cuneiform (akk RIAO/PISANDUB) +egyptian (cop Bohairic, egy PC)
  # +hebrew (hbo PTNK) +biblical (Septuagint grc-ptnk, Masoretic hbo-ptnk,
  # Bohairic Gospel of Mark cop) — existing axes that gain a treebank. The
  # four new language lanes xcl/fro/frm/ota have NO existing desk, so they
  # ride axis-less (minting new axes is an owner decision, not this packet's).
  axes: [classical, romance, slavic, germanic, celtic, hittite, indic, sinitic, cuneiform, egyptian, hebrew, biblical, turkic, americas]  # romance: P45-1 (llct/udante Latin continuum + ro-nonstandard + the P43-1 profiterole Old French); turkic: P107-6 (Tonqq); americas: P117-5 (Tupinamba-TuDeT, Guarani-OldTuDeT)
  # P49-r4 audit: THE archetype pack — ~40 treebanks in 18+ languages serving
  # twelve desks, and upstream adds treebanks in any language at all. Whole-
  # grain attribution made `nabu language hbo` claim all twelve desks off
  # three PTNK docs; the count-less surfaces now exclude ud (each desk still
  # gets its languages via the dedicated sources that hold them).
  multilingual: true
  wired: true   # first real sync verified + owner sign-off 2026-07-04
  sync_policy: manual   # treebanks version independently and change rarely
