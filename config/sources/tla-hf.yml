tla-hf:
  adapter: Nabu::Adapters::TlaHf
  adopted: "2026-07-18"
  axes: [egyptian]
  siblings: ["-de"]  # P34-0 (was P28-2 frozen): literal tail — no dataset slug ends in -de
  wired: true # flipped 2026-07-18 (owner order: all pre-P30 sources on, riding the P30 PR)
                   # bin/nabu sync tla-hf — two FileFetch GETs, 7,284,199 B
                   # (demotic, 13,383 sentences) + 1,904,138 B (Late
                   # Egyptian, 3,606 sentences) ≈ 9.2 MB total; then eyeball
                   # urn:nabu:tla-hf:demotic-v18:1 --parallel --lang deu,
                   # a late-egyptian hieroglyphs annotation and 5 random
                   # passages, check `dated/placed` picks up ~16,279
                   # passage-grain axis rows at the next rebuild, then flip).
  # Thesaurus Linguae Aegyptiae — the OFFICIAL Hugging Face org
  # (huggingface.co/thesaurus-linguae-aegyptiae), CC BY-SA 4.0 verbatim on
  # both dataset cards → attribution (the cards' citation is the required
  # attribution; it travels in the adapter manifest). ONE source, two
  # dataset rows (the starling-BASES configuration pattern):
  # tla-demotic-v18-premium — the only bulk demotic artifact anywhere —
  # and tla-late_egyptian-v19-premium (with the Unicode hieroglyph layer).
  # THE TLA'S FRESHNESS CHANNEL: curated sentence-grain extracts of corpus
  # v18 (2023) / v19 (2024), published 2024–2025 — versus the frozen 2018
  # AES snapshot (02-sources row 15); when an AES/AED shelf lands, these
  # rows share its TLA lemma-ID space (the dictionary join). Passages are
  # `egy` with the stage as a document facet (stage: demotic /
  # late-egyptian — the damaskini Norm precedent; the cards' egy-Egyd /
  # egy-Egyp/Egyh are SCRIPT subtags while the stored surface is Latin
  # transliteration, so no subtag is honest). Versioned artifacts: a v20
  # would be a NEW dataset name — re-fetch is an owner decision.
  # Listing census 2026-09-28 (HF api/datasets?author=…): NO v20 — the
  # org still lists exactly three datasets, unchanged since 2025-01-19.
  # P108-7 (2026-09-29): the third dataset INGESTED —
  # tla-Earlier_Egyptian_original-v18-premium, 12,773 sentences (+ the
  # -de sibling), the fresher successor of the 2018 AES snapshot's
  # ground; Unicode hieroglyphs ride annotations as on the siblings.
  # Source total: 6 docs / 59,524 passages.
  sync_policy: manual
  translations: true
  # German translation coverage is 100% (translation is a required field,
  # censused): -de sibling documents ride the same parse,
  # `show --parallel --lang deu` renders them like the damaskini -en pairs.
  # Same CC BY-SA grant (same cards) — no license override.
