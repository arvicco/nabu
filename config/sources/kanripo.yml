kanripo:
  adapter: Nabu::Adapters::Kanripo
  adopted: "2026-07-20"
  cjk_index: true   # P93-3: the CJK bigram substring lane
  axes: [sinitic]
  # Declared edition branches, acquired objects-only beside master
  # (remote-tracking refs; working trees untouched). SBCK = 四部叢刊,
  # the early-editions witness layer — membership is the catalog's own
  # general/sbck.org list; the mint of edition-qualified documents is
  # a future wave.
  edition_refs: [SBCK]
  # soft edge, not requires: (architecture §5): kr-gaiji is the upstream
  # gaiji list behind the committed config/gaiji/kanripo*.tsv tables the
  # reading ladder consults — refreshed by hand, never read at parse or
  # render, so kanripo works without canonical/kr-gaiji.
  wired: true   # flipped 2026-07-20 (owner order, post-P34 gate: P32+P33 sources on)
                   # first many-repo wave (KanripoFetch, architecture §8):
                   # KR-Catalog clone + 3,512 per-text shallow clones
                   # (census 2026-07-20: KR1 719 repos/~204 MB git, KR2
                   # 578/~459 MB, KR3 867/~513 MB, KR4 1,348/~566 MB; 63
                   # of the 3,569 wave ids have no repo → recorded absent).
                   # At the default 2 s pacing the combined wave is ~2 h of
                   # pauses (KR2's share ~20 min) + ~1.7 GB transfer —
                   # resumable: re-running resumes where it died,
                   # refetching nothing. Eyeball 論語
                   # (urn:nabu:kanripo:KR1h0004) juan 1 and 5 random
                   # pages, then flip.
  sync_policy: manual   # ~3.5k-repo waves are owner-fired, never --all
  # P33-0 wave 1 + P33-1 wave 2 (2026-07-20): `classes:` is the
  # ACQUISITION scope, listed in 四部 order — ORDER IS COSMETIC (the wave
  # fetches the sorted union of the classes' catalog ids). Wave 1 = KR1 經
  # classics + KR3 子 masters + KR4 集 belles-lettres (732 + 886 + 1,371
  # = 2,989 catalog ids); wave 2 (P33-1) adds KR2 史 histories: 580
  # catalog ids / 578 repos (~459 MB git — the 二十四史 live here; two ids
  # have NO repo: KR2a0039 清史稿 + KR2d0020 → recorded absent; 4 KR2
  # repos incl. the whole KR2p 出土簡帛 subclass are UN-catalogued →
  # outside the catalog-driven scope, censused in 02-sources row 104).
  # Wave 3 (P37-1, 2026-07-20) adds KR5 道 — the Daozang: 1,663 catalog
  # ids over 10 subclasses / 1,660 repos / only ~84 MB git (949 repos
  # < 15 KB; 4 ids repo-less → recorded absent; ~55 min of pauses at the
  # 2 s knob) — the OWNER-FIRED wave-3 sync is the P37-1 gate step:
  # `bin/nabu sync kanripo` re-pulls nothing already held and adds the
  # KR5 texts; eyeball 度人經 urn:nabu:kanripo:KR5a0001 (witness-page
  # urns :01:001a…) + 5 random KR5 passages. The DZJY witness overlays
  # (`<md:>` base-page milestones + witness `<pb:CK-KZ_…NNpNNNa>`
  # anchors + `@fw` running headers; ~459 overlay files censused via
  # code search) parse since the P37-1 MandokuParser extension: witness
  # pages are the citable structure, base-edition pages ride
  # annotations, anything un-censused quarantines loudly (the census
  # found e.g. KR5a0004's stray front-matter 八 — such texts quarantine
  # by design and surface in the sync report). KR6 Buddhist is EXCLUDED
  # this phase (doctrine call journaled in 02-sources row 104 — CBETA is
  # the scholarly Buddhist shelf).
  # Narrowing classes never withdraws held texts (discover is on-disk-
  # driven); widening is a config-only change. The pacing knob is
  # Nabu::KanripoFetch::DEFAULT_DELAY (2 s between network operations,
  # conservative; the adapter's fetch_delay seam is the override point).
  # License: org-level grant verbatim "Comprehensive collection of
  # premodern Chinese texts. Licensed as CC BY SA 4.0." + ytenx
  # DATA_LICENSE.md corroboration; CONFIRMED by the maintainer in
  # writing 2026-07-20 (C. Wittern: "Yes the idea is to license
  # everything that needs a license as CC BY SA 4.0 … these should
  # inherit the license of the org.") → attribution, SA rider.
  # Upstream watch: Wittern is building "Bunkankun", a Kanripo successor;
  # its catalog component lives at ask.bunkankun.org (journaled — a
  # future catalog/fetch seam candidate, next Sino phase survey).
  classes: [KR1, KR2, KR3, KR4, KR5]
