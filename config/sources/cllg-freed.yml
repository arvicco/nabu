cllg-freed:   # 02-sources row 404
  adapter: Nabu::Adapters::CllgFreed
  adopted: "2026-11-12"
  axes: [classical]
  siblings: cts
  wired: true    # flipped 2026-11-12: first sync verified — 6,290 docs / 1,258,099
                 # passages, 335 skipped by rule (331 no citeStructure + 4 SC_OVERLAP
                 # deferrals), 1 honest quarantine (tlg2021.tlg037: citeStructure
                 # use="n", an upstream typo for @n); 6,626 accounted, residue 0.
                 # Probes green: show tlg0012…:1.1 ("Μῆνιν ἄειδε θεὰ"), search
                 # "Πηληϊάδεω", 5 random passages. The fetch is a blobless SPARSE
                 # clone of data/ + the root catalog + README/CITATION.cff (~1.0 GB
                 # of TEI; the repo's 1.1 GB scripts/out classifier data never
                 # transfers). Full parse ~9.5 min on this box — log + watchdog.
  # The Inria CLLG Freed Corpus: the TLG E canon as citeStructure TEI (the
  # cllg-tei family), Diogenes-derived; CC0 texts / CC-BY structure. Witness
  # overlap, not duplication: ~1,605 works also held in perseus-greek /
  # first1k-greek under their own edition urns (cllg-grc1 vs perseus-grc2 /
  # 1st1K-grc1); ~5,021 works are new. ~225 SC works also sit here in the
  # older TLG edition (cllg-sc carries the Cerf text).
  sync_policy: manual
