oncoj:
  adapter: Nabu::Adapters::Oncoj
  adopted: "2026-07-19"
  axes: [japonic]
  wired: true   # flipped 2026-07-20 (owner order, post-P34 gate: P32+P33 sources on)
                   # GitFetch of github.com/ONCOJ/data pinned to the
                   # "release" TAG (commit fd34a1b2, 2021-12-26; cone
                   # xml/ + lexicon.xml + README ≈ 30 MB) — expect 4,991
                   # docs / ~33,192 line passages; eyeball nabu show
                   # urn:nabu:oncoj:MYS.1.1:0 (kwo mo yo / 篭毛與, the
                   # Man'yōshū opening) and 5 random lines, then flip.
  # P32-2: ONCOJ — the Oxford-NINJAL Corpus of Old Japanese (Frellesvig
  # et al., Oxford–NINJAL): 4,991 lemmatized+parsed poetic texts — the
  # complete Man'yōshū (4,693) + NSK 133 / KK 112 / BS 21 / FK 20 /
  # SNK 8 / JSHT 4 (NB the packet brief's "Senmyō" is NOT in this
  # release — project-site-only). NEW oncoj-xml family: document = text
  # (upstream ids), passage = the corpus's own LINE (lb ids verbatim;
  # two censused duplicate-id files re-mint "-b"); text = the romanized
  # analysis (upstream's own "transliteration" layer, ASCII — no
  # display.yml row), the attested man'yōgana line rides annotations
  # (lb/@corresp, 33,192/33,192 censused), tokens carry pos +
  # log/phon/… script segments + lemma. ojp joins the lemma-indexed
  # languages: w/@lemma ids resolve against lexicon.xml in this cone to
  # the oncoj-lexicon sibling's headwords (measured: 5,792/5,802
  # distinct ids = 99.8%, 125,020/125,043 occurrences = 99.98%); lemma
  # tier stays gold (hand-curated scholarly annotation). LICENSE README
  # §D verbatim: "The corpus annotation (the grammatical analysis) is
  # licensed under the Creative Commons Attribution 4.0 International
  # License." (texts 7th–8th c. PD) → attribution; the §C citation
  # verbatim in the manifest. The release tag is immutable and the
  # project site continues → frozen; re-pin is an owner decision.
  sync_policy: frozen
