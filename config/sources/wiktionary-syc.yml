  adapter: Nabu::Adapters::WiktionarySyc
  adopted: "2026-11-02"
  axes: [syriac]
  wired: true   # first sync verified 2026-11-03: 3,911 entries
  # The kaikki Classical Syriac extraction (3,911 records / "2761 distinct
  # words", census 2026-11-02): the library's first Syriac dictionary:
  # Syriac-script headwords with Akkadian (222), Greek (165), Proto-Semitic
  # (120) and Aramaic (86) etymons, and loans out into Armenian, Arabic and
