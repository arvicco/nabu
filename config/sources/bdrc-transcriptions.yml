bdrc-transcriptions:   # P153, 02-sources row 332
  adapter: Nabu::Adapters::BdrcTranscriptions
  adopted: "2026-11-02"
  axes: [tibetan, buddhist]
  wired: true   # first sync 2026-11-02 exactly on census (1,160 docs / 99,571 passages, 0 errored); VE1ALS00002N eyeballed
                 # then bin/nabu sync bdrc-transcriptions — a PACED rows-API crawl
                 # (~1,000 requests of 100 rows, ~0.3 GB of text, NO images;
                 # the API answers bursts with 429s — the census crawl took ≈75 min,
                 # the paced fetch ≈1.5–2 h; resumable at
                 # the page grain; progress every 2,000 rows). EXPECT berkeley 19
                 # docs / 8,866 passages + palri-parkhang 23 / 11,133 (census
                 # 2026-11-02) + acip-sungbum 1,118 / 79,572 (census, = the card) = 1,160
                 # docs / 99,571 passages, 6 card files skipped by rule. Eyeball
                 # nabu show urn:nabu:bdrc-transcriptions:palri-parkhang:VE1605_MA:16050001
                 # (the Chos 'byung bstan pa'i nyi ma title page) and 5 random,
                 # probe nabu search with ཆོས་འབྱུང་བསྟན་པའི་ཉི་མ, then flip.
  # BDRC's CC0 Tibetan page-aligned transcription releases on Hugging
  # Face (ACIP Sungbum via the Asian Legacy Library; Palri Parkhang;
  # UC Berkeley), TEXT columns only through Nabu::HfRowsFetch — the 17.5 GB
  # of embedded page images are never requested. Document = etext volume
  # (VE…), passage = page (scan-file stem). Cards: "License: CC0-1.0 …
  # Attribution requested (not required)" (verified 2026-11-02) → open.
  # Revision-pinned releases that may still move (the cards carry a DRAFT
  # marker) → manual.
  sync_policy: manual
