statutes-realm:   # P160-7, 02-sources row 388
  adapter: Nabu::Adapters::StatutesRealm
  adopted: "2026-11-05"
  axes: [germanic]
  wired: true    # first sync verified 2026-11-06: 661 docs (656 acts + 5 vol. 7
                 # private-acts schedules) / 8,053 passages, 0 errored; skipped by
                 # rule 9 TOC sidecars + 62 rejected rows (53 index letters, 5
                 # front matter, 4 engravings) — the 723 live TOC rows exactly.
                 # The crawl's one quarantine (vol5/pp421-422, page-anchored
                 # heads colliding on :s0) was a parser defect, fixed + re-parsed
                 # same day; eyeball (vol5:p1a:s1 "FORASMUCH as there is nothing
                 # more acceptable to God") + search "Bearebaiting" pass.
  sync_policy: manual   # an HTML crawl with no revision stamps
  # Statutes of the Realm vols 5–7 (1625–1701), John Raithby's Record
  # Commission edition (1819–1820) on British History Online (IHR,
  # University of London), double-rekeyed. Every page states "This free
  # content was digitised by double rekeying. Public Domain." — overriding,
  # for this series only, the site Terms of use ("Unless otherwise stated …
  # non-commercial") → open (first-hand 2026-11-05; the conflict recorded in
  # the adapter class comment). Vols 1–4 are not on BHO (404). Paced HTML
  # crawl of the three volume TOCs (100 rows/page, rel=next) + the act
  # pages. Document = act (and vol. 7's private-acts schedules); passage =
  # the act's section. Dating: the title's reign + session label, met with
  # vol. 7's Rot. Parl. regnal citation. Overlap: eebo-tcp's contemporary
  # printed statute collections are a different edition — both kept.
