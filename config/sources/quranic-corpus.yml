quranic-corpus:   # 02-sources row 445
  adapter: Nabu::Adapters::QuranicCorpus
  adopted: "2026-11-27"
  axes: [arabic]
  wired: false   # until the first real sync lands 114 docs / 6,236 passages / 128,219 tokens
  # The Quranic Arabic Corpus morphology, version 0.4 (Kais Dukes, University
  # of Leeds; corpus.quran.com): the whole Quran segment by segment in
  # Buckwalter transliteration, each segment with its tag, lemma, root and
  # feature string. One ASCII TSV (6.3 MB) raw-fetched from the q-ran/quran
  # mirror at the pinned commit 8abbbb2, sha256-pinned (the corpus's own
  # download is form-gated). License: the file's GPL-labelled terms forbid
  # any change and the forms render the Tanzil text under CC BY-ND 3.0 →
  # class research_private. One document per sura, one passage per verse.
  sync_policy: manual
