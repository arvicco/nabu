runesdb:   # P153, 02-sources row 325
  adapter: Nabu::Adapters::Runesdb
  adopted: "2026-11-02"
  axes: [germanic, epigraphy]
  wired: true   # first sync 2026-11-02 exactly on census (613 docs / 1,611 passages, 0 errored, 110 rule skips); Aarhus stone 1100 eyeballed; FTS þigsla green
                 # 9.8 MB zip off Zenodo (runes_tei.zip, record 21788307),
                 # parse ≈ 2 s. EXPECT 613 docs / 1,611 passages, 0 errored,
                 # 110 skipped by rule (untransliterated finds) — census of
                 # the v1.0.0 zip 2026-11-02 (613 + 110 = the zip's 723
                 # files). Eyeball nabu show urn:nabu:runesdb:629 (Hackness,
                 # "?rmcd"), urn:nabu:runesdb:1100 (Aarhus stone 1, "ʀ:þigsla:")
                 # and 5 random; probe nabu search "þigsla"; then flip.
  # RuneS-DB — the runic inscription database of the Göttingen Academy
  # project "Runic writing in the Germanic languages" (RuneS), Zenodo
  # deposit v1.0.0 (2026-08-01): one TEI file per find (Scandinavian,
  # continental, Anglo-Saxon and Frisian epigraphy + runica manuscripta),
  # passage = a glyph sequence, text = the glyph transliterations verbatim.
  # Language gem (no claim in the TEI; the runesdb-siglum lect rule reads
  # the siglum family). P160: fetch also harvests the per-find LIDO
  # records (runesdb.de/lido/<id> → lido/<id>.xml — 613 GETs paced 1 s,
  # ≈ 11 min first time, resumable, never re-fetched once on disk): the
  # Production dating, the find place + coordinates, object type / find
  # context / material facets, the editorial transcription, and the
  # English translation (-en siblings, below). LICENSE: the record's
  # cc-by-sa-4.0 + every file's availability statement (verified
  # 2026-11-02); every LIDO record's recordRights "CC BY-SA 4.0 -
  # Attribution-ShareAlike 4.0 International" (verified 2026-11-05) →
  # attribution. Overlap with rundata (the Scandinavian stones) is a
  # catalog-side crosswalk via the siglum (the LIDO sigla list carries
  # the DR/KJ numbers), never a dedupe. Frozen versioned deposit → manual.
  sync_policy: manual
  translations: true   # P160: the LIDO English translation as a -en sibling per find
