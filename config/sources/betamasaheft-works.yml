  # per-document in-file <licence> CC BY-SA 4.0 grant governs (6,545 of 6,548
  # files) -> attribution; the betamasaheft.eu WEBSITE blankets its pages
  # CC BY-NC-SA — a recorded discrepancy, the site statement does not govern
