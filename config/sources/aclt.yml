aclt:   # P110-2
  adapter: Nabu::Adapters::Aclt
  adopted: "2026-09-30"
  axes: [hittite]
  wired: true    # first sync verified 2026-09-30: 266 docs / 2,682 clause
                   # passages, 1 tombstone skip-by-rule — exactly at census;
                   # 4 random cards eyeballed (gloss/lemmas/signs/line layers
                   # all live, e.g. porsuk:s4)
  sync_policy: manual
  # The Annotated Corpus of Luwian Texts (Yakubovich's edition; the
  # Tsakorpus per-inscription JSON, delivered directly — a ManualDrop
  # source, docs/manual/aclt.md). 267 inscriptions / one tombstone
  # skip-by-rule; language hlu (the hieroglyphic tradition only).
  # research_private: no public license, not redistributable — excluded
  # from every public surface like the class demands.
  grant_required: true
  grant:
    terms: >-
      one delivery of the corpus, local personal research use only, no
      redistribution; the corpus and Yakubovich's editorship credited as
      provenance on every text, the Tsakorpus platform named as the technical
      channel
    request_hint: >-
      Contact the ACLT team (luwian.web-corpora.net) for a license grant; promise
      per-text corpus + editorship credit.
