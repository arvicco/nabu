dprr:   # 02-sources row 310
  adapter: Nabu::Adapters::Dprr
  adopted: "2026-10-27"
  kind: module   # person authority — zero document rows, the cbdb shape
  axes: [classical]
  wired: true   # first sync 2026-11-17 exactly on census: 4,876 persons in
                 # the person-index slice (authority dprr), both SPARQL
                 # answers landed verbatim (persons.json + dates.json,
                 # fetch 4.8 s); rows eyeballed (L. Iunius Brutus with the
                 # exact-year [-540, -509] envelope; entity-URI refs)
  sync_policy: manual
  # DPRR — Digital Prosopography of the Roman Republic (King's College
  # London; Mouritsen, Robb, Bradley): the Republican elite from
  # Broughton/Rüpke/Zmeskal. No bulk file: fetch sends two SELECTs to the
  # public SPARQL endpoint (romanrepublic.ac.uk/rdf/endpoint/) and lands
  # the sparql-results+json answers verbatim. LICENSE: CC BY-NC 4.0 — the
  # RDF documentation footer and every RDF serialization's header
  # verbatim, read on the live site 2026-10-27 → nc. EXPECTED FIRST SYNC
  # (~4 MB, seconds): 4,876 persons (ids 1–5,684 with gaps) + 1,917 date
  # assertions → a 4,876-row "dprr" person-index slice.
