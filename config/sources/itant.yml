itant:
  adapter: Nabu::Adapters::Itant
  adopted: "2026-07-18"
  axes: [epigraphy, italic]
  siblings: ["-(eng|ita|dipl)"]  # P34-0 (was P29-2/P30 frozen): the closed minted-tail set — stems end in digits
  wired: true # flipped 2026-07-18 (owner order: all pre-P30 sources on, riding the P30 PR)
                   # §6 — bin/nabu sync itant [git clone, ~10 MB], eyeball
                   # nabu show urn:nabu:itant:oscan-2 (the Monte Vairano
                   # curse tablet, pakis: heleviis. trebieís) beside its
                   # -ita/-eng siblings, urn:nabu:itant:lepontic-1 beside
                   # -dipl, and 5 random records, then flip). Expect 1,160
                   # docs (dry-run censused on the full clone, 0 quarantines):
                   # 500 interpretative + 9 -dipl + 641 translation siblings
                   # (320 ita + 321 eng) + 10 metadata-only lost inscriptions.
  # Corpus ItAnt (DigItAnt, PRIN 2017 CNR-ILC/UniFI; cite Murano et al.,
  # JOCCH 16.3 (2023), 10.1145/3606703): 501 Oscan + 9 Lepontic EpiDoc
  # records (2026-07-18 census). CC BY-NC-SA 4.0 in README + license.txt +
  # every record's <licence> → nc (never redistributed). Second witness
  # beside CEIPoM's Oscan — deliberately unmerged, meeting at the shared
  # tm: reference edges. RE-SYNC WATCH (journaled): the Venetic_/Faliscan_
  # dirs are README-only ("available once the revision process is
  # completed") — a later owner-fired sync picks them up; nothing promised.
  # Lexicon_ItAnt (the OntoLex-lemon TTL sibling repo) ships as its own
  # dictionary source, lexicon-itant (02-sources row 315).
  sync_policy: manual
  # P29-2: ita + eng translation divs ride as -ita/-eng sibling documents
  # where records carry prose (336 each upstream; the parser's own census
  # decides, the riig -fr pattern). The eng divs' in-div CC BY-SA ref is
  # recorded in the fixture README; siblings keep the source-level nc.
  translations: true
