osl:
  adapter: Nabu::Adapters::Osl
  adopted: "2026-07-29"
  group: signs  # P68-4: the sign-restore sweep (nabu enable signs && nabu sync signs)
  kind: module   # P53-1: machinery-only — a cuneiform sign/value/codepoint instrument, zero document rows
  axes: [cuneiform]
  wired: true    # channel verified (first fetch landed; canonical present). `--all`
                   # participation is governed by kind + sync_policy, NEVER by wired
                   # (owner semantics ruling 2026-08-18, reaffirming 2026-07-24:
                   # wired = the sync link is tested and declared working).
  # P53-1: OSL — the Oracc Sign List (ex-OGSL; Veldhuis & Tinney; rolling
  # master, no tags, stable @oid ids). The ONE machine artifact is
  # 00lib/osl.asl (line-oriented ASL grammar; census 2026-07-29: 3,241
  # active @sign + 62 deprecated, 1,216 @form variants, 11,238 @v values,
  # 2,033 @useq component sequences, 124 @upua private-use; ~661 signs have
  # NO Unicode encoding — that absence is data). TRAP, do not "fix": the
  # repo's sl.json serves a ZERO-BYTE 200 on every host (the same Oracc
  # failure class as their metadata.json, see docs/02-sources.md) — never
  # build on it; osl.asl is the artifact. LICENSE: CC0, stated verbatim in
  # the osl.asl header ("CC0: osl.asl and its associated files are placed
  # in the public domain under a CC0 licence.", quoted in the adapter
  # manifest) → class open.
  sync_policy: manual
