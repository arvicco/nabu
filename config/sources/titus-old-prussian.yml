titus-old-prussian:   # 02-sources row 402
  adapter: Nabu::Adapters::TitusOldPrussian
  adopted: "2026-11-12"
  axes: [etym, baltic, slavic]  # the West Baltic member of the baltic desk (the Balto-Slavic
                                # lineage dual-tag, the senie ruling); etym because the
                                # Elbing/Grunau vocabularies and catechism forms feed the
                                # comparative shelves.
  # Grant-gated PRIVATE research material, the titus-avestan posture verbatim
  # (the fetch right is not conveyed by a public license, so not by a clone):
  availability: blocked
  wired: true    # flipped 2026-11-12: the one-time granted retrieval verified —
                 # 34 docs / 2,704 passages (all 40 pages parse: 34 documents +
                 # 6 skipped by rule, 0 quarantined after the five fragment pages
                 # were classified into the content model). Probes green: show a
                 # Lib.Bapt. line, search "Noūson" (fold-aware hits across three
                 # catechisms incl. a fragment page), 5 random passages.
  # TITUS Old Prussian Corpus (titus.uni-frankfurt.de/texte/etcs/balt/apreuss/apreuss/):
  # the complete Old Prussian record in a diplomatic edition after V. Mažiulis, Prūsų
  # kalbos paminklai (Vilnius 1966/1981), data entry W. Euler (München 1997-1998), TITUS
  # version J. Gippert — Catechisms I and II (1545), the Enchiridion (1561), the Elbing
  # Vocabulary and Simon Grunau's vocabulary, the minor fragments. 40 text pages
  # (apreu001…apreu040; the frameset index's offsets, censused 2026-11-12). One document
  # per page carrying an Old Prussian lane (notes pages and German-only front matter skip
  # by rule); passages at the printed LINE (the h6 "Line" anchors, urn tail verbatim),
  # the German lane riding as the `german` annotation. Language prg throughout.
  # EXPECTED FIRST SYNC: 40 pages, crawl ≈ 2 min at the polite 2s pace (~2.5 MB).
  sync_policy: manual
  grant_required: true
  grant:
    terms: >-
      the TITUS family terms: one retrieval per corpus, local personal research use
      only, no redistribution; TITUS and the editors credited wherever displayed
    request_hint: >-
      Contact TITUS (titus.uni-frankfurt.de) for a license grant, and promise
      to credit TITUS and the editors (data entry W. Euler, after V. Mažiulis's edition)
      wherever any text is displayed.
