mdz-protestant:   # 02-sources row 243
  adapter: Nabu::Adapters::MdzProtestant
  adopted: "2026-10-11"
  axes: [slavic]
  wired: true    # Both crawl passes verified 2026-10-11: 6 docs complete / 1,54x page passages.
  sync_policy: manual
  index_policy: inline   # inline because: six prints, ~1.5k page passages complete — a slice never nears the in-place row budget
  # MDZ (Bayerische Staatsbibliothek) page OCR of six 16th-century
  # Slovene/Croatian Protestant prints — Trubar 1562, Dalmatin 1575,
  # the 1584 Wittenberg catechism/hymnal + prayer book, Bohorič 1584,
  # the Croatian Spovid 1564: IIIF manifests + per-page hOCR, a paced
  # resumable crawl (the API is rate limited; 1,551 pages = two syncs).
  # Public Domain Mark → open; the two NoC-NC Google copies ride as
  # per-document nc. OCR LAYER, NOT AN EDITION (text_nature
  # machine-ocr). The Urach Glagolitic/Cyrillic prints are out (OCR
  # noise), Megiser 1592 out (a four-language dictionary), declared.
