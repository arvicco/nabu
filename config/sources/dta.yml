  # 5,481 TEI/P5 (DTA-Basisformat) texts, 1473–1969 (Kernkorpus 1,478
  # balanced works 1600–1899 + Ergänzungstexte incl. newspapers). One
  # dated public komplett zip (606,937,636 bytes, 2026-02-10 cut;
  # Last-Modified served — conditional GET applies; a corpus growth cut
  # is a deliberate ZIP_URL bump). CC BY-SA 4.0 (nutzungsbedingungen
  # page), class attribution. Page-grain passages, orthography AS
  # PRINTED (sic/abbr halves; DTA's corr/expan normalization layers are
  # deliberately not ingested v1 — corrections are enrichments).
