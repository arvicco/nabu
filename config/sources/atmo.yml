atmo:   # P107-4
  adapter: Nabu::Adapters::Atmo
  adopted: "2026-09-28"
  kind: source
  axes: [turkic]
  wired: true   # first sync verified 2026-09-28 (15 published transcripts / 4,934 lines; commented-out index entries censused)
  sync_policy: manual
  # P107-4: ATMO — Annotated Turki Manuscripts from the Jarring
  # Collection Online (uyghur.linguistics.indiana.edu; Kansas/Indiana +
  # Lund UB): 18 line-by-line TEI P5 transcripts of 18th-20th c.
  # Eastern Turki manuscripts — the Chagatai-lane opener. Per line:
  # Perso-Arabic atmo:lit (served text) + atmo:lat transliteration
  # (annotation); zones (main vs endorsement/marginalia) annotated per
  # passage; facsimile-only XMLs stay upstream by design. Language chg,
  # declared honest-coarse ("Turki" = late Chagatai / early modern
  # Uyghur; a finer node is a future registry call). CC BY-SA 4.0
  # verbatim on the project's licensing page.
