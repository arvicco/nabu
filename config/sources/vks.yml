vks:
  adapter: Nabu::Adapters::Vks
  adopted: "2026-10-21"
  axes: [baltic]
  wired: true    # first harvest verified 2026-10-21: 128 docs / 65,311 passages,
                 # 6 baseline quarantines; harvest 5m49s (the pre-flight estimate held)
  sync_policy: manual
  # VKS — Vanhan kirjasuomen korpus, the Corpus of Old Literary Finnish
  # (Kotus; Kielipankki Korp version urn:nbn:fi:lb-201407166): the written
  # Finnish of 1543–1810 — all of Agricola, the 1642 Bible, the hymnals,
  # the realm's laws and decrees in Finnish, sermons, almanacs, Lizelius'
  # newspaper — 4,133,202 tokens / 167,400 sentences / 134 text files in
  # 12 subcorpora. No bulk file exists: Nabu::KorpFetch harvests the
  # anonymous Korp API sentence by sentence (a measured ~5 minutes, a
  # progress line per page). One passage per run of the corpus's own
  # sentence_code (line / verse / paragraph key). EUPL v1.2 (Kielipankki
  # PUB) → class attribution with the share-alike rider (ruled
  # 2026-10-21). A closed historical corpus → sync_policy manual.
