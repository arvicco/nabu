# P48-4: the tibetan-lexica packet — the Tibetan desk opens dictionary-first
# (P47 survey; the axis itself is P48-1's mint). Three dictionary shelves:
# the Mahāvyutpatti crosswalk glossary, the verb tense-stem database, and
# the kaikki bo extract.

derom:   # P56-4, 02-sources row 146
  adapter: Nabu::Adapters::Derom
  adopted: "2026-08-02"
  kind: source
  axes: [romance, etym]   # the Latin→Romance etymological bridge — the romance desk's proto shelf
  wired: true    # first sync owner-verified 2026-08-02 (513 docs -> 233 entries; define lakt-e / etym cheval eyeballed)
                 # CLAUDE.md checklist §6 — eyeball `nabu define lakt-e` +
                 # `nabu etym lapte` / `nabu etym cheval`, then flip)
  # P56-4 (license clarification asked by email 2026-07-25): DÉRom — Dictionnaire Étymologique Roman
  # (dir. Éva Buchi & Wolfgang Schweickard; ATILF, CNRS/Université de
  # Lorraine & Universität des Saarlandes), the reference comparative
  # reconstruction of Proto-Romance, from the openly downloadable Ortolang
  # workspace `derom` (ortolang.fr/market/corpora/derom → the
  # repository.ortolang.fr content API, `latest` root — snapshot 4, market
  # tag v1, published 2025-07-24). CENSUS (2026-08-02, 21 bounded probes):
  # FIVE open collections — DÉRom 1/2/3 full articles (110+40+38), 45
  # renvoi stubs (Mertens 2021 -ura derivatives: gloss + PDF link), 280
  # "potiches en attente" placeholders (<NonRedige/> — parser-skipped);
  # collections 4 (future DÉRom 4) + 7 (English articles) are AUTH-GATED
  # (303 → Keycloak), not crawled. One dictionary (slug derom, language
  # la-vul — Wiktionary's Vulgar-Latin code, already in the catalog's
  # reflex code space; DÉRom's doctrine: Proto-Romance IS spoken Latin;
  # NOT -pro, so the shelf gets the wiktionary-cu treatment: direct reflex
  # edges, no closure ascent, no display asterisk). Entry per etymon
  # article (headword = the phonological notation ˈlakt-e; fold drops
  # stress marks, β→b etc. — upstream's own ASCII filename convention);
  # cognat sets → dictionary_reflexes (idiome verbatim as lang_code, ISO
  # mapping for the join: dacoroum.→ron … port.→por; the joint gal./port.
  # stays display-only). FETCH (DeromFetch, the FOURTH Elephantine/Otdo/
  # Cantigas HTML-crawl sibling — extraction signal flagged again): 5
  # listing GETs + per-article GETs at 1 req/s, file-grain resume,
  # auth-gate/reshape listing defense + non-XML body defense, listed-404
  # fatal (versioned archive — never censused), attic + breaker. LICENSE
  # (P56-4 gate, item metadata verbatim in the fixture): CC BY-NC-SA 4.0
  # ("Licence Creative Commons Attribution - Pas d'Utilisation Commerciale
  # - Partage dans les Mêmes Conditions 4.0 International", status "Free
  # for non commercial use") → class nc: ingestible, NEVER REDISTRIBUTED.
  # EXPECTED FIRST SYNC: 513 documents → ~233 entries (188 full + 45
  # renvoi; 280 potiches skipped), ~3.5–4.5k reflex rows (fixture mean ~22
  # signifiants/article over DÉRom-1's densest slice). Next upstream
  # refresh: September 2026 (per É. Buchi's reply) — a routine manual re-sync.
  sync_policy: manual
