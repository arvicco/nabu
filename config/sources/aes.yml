aes:
  adapter: Nabu::Adapters::Aes
  adopted: "2026-07-18"
  axes: [egyptian]
  siblings: ["-de"]  # P34-0 (was P28-0 frozen): literal tail — text ids are uppercase [A-Z0-9]
  wired: true # flipped 2026-07-18 (owner order: all pre-P30 sources on, riding the P30 PR)
                   # checklist §6): bin/nabu sync aes — a sparse GitFetch of
                   # github.com/simondschweitzer/aes scoped to files/aes +
                   # README.md (the ~342 MB JSON cone; the ~114 MB relANNIS
                   # re-export stays outside the cone). Expect 13,026 docs /
                   # 101,793 passages (+ 12,985 -de siblings / 100,633
                   # German passages) and ≈779k gold lemma tokens. Eyeball
                   # nabu show urn:nabu:aes:tuebingerstelen:3F5KUVWQG5EPBM7GMQ6ZFVO5OQ
                   # --parallel ger + `nabu search --lemma ẖn.w` + 5 random
                   # passages, then flip.
  # AES — Ancient Egyptian Sentences (Schweitzer/TLA-BBAW): 101,796
  # lemmatized sentences / 13,026 texts / 16 subcorpora (Pyramid Texts,
  # Book of the Dead, Amarna, Ramesside letters, medical, sawlit …).
  # License verbatim in the repo README: "All files: CC-BY-SA 4.0" →
  # attribution. lemma_tier ABSENT = gold: TLA lemmatization is
  # editor-verified — the Egyptian gold-lemma mint; token lemma_id carries
  # the AED lemmaID verbatim (P28-1's dictionary joins on it exactly).
  # FRESHNESS: this repo is the FROZEN January-2018 TLA snapshot while TLA
  # itself is at corpus v20 — the official TLA Hugging Face datasets are
  # the freshness channel (P28-2's lane); a re-fetch of this snapshot is an
  # owner decision, not a schedule.
  sync_policy: manual
  # sentence_translation coverage is 98.9% (censused whole at fixture
  # time): -de German sibling documents ride the same parse, aligned on
  # sentence ids — `show --parallel ger` renders verse pairs. Same CC BY-SA
  # grant ("All files") — no license override.
  translations: true
