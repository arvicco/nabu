papyri-ddbdp:
  adapter: Nabu::Adapters::Papyri
  adopted: "2026-07-04"
  axes: [epigraphy]
  wired: true   # P5-1 minting fix + owner sign-off 2026-07-04: 61,347 docs / 920,766 passages; 9,354 quarantines audited honest (text-less stubs)
  # idp.data updates continuously (born-digital editing platform), but a
  # multi-GB clone/re-sync is an owner decision, not a scheduled one.
  # P104-3: the DCLP literary tree of the SAME clone is a second document
  # family of THIS source (urn:nabu:dclp:<dclp-idno>; walk extension, not a
  # sibling row — one upstream repo is one canonical asset; rationale in the
  # adapter header). Lands at the next re-parse: ~2,245 docs / ~179,783
  # passages (grc/lat/cop/egy-Egyd; 12,571 metadata-only stubs skip at
  # discover, 5 defective files quarantine honestly; census 2026-09-26).
  sync_policy: auto   # RE-PROMOTED 2026-10-14: the switchover migration
                      # landed end to end — the dual-root cone (DDbDP/ +
                      # Historical/ fallback) shipped with document-grain URN
                      # stability proven corpus-wide, the owner-fired breakered
                      # merge put canonical on upstream's current head, and the
                      # full re-parse verified (64,115 docs / 1.109M passages,
                      # the DCLP literary family's first landing). The 2026-10-13
                      # demotion's reason (the breaker's catch of the layout
                      # rationalization) is fully resolved; the auto sweep
                      # resumes on the new layout.
  # P16-4: trigram fragment index (search --fuzzy), DOCUMENTARY scope — the
  # owner-approved 250–270 MB line (intertext design §4). Papyrus lines
  # average 34 chars; damaged-fragment search earns its bytes here. Future
  # documentary sources (inscriptions) join by adding this flag, no code.
  fuzzy_index: true
  # The translation siblings: every translation file of the clone
  # (Translations/ — HGV, DDbDP and APIS translations — plus the APIS
  # records upstream has not yet pulled out) as a document
  # <edition urn>-trans-<translation id>, line-cited where the translator
  # marked the edition's lines. Census 2026-10-19: 7,971 Translations
  # files + 254 APIS-only translations (8,225 docs / 15,826 passages) land at the next re-parse
  # (en/de/fr/it dominant); 1,158 APIS records naming no text and the
  # misnamed/duplicate/empty files skip, censused. Rationale and rules in
  # the adapter header and PapyriTranslations.
  translations: true
  # The literal "-trans-" tail is a census claim: no ddb-hybrid or dclp id
  # contains it. The urns live under ddbdp/dclp, not the slug.
  siblings: ["-trans-[0-9A-Za-z.-]+"]
  sibling_namespaces: [ddbdp, dclp]
