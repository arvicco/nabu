africa-pd:   # P124-1, 02-sources row 271
  adapter: Nabu::Adapters::AfricaPd
  adopted: "2026-10-13"
  axes: [africa]
  wired: true    # first sync verified 2026-10-13: 10 docs / 3,536 passages,
                 # 0 errors — exactly the lane census; the Griffith 1913
                 # Nubian Texts card eyeballed (scholarly kind, dated)
  sync_policy: manual
  # The PD African-languages reference shelf as archive.org scans — 10
  # census items: Griffith's Nubian Texts of the Christian Period (1913);
  # Steere's Swahili Tales (1870), Taylor's African Aphorisms (1891),
  # Büttner's Anthologie aus der Suaheli-Litteratur (1894), Velten's Prosa
  # und Poesie der Suaheli (1907); Schön's Magána Hausa (1885), Robinson's
  # Specimens of Hausa Literature (1896); Hanoteau's Tamachek' grammar
  # (1860) and Poésies populaires de la Kabylie (1867); Koelle's Vai
  # grammar (1854). The slavistics-pd mechanics (IaScanShelf, hOCR pair,
  # page grain, UNCORRECTED OCR declared). Language = the prose's (eng 6,
  # deu 1, fra 2) with the African language in "object_language"; only
  # Velten's Swahili reader claims sw. Public domain (authors †1882–1935,
  # prints 1854–1913). EXPECTED FIRST SYNC (census 2026-10-13, every pair
  # fetched and parsed): 10 docs / 3,536 passages, ~2.3 MB.
