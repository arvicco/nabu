corpus-oudfries:
  adapter: Nabu::Adapters::CorpusOudfries
  adopted: "2026-10-27"
  axes: [germanic]
  wired: true    # first sync 2026-10-27: 177 docs / 14,136 passages EXACTLY on
                   # the census (README.txt the 1 skipped-by-rule; 0 errored),
                   # reconciled against upstream's README and the public index
                   # (235,462 tokens); eyeballed R1-K17:1 — the first liodkest
