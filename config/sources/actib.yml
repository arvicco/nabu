actib:
  adapter: Nabu::Adapters::Actib
  adopted: "2026-07-31"
  kind: module   # P55-4: machinery-only — the anchored-layer cone for nabu-data, zero catalog rows, up=module
  axes: [tibetan]
  wired: true    # channel verified (first fetch landed; canonical present). `--all`
                   # participation is governed by kind + sync_policy, NEVER by wired
                   # (owner semantics ruling 2026-08-18, reaffirming 2026-07-24:
                   # wired = the sync link is tested and declared working).
  # P55-4: ACTib v2.0 — The Annotated Corpus of Classical Tibetan (Meelen,
  # Hill & Faggionato), Zenodo record 3951503: word-segmented (seg/) +
  # POS-tagged (pos/) layers over the BDRC eKangyur, 103 volume files each
  # (UT4CZ5369-I1KG<9126+n>; the Esukhia→BDRC tail permutation
  # {100→101,101→102,102→100} is the builder's VOL_PERMUTATION), page/line
  # markers inline (p<N>/ln<N>, <utt> utterance breaks; pos layer =
  # form/tag pairs, seg layer = bare forms). Upstream layers are AUTOMATIC
  # annotation (their own papers say so) — the anchors dataset stays
  # gold-derived about the mapping only, never about the tags. LICENSE:
  # cc-by-4.0 ON THE ZENODO RECORD (API-verified 2026-07-31) → attribution;
  # the zip itself contains NO license files — the record, not in-zip text,
  # is the license basis (recorded honestly). Only the eKangyur SegPOS
  # artifact is taken; the record's other collections are not.
  sync_policy: manual
