iecor:
  adapter: Nabu::Adapters::Iecor
  adopted: "2026-07-14"
  axes: [etym]
  # soft edge, not requires: (architecture §5): the family-glottocode
  # table was verified against cldf-spine's Glottolog dump and lives in
  # the parser — nothing reads canonical/cldf-spine at parse time.
  wired: true    # P18-5: first real sync is OWNER-FIRED (6.4 MB Zenodo zip,
                   # owner sign-off 2026-07-14: synced 4,981 entries / 26k reflex rows, eyeballed, flipped.
                   # sha-pinned; CLAUDE.md checklist §6: bin/nabu sync iecor,
                   # eyeball `nabu etym срьдьцє` / `nabu language chu` for the
                   # iecor note, then flip). Projected: 4,981 entries /
                   # ~26.3k reflex rows (~2.3k loan-flagged) + ~144
                   # language notes accreted into the ledger.
  # IE-CoR (lexibank/iecor v1.2.1, CC BY 4.0; .docs/surveys/pie-survey.md §1): the
  # cognacy-matrix dictionary shelf — one entry per expert-curated cognate
  # set under the collective `ine` tag, members as reflex edges, loans.csv
  # feeding the borrowed flag. The Zenodo versioned record is immutable; a
  # future release is a NEW DOI the owner re-pins (URL + RELEASE_SHA256,
  # the Coptic RELEASE_TAG pattern) before firing a re-sync. Re-pinned
  # 2026-11-13 v1.2 → v1.2.1 (10.5281/zenodo.23183358): catalog-version
  # refresh only — the data tables are byte-identical and the full parse
  # is identical, so the re-sync re-reads and changes nothing.
