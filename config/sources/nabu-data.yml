nabu-data:
  adapter: Nabu::Adapters::NabuData
  adopted: "2026-07-29"
  kind: module   # P51-W6: machinery-only — Nabu's own published datasets consumed back, zero document rows
  axes: [indic, tibetan]
  wired: true    # channel verified (first fetch landed; canonical present). `--all`
                   # participation is governed by kind + sync_policy, NEVER by wired
                   # (owner semantics ruling 2026-08-18, reaffirming 2026-07-24:
                   # wired = the sync link is tested and declared working).
  # P51-W6: the two-way loop closes — github.com/arvicco/nabu-data, the
  # public repo `nabu data build` writes (docs/nabu-data.md: three datasets
  # at v1.0.0 — san/form-lemma 428,825 rows from the held DCS gold,
  # xct/wylie-fold, xct/verb-lemma), registered back as an ordinary source
  # so the publication is consumed exactly like any upstream: the
  # reproducibility loop closed in public. LICENSE: repo LICENSE is the
  # CC BY 4.0 legalcode → attribution; each dataset's datapackage.json
  # carries its own upstream attribution chain (san/form-lemma cites
  # Hellwig's DCS, CC BY 4.0). A new dataset release is a new commit the
  # owner re-syncs (ref-pin optional for a reproducible snapshot).
  sync_policy: manual
