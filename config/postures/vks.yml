        file's envelope on the :structured lane; the collection files (decrees, sermons,
        almanacs) also date each passage by its own element"}
    places: {posture: unplaced, note: "VKS carries no place field (imprint towns stay inside the
        title pages' text)"}
    script: {posture: implied, note: "Latin script; the corpus's word layer is the text (the
        abbreviation completions ride as expansions)"}
