sources:
  # Ruled deliberately unstaged (D57-f): mixed corpora, bare-anchor honesty.
  first1k-greek:
    # Translation editions (translations: true): 43 eng + 24 non-English
    # (lat 16 · deu 7 · cop 1; 3,608 passages, census 2026-10-19), each
    # marked "kind: translation" — no dating/place rows of their own; lat
    # rides identity like the rest of the source (unstaged).
    kind: {posture: pending, note: "candidate: TEI textClass ingestion (unruled)"}
    lect: {posture: identity, note: ruled deliberately unstaged (D57-f)}
    dating: {posture: dated, note: "two labeled classes, neither the edition's own composition
        claim: the sourceDesc imprint year of the printed edition (metadata source_date →
        date_class edition, 1,090 of 1,091 editions) and the TLG concordance lane — 483 grc
        editions join a glaux/diorisis composition envelope by their CTS author.work id
        (axis_source tlg-concordance, date_class composition); the rest stay undated"}
    places: {posture: unplaced, note: "the header names only the PRINTING place (imprint
        pubPlace), never an origin; the EpidocParser inline layer (notes/foreign/quotes
        annotations) carries no place keys at census — first1k bodies tag no placeName"}
    script: {posture: implied}
