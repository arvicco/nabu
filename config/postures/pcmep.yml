sources:
  pcmep:
    # kind machine-postured — the pcmep source_kind row in kind_map.yml (every
    # text is verse: the corpus's own scope).
    # lect machine-postured — the pcmep-period rule in lect_facet_rules.yml
    # (M1a/M1b → enm:m1, M2a/M2b → enm:m2, M3 → enm:m3). Dialect sub-lects
    # stay unminted; the per-text dialect claims live only on the pcmep.net
    # text pages (the places candidate below).
    dating: {posture: dated, note: "every document carries its file-name period band (M1a
        1150–1200 · M1b 1200–1250 · M2a 1250–1300 · M2b 1300–1350 · M3 1350–1420, the
        site's own table — the band of the estimated COMPOSITION date) as metadata date in
        the :structured shape, registered in MetadataDates SHAPES. Declared coarse: the
        site's per-text Suggested date (one year per poem, texts.php) is website-only, not
        in the zip, and is not mined"}
    places: {posture: pending, note: "the zip carries no place field. Candidate: each poem's
        'Dialect of original composition' and 'Manuscript dialect' (with localizations,
        e.g. AssumpVirg's manuscript language 'West Berkshire' after LALME) on the
        pcmep.net per-text pages (textdetails.php) — website-only; the site states no
        reuse terms for its pages beyond its copyright line, so pinning them as a tracked
        table waits on that question"}
    script: {posture: implied}
