sources:
  statutes-realm:   # P160-7
    # kind machine-postured — kind_map.yml source_kind legal/law.
    lect:
      posture: dates
      note: "every document is en (the asset marks no language below the page shell's lang=en)
        and stages by DATE-BAND INFERENCE over the act envelopes, no rule: the 1625–1699
        sessions sit inside en:early [1500, 1700]; the 21 vol. 7 rows of 1700–1702 (12 & 13
        and 13 & 14 Will. III) inside en:late [1700, 1900]; envelopes straddling 1700 (the
        misheaded 1698-9 label) stay honestly bare en. The roll's Latin formulae (the
        private-act schedules' Item quedam Petitiones …) and any Law French ride inside en
        passages, deliberately coarse — the asset does not distinguish them"
    dating:
      posture: dated
      note: "all 661: the act title's reign + session label (Raithby's legal-year heading —
        a single year Y reads [Y, Y+1], a pair its two years; the Long Parliament's 1640
        session [1640, 1642]), met on vol. 7 with the Rot. Parl. regnal citation (William
        III's year N from 13 Feb 1689); disagreement widens to both claims, flagged conflict
        (21 rows) — MetadataDates :structured, StatutesRealmDating. No finer date in the
        asset (no assent day)"
    places: {posture: unplaced, note: "the asset carries no per-act place field. The place
        of enactment is the session's sitting place (Westminster, save the 1625 adjourned
        sitting and the 1665 plague session at Oxford) — a session→place table would be our
        claim, not upstream's, so none is minted; deliberately coarse, declared. Places the
        acts NAME (counties, towns, rivers in the local acts) are text, left to the
        place-mining lane"}
    script: {posture: implied}
