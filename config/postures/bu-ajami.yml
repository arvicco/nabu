sources:
  bu-ajami:   # P124-1
    # kind machine-postured since 2026-10-14 — the genre fold in kind_map
    # (Poetry/Poem onto the poetry sub; the prose and mixed form labels
    # are reviewed non-claims). The pending row retired under the
    # shadowing rule.
    lect: {posture: identity, note: "the Africa package merged + canonical-synced 2026-10-14
        (the add-then-retire shape): the ha / mnk / fuf / wo anchors all live; the bare codes
        are the claim per item (fula = upstream's 'Fuuta Jalon Fula', i.e. Pular fuf, not the
        ff macrolanguage)"}
    dating: {posture: partial, note: "33 of 80 (census 2026-10-13): the source reference's typed year
        (Northwestern's “Title” (1968/9) form) or a date the item page states with its basis —
        witness dates plain, authorship eras ('written by Serigne Moussa Ka (1889-1963)') in the
        composition class; subjects' lifespans and inferred termini never claimed — :structured"}
    places: {posture: named, note: "all 80: the item's Provenance (Touba, Kano, Sedhiou, Labé,
        Dalaba, Ziguinchor, Zaria, …) — the manuscript's provenance, verbatim"}
    script: {posture: qualified, note: "the text is the editors' Latin ROMANIZED transcription of
        Ajami (Arabic-script) originals — metadata text_script says so; manuscript_script keeps
        upstream's script field (Hausa Ajami, Wolof Ajami, …)"}
