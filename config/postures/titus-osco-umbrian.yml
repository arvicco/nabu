sources:
  titus-osco-umbrian:
    kind: {posture: unclassified}
    # P90-2: `osc` and `xum` are both real nabu-lects anchors (xum minted
    # upstream 2026-08-31 and synced to canonical the same day — the
    # pending retired at the gate, the add-then-retire shape within one
    # phase). The language split is the edition's own lane split,
    # deliberately coarse: minor Sabellic dialects (Paelignian, Marsian,
    # …) ride their nearest lane. The single Rechtsdokumente lat doc's
    # stage refinement (lat:arch — "in hoce loucarid" is archaic Latin)
    # is a future override candidate, not a blanket rule.
    lect: {posture: identity, note: osc/xum — the Sabellic pair on the edition's own lane
        split; one lat comparandum rides bare (lat:arch the future override candidate)}
    dating: {posture: undatable}
    places: {posture: unplaced, note: "monument/inscription tokens (POMP-, CUM-, NOLA-, …)
        carry findspot abbreviations verbatim in annotations — a ruled token→place
        table is the future extractor"}
    script: {posture: qualified, note: "per-passage `alphabet` annotation (italic/latin/greek)
        from the edition's original-script lanes; the text lane is the unified Latin
        transliteration (Latn)"}
