sources:
  ms-wikisource:
    kind: {posture: unclassified}
    lect: {posture: identity, note: "msa / msa-Arab resolve through the codemap onto the
        ms anchor (merged + synced 2026-10-12); the Classical Malay stage (ms:cls,
        1300–1900) is the NAMED refinement for the pre-1930 manuscript cone, not
        defaulted — a facet-rule candidate once the cone's registers are censused"}
    dating: {posture: partial, note: "P120-3: the manuscript's stated date — the page
        header year= (a year, a span, or 'abad ke-N' → the century) else the Index
        Year= → MetadataDates :structured; Hijri-marked years mint nothing (never
        converted by guess); the Index Year= mixes copy dates and attributed composition
        dates as upstream states them"}
    places: {posture: unplaced, note: "no place fields on the manuscript pages (Index
        Address= empty across the cone)"}
    script: {posture: mixed, note: "Jawi (Arabic script → msa-Arab) and Rumi pages,
        MEASURED per page from the text (metadata script Arab/Latn/mixed), the Index
        Language= riding verbatim as index_language"}
