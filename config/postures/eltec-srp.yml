sources:
  eltec-srp:   # P117-2
    # kind machine-postured since 2026-10-18 — kind_map.yml source_kind
    # literary/narrative/novel (ELTeC's sampling frame is the novel; the
    # first literary whole-source declaration). The pending row retired
    # under the shadowing rule.
    lect: {posture: identity, note: "srp → the sr anchor (nabu-lects 2026-10-10), declared
        coarse: first editions 1852–1920 straddle Vuk's 1868 orthographic victory — the
        1850s texts keep pre-reform/Slavenoserbian traces (Игњатовић 1859 'историческиј
        роман'); sr carries no stages and none is claimed here"}
    dating: {posture: dated, note: "the firstEdition bibl's typed dates (envelope); one text
        without one falls back to ELTeC's reference year from its id — :structured lane"}
    places: {posture: named, note: "the firstEdition pubPlace (publication place: Београд,
        Нови Сад, Беч, Пешта, Zagreb …) on 85/96 texts; declared coarse"}
    script: {posture: mixed, note: "Cyrillic (94) + Latin (2: Јанковић 1918, Ћоровић 1919) —
        metadata script per document from the root xml:lang"}
