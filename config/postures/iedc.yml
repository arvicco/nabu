sources:
  iedc:   # P107-2
    kind: {posture: unclassified, note: documentType rides the grade/doctype facets — a kind_map
        rule is a natural follow-up, not silent}
    lect: {posture: identity, note: eleven mapped ISO codes (kho/fa/pal/sog/ara/jpr/xbc/heb/san/
        oui/zho); the Central Asia registry wave makes them real anchors at its merge}
    dating: {posture: partial, note: the iso_prefix_key MetadataDates shape — 317 typed date
        strings; prose-only dates honestly mint nothing}
    places: {posture: named, note: the toponym lists project through MetadataDates (P118-R4)
        — every name joins the claim, coordinates only when exactly one toponym carries them}
    script: {posture: implied, note: script parentheticals recorded per doc as script_note}
