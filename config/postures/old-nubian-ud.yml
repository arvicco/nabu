sources:
  old-nubian-ud:   # P125
    kind: {posture: unclassified, note: "one document holding a miracle (Saint Menas), a homily
        and scriptural fragments with no text boundary marked upstream — no single kind is
        true of it, and splitting by inferred boundaries would invent structure"}
    lect: {posture: identity, note: "the Old Nubian registry package (the nub family + the onw
        anchor) merged + canonical-synced 2026-10-14 — the add-then-retire shape within one
        phase; the bare onw code is the claim"}
    dating: {posture: undatable, note: "censused 2026-10-14: every sentence carries only sent_id
        (ordinal), text and translation — no date, manuscript siglum or text identifier
        anywhere in the file; the manuscripts' dating is not in the asset"}
    places: {posture: unplaced, note: "same census: no findspot, provenance or place field in
        the file"}
    script: {posture: qualified, note: "measured: the text lane is a Latin TRANSLITERATION
        (onw in Latn — 7,450 Latin letters, zero Coptic-block characters); the manuscripts'
        Coptic-derived Old Nubian alphabet is not carried. Metadata script Latn"}
