sources:
  ben-yehuda:   # 02-sources row 426
    # kind machine-postured — kind_map.yml metadata genre (upstream's genre enum key).
    # lect machine-postured — lect_facet_rules.yml ben-yehuda-period (period medieval →
    # heb:med, approximation); the ancient band (antiquity + piyyut) stays bare hbo
    # deliberately — no single stage names it.
    dating: {posture: dated, note: "every document carries upstream's period band as a
        composition-era envelope (class composition, :structured): 900–1700 for the Middle
        Ages + Renaissance band, ≤900 (no lower bound stated) for antiquity + piyyut — the
        band of the person whose Hebrew it is. Coarse by upstream's own grain, declared: the
        dump carries no per-work or per-author date; source_edition (the modern print the
        volunteers transcribed, free prose) rides metadata verbatim, never as a date"}
    places: {posture: unplaced, note: "the dump names no place — no origin, no findspot; the
        source_edition imprint town is the modern print's, not the text's"}
    script: {posture: implied, note: "Hebrew square script with the edition's nikud (the txt/
        variant), stored byte-verbatim on the NFC-exempt hbo code; some prose and
        superscriptions unpointed upstream"}
