sources:
  bim-sahcoba:
    # kind: machine-postured — the bim-sahcoba fold in kind_map.yml over the
    # adapter's per-work genre.
    lect: {posture: dates, note: "eu:arch / eu:old / eu:emod by date-band inference off the
        works' own dates (the registry's 2026-10-21 Basque mint; Etxepare 1545 → eu:arch,
        Axular 1643 → eu:old verified live) — the two undated works (Larramendi, Pouvreau)
        honestly ride bare eu. The per-work dialect (Labourdin, Souletin, Biscayan …) rides
        as a facet — the variety key in waiting"}
    dating: {posture: partial, note: "13 of 15 works: the imprint year read from the stream's own
        title page (7 — Axular, Chourio, Lopez, Maister, Materra, Otxoa, Tartas) or the standard
        attribution, raw marked attributed (6); Larramendi's selected writings and Pouvreau's
        manuscript Imitation carry no date in the asset — declared"}
    places: {posture: named, note: "8 of 15: the imprint town the stream's own title page names
        (Bordeaux, Bayonne, Pau, Orthez, Donostia, Avignon), place_role imprint; attributed
        imprints are never claimed as places"}
    script: {posture: implied, note: "Latin script; the corpus's form column
        is the text, the standardized form rides per token"}
