sources:
  dicta-library:   # 02-sources row 421
    # kind machine-postured — kind_map.yml metadata genre (category -- subcategory).
    # lect machine-postured — lect_facet_rules.yml dicta-library-era (era rishonim →
    # heb:med); the Acharonim mass (~1,150 books) and the 2 Geonim volumes stay bare heb
    # deliberately — no early-modern rabbinic stage exists in the registry, and the print
    # year (class edition) never stages (the blbooks/P164 rule). The rabbinic
    # Hebrew-Aramaic mix of responsa and novellae rides heb whole (declared coarse).
    dating: {posture: dated, note: "the manifest's printYear on every book (1726–1982; one
        range \"1925-1931\" widens the envelope), class edition on the :structured lane —
        the PRINT, not the composition (the 1881 Warsaw print of the Maharam of Lublin, d. 1616)"}
    places: {posture: named, note: "printLocationEnglish, the imprint town (Warsaw, Vilna,
        Jerusalem, Lemberg … 93 distinct), on every book; the Hebrew spelling rides place_he"}
    script: {posture: implied, note: "Hebrew square script read by Dicta's AI OCR (Rashi
        script rendered in square letters), unpointed; the two vocalized fallbacks carry
        Dicta's machine niqqud, NFC-composed at the boundary (text_nature machine-ocr)"}
