sources:
  wiktionary-trk-oat:
    kind: {posture: unclassified}
    lect: {posture: codemap, note: "trk-oat → ota:old through the universal codemap row
        (nabu-lects, 2026-11-28): Wiktionary's own etymology-language code for Old Anatolian
        Turkish, stored verbatim, resolves to the registry's Old Anatolian Turkish stage of ota
        (1200–1500, the Oghuz literary language before Ottoman). Every entry carries the one
        code, so the whole shelf lands on the stage; no finer claim exists"}
    dating: {posture: undatable, note: "a dictionary shelf — Wiktionary entries carry no
        attestation dates as fields; quotation years, where present, ride entry bodies"}
    places: {posture: unplaced, note: "a dictionary shelf — no document place; place-name
        entries ride as entries"}
    script: {posture: implied, note: "Perso-Arabic headwords, the language's own written
        norm; romanizations ride forms and bodies"}
