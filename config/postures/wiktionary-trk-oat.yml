sources:
  wiktionary-trk-oat:
    kind: {posture: unclassified}
    lect: {posture: pending, note: "bare trk-oat — Wiktionary's own etymology-language code for
        Old Anatolian Turkish (13th–15th c., the Oghuz literary stage before Ottoman), stored
        verbatim; the lect registry carries no trk-oat row, so the code resolves to itself.
        Candidate: a nabu-lects codemap row mapping trk-oat onto the ota anchor's early edge
        (the registry's ota note already folds Old Anatolian Turkish into the code's early
        edge) or onto a minted early-Ottoman stage under ota — after which the codemap
        resolves every entry and this declaration retires (the shadowing rule)"}
    dating: {posture: undatable, note: "a dictionary shelf — Wiktionary entries carry no
        attestation dates as fields; quotation years, where present, ride entry bodies"}
    places: {posture: unplaced, note: "a dictionary shelf — no document place; place-name
        entries ride as entries"}
    script: {posture: implied, note: "Perso-Arabic headwords, the language's own written
        norm; romanizations ride forms and bodies"}
