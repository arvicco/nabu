sources:
  sigla:
    # kind machine-postured — kind_map.yml folds SigLA's typology facet
    # (object: Tablet/Nodule/Roundel administrative, libation tables
    # dedicatory, graffiti; the object-only types deliberate).
    lect: {posture: identity, note: "lab — the nabu-lects anchor (registry package merged
        2026-10-22): undeciphered Linear A, parentless under the no-classification
        discipline, no stage grid to refine into; the corpus is the whole attested
        language"}
    dating: {posture: dated, note: "the Minoan ceramic-phase label (LM IB 640 · MM IIB
        34 · MM IIIB 28 …) on 775 of 802 inscriptions bands through the ruled Aegean
        rows of config/period_bands.yml (conventional low chronology, declared) via
        MetadataDates :period_label; no-field/empty/unknown/n-a stay honestly undated"}
    places: {posture: named, note: "the site (Haghia Triada 372 · Khania 220 · Phaistos
        64 · Zakros 44 · Knossos 37 …) rides the place hash's ancient name verbatim;
        no gazetteer refs yet"}
    script: {posture: implied, note: "the text is our consistent TRANSLITERATION of
        SigLA's sign readings (phonetic values, standard names AB/A/N, Latin logogram
        names) — Latin-script by construction; the artifact script, Linear A, awaits
        the lina registry row for config/artifact_scripts.yml"}
