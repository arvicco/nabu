sources:
  mongolic-pd:   # P164
    # kind: machine-postured — kind_map.yml genre facet fold.
    lect: {posture: identity, note: "the reference-shelf posture (africa-pd, slavistics-pd): each
        work claims its PROSE language — rus 7, eng 3, fra 3, deu 2, all real anchors; the
        language presented rides metadata object_language — mnc (7), cmg (5), xwo (3), all
        three real registry nodes (cmg + xwo minted 2026-11-02 for exactly this shelf), never
        a claim. Kowalewski's dictionary glosses in Russian AND French and claims rus, declared
        coarse"}
    dating: {posture: dated, note: "every work carries its edition year (Kowalewski per volume:
        1844/1846/1849) — :structured lane"}
    places: {posture: unplaced, note: "imprint places (St Petersburg, Kazan, Paris, Shanghai,
        Canton, Leipzig) ride metadata 'imprint' — the printing place, not a text place"}
    script: {posture: mixed, note: "Cyrillic (pre-reform) and Latin-script prose; Manchu and
        Mongolian forms in Cyrillic or Latin transcription; the native vertical scripts
        (Manchu, Uyghur-Mongolian, the Oirat Clear Script) are uncorrected OCR, garbled
        (declared per document)"}
