sources:
  ticha:   # P117-5
    # kind machine-postured since 2026-10-12 — the ruled work_type fold in
    # kind_map.yml (manuscript → legal, arte → lexical/grammar, catecismo →
    # catechesis since 2026-11-07, miscelaneo → unknown). The pending row retired under the
    # shadowing rule.
    # lect machine-postured since 2026-10-11 — the per-collection zap/xzp →
    # zap:col overrides (the americas registry package merged; xzp stays
    # universally unmapped: SIL's Monte Albán glyphic reading), the
    # shadowing rule.
    dating: {posture: partial, note: "84 of 93 documents: the Ticha manuscript id's year
        (the ORIGINAL document's year — a translation is dated by its original) and the
        printed works' title-page years (1578, 1666, 1766) on the :structured lane;
        levanto-arte and the eight AGEO files carry no date"}
    places: {posture: named, note: "80 of 93: the town of the manuscript id's code
        (Ticha's own town pages; names verbatim from the repo's places.json) or the
        works' imprint (México, Puebla de los Ángeles; place_role imprint); places.json
        coordinates ride metadata-only — 3 of its 22 points fall far outside the
        Valley of Oaxaca, so none are projected"}
    script: {posture: implied, note: "Latin script; the original reading (long s, tildes,
        abbreviations) is the text, upstream's modern-Spanish regularization rides per
        page"}
