sources:
  armepic:
    # kind: machine-postured by the kind_map.yml armepic genre fold.
    # lect declaration retired P157 (ruled 2026-11-04): the armepic xcl
    # override machine-postures it now (the shadowing rule) — the corpus
    # pins to grabar/xcl on the editors' own description, no date-band
    # staging into axm; the spot-read evidence rides the override comment.
    dating: {posture: dated, note: "50/50 via origin/origDate: 41 when-custom (the Armenian-era
        year converted, evidence internal-date) as one-year envelopes, 9 notBefore-custom/
        notAfter-custom palaeographic centuries as bounds; raw/evidence/precision/calendar ride"}
    places: {posture: named, note: "the origPlace settlement (urn:armepic:artsakh:PLC…, 49/50)
        with its own decimal coordinates where given (41) → place_lat/lon; ART0043 names only its
        findspot. The armepic place urns join no held gazetteer — ride verbatim (armepic_ref)"}
    script: {posture: implied, note: "Armenian script (xcl ⇒ Armn); the hand's style in
        upstream's words (Bolorgits Erkatagir, Ughghagits Erkatagir …) rides the script_style
        facet"}
