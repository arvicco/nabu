sources:
  # P116-3: the West/East Slavic wikisource family (the owner-ruled wikisource posture).
  pl-wikisource:
    kind: {posture: unclassified}
    lect: {posture: identity, note: "pl — the anchor minted 2026-10-11 (the Slavic
        package); documents claim bare pol → pl via codemap. Deliberately coarse at
        source grain: the cone spans pl:old and pl:mid, and the era-band categories
        are attributions, not typed dates — staging stays a recorded future look"}
    dating: {posture: dated, note: "P116-3: the cone category's
        literary-period band (era_band → MetadataDates :era_band_key; medieval /
        XV-century / Renaissance / Baroque, approximate conventions declared in
        ERA_CATEGORIES), precision era — an attribution, never a typed date"}
    places: {posture: unplaced, note: "the edition imprint place (miejsce wydania)
        is the 19th–20th-c. edition's, not the text's — declared, never a text place"}
    script: {posture: implied}
