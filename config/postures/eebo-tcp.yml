sources:
  eebo-tcp:
    lect:
      posture: identity
      note: "en IS the claim and it is TRUE today (P83-1): 97.6% of the
        corpus declares LANGUSAGE eng (censused ×3,325), mapped through
        the codemap's eng→en alias; the registry anchor is en (parent
        enm). The en:early stage mint is APPROVED (owner ruling 2026-08-26,
        nabu-lects PR #9: en:early [1500, 1700] — the de:early shape,
        pending owner merge); once the v1.2.0 mint reaches
        canonical/nabu-lects the en:early staging rides DATE-BAND
        INFERENCE over the imprint envelopes (the no:old/Menota
        precedent — no blanket rule), and the registry-fixture sweep
        happens at that merge, not here. Identity stays the honest
        declaration meanwhile. The foreign-language minority (lat 1.4%;
        wel/roa/frm/fre/dut/spa/iri/ita tails) claims its upstream MARC
        code verbatim — those ride as-is, deliberately coarse"
    dating:
      posture: dated
      note: "the BIBLFULL imprint year via MetadataDates :structured —
        the censused molds (plain/bracketed years, [i.e. YYYY]
        corrections, ranges, OS/NS split years, Anno Dom.) date 85.7% of
        the 3,325-file sample; ?/ca. uncertainty stays raw-only, bounds
        never invented. The imprint is the PRINT year, an honest
        early-modern envelope (composition≈print for this corpus)"
    places: {posture: named, note: "P109-4 (the unmined-metadata drain, superseding
        the P83-1 no-claim stance): the document IS the early-modern
        print, so the imprint PUBPLACE is the artifact's own production
        place — the same composition≈print logic the dating posture
        already rides. Projected via PLACE_KEYS source_pub_place, ESTC
        bracket/colon furniture stripped, s.l. sine-loco minting nothing
        (59,805 axis rows live 2026-09-29); the TCP's own Ann Arbor
        pub_place stays lineage (declared, Invariants::MINING_EXEMPT).
        Parse-time bare town beside it (census 2026-10-20 over all 60,326
        files): imprint_place on 56,683 (94.0%), the ?-marked
        imprint_place_conjecture on 2,288 (3.8%) — period furniture,
        Latin/Welsh/French forms and cataloguer [i.e.] corrections read
        to the English town (EeboImprintPlace), the registry-shaped join
        key for gazetteer refs. A conjecture doc projects its conjecture
        town as the declared-uncertain claim (\"London?\", the cataloguer's
        trailing ? — never the raw \"[London?] printed\" prose)"}
    script: {posture: implied}
