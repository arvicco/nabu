sources:
  cantus:
    # One document per full-text chant record (Adapters::CantusCsvParser);
    # the manuscript source's own fields (Browse Sources listing) join every
    # record of it. kind is machine-postured by the kind_map rule (genre).
    # lect rides the lect_overrides row (lat → lat/ecc, ruled 2026-11-12:
    # chant is register-classed like gregobase/divinum-officium; the
    # witness-date band staging that once made lat:ren 98.6% chant is
    # replaced by the stageless register) — machine files are the single
    # source of truth, so no declaration here.
    dating: {posture: partial, note: "the source's curated century labels (Browse Sources
        /century/ links: '10th century (975-1000)', '13th century (2nd half)', 40 labels) band
        every record of that source — basis 'source', the witness's copying date, never the
        chant's composition (no date class: the artifact's own date). 265 of 305 sources carry
        one (census 2026-11-04); the other 40 mint no date. Each source's free-text date
        ('Late 15th century') is not fetched — the curated label is the claim"}
    places: {posture: named, note: "the source's provenance (Browse Sources /provenance/ links —
        a 214-value vocabulary of towns, abbeys, regions, countries) rides place as named;
        231 of 305 sources carry one. Three vocabulary values name no place (Dominican,
        Franciscan, English — CantusSourceIndex::NON_PLACES) and ride metadata provenance
        only. The holding institution/country is the PRESENT location — metadata only"}
    script: {posture: implied}
