        (1998 onward); the Greek they translate rides each passage's greek_original annotation
        and is held as its own witness (First1K tlg9010), never claimed here"}
    dating: {posture: undatable, note: "the asset's dates are the translation's own contribution
        history (translated_at + every vetting stamp, 1998–2025, on every passage) — not a text
