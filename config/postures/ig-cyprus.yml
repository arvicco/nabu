sources:
  ig-cyprus:
    kind: {posture: pending, note: "candidate: a kind_map fold over the genre facet — the title
        head as upstream writes it (Weihinschrift, Grabinschrift, Besitzerinschrift,
        Einzelbuchstabe…), censused at the first sync; titles without a script label
        (coin legends) carry no genre"}
    # lect machine-postured since 2026-10-18 — the lect_overrides grc →
    # grc/cyp row (the fascicle IS pre-Hellenistic Cyprus); ecy and
    # und-Latn documents ride their own codes untouched (the shadowing
    # rule).
    dating: {posture: partial, note: "origDate is German prose with unsigned BCE years and
        centuries (330-310, 4.Jh., Anfang 4.Jh., 5.-4.Jh., nach 498); the grammar bands all
        six fixture records; 'Zeit?' and unforeseen prose keep raw only — census the
        unparsed residue at the first sync"}
    places: {posture: named, note: "origPlace is the ancient city (Amathus, Kurion, Marion) as
        a bare name — no gazetteer refs in the records; provenance (findspot + present
        museum) rides metadata, never the place claim"}
    script: {posture: mixed, note: "the Cypriot syllabary held in Latin TRANSLITERATION
        (-Latn; zero Cypriot-block characters) beside alphabetic Greek lines (Grek) — per line;
        writing_system cypriot-syllabary / greek-alphabet on every passage"}
