sources:
  damos:
    # kind machine-postured since 2026-10-18 — kind_map.yml source_kind
    # administrative (Linear B is palatial bookkeeping: tablets, sealings,
    # labels; the stirrup jars are transport labels). The pending row
    # retired under the shadowing rule.
    lect: {posture: identity, note: "gmy — the nabu-lects anchor; the corpus is the whole
        attested Mycenaean Greek, no finer stage exists to refine into"}
    dating: {posture: dated, note: "the Aegean ceramic-phase rows RULED in
        config/period_bands.yml (basis aegean — Warren & Hankey 1989 conventional
        bounds; compound labels band as envelopes): the chronology label on 4,019 of
        5,932 documents mints period-class rows through MetadataDates :period_label;
        the 1,878 carrying upstream's '-' and the handful of unruled strays stay
        honestly undated"}
    places: {posture: named, note: "the site (Knossos, Pylos, Thebes …; a 'Vases - X'
        collection places at X) with find-area/find-spot in the place hash via MetadataDates;
        the jar clay provenance (West Crete α) stays metadata — no gazetteer refs yet"}
    script: {posture: implied, note: "the text is the conventional Linear B
        TRANSLITERATION (syllabograms romanized, logograms as Latin abbreviations) —
        Latin-script by construction, no Linear B Unicode rides"}
