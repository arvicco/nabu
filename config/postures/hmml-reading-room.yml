sources:
  hmml-reading-room:   # P154
    # kind: machine-postured — the hmml-reading-room genre fold in kind_map.yml (open vocabulary).
    lect: {posture: identity, note: "per-incipit tags on held nodes from the cataloguer's item
        language — syc (Syriac), gez (Ge'ez), amh (Amharic), ara (Arabic) and ara-Syrc (Arabic
        Garshuni, Arabic in Syriac script; ara through the ar codemap row). Declared coarse: the
        cataloguer's language is the claim (an item catalogued Syriac whose incipit reads as
        Garshuni stays syc); Neo-Aramaic, Turkish/Kurdish Garshuni and the rest skip by rule
        (196 incipits, named per document) until the registry holds them"}
    dating: {posture: dated, note: "registered hmml-reading-room => :structured in
        Store::TimelineBuilder::MetadataDates::SHAPES (pick-time, P154) — the catalogue's own
        envelope as metadata date {not_before, not_after, raw} (min beginDate .. max endDate
        over the parts, century label raw; 18,001 of 18,892 records in the 2026-11-01
        generation), artifact class; the precise year/month/day and the native-era date
        (e.g. '2025 AG') ride each part verbatim; the 8 impossible part pairs upstream ships
        (18891–1913, 1750–150 …) are repaired from the part's precise year / centuries band,
        the verbatim pair named in the raw"}
    places: {posture: named, note: "the same :structured registration reads the metadata
        place — the part's city of origin, else its country of origin (4,448 records), else
        the copying town a provenance note opens with ('Copied in Alqūsh, fol. 143r'; 38
        records), the writing place as catalogued, names verbatim; the holding repository (city, country,
        LC/VIAF authority URIs) rides metadata and is never taken for the origin"}
    script: {posture: mixed, note: "Syriac script (Serṭā, Madnḥāyā, ʼEsṭrangelā — the part's
        script field verbatim), Ethiopic Fidäl, Arabic Naskh for the Arabic items; Garshuni is
        tagged ara-Syrc"}
