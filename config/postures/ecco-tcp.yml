sources:
  ecco-tcp:
    lect:
      posture: identity
      note: "en IS the claim and it is true today: 3,099 of 3,101 files
        declare LANGUSAGE eng (census 2026-11-03), mapped eng→en; one fre and
        one wel ride their MARC codes verbatim. The registry's English stage
        en:early [1500, 1700] ends where ECCO begins, so the corpus stays
        honestly bare en; the late-modern English stage is being minted in
        the sister registry, and the date-band re-pin follows that mint once
        it reaches canonical/nabu-lects (date-band inference over the
        imprint envelopes, no rule)"
    dating:
      posture: dated
      note: "the BIBLFULL imprint year via MetadataDates :structured —
        EeboTcp's censused molds plus the later-print molds; census
        2026-11-03 over all 3,101 files: 2,950 bounded (95.1%), 150 left
        raw-only (?-marked, or a pair the molds decline), one with no imprint
        date at all (bounds never invented). The print IS the
        document"
    places: {posture: named, note: "the imprint PUBPLACE is the print's own
        production place (the eebo-tcp stance), projected via PLACE_KEYS with
        the parse-time bare town (EeboImprintPlace: a town or conjecture on all
        3,101 — London 2,543 · Dublin 201 · Edinburgh 107 …); the TCP's own Ann Arbor / Oxford
        pub_place stays lineage (Invariants::MINING_EXEMPT)"}
    script: {posture: implied}
