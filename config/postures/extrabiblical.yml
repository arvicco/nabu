sources:
  extrabiblical:
    # kind machine-postured — kind_map.yml folds the 13 books over metadata
    # book (letters, petition, building, royal, amulet, oracle, hymns, rule,
    # wisdom, midrash; Ajrud and 1QM declared deliberate).
    # lect is machine-postured: the registry package landed (obm anchor + hbo:epi
    # stage, 2026-10-27), so the Mesha Stele's obm resolves to its anchor directly,
    # and the extrabiblical-book rule in config/lect_facet_rules.yml stages the six
    # Iron Age inscriptional books hbo:epi and the two rabbinic works heb:rab.
    # The Deir ʿAlla text (Balaam) rides the qda local-use anchor (registry
    # package merged 2026-10-29) — the Aramaic/Canaanite/own-dialect dispute
    # lives in the anchor's note, deliberately unsettled; upstream's Hebrew
    # processing claim stays as metadata. The three Qumran scrolls stay bare
    # hbo by the dss precedent.
    dating: {posture: dated, note: "the asset carries no date field; each of the 13 books
        bands through its attributed era in config/work_eras.yml (handbook consensus,
        cited per row; MetadataDates :work_era, composition class, precision era) —
        Iron Age II inscriptions c. 840–586 BCE, the Qumran scrolls' Hasmonean–Herodian
        composition, the rabbinic works' redaction (3rd–4th c. CE). Per-book grain is
        declared coarseness (Arad 1/2/40 share one envelope)"}
    places: {posture: linked, note: "the find-site rides the place hash from the adapter's
        BOOKS table with its Pleiades id on 9 of 13 books (Qumran ×3, Kuntillet ʿAjrud,
        Tel Arad, Ketef Hinnom, Lachish, Dibon, Jerusalem); Tell Deir ʿAlla and Mesad
        Hashavyahu are named only (no held gazetteer entry); Pirqe Avot and Shirata are
        compositions, not finds — unplaced"}
    script: {posture: qualified, note: "the held surface is the ETCBC's consonantal Hebrew
        square-script transcription (with shin/sin dots) for every book; the Iron Age
        inscriptions and the Mesha Stele were written in the Old Hebrew / Moabite
        (Phoenician-derived) alphabet. No config/artifact_scripts.yml row yet: the row
        keys on the language code and hbo here mixes square-script scrolls with
        Old Hebrew inscriptions; obm → phnx is the candidate row once obm is an anchor"}
