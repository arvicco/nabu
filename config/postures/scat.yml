  scat:
    # kind: machine-postured — kind_map.yml source_kind hagiography/vita (the
    # corpus is saints' lives; historiography until the 2026-11-07 head). lect: machine-postured by the scat-century
    # facet rules — 16th/17th c. chu:csl/rus (scat-century); the 18th-c.
    # slice chu:ncs, the registry's New Church Slavonic stage
    # (scat-century-ncs).
    dating: {posture: dated, note: "the release catalog's century on all 24 texts → a century
        envelope (16th/17th/18th); coarse by upstream's own grain — the README pairs it with the
        manuscript shelfmark, so it dates the witness"}
    places: {posture: unplaced, note: "the release carries no origin place; the saints' Vologda /
        Russian North monasteries are the texts' subject, never claimed as the writing place, and
        the README's shelfmarks name holding libraries (present locations)"}
    script: {posture: implied, note: "Cyrillic, diplomatic (titla and superscript letters kept)"}
