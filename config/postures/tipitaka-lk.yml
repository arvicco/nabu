sources:
  tipitaka-lk:
    # lect declaration retired 2026-10-27: the tipitaka-lk pli → pli~sinh
    # override (config/lect_overrides.yml) machine-postures the source — the
    # Pāli's Sinhala surface, expressible since the registry's sinh row; the
    # si translation siblings stay bare si (no override row). Retired under
    # the shadowing rule.
    dating: {posture: undatable, note: "the JSON carries no date field of any kind (census
        2026-10-22: filename, bookId, pageOffset, collection, pageNum, entries, footnotes —
        nothing date-shaped); the canon's and the commentaries' composition eras are
        scholarship, not this asset's data"}
    places: {posture: unplaced, note: "no place field upstream; the edition is Sri Lankan
        (Buddha Jayanti series) but that is the print's provenance, not the texts'"}
    script: {posture: qualified, note: "the Pāli is held in SINHALA script (the BJT's own
        print convention), unlike the library's romanized Pāli (suttacentral); the claim
        is pli~sinh through the tipitaka-lk override (the registry's sinh row, 2026-10-27),
        byte-checkable by the sinh ScriptCheck property. The translation is Sinhala in
        Sinhala script, the bare si default"}
