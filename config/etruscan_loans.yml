# Etruscan → Latin curated loan rows (the config/sabellic_loans.yml
# recipe; the P17-3 `borrowed` pattern from a non-Indo-European donor).
# Curated 2026-10-22 from the en.wiktionary category pages — member
# lists via the MediaWiki API (list=categorymembers), etyma read from
# each Latin entry's OWN etymology (prop=revisions) by
# Nabu::WiktionaryLoanCuration: the first {{bor|la|ett|…}}/{{der|la|ett|…}}
# (or {{ety|la|…|ett:…}}) stating a form; Old Italic script verbatim, a
# leading * marks a reconstructed etymon; {{m}}/{{cog}} mentions are
# cognates and never promoted.
# relation: borrowed = the lemma sits in "Latin terms borrowed from
# Etruscan" (→ borrowed true); derived = only in the "derived from"
# superset (→ borrowed false). Borrowed wins the overlap: all
# 69 borrowed members also sit in the derived category.
# Category counts at retrieval: borrowed 69 · derived 200 pages
# (199 Latin lemmas + Reconstruction:Latin/piltrum, excluded — a
# reconstructed form, not an attested lemma) + 4 subcategories (not
# rows). Rows: 199 (69 borrowed, 130 derived-only).
# Etymon residue, declared row by row (never dropped): 76 rows cite an
# Etruscan form; 119 are `no_etymon: unstated` (the entry names
# Etruscan but cites no form: "-", empty, or a commented-out form);
# 4 are `no_etymon: no-template` (no Etruscan etymology template in
# the Latin entry — membership inherited through another word's
# etymology). `page` keeps a split-page title ("a/languages A to L").
# The survey-era census (2026-07-13) read 66 borrowed / 191 derived;
# this curation is the fresh one, at today's counts.
# License: CC BY-SA 4.0 + GFDL (the Wiktionary dual grant).

