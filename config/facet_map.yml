  # -- The Arabic/Syriac crosswalk wave: parse-time metadata (live census
  #    figures from the canonical assets, 2026-10-18).
  openiti:                    # 9,105 primary versions carry a TSV tags bag
    fields:
      genre_tags: genre_tag   # the scheme@keyword classification tags verbatim, prefix
      #                         kept (GAL@fiqh 490 · JK@فقه 471 · Shamela@فقه عام 2,235 …);
      #                         GAL is Brockelmann's multi-axis scheme (genre + period +
      #                         region keywords), never split by guess — hence its own
      #                         facet, not genre (the subject facet keeps the kind rule)
  diccas:                     # 10 books (one document each)
    fields:
      disaster_types: disaster  # the catastrophe <term>s' own English translation labels,
      #                         distinct per book (wind 476 · torture, punishment 288 ·
      #                         pestilence 206 · calamity 202 · earthquake 357 · plague
      #                         188 …); ONE fold: the 167 "earhquake" spellings join
