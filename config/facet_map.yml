# The metadata-field → facet projections (P104-1, under the
# aggressive-mining ruling 2026-09-26): per-source declarations of which
# documents.metadata_json fields project into document_facets rows —
# Nabu::FacetMap / Store::FacetBuilder. Values project VERBATIM (the
# facet value IS the upstream claim; normalization is the kind lane's
# job), arrays one row per element, absent/empty fields nothing.
# Field censuses below are from the live catalog, 2026-09-26.
sources:
  okhc:                       # census: 1,198,779 docs, corpus on ALL — 12 archive labels
    fields:
      corpus: collection      # Korean Literary Collections 652,405 · Ilseongnok 338,084 ·
      #                         Gaksadeungnok 78,247 · Kyujanggak old documents 32,487 ·
      #                         AKS old books 27,910 · AKS old documents 24,702 · Japanese
      #                         legation records 22,502 · GongU Madang 13,291 · Samguk sagi
      #                         4,613 · royal-court documents 2,273 · Hangeul museum 1,668 ·
      #                         Hangeul letters 597
  seal:                       # census: 408 docs, all four fields near-universal
    fields:
      genre: genre            # "Hymns and Prayers, Adad" — upstream's Genre header verbatim
      period: period          # 5 labels (OB 314 · MB/MA 72 · OA 11 · Archaic/OAkk/Ebla 7 ·
      #                         Later Periods 4) — the dating lane bands these via
      #                         config/period_bands.yml; the facet keeps the claim verbatim
      collection: collection  # museum collections (Schøyen 61 · YBC 52 · BM 51 …)
      provenance: provenance  # findspots incl. upstream's explicit "Unknown" (147 — a claim)
  rsti:                       # census: 5,075 docs — the facet-dark Ugarit inventory
    fields:
      object_type: object_type  # Tablet 4,778 · Vessel 85 · Model 63 · Scarab 46 …
      script: script          # Alphabetic/Logographic cuneiform, Hieroglyphic …
      languages: language     # array field — one row per language
      set: set                # 35 TEO season/collection sets
      findspot: findspot      # TEO findspot text incl. "Not listed in TEO" (a claim)
      museum_number: museum   # Louvre AE / RS sigla — the museum shelf join
  local-library:              # census: 62 docs, every manifest multi-language (P105-5b) —
    fields: #                   only languages[0] becomes documents.language; the trailing
      languages: language     # claims (ett under 22 eng facsimile editions, xum, xfa…)
      #                         stay visible as one facet row per code
  coptic-scriptorium:         # census: 482 docs; only dialect was faceted before P104-1
    fields:
      author: author          # Besa · Shenoute · Johannes · anonymous hagiographies …
      origPlace: place        # White Monastery 227 · Hagr Edfu · Hamuli …
      objectType: object_type # codex · papyrus …
      repository: repository  # holding libraries (BN Napoli, BL, Morgan …)
      corpus: corpus          # upstream corpus ids (besa.letters, shenoute.a22 …)
  # -- P118-R4 S2: the held-but-dark audit's facet wave. Censuses: live
  #    catalog 2026-10-11. Every field below already rode metadata_json
  #    verbatim and fed no facet; projecting it needs no re-parse.
  cdli:                       # census: 353,138 docs
    fields:
      material: material      # 348,407 docs, 294 values (clay 323,177 · stone 7,918 ·
      #                         "stone ?" 6,604 · composite 3,595 …; upstream case kept)
      object_type: object_type  # 349,252 docs, 29 values (tablet 296,840 · seal (not
      #                         impression) 15,518 · tablet & envelope 7,183 · cone · brick …)
      museum_no: museum       # 340,616 docs, 263,099 values — incl. upstream's own
      #                         number-withheld forms ("BM —" 27,272) and "unknown" (claims)
  rundata:                    # census: 6,815 inscription records
    fields:
      material_type: material # 7 classes (stone 4,204 · wood 1,279 · metal 646 …)
      material: material      # 5,459 docs, 437 fine values (granite · Gävle sandstone …) —
      #                         both grains under one facet so either filters
      objectInfo: object_type # 6,807 docs (runestone 1,963 · fragment of runestone 696 …)
      style: style            # 2,669 docs, 88 ornament styles (Pr 1–5, Rak, Fp …; "?" a claim)
      # carver (1,080 docs) is a PERSON field — the person lane, not a facet (later)
  glaux:                      # census: 1,421 works
    fields:
      dialect: dialect        # 1,176 docs, 7 values (Attic/Koine 416 · Attic 322 · Koine 214 …)
  kdsp:                       # census: 262 Slovene novels (ELTeC)
    fields:
      canonicity: canonicity  # nizka 182 · visoka 80
      period_slot: period     # ELTeC time slots D1–D9 (the date itself is on the timeline)
  ref:                        # census: 190 Early New High German texts
    fields:
      medium: medium          # Handschrift 97 · Druck 93
      text-type: text_type    # 185 docs, 140 upstream text-type labels verbatim
  rem:                        # census: 406 Middle High German texts
    fields:
      topic: topic            # 406 docs (Religion 278 · Poesie 47 · Wissen(-schaft) 41 …)
      text_type: text_type    # 388 docs, 105 values (Predigt · Segen · Bibeldichtung …)
  edr:                        # census: 115,590 docs
    fields:
      repository: museum      # holding museum incl. "ignoratur"/"periit" (lost — a claim)
  edh:                        # census: 81,881 docs, 42,238 with a repository
    fields:
      repository: museum      # "verschollen" 5,482 (lost — a claim); 5 bare "-" ride verbatim
  oncoj:                      # census: 4,991 poems
    fields:
      corpus: collection      # MYS 4,693 · NSK 133 · KK 112 · BS · FK · SNK …
  ban-wikisource:             # census 2026-10-12 (scratch first-sync run): 1,252 lontars
    fields:
      genre: genre            # the wiki's genre categories: Geguritan 142 · Usada 30 · Wariga 27 …
      collection: collection  # holding collections: Lontar ring Perpustakaan Kantor Dokumentasi
      #                         Budaya Bali 191 · Lontar Balai Bahasa Bali 179 · Wanagiri 153 …
      gedong_kirtya_class: classification  # Agama 492 · Itihasa 121 · Wéda 68 · Babad 17
