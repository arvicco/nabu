  # -- The passage grain: passage_fields project passages.annotations_json
  #    keys into the passage facet tables (Store::PassageFacetBuilder) —
  #    the facet lane for claims upstream makes per ARTICLE, not per
  #    document. Same verbatim discipline; an annotation value may be a
  #    string, an array of strings, or an array of {"value", "ref"}
  #    objects (the entity shape: a name plus its authority ref).
  #    Censuses: live catalog 2026-10-18. The NIKH siblings (sjw,
  #    bibyeonsa, goryeosa, goryeosa-jeoryo) parse the same subjectClass
  #    slot but their deposits carry none (0 passages each) — that field
  #    stays unruled for them.
  #    The NIKH index markup (NikhXmlParser entities: typed <index> tags
  #    mined per leaf; censuses: a full parse of the box's canonical tree,
  #    2026-10-18 — "mentions" = tags in leaf text, "records" = the
  #    annotation records, one per distinct (kind, value, ref, surface)
  #    per passage (≈ the facet pairs; repeats live in the
  #    text), "distinct" = the facet dictionary's (value, ref) rows).
  #    Values are the tagged surfaces verbatim — except sjw persons and books,
  #    valued by upstream's own normalized name= (its resolution claim,
  #    the raw surface beside it); refs are "nikh:" + upstream's own id (sillok M_ person
  #    ids; the goryeosa family's p/o/t/m/b ids; the cross-database person
  #    pid where that is a tag's only id). Tags in non-leaf header text
  #    (navigation repeats of the title chain) mint nothing, as that text
  #    mints no passage.
  sillok:                     # 413,102 of 414,321 article passages, 216 subject labels,
    passage_fields: #           899,669 (passage, label) pairs — the 분류 subjectClass
      subject_classes: subject  # tree verbatim, upper-lower joined by upstream's own
      #                         hyphen ("왕실-의식(儀式)", "군사-중앙군(中央軍)", "인물(人物)")
      persons: person         # 1,570,018 이름 mentions → 1,199,460 records on 311,113 of 414,321
      #                         passages, 156,799 distinct (surface, ref); M_ refs on 1,039,366
      #                         records (68,285 persons)
      places: place           # 526,047 지명 mentions → 429,445 records, 27,141 distinct — no ref
      books: book             # 51,070 서명 mentions → 40,780 records, 7,002 distinct (《》 verbatim)
      eras: era               # 5,534 연호 mentions → 4,486 records, 226 distinct era names
      offices: office         # 2 관직 mentions — the type is near-absent in sillok
  itkc:                       # 37,182 of 37,184 article passages, 29 genre labels, 74,364
    passage_fields: #           pairs — the 문체분류 classification verbatim (詩類 ·
      genre_classes: genre    # 書簡類 · 其他類 · 雜著類 …); the passage facet shares the document
      #                         facet's axis name, so --type/--facet genre reach both grains
    # ALSO document-grain (the 26 held work sidecars' 서지 records, on every fascicle):
    fields:
      author: author          # the first 저자 (柳得恭, 申叔舟 …); the full list with 생년/몰년
      #                         life years rides metadata "authors" (one work names two)
      subject_class: subject  # 주제분류 — 문집 · 역사 · 잡저 · 법률 · 전기류 · 주의류 · 지리류
      sabu_class: classification  # 사부분류 중분류, hanja-glossed and consistent across families
      #                         (별집류(別集類) · 편년류(編年類) · 지리류(地理類) …); the 대분류 rides
      #                         "sabu_division" unfaceted — written both "사부(史部)" and "사부"
  # -- the CJK person blocks (adapter-mined; a re-parse lands the fields first).
  #    Censuses over canonical/, 2026-10-18.
  kanripo:                    # 4,119 held texts carry KR-Catalog 人物 blocks (5,202 blocks)
    fields: #                   — metadata "persons" keeps every block verbatim
      authors: author         # 3,182 texts, 2,248 names — the text-level byline's 撰-family
      #                         roles (撰 3,063 · 奉敕撰 160 · 敕撰 18 …; Kanripo adapter table)
      editors: editor         # 540 texts, 497 names — 編/輯/纂-family compilers (編 436 ·
      #                         輯 43 · 奉敕編 26 …): a census-warranted facet of its own,
