# place-mine hand stop list (P96-3, Q9 v0). Names the DERIVED stop rule
# does not catch but an owner ruling excludes from mining anyway — each
# entry is a place-index name key that is really a common word in the
# target corpora. The derived rule (a name hitting > 0.2% of a source's
# scanned passages is excluded and reported) handles the flood cases;
# this file holds the judgment tail. Every addition is an owner ruling.
stop_names:
  # kanripo × chgis review round 2 (report 2026-09-12, top-30 sweep;
  # owner-ratified 2026-09-13). Generic classical-Chinese words/phrases
  # that happen to be CHGIS place names.
  - "以古"   # "taking the ancient…"
  - "和平"   # peace
  - "前所"   # "the aforementioned…"
  - "空中"   # in the air
  - "其源"   # its source
  - "雨露"   # rain and dew
  - "三家"   # the three houses/schools
  - "下莫"   # compound crossing 下 + 莫
  - "朝天"   # facing heaven / audience with the emperor
  - "天成"   # naturally formed (also an era name)
  - "地所"   # "…the place where"
  - "化成"   # to transform into
  - "利其"   # "profit its…"
  - "立者"   # "the one who establishes…"
  - "安居"   # to dwell in peace
  - "王文"   # Wang Wen- (person-name prefix)
  - "大川"   # great rivers (名山大川)
  - "雨雪"   # rain and snow
  - "其宗"   # its lineage
  - "中元"   # the Zhongyuan festival / mid-period
  - "南渡"   # the southern crossing (Song history phrase)
  - "月照"   # the moon shines
  - "都城"   # capital city
  - "下安"   # compound crossing
  - "平安"   # peace, safety
  # kanripo × chgis review round 3 (report 2026-09-14, top-30 sweep;
  # owner-ratified 2026-09-18, №R-67). Same class: generic classical-
  # Chinese words/phrases that happen to be CHGIS place names. 文昌
  # rides from the possible-real quartet — the literature-god reading
  # dominates the corpus (№R-67 ruling); 江北/中都/西江 stay linkable.
  - "成章"   # "complete a composition"
  - "石室"   # stone chamber
  - "文中"   # "in the text"
  - "公平"   # fair, just
  - "三元"   # the three primes (exam/calendrical term)
  - "同列"   # of the same rank
  - "白衣"   # white-robed (commoner/lay)
  - "下山"   # descend the mountain
  - "方丈"   # abbot's quarters
  - "老君"   # Laozi epithet
  - "田里"   # fields and villages
  - "大喜"   # great joy
  - "出水"   # emerge from water
  - "善政"   # good governance
  - "小心"   # careful
  - "大海"   # the great sea
  - "城上"   # atop the walls
  - "清流"   # clear stream / the "pure" faction
  - "小山"   # small hill
  - "文昌"   # the literature god (dominant reading; the Hainan place loses)
  # kanripo × chgis review round 5 (round-4 board top-30, 2026-09-25;
  # owner-ratified 2026-09-26, all as recommended). Same class + three
  # dominant-reading judgments (金城/安平/玉山) and one wrong-identity
  # case: 曲江's corpus reading is Chang'an's Qujiang pond while the
  # CHGIS row is the Guangdong county — every link a wrong identity.
  - "力所"   # "what one's strength allows"
  - "王居"   # the king's residence
  - "大言"   # big words, boasting
  - "玉皇"   # the Jade Emperor
  - "桃源"   # the Peach-Blossom Spring trope
  - "竹林"   # bamboo grove (the Seven Sages)
  - "白露"   # the White Dew solar term
  - "五斗"   # five pecks (五斗米)
  - "七星"   # the Seven Stars / Dipper
  - "洪水"   # flood waters
  - "曲江"   # Chang'an's Qujiang pond vs the Guangdong county row
  - "金城"   # the impregnable-walls idiom (金城湯池)
  - "安平"   # peace and calm
  - "玉山"   # the 玉山傾倒 figure
  # kanripo × chgis review round 6 (the P105-2 verdict board, top-50 by
  # document spread, 2026-09-26; every candidate a 1911 cun-zhen village
  # row unless noted — ratified by the P105 gate merge). Same classes as
  # rounds 2-5: generic classical words/phrases, idiom/quotation
  # crossings, fanqie glosses, person-title crossings, and four
  # dominant-reading judgments (清水/嘉禾/百丈 measure-or-river/南王·西王
  # prince-title crossings). The real-geography names of the round (江北
  # 西江 天竺 三江 杜陵 中都 平江 京口 南城 王城) go to nabu-places
  # decisions, not here.
  - "大作"   # "great undertaking" (利用為大作 — the Yijing line)
  - "中土"   # the central lands
  - "下交"   # associating with inferiors (上交不諂下交不瀆)
  - "明光"   # bright radiance (大明光于天下)
  - "上明"   # "the bright above" (commentary diction)
  - "大方"   # the great method (學易之大方)
  - "玉石"   # jade and stone (玉石俱焚)
  - "中古"   # middle antiquity (易之興也其於中古乎)
  - "上水"   # water drawn upward (巽乎水而上水 — the Well hexagram)
  - "田中"   # "in the field" (上不在天下不在田中)
  - "大化"   # the great transformation
  - "石山"   # rocky mountain
  - "子午"   # the zi-wu meridian / cyclical pair
  - "富有"   # "richly possessing" (富有之謂大業 — the Xici)
  - "高明"   # lofty brilliance
  - "田家"   # farm household
  - "清泉"   # clear spring
  - "下作"   # collation notes ("below written as…") + boundary crossings
  - "安仁"   # at rest in ren (仁者安仁 — the Analects)
  - "公田"   # the public field (the well-field system)
  - "治中"   # governing the center / the aide-de-camp office title
  - "矣文"   # sentence-boundary crossing (…矣。文…)
  - "古木"   # fanqie gloss crossing (谷, 古木反) + "ancient tree"
  - "周家"   # the house of Zhou
  - "上仙"   # ascending to immortality
  - "三界"   # the Buddhist three realms
  - "元三"   # numerological crossing (一元而二元三元)
  - "都下"   # in the capital
  - "老翁"   # old man
  - "北望"   # gazing north
  - "西郊"   # the western suburbs (自我西郊 — the Yijing)
  - "松柏"   # pines and cypresses (歲寒然後知松柏之後凋)
  - "石壁"   # stone cliff
  - "清水"   # clear water, literal (一淵清水; the 文昌 dominant-reading rule)
  - "南王"   # prince-title crossing (淮南王, X南王)
  - "西王"   # prince-title crossing (安西王; 西王母)
  - "百丈"   # the measure phrase (數百丈) dominates the Sichuan river reading
  - "嘉禾"   # auspicious grain (the 歸禾/嘉禾 Documents episode)
  - "康王"   # King Kang of Zhou — a person, not a place
  - "晏子"   # Master Yan — a person, not a place

# Ceiling exemptions (№R-67, owner 2026-09-18): ruled genuinely-
# geographic names the derived frequency ceiling must not swallow.
# Allow exempts the DERIVED stop only — floor, ambiguity cap and the
# stop list above still apply. Every addition is an owner ruling.
allow_names:
  - "吐蕃"   # Tibet — 9,870 kanripo passages, real geography (№R-67)
