# config/south_indian_reigns.yml — the South-Indian regnal accession table
# (owner-approved before use). Converts the REGNAL dating statements of
# the DHARMA Tamil-country edition titles ("time of Rājarāja I Cōḻa,
# year 19") into CE envelopes through Nabu::SouthIndianReigns.
#
# The sibling of config/eras.yml (an ERA-typed year) and
# config/regnal_years.yml (cdli's Mesopotamian reigns): a regnal year is
# counted from one king's accession, so the conversion needs the
# accession, and the accession of most South-Indian kings is known only
# within a range. Every row keeps that range; nothing is ever pinned to
# one year it is not known to.
#
# SOURCES (one standard chronology per dynasty; see `dynasties:`):
# accession years follow the cited work; where the field's standard
# chronologies disagree, the row's accession RANGE spans the
# disagreement rather than choosing a side.
#
# CONVENTIONS (declared, never silent):
# - accession: the CE year (or [earliest, latest] range) in which regnal
#   year 1 began. A single integer means the field agrees on the year.
# - end: the LATEST year the reign (counting regnal years from the same
#   accession, co-regency included) can have run to. It bounds the
#   whole-reign span and the highest regnal year the reign can carry:
#   max year = end − earliest accession + 1. Ends are generous on purpose
#   — a too-early end would wrongly exclude a candidate.
# - Regnal year N of a reign → [earliest accession + N − 1, latest
#   accession + N]: a regnal year runs from one accession anniversary to
#   the next, so it straddles two Julian years (the Kollam width-1
#   precedent in eras.yml).
# - No year, or a year the title cannot give as a number ("year lost",
#   "year 2[.]", "year 3?") → the whole-reign span [earliest accession,
#   end]: the inscription is dated within the reign either way.
# - A year written as a sum ("year 4 + 9", the Tamil "year N opposite
#   to year M" count) reads as the sum.
#
# TITLES: each spelling the census found (DHARMA title wording verbatim,
# matched after NFC, case-folding and dropping spaces/dots/hyphens) maps
# to its CANDIDATE reigns:
# - one candidate: the title names one reign (an ordinal, a reign-unique
#   name, or a dynastic prefix that singles it out);
# - several candidates (homonyms — three Kulottuṅgas, two
#   Nandivikramavarmans …): the conversion is the envelope over the
#   candidates whose reign can reach year N (a year N exceeding a
#   candidate's max year drops that candidate; exceeding every one mints
#   nothing). Never a pick among them.
# `unconvertible:` lists the censused spellings that deliberately mint
# NOTHING, each with its reason (alternating titles naming a dozen kings,
# homonyms with an unruled early king, floating chronologies). An
# unlisted spelling also mints nothing — never a guess.

# The widest envelope the table will mint. A homonym union whose
# candidates lie centuries apart (Rājendra I … Rājendra III, 1012–1279;
# Rājarāja I or III) is honest but says less than the dynasty attribution
# itself; above this width the conversion mints nothing. 150 years keeps
# the adjacent-reign unions (Nandivarman II/III, Kulottuṅga I–III).
max_envelope_years: 150

dynasties:
  chola:
    label: Cōḻa (Vijayālaya line and the Cāḷukya-Cōḻas)
    source: K. A. Nilakanta Sastri, The Cōḷas, 2nd ed. (Madras, University of Madras, 1955), genealogical and chronological tables; accession ranges widened where later lists differ by a year or two
  pallava:
    label: Pallava (Siṁhaviṣṇu line and the later Pallavas)
    source: T. V. Mahalingam, Inscriptions of the Pallavas (New Delhi, ICHR, 1988), introduction (chronology); with E. Francis, Le discours royal dans l'Inde du Sud ancienne, vol. 1 (Louvain-la-Neuve, Institut orientaliste, 2013); ranges span the C. Minakshi / R. Gopalan / Mahalingam disagreements for the 9th-century kings
  pandya:
    label: Pāṇḍya (the second empire, 12th–14th c.)
    source: N. Sethuraman, The Imperial Pandyas — Mathematics Reconstructs the Chronology (Kumbakonam, 1978), accession years from the astronomical data; with K. A. Nilakanta Sastri, The Pāṇḍyan Kingdom (London, Luzac, 1929)
  rashtrakuta:
    label: Rāṣṭrakūṭa (Kṛṣṇa III's Tamil-country regnal count)
    source: A. S. Altekar, The Rashtrakutas and Their Times (Poona, Oriental Book Agency, 1934), Kṛṣṇa III's accession 939/940 and the Tamil records counting regnal years from it
  kadava:
    label: Kāḍava (Kōpperuñjiṅga I and II)
    source: K. A. Nilakanta Sastri, The Cōḷas, 2nd ed. (Madras 1955), the Kāḍava chapter; Kōpperuñjiṅga II's accession 1243 from the astronomical data of his records, Kōpperuñjiṅga I's held as a range
  vijayanagara:
    label: Vijayanagara (Saṅgama and Tuḷuva kings)
    source: K. A. Nilakanta Sastri, A History of South India, 4th ed. (Madras, Oxford University Press, 1975), the Vijayanagara dynastic list
  madurai_nayaka:
    label: Nāyakas of Madurai
    source: R. Sathyanatha Aiyar, History of the Nayaks of Madura (London, Oxford University Press, 1924)

