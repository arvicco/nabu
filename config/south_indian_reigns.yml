unconvertible:
  Rājakesarivarman: the alternating Cōḻa title — ten kings bore it (Āditya I to Rājarāja III, 871–1256); names no reign
  Rājakesarin: the alternating Cōḻa title (Rājakesari); names no reign
  Parakesarivarman: the alternating Cōḻa title — eleven kings bore it (Vijayālaya to Rājendra III, c. 850–1279); names no reign
  Parakesarin: the alternating Cōḻa title (Parakesari); names no reign
  Parakesarivarman (?): the alternating Cōḻa title, and doubted by the editor
  kesarivarman: half of an alternating Cōḻa title; names no reign
  Rājakesarivarman Rājendra Cōḻa: no Rājakesari Rājendra reigned under that name alone (Kulottuṅga I's early records, or Vīrarājendra) — identification is the editor's to make
  Karikāla Cōḻa: legendary Karikāla or Āditya II Karikāla — identification open
  Madhurāntaka: title of Uttama Cōḻa and of Rājendra I — identification open
  Rājarāja (?): doubted by the editor
  Sundara Cōḻapāṇḍya: a Cōḻa-Pāṇḍya viceroy, no ruled regnal count
  Kōṉēriṉmaikoṇṭāṉ: a royal epithet used by 12th–13th-century Cōḻa and Pāṇḍya kings alike; names no reign
  Kōnēriṉmaikoṇṭāṉ: royal epithet (see Kōṉēriṉmaikoṇṭāṉ); names no reign
  Kōṉēriṉmaikoṇṭān: royal epithet (see Kōṉēriṉmaikoṇṭāṉ); names no reign
  Tribhuvanacakravartin Kōṉēriṉmaikoṇṭāṉ: royal epithet (see Kōṉēriṉmaikoṇṭāṉ); names no reign
  Nandivarman: the bare name covers the early Pallava Nandivarman I (Utayēntiram plates, year 1 — chronology floating) as well as Nandivarman II and III
  Siṁhavarman: early Pallava kings of that name (Andhra charters) — the early Pallava chronology floats by decades
  Siṁhavarman or Mahendravarman: the editor's own alternative
  Mahendravarman (?): doubted by the editor
  Nr̥patuṅgavarman (?): doubted by the editor
  Kampavarman (?): doubted by the editor
  Nantippōttaraiyar (?): doubted by the editor
  Śiva-Skandavarman: early Pallava (Prakrit charters) — chronology floating
  Vijaya-Skandavarman: early Pallava — chronology floating
  Skandavarman: early Pallava — chronology floating
  Viṣṇugopa: early Pallava — chronology floating
  Viṣṇugopavarman: early Pallava — chronology floating
  Kumāraviṣṇu: early Pallava — chronology floating
  Kumāraviṣṇuvarman: early Pallava — chronology floating
  Skandaśiṣya: early Pallava — chronology floating
  Rājasiṁha: a Pallava (Narasiṁhavarman II) and a first-empire Pāṇḍya title alike
  Māṟaṉ Caṭaiyaṉ: the alternating first-empire Pāṇḍya title (Māṟaṉ / Caṭaiyaṉ); names no reign
  Māṟañ Caṭaiyaṉ: the alternating first-empire Pāṇḍya title; names no reign
  Māraṉ Caṭaiyaṉ: the alternating first-empire Pāṇḍya title; names no reign
  Varaguṇa: Varaguṇa I or II (first empire) — that chronology is not settled
  Neṭuñcaṭaiyaṉ: first-empire Pāṇḍya — chronology not settled
  Parāntaka: a Cōḻa (I or II) or a first-empire Pāṇḍya name
  Jaṭāvarman Parāntaka: first-empire Pāṇḍya — chronology not settled
  Śrīvallabha: several Pāṇḍya Śrīvallabhas, first and second empire
  Jaṭāvarman Śrīvallabhadēva: several Pāṇḍya Śrīvallabhas
  Caṭaiyavarman Śrī Vallabha: several Pāṇḍya Śrīvallabhas
  Parāṅkucaṉ: first-empire Pāṇḍya epithet — chronology not settled
  Vīrapāṇḍya: the 10th-century Vīrapāṇḍya and the 13th-century Jaṭāvarman Vīra Pāṇḍyas alike
  Vīra Pāṇḍya: as Vīrapāṇḍya
  Vikrama Pāṇḍya: several Pāṇḍya Vikramas, 12th–14th c.
