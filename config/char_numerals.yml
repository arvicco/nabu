# Letter-numeral value tables (P86-4b, №R-49) — the alphabetic numeral
# conventions our corpora actually use, as FACT TABLES (the ewts/starling
# precedent: objective, tiny, config-not-overlay). The char card renders a
# "numeric (<scheme>)" line for any glyph a table carries; Unicode's own
# numeric property does NOT cover these (α carries no numeric value in
# UnicodeData — isopsephy is a scholarly convention, not a character
# property; the two Gothic numeral-only letters 𐍁 𐍊 are the exception that
# proves it).
#
# Keys are glyphs in NFC, lowercase where the script cases (the lookup
# folds case). Uppercase variants and positional/final forms resolve to
# the same values unless the table says otherwise.
#
# DELIBERATELY ABSENT (censused decisions, not oversights):
#   - futhark: runes have NO standard numeric values — runic calendars use
#     the golden-number system (pentimal marks), a different animal; a
#     rune-numeral table would be an invention.
#   - glagolitic: a real system (values follow the GLAGOLITIC alphabet
#     order, differing from Cyrillic!) — deferred until the table can be
#     entered against a checked source, not memory. Queue note in the
#     P86 plan.

isopsephy:
  script: grek
  name: "Greek alphabetic (Milesian) numerals"
  note: "the classical 27-letter system: 1–9, 10–90, 100–900, with the
    three archaic episemons (ϛ stigma 6 — ϝ digamma carries the same
    value in early inscriptions; ϙ koppa 90 — ϟ is its modern form;
    ϡ sampi 900)"
  values:
    α: 1
    β: 2
    γ: 3
    δ: 4
    ε: 5
    ϛ: 6
    ϝ: 6
    ζ: 7
    η: 8
    θ: 9
    ι: 10
    κ: 20
    λ: 30
    μ: 40
    ν: 50
    ξ: 60
    ο: 70
    π: 80
    ϙ: 90
    ϟ: 90
    ρ: 100
    σ: 200
    τ: 300
    υ: 400
    φ: 500
    χ: 600
    ψ: 700
    ω: 800
    ϡ: 900

