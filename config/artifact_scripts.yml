# config/artifact_scripts.yml — the artifact-script rows (P61-3, D60-b).
#
# The ~script lect axis claims the script of the text AS HELD; THIS file
# records the ARTIFACT's original writing system for exactly the codes
# where the two differ (the ruling: "where the artifact script differs
# from the source document it should be marked as a separate field").
# Machine grain: source → stored language code → registry script tag
# (lects.yml's global scripts table) + an optional note carrying upstream
# refinements the axis deliberately does not model. Compiled into
# document_axes.artifact_script by Store::ArtifactScripts.derive!
# (rebuild-safe, re-derived wholesale). Every row is an owner-ruled
# reading of the P60-1 byte-census: the held bytes measured 100% Latin
# while the suffix names the artifact.
sources:
  elephantine:
    egy-Egyd:
      script: egyd
    phn:
      script: phnx
      note: "№R-50 census discovery — the Phoenician documents are held in
        Hebrew square-script transcription (surface 90% hebr), artifact
        Phoenician. (Merged INTO this section 2026-08-29: the row first
        landed as a DUPLICATE elephantine: key, which YAML silently
        resolved by dropping the egy-Egyd row — the guard test now parses
        raw text for duplicate source keys.)"
  papyri-ddbdp:
    egy-Egyd:
      script: egyd
  itant:
    osc-Ital-x-oscetr:
      script: ital
      note: Etruscan alphabet (upstream's -x-oscetr private-use subtag)
    xcg-Ital-x-xcglep:
      script: ital
      note: Lepontic alphabet (upstream's -x-xcglep private-use subtag)
  # P86 (№R-50, ruled 2026-08-28 "as recommended"): the rows the six-script
  # mint unblocked, each an owner-ruled reading of the 2026-08-28 byte
  # census (200-passage samples; every held surface measured 100% latn
  # unless noted).
  cuc:
    uga:
      script: ugar
      note: Ugaritic cuneiform tablets, held in transliteration
  derge-kangyur:
    xct:
      script: tibt
      note: Classical Tibetan, held in Wylie (EWTS) romanization
  soas-tibetan:
    xct:
      script: tibt
      note: Classical Tibetan, held in Wylie (EWTS) romanization
  otdo:
    otb:
      script: tibt
      note: Old Tibetan (Dunhuang and allied sources), held romanized
    xzh:
      script: tibt
      note: Zhangzhung from Tibetan-script sources, held romanized
  titus-avestan:
    ave:
      script: avst
      note: the Avestan alphabet, held in scholarly romanization (surface 97% latn)
  achemenet:
    akk:
      script: xsux
      note: Achaemenid Babylonian cuneiform (the corpus's Akkadian side; no
        peo documents held, so no xpeo row yet)
  oncoj:
    ojp:
      script: hant
      note: "man'yōgana — Han characters used phonographically (8th c.,
        pre-kana); №R-50's judgment call: hant, not the anachronistic jpan"
