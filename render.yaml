# Render Blueprint for the hosted Nabu demo (the "Deploy to Render" button
# on https://arvicco.github.io/nabu/mcp/). Render reads this Blueprint from
# the repo and PULLS the prebuilt public demo image (the demo library slice
# is baked in; Render compiles nothing from the repo's source) and runs it
# as a streamable-HTTP MCP endpoint at https://<service>.onrender.com/mcp.
# Render injects PORT; the server reads it (default 8080) and binds
# 0.0.0.0 inside the image. The image answers comfortably within the free
# plan's 512 MB (about 185 MiB resident after search/align/define calls).
# The image is pinned to the RELEASED tag — server.json's version, the
# demo-publish rail's SSOT; test/site/site_data_test.rb fails the day the
# two disagree. autoDeploy is off: a new release is picked up by a manual
# redeploy after this pin moves.
services:
  - type: web
    name: nabu-demo
    runtime: image
    image:
      url: ghcr.io/arvicco/nabu-demo:1.0.0
    plan: free
    autoDeploy: false
    dockerCommand: bin/nabu mcp --http
